th:"ต้องได้ทำ X ก่อนเท่านั้น ความจริงของ Y ถึงจะปรากฏ",
note_en:"てはじめて emphasises the moment of realisation; てこそ emphasises value or worth. Similar shape, different focus.",
note_th:"てはじめて เน้นช่วงเวลาที่เพิ่งรู้ตัว ส่วน てこそ เน้นคุณค่า รูปคล้ายกันแต่จุดเน้นต่างกัน",
ex:[{j:"外国に住んではじめて、母国の良さが分かった。",k:"がいこくに すんで はじめて、ぼこくの よさが わかった。",e:"Only after living abroad did I see my country's virtues.",t:"พอได้อยู่ต่างประเทศถึงเพิ่งเข้าใจข้อดีของบ้านเกิด"},
{j:"経験してはじめて分かることがある。",k:"けいけん して はじめて わかる ことが ある。",e:"Some things you only understand by experiencing them.",t:"มีบางอย่างที่ต้องผ่านประสบการณ์เองถึงจะเข้าใจ"}]},

{id:"n2d19",lv:"N2",cat:"慣用・書き言葉",p:"〜において（正式）",conn:"N＋において・における",
en:"In; at; in the field of (formal written 'in').",
th:"ใน; ที่; ในด้านของ (คำว่า 'ใน' ทางการในภาษาเขียน)",
note_en:"At N2 you'll see it mostly with abstract fields: 現代社会において, ビジネスにおける. で would be too casual there.",
note_th:"ในระดับ N2 จะเจอกับสาขานามธรรมเป็นหลัก เช่น 現代社会において, ビジネスにおける ถ้าใช้ で จะกันเองเกินไป",
ex:[{j:"ビジネスにおける敬語は不可欠だ。",k:"ビジネスに おける けいごは ふかけつだ。",e:"Keigo is indispensable in business.",t:"ภาษายกย่องขาดไม่ได้ในโลกธุรกิจ"},
{j:"現代社会において、AIの役割は大きい。",k:"げんだい しゃかいに おいて、エーアイの やくわりは おおきい。",e:"In modern society, AI plays a large role.",t:"ในสังคมสมัยใหม่ AI มีบทบาทมาก"}]},

{id:"n2d20",lv:"N2",cat:"慣用・書き言葉",p:"〜に応じて",conn:"N＋におうじて",
en:"In response to; according to (and varying with) X.",
th:"ตามที่; ปรับเปลี่ยนไปตาม X",
note_en:"Implies flexible adjustment to a variable. 場合に応じて, 能力に応じて, 予算に応じて.",
note_th:"สื่อถึงการปรับตัวยืดหยุ่นตามตัวแปร เช่น 場合に応じて 能力に応じて 予算に応じて",
ex:[{j:"お客様のご要望に応じて対応いたします。",k:"おきゃくさまの ごようぼうに おうじて たいおう いたします。",e:"We'll respond according to your requirements.",t:"จะดำเนินการตามความต้องการของลูกค้าครับ"},
{j:"経験に応じて給料が決まる。",k:"けいけんに おうじて きゅうりょうが きまる。",e:"Salary is set according to experience.",t:"เงินเดือนกำหนดตามประสบการณ์"}]},

{id:"n2d21",lv:"N2",cat:"慣用・書き言葉",p:"〜にわたって",conn:"N（期間・範囲）＋にわたって",
en:"Spanning; over the whole extent of X.",
th:"กินระยะ; ตลอดทั่วทั้ง X",
note_en:"The noun must be a span — time, area, or scope: 10年, 全国, 広範囲. Emphasises breadth, not repetition.",
note_th:"คำนามข้างหน้าต้องเป็นช่วงกว้าง ไม่ว่าเวลา พื้นที่ หรือขอบเขต เช่น 10年 全国 広範囲 เน้นความกว้าง ไม่ใช่การซ้ำ",
ex:[{j:"3日間にわたって会議が行われた。",k:"みっかかんに わたって かいぎが おこなわれた。",e:"The conference ran over three days.",t:"การประชุมจัดขึ้นกินเวลา 3 วัน"},
{j:"全国にわたって被害が出ている。",k:"ぜんこくに わたって ひがいが でて いる。",e:"Damage has occurred nationwide.",t:"เกิดความเสียหายทั่วทั้งประเทศ"}]},

{id:"n2d22",lv:"N2",cat:"慣用・書き言葉",p:"〜をきっかけに / 〜を契機に",conn:"N／V の ＋ をきっかけに・をけいきに",
en:"With X as the trigger; X was what started it.",
th:"โดยมี X เป็นจุดเริ่ม; X คือสิ่งที่ทำให้เริ่มต้น",
note_en:"Marks a turning point. を契機に is the formal version. Great for interview stories: 留学をきっかけに.",
note_th:"ใช้ระบุจุดเปลี่ยน ส่วน を契機に เป็นรูปทางการ เหมาะมากสำหรับเล่าเรื่องในการสัมภาษณ์ เช่น 留学をきっかけに",
ex:[{j:"アニメをきっかけに、日本語を学び始めた。",k:"アニメを きっかけに、にほんごを まなび はじめた。",e:"Anime is what got me started learning Japanese.",t:"เริ่มเรียนภาษาญี่ปุ่นเพราะอนิเมะเป็นจุดเริ่มต้น"},
{j:"転職を契機に、生活が変わった。",k:"てんしょくを けいきに、せいかつが かわった。",e:"Changing jobs was the turning point for my life.",t:"การเปลี่ยนงานเป็นจุดเปลี่ยนที่ทำให้ชีวิตเปลี่ยนไป"}]},

{id:"n2d23",lv:"N2",cat:"慣用・書き言葉",p:"〜に違いない（確信）",conn:"V普通形／イA／ナA／N ＋ にちがいない",
en:"I'm convinced that; it must be.",
th:"มั่นใจว่า; ต้องเป็นอย่างนั้นแน่",
note_en:"Place it in the confidence ladder: かもしれない ＜ だろう ＜ はずだ ＜ にちがいない ＜ に決まっている.",
note_th:"จัดตำแหน่งในลำดับความมั่นใจ: かもしれない ＜ だろう ＜ はずだ ＜ にちがいない ＜ に決まっている",
ex:[{j:"あんなに勉強したのだから、受かるにちがいない。",k:"あんなに べんきょう したのだから、うかるに ちがいない。",e:"After studying that hard, she must pass.",t:"เรียนหนักขนาดนั้น ต้องสอบผ่านแน่นอน"},
{j:"彼は何か隠しているにちがいない。",k:"かれは なにか かくして いるに ちがいない。",e:"He must be hiding something.",t:"เขาต้องปิดบังอะไรบางอย่างแน่ ๆ"}]},

{id:"n2d24",lv:"N2",cat:"慣用・書き言葉",p:"〜ようでは",conn:"V普通形／N の ＋ ようでは",
en:"If things are like this, then (a bad outcome follows).",
th:"ถ้ายังเป็นแบบนี้อยู่ ก็ (จะเกิดผลไม่ดีตามมา)",
note_en:"A warning form. The front clause is an undesirable current state; the back clause is the consequence.",
note_th:"เป็นรูปคำเตือน ประโยคหน้าคือสภาพปัจจุบันที่ไม่พึงประสงค์ ส่วนประโยคหลังคือผลที่จะตามมา",
ex:[{j:"こんな成績を取るようでは、合格は難しい。",k:"こんな せいせきを とる ようでは、ごうかくは むずかしい。",e:"With grades like these, passing will be hard.",t:"ถ้าได้คะแนนแบบนี้อยู่ จะสอบผ่านก็ยาก"},
{j:"すぐに諦めるようでは、上達しない。",k:"すぐに あきらめる ようでは、じょうたつ しない。",e:"If you give up that easily, you won't improve.",t:"ถ้ายอมแพ้ง่าย ๆ แบบนี้ ก็ไม่มีทางเก่งขึ้น"}]},

{id:"n2d25",lv:"N2",cat:"慣用・書き言葉",p:"〜ば〜で / 〜たら〜たで",conn:"V仮定形＋V たで／Vた＋らVたで",
en:"Whether X or not, there's a problem either way.",
th:"จะ X หรือไม่ X ก็มีปัญหาทั้งคู่",
note_en:"An idiomatic resignation pattern. あればあったで、なければないで — trouble comes whichever way.",
note_th:"เป็นสำนวนที่แสดงความจำยอม เช่น あればあったで、なければないで — ยังไงก็มีปัญหาทั้งสองทาง",
ex:[{j:"お金はあればあったで、使ってしまう。",k:"おかねは あれば あったで、つかって しまう。",e:"If you have money, you just end up spending it.",t:"เงินน่ะ พอมีก็ใช้หมดอยู่ดี"},
{j:"休みが取れたら取れたで、やることがない。",k:"やすみが とれたら とれたで、やる ことが ない。",e:"Even when I do get time off, there's nothing to do.",t:"พอได้วันหยุดมาจริง ๆ ก็ไม่มีอะไรจะทำ"}]},

{id:"n2d26",lv:"N2",cat:"慣用・書き言葉",p:"〜も〜ば〜も",conn:"N も＋V仮定形／イA ければ ＋ N も",
en:"There's both X and Y — listing two parallel facts.",
th:"มีทั้ง X และ Y — เป็นการยกสองข้อเท็จจริงคู่กัน",
note_en:"A balanced pair, both positive or both negative. 頭もよければ性格もいい.",
note_th:"เป็นคู่ที่สมดุล ต้องบวกทั้งคู่หรือลบทั้งคู่ เช่น 頭もよければ性格もいい",
ex:[{j:"彼は頭もよければ、性格もいい。",k:"かれは あたまも よければ、せいかくも いい。",e:"He's both clever and good-natured.",t:"เขาทั้งฉลาดทั้งนิสัยดี"},
{j:"お金もなければ、時間もない。",k:"おかねも なければ、じかんも ない。",e:"I have neither money nor time.",t:"ไม่มีทั้งเงินไม่มีทั้งเวลา"}]},

{id:"n2d27",lv:"N2",cat:"慣用・書き言葉",p:"〜からいって / 〜からして（判断）",conn:"N＋からいって・からして",
en:"Judging from X.",
th:"ตัดสินจาก X",
note_en:"Both take a criterion and deliver a verdict. からいって is neutral judgement; からして implies the rest follows too.",
note_th:"ทั้งคู่ใช้เกณฑ์แล้วให้ข้อสรุป からいって เป็นการตัดสินแบบเป็นกลาง ส่วน からして สื่อว่าอย่างอื่นก็เป็นไปในทางเดียวกัน",
ex:[{j:"この様子からいって、雨は降らないだろう。",k:"この ようすから いって、あめは ふらないだろう。",e:"Judging by the look of things, it won't rain.",t:"ดูจากสภาพแบบนี้ ฝนคงไม่ตก"},
{j:"実力からいって、彼が選ばれるはずだ。",k:"じつりょくから いって、かれが えらばれる はずだ。",e:"Going by ability, he should be the one chosen.",t:"ดูจากความสามารถแล้ว เขาน่าจะเป็นคนที่ถูกเลือก"}]},

{id:"n2d28",lv:"N2",cat:"慣用・書き言葉",p:"〜あっての",conn:"N＋あっての＋N",
en:"X is what makes Y possible — Y exists only because of X.",
th:"มี X ถึงจะมี Y — Y มีอยู่ได้เพราะ X เท่านั้น",
note_en:"A compact, weighty phrase. お客様あっての商売 is a stock expression in Japanese service culture — worth knowing by heart.",
note_th:"เป็นวลีที่กระชับและหนักแน่น お客様あっての商売 เป็นสำนวนติดปากในวัฒนธรรมบริการของญี่ปุ่น ควรจำให้ขึ้นใจ",
ex:[{j:"お客様あっての商売です。",k:"おきゃくさま あっての しょうばい です。",e:"Business exists only thanks to customers.",t:"ธุรกิจมีอยู่ได้ก็เพราะลูกค้าครับ"},
{j:"努力あっての成功だ。",k:"どりょく あっての せいこうだ。",e:"Success comes only through effort.",t:"ความสำเร็จเกิดขึ้นได้เพราะความพยายาม"}]}
,
{id:"n3e01",lv:"N3",cat:"敬語",p:"尊敬語（お〜になる・特別形）",conn:"お＋Vます形＋になる／ご＋漢語N＋になる／特別形：いらっしゃる・おっしゃる・召し上がる・ご覧になる・なさる・くださる",
en:"Respectful language: raises the OTHER person up. Used for what the customer or superior does.",
th:"ภาษายกย่อง: ยกอีกฝ่ายให้สูงขึ้น ใช้กับสิ่งที่ลูกค้าหรือผู้ใหญ่เป็นคนทำ",
note_en:"Rule of thumb: if the SUBJECT of the verb is the customer or your boss, use 尊敬語. Special forms override the お〜になる pattern — you say いらっしゃいます, never お行きになります. Never apply 尊敬語 to yourself; that is the single most noticeable keigo mistake foreigners make.",
note_th:"หลักจำง่าย ๆ: ถ้า 'ประธาน' ของกริยาคือลูกค้าหรือหัวหน้า ให้ใช้ 尊敬語 รูปพิเศษจะมาแทนรูป お〜になる เช่นพูดว่า いらっしゃいます ไม่ใช่ お行きになります และห้ามใช้ 尊敬語 กับตัวเองเด็ดขาด นี่คือข้อผิดพลาดที่คนต่างชาติทำแล้วสังเกตเห็นชัดที่สุด",
ex:[{j:"お客様がお待ちになっています。",k:"おきゃくさまが おまちに なって います。",e:"The customer is waiting.",t:"ลูกค้ากำลังรออยู่ครับ"},
{j:"何時にいらっしゃいますか。",k:"なんじに いらっしゃいますか。",e:"What time will you be coming?",t:"จะมากี่โมงครับ"}]},

{id:"n3e02",lv:"N3",cat:"敬語",p:"謙譲語（お〜する・特別形）",conn:"お＋Vます形＋する／ご＋漢語N＋する／特別形：伺う・申す・いたす・拝見する・いただく・存じる",
en:"Humble language: lowers YOURSELF. Used for what you do for the other person.",
th:"ภาษาถ่อมตน: ลดตัวเองลง ใช้กับสิ่งที่เราเป็นคนทำเพื่ออีกฝ่าย",
note_en:"The mirror of 尊敬語. Subject is you → 謙譲語. お持ちします (I'll carry it) vs お持ちになります (you carry it) — one kana apart, opposite meaning. Getting these backwards is the classic error.",
note_th:"เป็นภาพสะท้อนของ 尊敬語 ถ้าประธานคือเรา → ใช้ 謙譲語 เช่น お持ちします (ผมถือให้) กับ お持ちになります (ท่านถือ) ต่างกันไม่กี่คานะแต่ความหมายตรงข้าม การใช้สลับกันคือข้อผิดพลาดคลาสสิก",
ex:[{j:"お荷物をお持ちします。",k:"おにもつを おもち します。",e:"Let me carry your bags.",t:"ผมขอถือกระเป๋าให้นะครับ"},
{j:"明日、そちらへ伺います。",k:"あした、そちらへ うかがいます。",e:"I'll come to you tomorrow.",t:"พรุ่งนี้ผมจะไปหาที่นั่นครับ"}]},

{id:"n3e03",lv:"N3",cat:"敬語",p:"丁寧語・美化語（ございます・お／ご）",conn:"です→でございます／あります→ございます／N に お・ご を付ける",
en:"Polite and beautified language: raises the tone of the whole sentence, not any person.",
th:"ภาษาสุภาพและภาษาขัดเกลา: ยกระดับน้ำเสียงของทั้งประโยค ไม่ได้ยกใครเป็นพิเศษ",
note_en:"This is the layer that makes service Japanese sound like service Japanese. ございます is not humble toward anyone — it just makes the sentence formal. お and ご attach to nouns: お茶, ご住所. Use ご with kanji compounds, お with native words.",
note_th:"นี่คือชั้นที่ทำให้ภาษาบริการฟังดูเป็นภาษาบริการ ございます ไม่ได้ถ่อมตัวต่อใคร แค่ทำให้ประโยคเป็นทางการ ส่วน お กับ ご เติมหน้าคำนาม เช่น お茶 ご住所 โดย ご ใช้กับคำศัพท์จีน ส่วน お ใช้กับคำญี่ปุ่นแท้",
ex:[{j:"受付は2階でございます。",k:"うけつけは にかいで ございます。",e:"Reception is on the second floor.",t:"แผนกต้อนรับอยู่ชั้น 2 ครับ"},
{j:"ご住所をお願いいたします。",k:"ごじゅうしょを おねがい いたします。",e:"Your address, please.",t:"ขอที่อยู่ด้วยครับ"}]},

{id:"n3e04",lv:"N3",cat:"接続・助詞",p:"〜ずに",conn:"Vない（ない削除）＋ずに（する→せずに）",
en:"Without doing X.",
th:"โดยไม่ทำ X",
note_en:"The written, compact twin of 〜ないで. Memorise the irregular: する → せずに, never しずに. In speech ないで is more natural; in writing and set phrases ずに wins.",
note_th:"เป็นฝาแฝดแบบเขียนที่กระชับของ 〜ないで ต้องจำรูปพิเศษ: する → せずに ไม่ใช่ しずに เวลาพูดใช้ ないで เป็นธรรมชาติกว่า แต่ในภาษาเขียนและสำนวนตายตัวใช้ ずに",
ex:[{j:"朝ごはんを食べずに出かけた。",k:"あさごはんを たべずに でかけた。",e:"I went out without eating breakfast.",t:"ออกไปโดยไม่ได้กินข้าวเช้า"},
{j:"何も言わずに帰ってしまった。",k:"なにも いわずに かえって しまった。",e:"He left without saying anything.",t:"กลับไปโดยไม่พูดอะไรสักคำ"}]},

{id:"n3e05",lv:"N3",cat:"時・順序",p:"〜ぶりに",conn:"期間を表すN＋ぶりに",
en:"After an interval of X (for the first time in X).",
th:"เป็นครั้งแรกในรอบ X",
note_en:"Only for a gap since the last time something happened. 3年ぶりに会った = met for the first time in 3 years. Cannot be used for a first time ever.",
note_th:"ใช้กับช่วงเวลาที่ห่างจากครั้งก่อนเท่านั้น เช่น 3年ぶりに会った = เจอกันครั้งแรกในรอบ 3 ปี ใช้กับ 'ครั้งแรกในชีวิต' ไม่ได้",
ex:[{j:"5年ぶりにタイに帰りました。",k:"ごねん ぶりに タイに かえりました。",e:"I went back to Thailand for the first time in five years.",t:"กลับไทยครั้งแรกในรอบ 5 ปีครับ"},
{j:"久しぶりに友達に会った。",k:"ひさしぶりに ともだちに あった。",e:"I saw my friend after a long time.",t:"ได้เจอเพื่อนหลังจากไม่ได้เจอกันนาน"}]},

{id:"n3e06",lv:"N3",cat:"接続・助詞",p:"〜てばかりいる",conn:"Vて＋ばかりいる",
en:"Does nothing but X — with criticism.",
th:"เอาแต่ทำ X อย่างเดียว — มีน้ำเสียงตำหนิ",
note_en:"Always disapproving. 遊んでばかりいる = all he does is play. Note it takes ばかり between the て-form and いる, not after いる.",
note_th:"มีน้ำเสียงตำหนิเสมอ เช่น 遊んでばかりいる = เอาแต่เล่นอย่างเดียว สังเกตว่า ばかり อยู่ระหว่างรูป て กับ いる ไม่ใช่หลัง いる",
ex:[{j:"スマホを見てばかりいないで、勉強しなさい。",k:"スマホを みてばかり いないで、べんきょう しなさい。",e:"Stop staring at your phone and study.",t:"อย่าเอาแต่ดูมือถือ ไปเรียนได้แล้ว"},
{j:"彼は文句を言ってばかりいる。",k:"かれは もんくを いってばかり いる。",e:"All he does is complain.",t:"เขาเอาแต่บ่นอย่างเดียว"}]},

{id:"n3e07",lv:"N3",cat:"意志・希望",p:"〜ばよかった",conn:"V仮定形＋よかった／Vなければ＋よかった",
en:"I wish I had / hadn't — regret about the past.",
th:"รู้งี้...ก็ดี — ความเสียใจกับสิ่งที่ผ่านไปแล้ว",
note_en:"Pure hindsight regret. もっと早く始めればよかった is the sentence every language learner eventually says. The negative is 〜なければよかった.",
note_th:"เป็นความเสียใจเมื่อมองย้อนกลับไป ประโยค もっと早く始めればよかった คือประโยคที่คนเรียนภาษาทุกคนต้องได้พูดสักวัน รูปปฏิเสธคือ 〜なければよかった",
ex:[{j:"もっと早く文法を勉強すればよかった。",k:"もっと はやく ぶんぽうを べんきょう すれば よかった。",e:"I wish I'd studied grammar sooner.",t:"รู้งี้เรียนไวยากรณ์ให้เร็วกว่านี้ก็ดี"},
{j:"あんなこと言わなければよかった。",k:"あんな こと いわなければ よかった。",e:"I wish I hadn't said that.",t:"รู้งี้ไม่พูดแบบนั้นก็ดี"}]},

{id:"n3e08",lv:"N3",cat:"複合動詞",p:"〜こむ",conn:"Vます形＋こむ",
en:"Into; inward; or thoroughly and deeply.",
th:"เข้าไปข้างใน; หรือ อย่างลึกซึ้งจริงจัง",
note_en:"Two senses: physical inward motion (入り込む, 詰め込む) and deep intensity (考え込む, 話し込む). Extremely productive — you'll meet dozens of these verbs.",
note_th:"มีสองความหมาย: การเคลื่อนเข้าไปข้างในจริง ๆ (入り込む 詰め込む) และความเข้มข้นลึกซึ้ง (考え込む 話し込む) ใช้สร้างคำได้เยอะมาก จะเจอกริยาแบบนี้เป็นสิบ ๆ ตัว",
ex:[{j:"電車に駆け込むのは危険です。",k:"でんしゃに かけこむのは きけん です。",e:"Rushing onto a train is dangerous.",t:"การวิ่งพรวดเข้ารถไฟอันตรายครับ"},
{j:"彼は黙って考え込んでいた。",k:"かれは だまって かんがえこんで いた。",e:"He sat lost in thought.",t:"เขานั่งเงียบครุ่นคิดอย่างลึกซึ้ง"}]},

{id:"n3e09",lv:"N3",cat:"複合動詞",p:"〜あう",conn:"Vます形＋あう",
en:"To do something to each other; mutually.",
th:"ทำต่อกันและกัน; ซึ่งกันและกัน",
note_en:"Requires two or more parties acting on each other: 助け合う, 話し合う, 愛し合う. If only one side acts, it doesn't work.",
note_th:"ต้องมีสองฝ่ายขึ้นไปกระทำต่อกัน เช่น 助け合う 話し合う 愛し合う ถ้ามีฝ่ายเดียวกระทำจะใช้ไม่ได้",
ex:[{j:"困った時は助け合いましょう。",k:"こまった ときは たすけあいましょう。",e:"Let's help each other when times are hard.",t:"เวลาลำบากมาช่วยเหลือกันเถอะ"},
{j:"チームでよく話し合った。",k:"チームで よく はなしあった。",e:"We talked it through as a team.",t:"ทีมได้คุยปรึกษากันอย่างดี"}]},

{id:"n2e01",lv:"N2",cat:"敬語",p:"〜させていただく",conn:"V使役形＋ていただく",
en:"I humbly do X (with your permission) — the most-used business humble form.",
th:"ขออนุญาตทำ X (อย่างถ่อมตน) — รูปถ่อมตนที่ใช้บ่อยที่สุดในการทำงาน",
note_en:"Literally 'I receive the favour of being allowed to'. Use it for actions that affect the listener: 確認させていただきます, 休ませていただきます. Overusing it sounds servile, but under-using it sounds blunt — for front desk work it's the safe default.",
note_th:"แปลตรงตัวว่า 'ขอรับความกรุณาให้ได้ทำ' ใช้กับการกระทำที่ส่งผลถึงผู้ฟัง เช่น 確認させていただきます, 休ませていただきます ถ้าใช้บ่อยเกินจะฟังดูประจบ แต่ถ้าใช้น้อยไปจะฟังห้วน สำหรับงานต้อนรับถือเป็นตัวเลือกที่ปลอดภัยที่สุด",
ex:[{j:"確認させていただきます。",k:"かくにん させて いただきます。",e:"Allow me to check that for you.",t:"ขออนุญาตตรวจสอบให้นะครับ"},
{j:"本日は休業させていただきます。",k:"ほんじつは きゅうぎょう させて いただきます。",e:"We are closed today.",t:"วันนี้ขออนุญาตปิดทำการครับ"}]},

{id:"n2e02",lv:"N2",cat:"限定・強調",p:"〜てまで / 〜までして",
conn:"Vて＋まで／N＋までして",
en:"Going so far as to X — the speaker thinks it's excessive.",
th:"ถึงขั้นยอมทำ X — ผู้พูดคิดว่ามากเกินไป",
note_en:"Always carries disapproval or disbelief that someone would go that far. Often followed by a rhetorical question or 〜たくない.",
note_th:"มีน้ำเสียงไม่เห็นด้วยหรือไม่อยากเชื่อว่าจะทำถึงขนาดนั้นเสมอ มักตามด้วยคำถามเชิงวาทศิลป์หรือ 〜たくない",
ex:[{j:"借金してまで、旅行に行きたくない。",k:"しゃっきん してまで、りょこうに いきたく ない。",e:"I don't want to travel badly enough to go into debt.",t:"ไม่ได้อยากไปเที่ยวถึงขั้นต้องเป็นหนี้"},
{j:"徹夜までして準備した。",k:"てつや までして じゅんび した。",e:"He went so far as to stay up all night preparing.",t:"เตรียมงานถึงขั้นอดนอนทั้งคืน"}]},

{id:"n2e03",lv:"N2",cat:"添加・並列",p:"〜をはじめ(として)",conn:"N＋をはじめ(として)",
en:"Starting with X (as the leading example), and others too.",
th:"เริ่มจาก X (ในฐานะตัวอย่างเด่น) และอื่น ๆ อีก",
note_en:"X must be the most representative or important member of the group. Common in formal introductions and writing.",
note_th:"X ต้องเป็นสมาชิกที่เป็นตัวแทนหรือสำคัญที่สุดของกลุ่ม เจอบ่อยในการแนะนำแบบทางการและงานเขียน",
ex:[{j:"大阪をはじめ、関西には見所が多い。",k:"おおさかを はじめ、かんさいには みどころが おおい。",e:"Starting with Osaka, Kansai has many sights.",t:"เริ่มจากโอซาก้า คันไซมีที่เที่ยวเยอะมาก"},
{j:"社長をはじめとして、全員が参加した。",k:"しゃちょうを はじめと して、ぜんいんが さんか した。",e:"Everyone attended, starting with the president.",t:"ทุกคนเข้าร่วม เริ่มตั้งแต่ท่านประธานบริษัท"}]},

{id:"n2e04",lv:"N2",cat:"時・場面",p:"〜にあたって / 〜にあたり",conn:"V辞書形／N ＋ にあたって",
en:"On the occasion of; when about to undertake something significant.",
th:"ในโอกาสที่; เมื่อกำลังจะเริ่มสิ่งสำคัญ",
note_en:"Close to に際して, but にあたって leans toward the start of an undertaking. Formal, positive, forward-looking.",
note_th:"ใกล้เคียงกับ に際して แต่ にあたって เน้นไปที่การเริ่มต้นภารกิจ เป็นทางการ เชิงบวก และมองไปข้างหน้า",
ex:[{j:"入社にあたって、抱負を述べます。",k:"にゅうしゃに あたって、ほうふを のべます。",e:"On joining the company, I'd like to state my aspirations.",t:"ในโอกาสเข้าทำงาน ขอกล่าวถึงความมุ่งมั่นครับ"},
{j:"新生活を始めるにあたり、準備が必要だ。",k:"しんせいかつを はじめるに あたり、じゅんびが ひつようだ。",e:"Starting a new life requires preparation.",t:"ในการเริ่มชีวิตใหม่ จำเป็นต้องเตรียมตัว"}]},

{id:"n2e05",lv:"N2",cat:"逆接・対比",p:"〜つつ（逆接）",conn:"Vます形＋つつ",
en:"Even while X — knowing full well, yet doing otherwise.",
th:"ทั้ง ๆ ที่ X — ทั้งที่รู้ดี แต่กลับทำอีกอย่าง",
note_en:"Typically self-critical: 悪いと知りつつ、やめられない. Distinguish from つつある (gradual change) — same word, unrelated meaning.",
note_th:"มักใช้ตำหนิตัวเอง เช่น 悪いと知りつつ、やめられない ต้องแยกจาก つつある (การเปลี่ยนแปลงทีละน้อย) คำเดียวกันแต่ความหมายไม่เกี่ยวกัน",
ex:[{j:"体に悪いと知りつつ、夜食を食べてしまう。",k:"からだに わるいと しりつつ、やしょくを たべて しまう。",e:"Knowing it's bad for me, I still eat late at night.",t:"ทั้ง ๆ ที่รู้ว่าไม่ดีต่อร่างกาย ก็ยังกินมื้อดึกอยู่ดี"},
{j:"復習しようと思いつつ、今日もできなかった。",k:"ふくしゅう しようと おもいつつ、きょうも できなかった。",e:"I meant to revise, yet today I didn't manage it again.",t:"ทั้ง ๆ ที่คิดว่าจะทบทวน วันนี้ก็ยังไม่ได้ทำอีก"}]},

{id:"n2e06",lv:"N2",cat:"評価・判断",p:"〜ようにも〜ない",conn:"V意志形＋にも＋V可能形のない形",
en:"Even if I wanted to X, I can't — circumstances make it impossible.",
th:"ต่อให้อยากทำ X ก็ทำไม่ได้ — เพราะสถานการณ์ไม่เอื้อ",
note_en:"The same verb appears twice: 行こうにも行けない. There's an external obstacle, not a lack of will.",
note_th:"กริยาตัวเดียวกันปรากฏสองครั้ง เช่น 行こうにも行けない มีอุปสรรคจากภายนอก ไม่ใช่ขาดความตั้งใจ",
ex:[{j:"忙しくて、休もうにも休めない。",k:"いそがしくて、やすもうにも やすめない。",e:"I'm so busy I couldn't rest even if I wanted to.",t:"ยุ่งจนต่อให้อยากพักก็พักไม่ได้"},
{j:"連絡先が分からず、伝えようにも伝えられない。",k:"れんらくさきが わからず、つたえようにも つたえられない。",e:"I've no contact details, so I can't tell them even if I wanted to.",t:"ไม่รู้ช่องทางติดต่อ ต่อให้อยากบอกก็บอกไม่ได้"}]},

{id:"n2e07",lv:"N2",cat:"評価・判断",p:"〜だけましだ",conn:"V普通形／イA／ナA な ＋ だけましだ",
en:"At least it's X — could have been worse.",
th:"อย่างน้อยก็ยังดีที่ X — มันแย่กว่านี้ได้อีก",
note_en:"Finding the silver lining in a bad situation. Implies the situation is still not good, just not the worst.",
note_th:"เป็นการหาข้อดีในสถานการณ์ที่แย่ สื่อว่าสถานการณ์ยังไม่ดีอยู่ดี แค่ไม่ใช่แย่ที่สุด",
ex:[{j:"給料は安いが、休みが多いだけましだ。",k:"きゅうりょうは やすいが、やすみが おおい だけ ましだ。",e:"The pay is low, but at least there's plenty of time off.",t:"เงินเดือนน้อยก็จริง แต่อย่างน้อยก็ยังดีที่วันหยุดเยอะ"},
{j:"不合格だったが、点数が上がっただけましだ。",k:"ふごうかく だったが、てんすうが あがった だけ ましだ。",e:"I failed, but at least my score went up.",t:"ถึงจะสอบไม่ผ่าน แต่อย่างน้อยคะแนนก็ยังขึ้น"}]},

{id:"n2e08",lv:"N2",cat:"評価・判断",p:"〜たところで",conn:"Vた＋ところで",
en:"Even if you do X, it won't help.",
th:"ต่อให้ทำ X ก็ไม่ได้ช่วยอะไร",
note_en:"The second clause is always negative or futile. Different from 〜たところ (a discovery) — the で changes everything.",
note_th:"ประโยคหลังเป็นลบหรือไร้ประโยชน์เสมอ ต่างจาก 〜たところ (การค้นพบ) แค่ で ตัวเดียวเปลี่ยนความหมายทั้งหมด",
ex:[{j:"今から急いだところで、間に合わない。",k:"いまから いそいだ ところで、まにあわない。",e:"Even rushing now, we won't make it.",t:"ต่อให้รีบตอนนี้ก็ไม่ทันอยู่ดี"},
{j:"謝ったところで、許してもらえないだろう。",k:"あやまった ところで、ゆるして もらえないだろう。",e:"Even if I apologise, I doubt I'll be forgiven.",t:"ต่อให้ขอโทษ ก็คงไม่ได้รับการให้อภัย"}]},

{id:"n2e09",lv:"N2",cat:"慣用・書き言葉",p:"〜ことなく",conn:"V辞書形＋ことなく",
en:"Without ever doing X (formal, written).",
th:"โดยไม่เคย X เลย (ทางการ ภาษาเขียน)",
note_en:"The literary version of 〜ないで. Often with 一度も or 休む: 休むことなく働いた.",
note_th:"เป็นรูปวรรณกรรมของ 〜ないで มักใช้กับ 一度も หรือ 休む เช่น 休むことなく働いた",
ex:[{j:"彼は一度も休むことなく働き続けた。",k:"かれは いちども やすむ ことなく はたらき つづけた。",e:"He worked on without a single break.",t:"เขาทำงานต่อเนื่องโดยไม่ได้พักเลยสักครั้ง"},
{j:"諦めることなく挑戦し続ける。",k:"あきらめる ことなく ちょうせん しつづける。",e:"To keep trying without giving up.",t:"ท้าทายต่อไปโดยไม่ยอมแพ้"}]},

{id:"n2e10",lv:"N2",cat:"評価・判断",p:"〜に限る",conn:"V辞書形／Vない／N ＋ にかぎる",
en:"Nothing beats X; X is the best way.",
th:"ไม่มีอะไรดีไปกว่า X; X ดีที่สุด",
note_en:"A personal, warm recommendation. 疲れた時は寝るに限る. Not a formal judgement — it's how you'd talk to a friend.",
note_th:"เป็นคำแนะนำส่วนตัวที่อบอุ่น เช่น 疲れた時は寝るに限る ไม่ใช่การตัดสินแบบทางการ แต่เป็นแบบที่คุยกับเพื่อน",
ex:[{j:"疲れた時は、寝るに限る。",k:"つかれた ときは、ねるに かぎる。",e:"When you're tired, nothing beats sleep.",t:"เวลาเหนื่อย ไม่มีอะไรดีไปกว่าการนอน"},
{j:"暑い日はビールに限るね。",k:"あつい ひは ビールに かぎるね。",e:"On a hot day, you can't beat a beer.",t:"วันที่ร้อน ๆ ไม่มีอะไรดีไปกว่าเบียร์เลยเนอะ"}]},

{id:"n2e11",lv:"N2",cat:"評価・判断",p:"〜に越したことはない",conn:"V辞書形／イA／ナA である／N である ＋ にこしたことはない",
en:"It's best if X, though it's not essential.",
th:"ถ้าได้ X ก็ดีที่สุด แต่ไม่ถึงกับจำเป็น",
note_en:"Milder than べきだ. It says X is preferable, without obliging anyone.",
note_th:"เบากว่า べきだ บอกว่า X ดีกว่า แต่ไม่ได้บังคับใคร",
ex:[{j:"用心するに越したことはない。",k:"ようじん するに こした ことは ない。",e:"It never hurts to be careful.",t:"ระวังไว้ก่อนก็ดีที่สุด"},
{j:"日本語は上手に越したことはない。",k:"にほんごは じょうずに こした ことは ない。",e:"The better your Japanese, the better.",t:"ภาษาญี่ปุ่นยิ่งเก่งก็ยิ่งดี"}]},

{id:"n2e12",lv:"N2",cat:"限定・強調",p:"〜のみ",conn:"N／V普通形 ＋ のみ",
en:"Only; solely (formal written だけ).",
th:"เพียงแค่; เท่านั้น (รูปทางการของ だけ ในภาษาเขียน)",
note_en:"The written だけ. Also appears in 〜のみならず (not only). Signs and documents use it constantly: 関係者のみ.",
note_th:"เป็น だけ ในภาษาเขียน และปรากฏใน 〜のみならず (ไม่เพียงแต่) ป้ายและเอกสารใช้บ่อยมาก เช่น 関係者のみ",
ex:[{j:"関係者のみ入場できます。",k:"かんけいしゃのみ にゅうじょう できます。",e:"Only authorised persons may enter.",t:"เฉพาะผู้เกี่ยวข้องเท่านั้นที่เข้าได้ครับ"},
{j:"あとは結果を待つのみだ。",k:"あとは けっかを まつのみだ。",e:"All that's left is to await the result.",t:"ที่เหลือก็แค่รอผลเท่านั้น"}]},

{id:"n2e13",lv:"N2",cat:"時・場面",p:"〜やいなや",conn:"V辞書形＋やいなや",
en:"The very instant X happened, Y.",
th:"ทันทีที่ X ก็ Y ทันที",
note_en:"Literary and dramatic. The fastest of the 'as soon as' family: 次第 ＜ とたん ＜ やいなや. Second clause is past tense.",
note_th:"เป็นภาษาวรรณกรรมและให้ความรู้สึกดราม่า เร็วที่สุดในตระกูล 'ทันทีที่' คือ 次第 ＜ とたん ＜ やいなや ประโยคหลังเป็นอดีต",
ex:[{j:"ベルが鳴るやいなや、生徒が飛び出した。",k:"ベルが なるや いなや、せいとが とびだした。",e:"The instant the bell rang, the students bolted.",t:"ทันทีที่กริ่งดัง นักเรียนก็พุ่งออกไปเลย"},
{j:"家に着くやいなや、雨が降り出した。",k:"いえに つくや いなや、あめが ふりだした。",e:"The moment I got home, it began to rain.",t:"ทันทีที่ถึงบ้าน ฝนก็เริ่มตกเลย"}]},

{id:"n2e14",lv:"N2",cat:"慣用・書き言葉",p:"〜かぎり / 〜ないかぎり",conn:"V辞書形／Vている／Vない／N の ＋ かぎり",
en:"As long as X holds; unless X, then not.",
th:"ตราบใดที่ X ยังเป็นอยู่; ถ้าไม่ X ก็จะไม่",
note_en:"Sets a boundary condition. 私が知るかぎり = as far as I know. 謝らないかぎり許さない = I won't forgive unless you apologise.",
note_th:"เป็นการตั้งขอบเขตเงื่อนไข เช่น 私が知るかぎり = เท่าที่ฉันรู้ ส่วน 謝らないかぎり許さない = จะไม่ยกโทษให้ถ้าไม่ขอโทษ",
ex:[{j:"私が知るかぎり、彼は正直な人だ。",k:"わたしが しる かぎり、かれは しょうじきな ひとだ。",e:"As far as I know, he's an honest person.",t:"เท่าที่ผมรู้ เขาเป็นคนซื่อสัตย์"},
{j:"毎日練習しないかぎり、上達しない。",k:"まいにち れんしゅう しない かぎり、じょうたつ しない。",e:"You won't improve unless you practise daily.",t:"ถ้าไม่ฝึกทุกวันก็จะไม่เก่งขึ้น"}]}
,
{id:"n3f01",lv:"N3",cat:"複合動詞",p:"〜あげる（完了）",conn:"Vます形＋あげる",
en:"To finish something completely, with a sense of accomplishment.",
th:"ทำจนเสร็จสมบูรณ์ พร้อมความรู้สึกภูมิใจ",
note_en:"Different from 〜てあげる (doing a favour). This one attaches to the ます-stem and means 'complete a big task': 書き上げる, 作り上げる, 仕上げる.",
note_th:"ต่างจาก 〜てあげる (ทำให้เป็นบุญคุณ) ตัวนี้ต่อกับรูป ます และแปลว่า 'ทำงานใหญ่จนเสร็จ' เช่น 書き上げる 作り上げる 仕上げる",
ex:[{j:"やっと論文を書き上げた。",k:"やっと ろんぶんを かきあげた。",e:"I finally finished writing the thesis.",t:"ในที่สุดก็เขียนวิทยานิพนธ์เสร็จ"},
{j:"三年かけて作り上げた作品です。",k:"さんねん かけて つくりあげた さくひん です。",e:"It's a work I spent three years completing.",t:"เป็นผลงานที่ใช้เวลาสร้าง 3 ปีจนเสร็จครับ"}]},

{id:"n3f02",lv:"N3",cat:"意志・希望",p:"〜ばいい / 〜たらいい",conn:"V仮定形＋いい／Vた＋らいい",
en:"You should; it would be good if.",
th:"ก็...สิ; ถ้า...ก็ดี",
note_en:"Gives advice more gently than 〜べきだ. Also expresses a wish about the future: 早く春が来ればいい.",
note_th:"ให้คำแนะนำที่นุ่มกว่า 〜べきだ และใช้แสดงความหวังเกี่ยวกับอนาคตได้ เช่น 早く春が来ればいい",
ex:[{j:"分からなければ、先生に聞けばいいですよ。",k:"わからなければ、せんせいに きけば いいですよ。",e:"If you don't understand, just ask the teacher.",t:"ถ้าไม่เข้าใจก็ถามอาจารย์สิครับ"},
{j:"早く週末が来たらいいのに。",k:"はやく しゅうまつが きたら いいのに。",e:"I wish the weekend would hurry up.",t:"อยากให้สุดสัปดาห์มาถึงเร็ว ๆ จัง"}]},

{id:"n3f03",lv:"N3",cat:"条件・仮定",p:"〜ば〜のに",conn:"V仮定形＋〜のに",
en:"If only X, then Y would have happened — regret about an unreal situation.",
th:"ถ้า X ก็คงจะ Y — เสียดายกับสิ่งที่ไม่ได้เกิดขึ้น",
note_en:"Counterfactual regret. The のに carries the disappointment: the condition wasn't met, so the good outcome didn't happen.",
note_th:"เป็นความเสียดายกับสิ่งที่ไม่เป็นจริง โดย のに เป็นตัวแบกอารมณ์ผิดหวัง คือเงื่อนไขไม่เกิด ผลดีจึงไม่เกิดตาม",
ex:[{j:"もっと早く始めればよかったのに。",k:"もっと はやく はじめれば よかったのに。",e:"If only you'd started sooner.",t:"ถ้าเริ่มให้เร็วกว่านี้ก็ดีน่ะสิ"},
{j:"お金があれば買えるのに。",k:"おかねが あれば かえるのに。",e:"If I had the money I could buy it.",t:"ถ้ามีเงินก็คงซื้อได้แท้ ๆ"}]},

{id:"n3f04",lv:"N3",cat:"意志・希望",p:"〜べきではない",conn:"V辞書形＋べきではない",
en:"Ought not to; shouldn't (moral).",
th:"ไม่ควรจะ (ในเชิงศีลธรรม)",
note_en:"The negative of べきだ. Stronger than 〜ないほうがいい — this says the action is wrong, not merely unwise.",
note_th:"เป็นรูปปฏิเสธของ べきだ แรงกว่า 〜ないほうがいい เพราะบอกว่าการกระทำนั้นผิด ไม่ใช่แค่ไม่ฉลาด",
ex:[{j:"人の悪口を言うべきではない。",k:"ひとの わるくちを いう べきでは ない。",e:"You shouldn't speak ill of people.",t:"ไม่ควรนินทาคนอื่น"},
{j:"約束を破るべきではありません。",k:"やくそくを やぶる べきでは ありません。",e:"You ought not to break promises.",t:"ไม่ควรผิดสัญญาครับ"}]},

{id:"n3f05",lv:"N3",cat:"接続・助詞",p:"別に〜ない",conn:"別に＋Vない／イA くない／ナA ではない",
en:"Not particularly; not really.",
th:"ไม่ได้...เป็นพิเศษ; ก็ไม่เชิง",
note_en:"A softening denial, very common in speech. 別に is almost always paired with a negative — on its own, 別に。 means 'nothing / never mind'.",
note_th:"เป็นการปฏิเสธแบบนุ่ม ๆ ใช้บ่อยมากในภาษาพูด 別に มักคู่กับรูปปฏิเสธเสมอ ถ้าพูดว่า 別に。 เดี่ยว ๆ จะแปลว่า 'ไม่มีอะไร / ช่างเถอะ'",
ex:[{j:"別に嫌いじゃないよ。",k:"べつに きらいじゃ ないよ。",e:"It's not that I dislike it.",t:"ก็ไม่ได้เกลียดอะไรนะ"},
{j:"別に問題はありません。",k:"べつに もんだいは ありません。",e:"There's no particular problem.",t:"ไม่มีปัญหาอะไรเป็นพิเศษครับ"}]},

{id:"n3f06",lv:"N3",cat:"時・順序",p:"〜中（じゅう・ちゅう）",conn:"N＋じゅう（全体）／N＋ちゅう（進行中）",
en:"じゅう = throughout the whole of. ちゅう = currently in the middle of.",
th:"じゅう = ตลอดทั้ง... ส่วน ちゅう = กำลังอยู่ในระหว่าง",
note_en:"Two readings, two meanings, same kanji. 一日中 (all day long) vs 仕事中 (during work / at work now). The reading tells you which.",
note_th:"อ่านได้สองแบบ ความหมายต่างกัน แต่คันจิเดียวกัน เช่น 一日中 (ตลอดทั้งวัน) กับ 仕事中 (กำลังทำงานอยู่) การอ่านเป็นตัวบอกว่าอันไหน",
ex:[{j:"一日中、勉強していました。",k:"いちにちじゅう、べんきょう して いました。",e:"I studied all day long.",t:"เรียนทั้งวันเลยครับ"},
{j:"ただいま準備中です。",k:"ただいま じゅんびちゅう です。",e:"We're currently preparing.",t:"ขณะนี้กำลังเตรียมการอยู่ครับ"}]},

{id:"n3f07",lv:"N3",cat:"添加・並列",p:"〜だけでなく",conn:"V普通形／イA／ナA な／N ＋ だけでなく",
en:"Not only X but also Y.",
th:"ไม่เพียงแค่ X แต่ยัง Y",
note_en:"The everyday version of ばかりでなく and のみならず. Usually paired with も in the second half.",
note_th:"เป็นรูปที่ใช้ในชีวิตประจำวันของ ばかりでなく และ のみならず มักใช้คู่กับ も ในประโยคหลัง",
ex:[{j:"彼は英語だけでなく、日本語も話せる。",k:"かれは えいご だけでなく、にほんごも はなせる。",e:"He speaks not only English but Japanese too.",t:"เขาไม่ได้พูดได้แค่ภาษาอังกฤษ แต่พูดญี่ปุ่นได้ด้วย"},
{j:"味だけでなく、見た目もいい。",k:"あじ だけでなく、みためも いい。",e:"Not just the taste — it looks good too.",t:"ไม่ใช่แค่รสชาติ หน้าตาก็ดีด้วย"}]},

{id:"n3f08",lv:"N3",cat:"逆接",p:"どんなに〜ても / いくら〜ても",conn:"どんなに・いくら＋Vて／イA くて／ナA で ＋ も",
en:"No matter how much X, still Y.",
th:"ไม่ว่าจะ X แค่ไหน ก็ยัง Y",
note_en:"どんなに and いくら are near-identical; いくら feels slightly more colloquial. Both intensify the concession.",
note_th:"どんなに กับ いくら เกือบเหมือนกัน โดย いくら ให้ความรู้สึกเป็นกันเองกว่าเล็กน้อย ทั้งคู่ทำให้การยอมรับเงื่อนไขหนักแน่นขึ้น",
ex:[{j:"どんなに難しくても、諦めません。",k:"どんなに むずかしくても、あきらめません。",e:"No matter how hard it is, I won't give up.",t:"ไม่ว่าจะยากแค่ไหน ผมก็จะไม่ยอมแพ้ครับ"},
{j:"いくら説明しても、分かってくれない。",k:"いくら せつめい しても、わかって くれない。",e:"However much I explain, he won't understand.",t:"อธิบายเท่าไหร่เขาก็ไม่ยอมเข้าใจ"}]},

{id:"n3f09",lv:"N3",cat:"伝聞・推量",p:"〜ふりをする",conn:"V普通形／イA／ナA な／N の ＋ ふりをする",
en:"To pretend; to act as if.",
th:"ทำเป็น; แกล้งทำเหมือนว่า",
note_en:"Always a deliberate act of deception, however small. 寝たふり (pretending to sleep) is the classic example.",
note_th:"เป็นการแกล้งทำอย่างตั้งใจเสมอ ไม่ว่าจะเล็กน้อยแค่ไหน ตัวอย่างคลาสสิกคือ 寝たふり (แกล้งหลับ)",
ex:[{j:"聞こえないふりをした。",k:"きこえない ふりを した。",e:"I pretended not to hear.",t:"แกล้งทำเป็นไม่ได้ยิน"},
{j:"分かったふりをしてはいけない。",k:"わかった ふりを しては いけない。",e:"You mustn't pretend to understand.",t:"อย่าแกล้งทำเป็นเข้าใจ"}]},

{id:"n3f10",lv:"N3",cat:"時・順序",p:"〜から〜にかけて",conn:"N＋から＋N＋にかけて",
en:"From X through to Y (a continuous span of time or place).",
th:"ตั้งแต่ X ไปจนถึง Y (ช่วงเวลาหรือพื้นที่ที่ต่อเนื่อง)",
note_en:"Different from から〜まで, which marks exact endpoints. にかけて blurs the edges — it's an approximate stretch.",
note_th:"ต่างจาก から〜まで ที่ระบุจุดเริ่มจุดจบชัดเจน ส่วน にかけて ขอบเขตจะเบลอ ๆ คือเป็นช่วงกว้าง ๆ โดยประมาณ",
ex:[{j:"夜から朝にかけて雨が降った。",k:"よるから あさに かけて あめが ふった。",e:"It rained from night through to morning.",t:"ฝนตกตั้งแต่กลางคืนไปจนถึงเช้า"},
{j:"関東から東北にかけて地震があった。",k:"かんとうから とうほくに かけて じしんが あった。",e:"There was an earthquake from Kanto through Tohoku.",t:"เกิดแผ่นดินไหวตั้งแต่คันโตไปจนถึงโทโฮคุ"}]},

{id:"n3f11",lv:"N3",cat:"接続・助詞",p:"〜代わりに",conn:"V普通形／N の ＋ かわりに",
en:"Instead of; in exchange for.",
th:"แทนที่จะ; เพื่อแลกกับ",
note_en:"Two senses: substitution (私の代わりに行く) and trade-off (給料は安いが、その代わりに休みが多い).",
note_th:"มีสองความหมาย: การแทนที่ (私の代わりに行く) และการแลกเปลี่ยน (給料は安いが、その代わりに休みが多い)",
ex:[{j:"部長の代わりに、私が出席します。",k:"ぶちょうの かわりに、わたしが しゅっせき します。",e:"I'll attend in place of the manager.",t:"ผมจะเข้าร่วมแทนผู้จัดการครับ"},
{j:"家賃が高い代わりに、駅に近い。",k:"やちんが たかい かわりに、えきに ちかい。",e:"The rent is high, but in exchange it's near the station.",t:"ค่าเช่าแพงก็จริง แต่แลกกับการอยู่ใกล้สถานี"}]},

{id:"n3f12",lv:"N3",cat:"原因・理由",p:"〜た結果",conn:"Vた／N の ＋ けっか",
en:"As a result of X.",
th:"ผลจากการที่ X",
note_en:"Formal and written. The front clause is an effort or investigation; the back clause is what came of it.",
note_th:"เป็นทางการและภาษาเขียน ประโยคหน้าคือความพยายามหรือการตรวจสอบ ส่วนประโยคหลังคือผลที่ได้",
ex:[{j:"努力した結果、合格できました。",k:"どりょく した けっか、ごうかく できました。",e:"As a result of my efforts, I passed.",t:"ผลจากความพยายาม ก็สอบผ่านครับ"},
{j:"検査の結果、異常はなかった。",k:"けんさの けっか、いじょうは なかった。",e:"The examination showed nothing abnormal.",t:"ผลการตรวจไม่พบความผิดปกติ"}]},

{id:"n3f13",lv:"N3",cat:"接続・助詞",p:"決して〜ない",conn:"決して＋Vない",
en:"Never; by no means (strong denial).",
th:"ไม่...เด็ดขาด; ไม่มีทาง (ปฏิเสธหนักแน่น)",
note_en:"Must be followed by a negative. Stronger than ぜんぜん — it's a promise or a firm rule.",
note_th:"ต้องตามด้วยรูปปฏิเสธ หนักแน่นกว่า ぜんぜん เพราะเป็นคำสัญญาหรือกฎที่แน่วแน่",
ex:[{j:"この約束は決して忘れません。",k:"この やくそくは けっして わすれません。",e:"I will never forget this promise.",t:"สัญญานี้ผมจะไม่มีวันลืมเด็ดขาดครับ"},
{j:"決して簡単ではない。",k:"けっして かんたんでは ない。",e:"It is by no means easy.",t:"ไม่ได้ง่ายเลยแม้แต่น้อย"}]},

{id:"n3f14",lv:"N3",cat:"接続・助詞",p:"〜っけ",conn:"普通形＋っけ（だっけ・たっけ）",
en:"What was it again? — trying to recall something you should know.",
th:"...นะ? — พยายามนึกสิ่งที่ควรจะรู้อยู่แล้ว",
note_en:"Casual only, never in polite settings. It signals 'I knew this but forgot': 名前は何だっけ？ Use with friends, never with customers.",
note_th:"ใช้เฉพาะภาษากันเอง ห้ามใช้ในที่ทางการ สื่อว่า 'เคยรู้แต่ลืมไปแล้ว' ใช้กับเพื่อนเท่านั้น ห้ามใช้กับลูกค้า",
ex:[{j:"明日の集合は何時だっけ？",k:"あしたの しゅうごうは なんじ だっけ？",e:"What time are we meeting tomorrow again?",t:"พรุ่งนี้นัดกันกี่โมงนะ"},
{j:"この漢字、何て読むんだっけ。",k:"この かんじ、なんて よむんだっけ。",e:"How do you read this kanji again?",t:"คันจิตัวนี้อ่านว่าอะไรนะ"}]},

{id:"n3f15",lv:"N3",cat:"原因・理由",p:"〜ことから",conn:"V普通形／イA／ナA な・である／N である ＋ ことから",
en:"From the fact that X; that's how it came to be.",
th:"จากข้อเท็จจริงที่ว่า X; จึงเป็นที่มาของ",
note_en:"Often explains the origin of a name or a conclusion drawn from evidence. Formal and written.",
note_th:"มักใช้อธิบายที่มาของชื่อ หรือข้อสรุปที่ได้จากหลักฐาน เป็นทางการและภาษาเขียน",
ex:[{j:"桜が多いことから、この町は桜町と呼ばれる。",k:"さくらが おおい ことから、この まちは さくらまちと よばれる。",e:"Because there are many cherry trees, this town is called Sakuramachi.",t:"เพราะมีต้นซากุระเยอะ เมืองนี้เลยถูกเรียกว่าซากุระมาจิ"},
{j:"足跡があることから、犯人は男性と判断された。",k:"あしあとが ある ことから、はんにんは だんせいと はんだん された。",e:"From the footprints, the culprit was judged to be male.",t:"จากรอยเท้า จึงตัดสินว่าคนร้ายเป็นผู้ชาย"}]},

{id:"n3f16",lv:"N3",cat:"変化・状態",p:"〜ことになっている",conn:"V辞書形／Vない ＋ ことになっている",
en:"It is the rule that; it's been arranged that.",
th:"มีกฎว่า; ถูกกำหนดไว้ว่า",
note_en:"An existing rule or standing arrangement, not a fresh decision. Perfect for explaining workplace rules to customers.",
note_th:"เป็นกฎที่มีอยู่แล้วหรือข้อตกลงที่ยืนอยู่ ไม่ใช่การตัดสินใจใหม่ เหมาะมากสำหรับอธิบายกฎที่ทำงานให้ลูกค้าฟัง",
ex:[{j:"館内では、写真を撮らないことになっております。",k:"かんないでは、しゃしんを とらない ことに なって おります。",e:"Photography is not permitted inside the building.",t:"ภายในอาคารมีกฎว่าห้ามถ่ายรูปครับ"},
{j:"毎週月曜に会議をすることになっている。",k:"まいしゅう げつように かいぎを する ことに なって いる。",e:"We're set to have a meeting every Monday.",t:"มีกำหนดว่าจะประชุมทุกวันจันทร์"}]},

{id:"n3f17",lv:"N3",cat:"伝聞・推量",p:"まるで〜ようだ",conn:"まるで＋V普通形／N の ＋ ようだ・みたいだ",
en:"Just like; exactly as if.",
th:"ราวกับว่า; เหมือนกับ...เป๊ะ",
note_en:"まるで announces a simile before it arrives and intensifies it. Nearly always paired with ようだ or みたいだ.",
note_th:"まるで เป็นสัญญาณล่วงหน้าว่ากำลังจะเปรียบเทียบ และช่วยเน้นให้แรงขึ้น มักคู่กับ ようだ หรือ みたいだ เสมอ",
ex:[{j:"まるで夢のようです。",k:"まるで ゆめの ようです。",e:"It's just like a dream.",t:"ราวกับความฝันเลยครับ"},
{j:"彼はまるで日本人みたいに話す。",k:"かれは まるで にほんじん みたいに はなす。",e:"He speaks exactly like a Japanese person.",t:"เขาพูดราวกับเป็นคนญี่ปุ่นเลย"}]},

{id:"n3f18",lv:"N3",cat:"接続・助詞",p:"めったに〜ない",conn:"めったに＋Vない",
en:"Rarely; hardly ever.",
th:"แทบจะไม่...เลย; นาน ๆ ครั้ง",
note_en:"Frequency ladder: いつも ＞ よく ＞ ときどき ＞ たまに ＞ めったに〜ない ＞ 全然〜ない. Always takes a negative.",
note_th:"ลำดับความถี่: いつも ＞ よく ＞ ときどき ＞ たまに ＞ めったに〜ない ＞ 全然〜ない ต้องใช้กับรูปปฏิเสธเสมอ",
ex:[{j:"最近はめったに外食しない。",k:"さいきんは めったに がいしょく しない。",e:"I hardly ever eat out these days.",t:"ช่วงนี้แทบไม่ได้กินข้าวนอกบ้านเลย"},
{j:"こんな機会はめったにありません。",k:"こんな きかいは めったに ありません。",e:"An opportunity like this is rare.",t:"โอกาสแบบนี้หาได้ยากมากครับ"}]},

{id:"n3f19",lv:"N3",cat:"接続・助詞",p:"〜ないことはない",conn:"Vない／イA くない／ナA でない ＋ ことはない",
en:"It's not impossible; I could, I suppose.",
th:"ก็ไม่ใช่ว่าจะทำไม่ได้; ก็พอได้อยู่",
note_en:"A double negative that says a reluctant yes. It concedes possibility while holding back enthusiasm.",
note_th:"ปฏิเสธซ้อนปฏิเสธที่แปลว่า 'ตกลงแบบไม่เต็มใจ' คือยอมรับว่าเป็นไปได้ แต่ยังไม่กระตือรือร้น",
ex:[{j:"辛い物も食べられないことはない。",k:"からい ものも たべられない ことは ない。",e:"It's not that I can't eat spicy food.",t:"ของเผ็ดก็ไม่ใช่ว่ากินไม่ได้นะ"},
{j:"行けないことはないが、遠いですね。",k:"いけない ことは ないが、とおいですね。",e:"I could go, but it's far.",t:"ก็ไปได้อยู่ แต่ไกลนะครับ"}]},

{id:"n3f20",lv:"N3",cat:"複合動詞",p:"〜直す",conn:"Vます形＋なおす",
en:"To redo; to do over again properly.",
th:"ทำใหม่; ทำซ้ำอีกครั้งให้ถูกต้อง",
note_en:"Implies the first attempt was unsatisfactory. 書き直す, やり直す, 考え直す — all very common.",
note_th:"สื่อว่าครั้งแรกยังไม่น่าพอใจ เช่น 書き直す やり直す 考え直す ใช้บ่อยทั้งหมด",
ex:[{j:"間違えたので、書き直します。",k:"まちがえたので、かきなおします。",e:"I made a mistake, so I'll rewrite it.",t:"เขียนผิด เลยจะเขียนใหม่ครับ"},
{j:"もう一度考え直してください。",k:"もういちど かんがえなおして ください。",e:"Please reconsider it once more.",t:"กรุณาคิดทบทวนอีกครั้งนะครับ"}]},

{id:"n3f21",lv:"N3",cat:"接続・助詞",p:"〜に関する / 〜に関して",conn:"N＋にかんする・にかんして",
en:"Concerning; related to (formal).",
th:"เกี่ยวกับ; ที่เกี่ยวข้องกับ (ทางการ)",
note_en:"The formal twin of について. に関する modifies a noun (日本に関する本); に関して modifies a verb.",
note_th:"เป็นฝาแฝดทางการของ について โดย に関する ขยายคำนาม (日本に関する本) ส่วน に関して ขยายกริยา",
ex:[{j:"環境問題に関する研究をしています。",k:"かんきょう もんだいに かんする けんきゅうを して います。",e:"I'm doing research concerning environmental issues.",t:"กำลังทำวิจัยเกี่ยวกับปัญหาสิ่งแวดล้อมครับ"},
{j:"この件に関して、ご意見はありますか。",k:"この けんに かんして、ごいけんは ありますか。",e:"Do you have any opinions regarding this matter?",t:"เกี่ยวกับเรื่องนี้ มีความเห็นไหมครับ"}]},

{id:"n3f22",lv:"N3",cat:"程度・比較",p:"〜に比べて",conn:"N＋にくらべて",
en:"Compared to X.",
th:"เมื่อเทียบกับ X",
note_en:"The neutral comparison marker. Unlike より, it can head the sentence: 去年に比べて、今年は暑い.",
note_th:"เป็นตัวชี้การเปรียบเทียบแบบกลาง ๆ ต่างจาก より ตรงที่วางขึ้นต้นประโยคได้ เช่น 去年に比べて、今年は暑い",
ex:[{j:"去年に比べて、今年は暑いです。",k:"きょねんに くらべて、ことしは あついです。",e:"Compared to last year, this year is hot.",t:"เมื่อเทียบกับปีที่แล้ว ปีนี้ร้อนกว่าครับ"},
{j:"タイに比べて、日本は物価が高い。",k:"タイに くらべて、にほんは ぶっかが たかい。",e:"Compared to Thailand, Japan's prices are high.",t:"เมื่อเทียบกับไทย ญี่ปุ่นค่าครองชีพสูงกว่า"}]},

{id:"n3f23",lv:"N3",cat:"変化・状態",p:"〜に慣れる",conn:"N／V辞書形＋の ＋ になれる",
en:"To get used to X.",
th:"เริ่มชินกับ X",
note_en:"Takes に, not を. For a verb, nominalise first: 早起きするのに慣れた. The 〜ている form means 'am used to it now'.",
note_th:"ใช้ に ไม่ใช่ を ถ้าเป็นกริยาต้องทำเป็นคำนามก่อน เช่น 早起きするのに慣れた ส่วนรูป 〜ている แปลว่า 'ตอนนี้ชินแล้ว'",
ex:[{j:"日本の生活にもう慣れました。",k:"にほんの せいかつに もう なれました。",e:"I've got used to life in Japan now.",t:"ชินกับชีวิตในญี่ปุ่นแล้วครับ"},
{j:"敬語を使うのにまだ慣れていない。",k:"けいごを つかうのに まだ なれて いない。",e:"I'm still not used to using keigo.",t:"ยังไม่ชินกับการใช้ภาษายกย่องเลย"}]},

{id:"n3f24",lv:"N3",cat:"逆接",p:"〜にしては",conn:"V普通形／N ＋ にしては",
en:"For an X; considering it's X (contrary to what you'd expect).",
th:"สำหรับ X แล้ว; เมื่อคิดว่าเป็น X (ผิดจากที่คาด)",
note_en:"Close to わりに, but にしては needs a concrete, known standard: 初心者にしては上手 (good, for a beginner).",
note_th:"ใกล้เคียงกับ わりに แต่ にしては ต้องมีมาตรฐานที่ชัดเจนและรู้กัน เช่น 初心者にしては上手 (เก่ง สำหรับมือใหม่)",
ex:[{j:"初心者にしては、上手ですね。",k:"しょしんしゃに しては、じょうずですね。",e:"That's good, for a beginner.",t:"สำหรับมือใหม่แล้วถือว่าเก่งเลยนะครับ"},
{j:"7年勉強したにしては、話せない。",k:"ななねん べんきょう したに しては、はなせない。",e:"For someone who studied seven years, I can't speak.",t:"สำหรับคนที่เรียนมา 7 ปี ยังพูดไม่ได้เลย"}]},

{id:"n3f25",lv:"N3",cat:"伝聞・推量",p:"〜によると / 〜によれば",conn:"N＋によると・によれば",
en:"According to X (source of information).",
th:"ตามที่ X (แหล่งข้อมูล) บอก",
note_en:"Almost always paired with そうだ or ということだ at the end. Naming your source is expected in Japanese — don't drop it.",
note_th:"มักคู่กับ そうだ หรือ ということだ ท้ายประโยคเสมอ ภาษาญี่ปุ่นคาดหวังให้ระบุแหล่งข้อมูล อย่าละไว้",
ex:[{j:"天気予報によると、明日は雪だそうだ。",k:"てんきよほうに よると、あしたは ゆきだ そうだ。",e:"According to the forecast, it'll snow tomorrow.",t:"ตามพยากรณ์อากาศ พรุ่งนี้หิมะจะตก"},
{j:"友達によれば、あの店は移転したそうだ。",k:"ともだちに よれば、あの みせは いてん した そうだ。",e:"According to my friend, that shop has moved.",t:"เพื่อนบอกว่าร้านนั้นย้ายไปแล้ว"}]},

{id:"n3f26",lv:"N3",cat:"接続・助詞",p:"〜を中心に",conn:"N＋をちゅうしんに",
en:"Centred on; focusing mainly on X.",
th:"โดยมี X เป็นศูนย์กลาง; เน้นที่ X เป็นหลัก",
note_en:"Marks the core around which everything else is arranged. Common in study plans and reports: 文法を中心に勉強する.",
note_th:"ใช้ระบุแกนกลางที่สิ่งอื่นจัดเรียงรอบ ๆ เจอบ่อยในแผนการเรียนและรายงาน เช่น 文法を中心に勉強する",
ex:[{j:"今は文法を中心に勉強しています。",k:"いまは ぶんぽうを ちゅうしんに べんきょう して います。",e:"Right now I'm studying with grammar at the centre.",t:"ตอนนี้เรียนโดยเน้นไวยากรณ์เป็นหลักครับ"},
{j:"若者を中心に人気が広がった。",k:"わかものを ちゅうしんに にんきが ひろがった。",e:"Its popularity spread, centred on young people.",t:"ความนิยมแพร่ออกไปโดยมีคนหนุ่มสาวเป็นศูนย์กลาง"}]},

{id:"n3f27",lv:"N3",cat:"時・順序",p:"〜たて",conn:"Vます形＋たて",
en:"Freshly done; just made.",
th:"เพิ่งทำเสร็จใหม่ ๆ",
note_en:"Only a handful of verbs take it: 焼きたて, 出来たて, 揚げたて, 炊きたて. Mostly about food and freshness.",
note_th:"ใช้ได้กับกริยาไม่กี่ตัว เช่น 焼きたて 出来たて 揚げたて 炊きたて ส่วนใหญ่เกี่ยวกับอาหารและความสดใหม่",
ex:[{j:"焼きたてのパンはおいしい。",k:"やきたての パンは おいしい。",e:"Freshly baked bread is delicious.",t:"ขนมปังที่เพิ่งอบใหม่ ๆ อร่อยมาก"},
{j:"出来たてなので、熱いです。",k:"できたてなので、あついです。",e:"It's just been made, so it's hot.",t:"เพิ่งทำเสร็จ เลยยังร้อนอยู่ครับ"}]},

{id:"n3f28",lv:"N3",cat:"接続・助詞",p:"〜的",conn:"漢語N＋てき",
en:"Turns a noun into a な-adjective: -ic, -al, -like.",
th:"เปลี่ยนคำนามให้เป็นคำคุณศัพท์ な: เชิง-, ทาง-",
note_en:"Enormously productive: 経済的, 具体的, 積極的, 一般的. Learning this one suffix unlocks hundreds of words at once.",
note_th:"สร้างคำได้มหาศาล เช่น 経済的 具体的 積極的 一般的 แค่จำปัจจัยตัวนี้ตัวเดียวก็เปิดคำศัพท์ได้เป็นร้อยคำ",
ex:[{j:"もっと具体的に説明してください。",k:"もっと ぐたいてきに せつめい して ください。",e:"Please explain more concretely.",t:"กรุณาอธิบายให้เป็นรูปธรรมกว่านี้ครับ"},
{j:"彼は積極的な性格です。",k:"かれは せっきょくてきな せいかく です。",e:"He has a proactive personality.",t:"เขาเป็นคนนิสัยกระตือรือร้นครับ"}]},

{id:"n3f29",lv:"N3",cat:"義務・許可",p:"〜てもかまわない",conn:"Vて／イA くて／ナA で ＋ もかまわない",
en:"I don't mind if; it's fine to.",
th:"...ก็ไม่เป็นไร; จะ...ก็ได้",
note_en:"Slightly more permissive-sounding than てもいい — it stresses that you have no objection.",
note_th:"ฟังดูอนุญาตมากกว่า てもいい เล็กน้อย เพราะเน้นว่าเราไม่ขัดข้อง",
ex:[{j:"写真を撮ってもかまいませんか。",k:"しゃしんを とっても かまいませんか。",e:"Would you mind if I took a photo?",t:"ถ่ายรูปได้ไหมครับ"},
{j:"少し遅れてもかまいません。",k:"すこし おくれても かまいません。",e:"It's fine if you're a little late.",t:"มาสายนิดหน่อยก็ไม่เป็นไรครับ"}]},

{id:"n3f30",lv:"N3",cat:"名詞化・引用",p:"〜と言えば",conn:"N／普通形 ＋ といえば",
en:"Speaking of X; that reminds me of X.",
th:"พูดถึง X แล้ว; นึกขึ้นได้ว่า",
note_en:"Picks up a topic just mentioned and develops it. A very natural way to change the subject smoothly in conversation.",
note_th:"หยิบหัวข้อที่เพิ่งพูดถึงมาขยายต่อ เป็นวิธีเปลี่ยนเรื่องอย่างลื่นไหลในบทสนทนา",
ex:[{j:"大阪と言えば、たこ焼きですね。",k:"おおさかと いえば、たこやき ですね。",e:"Speaking of Osaka — takoyaki, right?",t:"พูดถึงโอซาก้าแล้วก็ต้องทาโกยากิเลยนะครับ"},
{j:"そう言えば、明日は休みだった。",k:"そう いえば、あしたは やすみ だった。",e:"That reminds me — tomorrow's a holiday.",t:"พูดแล้วนึกได้ พรุ่งนี้เป็นวันหยุดนี่นา"}]},

{id:"n3f31",lv:"N3",cat:"逆接",p:"〜といっても",conn:"普通形／N ＋ といっても",
en:"Although I say X, actually it's less than you'd think.",
th:"ถึงจะบอกว่า X แต่จริง ๆ ก็ไม่ได้ขนาดนั้น",
note_en:"You state something, then immediately shrink expectations. 料理といっても、簡単なものだけです.",
note_th:"พูดอะไรออกไปแล้วรีบลดความคาดหวังทันที เช่น 料理といっても、簡単なものだけです",
ex:[{j:"料理といっても、簡単なものだけです。",k:"りょうりと いっても、かんたんな ものだけ です。",e:"I say I cook, but only simple things.",t:"ถึงจะบอกว่าทำอาหาร แต่ก็แค่ของง่าย ๆ ครับ"},
{j:"忙しいといっても、休む時間はある。",k:"いそがしいと いっても、やすむ じかんは ある。",e:"Busy as I am, I do have time to rest.",t:"ถึงจะบอกว่ายุ่ง แต่ก็ยังมีเวลาพัก"}]},

{id:"n3f32",lv:"N3",cat:"名詞化・引用",p:"〜というより",conn:"普通形／N ＋ というより",
en:"Rather than X, it's more like Y.",
th:"มากกว่าจะเป็น X ก็คือ Y มากกว่า",
note_en:"Corrects a description toward a better word. 難しいというより、複雑だ.",
note_th:"เป็นการแก้คำบรรยายให้ตรงขึ้น เช่น 難しいというより、複雑だ",
ex:[{j:"難しいというより、複雑なんです。",k:"むずかしいと いうより、ふくざつ なんです。",e:"It's not so much hard as complicated.",t:"มากกว่าจะยาก มันซับซ้อนมากกว่าครับ"},
{j:"趣味というより、仕事の一部です。",k:"しゅみと いうより、しごとの いちぶ です。",e:"It's less a hobby than part of my job.",t:"มากกว่าจะเป็นงานอดิเรก มันเป็นส่วนหนึ่งของงานมากกว่า"}]},

{id:"n3f33",lv:"N3",cat:"接続・助詞",p:"〜とおりに",conn:"V辞書形／Vた／N の ＋ とおりに",
en:"Exactly as; in the same way as.",
th:"ตามที่...เป๊ะ ๆ; แบบเดียวกับที่",
note_en:"Emphasises faithful copying. After a noun it becomes どおり: 予定どおり, 説明書どおり.",
note_th:"เน้นการทำตามอย่างซื่อตรง ถ้าต่อท้ายคำนามจะกลายเป็น どおり เช่น 予定どおり 説明書どおり",
ex:[{j:"説明書のとおりに組み立ててください。",k:"せつめいしょの とおりに くみたてて ください。",e:"Please assemble it exactly as the manual says.",t:"กรุณาประกอบตามคู่มือเป๊ะ ๆ นะครับ"},
{j:"予定どおりに進んでいます。",k:"よていどおりに すすんで います。",e:"It's going according to plan.",t:"กำลังดำเนินไปตามแผนครับ"}]},

{id:"n3f34",lv:"N3",cat:"複合動詞",p:"〜通す",conn:"Vます形＋とおす",
en:"To do something right through to the end.",
th:"ทำต่อเนื่องจนจบ",
note_en:"Emphasises duration without stopping: read a whole book (読み通す), stay silent throughout (黙り通す). ぬく stresses hardship; 通す stresses continuity.",
note_th:"เน้นความต่อเนื่องไม่หยุด เช่น อ่านทั้งเล่ม (読み通す) เงียบตลอด (黙り通す) โดย ぬく เน้นความลำบาก ส่วน 通す เน้นความต่อเนื่อง",
ex:[{j:"最後まで読み通した。",k:"さいごまで よみとおした。",e:"I read it right through to the end.",t:"อ่านจนจบเล่มเลย"},
{j:"彼は自分の意見を言い通した。",k:"かれは じぶんの いけんを いいとおした。",e:"He maintained his opinion throughout.",t:"เขายืนยันความเห็นของตัวเองตลอด"}]},

{id:"n3f35",lv:"N3",cat:"程度・比較",p:"とても〜ない",conn:"とても＋V可能形のない形",
en:"Couldn't possibly; simply cannot.",
th:"ไม่มีทางจะ...ได้เลย",
note_en:"Not the everyday 'very'. With a negative, とても means 'by no means': とても覚えられない.",
note_th:"ไม่ใช่ とても ที่แปลว่า 'มาก' ในชีวิตประจำวัน เมื่อคู่กับรูปปฏิเสธจะแปลว่า 'ไม่มีทาง' เช่น とても覚えられない",
ex:[{j:"一日でとても覚えられません。",k:"いちにちで とても おぼえられません。",e:"I couldn't possibly memorise it in a day.",t:"ไม่มีทางจำได้ในวันเดียวหรอกครับ"},
{j:"この量はとても食べきれない。",k:"この りょうは とても たべきれない。",e:"There's no way I can finish this much.",t:"ปริมาณขนาดนี้ไม่มีทางกินหมดได้เลย"}]}
,
{id:"n2f01",lv:"N2",cat:"限定・強調",p:"〜だけは",conn:"V辞書形／N ＋ だけは",
en:"At least X; do all that one can of X.",
th:"อย่างน้อยก็ X; ทำเท่าที่ทำได้ในเรื่อง X",
note_en:"Isolates one thing as the minimum guaranteed. やるだけはやった = I did everything I could.",
note_th:"แยกสิ่งหนึ่งออกมาเป็นขั้นต่ำที่รับประกันได้ เช่น やるだけはやった = ทำทุกอย่างเท่าที่ทำได้แล้ว",
ex:[{j:"やるだけはやりました。",k:"やるだけは やりました。",e:"I did everything I could.",t:"ทำเท่าที่ทำได้แล้วครับ"},
{j:"挨拶だけはきちんとしなさい。",k:"あいさつだけは きちんと しなさい。",e:"At the very least, greet people properly.",t:"อย่างน้อยเรื่องทักทายก็ทำให้เรียบร้อยหน่อย"}]},

{id:"n2f02",lv:"N2",cat:"評価・判断",p:"〜でしかない",conn:"N＋でしかない",
en:"Is nothing but; merely.",
th:"เป็นแค่...เท่านั้น",
note_en:"Stronger and more dismissive than にすぎない. It closes the door on any other interpretation.",
note_th:"แรงและดูแคลนกว่า にすぎない เพราะปิดประตูการตีความอื่นทั้งหมด",
ex:[{j:"それは言い訳でしかない。",k:"それは いいわけでしか ない。",e:"That's nothing but an excuse.",t:"นั่นเป็นแค่ข้อแก้ตัวเท่านั้น"},
{j:"今の私は初心者でしかありません。",k:"いまの わたしは しょしんしゃでしか ありません。",e:"Right now I'm nothing but a beginner.",t:"ตอนนี้ผมเป็นแค่มือใหม่เท่านั้นครับ"}]},

{id:"n2f03",lv:"N2",cat:"時・場面",p:"〜がきっかけで",conn:"N／V の ＋ がきっかけで",
en:"X was the thing that started it off.",
th:"X เป็นสิ่งที่ทำให้เริ่มต้นขึ้น",
note_en:"Same idea as をきっかけに but with が, putting the trigger in subject position. Slightly more narrative.",
note_th:"ความหมายเดียวกับ をきっかけに แต่ใช้ が ทำให้จุดเริ่มอยู่ในตำแหน่งประธาน ให้ความรู้สึกเป็นการเล่าเรื่องมากกว่า",
ex:[{j:"アニメがきっかけで日本語を始めました。",k:"アニメが きっかけで にほんごを はじめました。",e:"Anime is what got me into Japanese.",t:"อนิเมะเป็นจุดเริ่มที่ทำให้เริ่มเรียนภาษาญี่ปุ่นครับ"},
{j:"小さな喧嘩がきっかけで、疎遠になった。",k:"ちいさな けんかが きっかけで、そえんに なった。",e:"A small quarrel is what drove us apart.",t:"การทะเลาะเล็ก ๆ เป็นจุดเริ่มที่ทำให้ห่างกันไป"}]},

{id:"n2f04",lv:"N2",cat:"程度・比例",p:"〜以上に",conn:"V普通形／N ＋ いじょうに",
en:"More than X; beyond X.",
th:"มากกว่า X; เกินกว่า X",
note_en:"Distinguish from 以上は (since/now that). 以上に compares degree; 以上は gives a reason.",
note_th:"ต้องแยกจาก 以上は (ในเมื่อ) โดย 以上に เปรียบเทียบระดับ ส่วน 以上は บอกเหตุผล",
ex:[{j:"思った以上に難しかった。",k:"おもった いじょうに むずかしかった。",e:"It was harder than I expected.",t:"ยากกว่าที่คิดไว้"},
{j:"去年以上に努力するつもりだ。",k:"きょねん いじょうに どりょく する つもりだ。",e:"I intend to work harder than last year.",t:"ตั้งใจจะพยายามมากกว่าปีที่แล้ว"}]},

{id:"n2f05",lv:"N2",cat:"評価・判断",p:"〜甲斐がある",conn:"Vた／Vます形／N の ＋ かいがある",
en:"It was worth the effort.",
th:"คุ้มค่ากับความพยายาม",
note_en:"Says the reward justified the work. Also as a suffix: やりがい (worth doing), 生きがい (what makes life worth living).",
note_th:"บอกว่าผลลัพธ์คุ้มกับความพยายาม และใช้เป็นปัจจัยได้ เช่น やりがい (คุ้มค่าที่จะทำ) 生きがい (สิ่งที่ทำให้ชีวิตมีค่า)",
ex:[{j:"毎日練習した甲斐があった。",k:"まいにち れんしゅう した かいが あった。",e:"Practising every day was worth it.",t:"การฝึกทุกวันคุ้มค่าจริง ๆ"},
{j:"待った甲斐があるおいしさだ。",k:"まった かいが ある おいしさだ。",e:"It's delicious enough to justify the wait.",t:"อร่อยจนคุ้มกับการรอเลย"}]},

{id:"n2f06",lv:"N2",cat:"慣用・書き言葉",p:"〜ことか",conn:"疑問詞＋V普通形／イA／ナA な ＋ ことか",
en:"How very...! — an exclamation of strong feeling.",
th:"ช่างเป็น...เสียเหลือเกิน! — อุทานแสดงอารมณ์แรง",
note_en:"Needs a question word in front: どんなに, なんと, どれほど. It's emotional emphasis, not a real question.",
note_th:"ต้องมีคำคำถามนำหน้า เช่น どんなに なんと どれほど เป็นการเน้นอารมณ์ ไม่ใช่คำถามจริง ๆ",
ex:[{j:"この日をどんなに待っていたことか。",k:"この ひを どんなに まって いた ことか。",e:"How long I've waited for this day!",t:"รอวันนี้มานานแสนนานเหลือเกิน"},
{j:"何度注意したことか。",k:"なんど ちゅうい した ことか。",e:"How many times have I warned you!",t:"เตือนไปตั้งกี่ครั้งแล้วเนี่ย"}]},

{id:"n2f07",lv:"N2",cat:"慣用・書き言葉",p:"〜ままに",conn:"V辞書形／Vられる／N の ＋ ままに",
en:"As one is told; just as it is; at the mercy of.",
th:"ตามที่ถูกบอก; ตามที่เป็นอยู่; ปล่อยไปตาม",
note_en:"Implies passivity — following someone else's lead without your own judgement. 言われるままに従った.",
note_th:"สื่อถึงความเฉื่อยชา คือทำตามคนอื่นโดยไม่ใช้วิจารณญาณตัวเอง เช่น 言われるままに従った",
ex:[{j:"言われるままに書類にサインした。",k:"いわれる ままに しょるいに サイン した。",e:"I signed the papers just as I was told.",t:"เซ็นเอกสารไปตามที่เขาบอกทุกอย่าง"},
{j:"足の向くままに歩いた。",k:"あしの むく ままに あるいた。",e:"I walked wherever my feet took me.",t:"เดินไปเรื่อย ๆ ตามที่เท้าพาไป"}]},

{id:"n2f08",lv:"N2",cat:"逆接・対比",p:"〜もかまわず",conn:"N／V の ＋ もかまわず",
en:"Without caring about X; heedless of X.",
th:"โดยไม่สนใจ X; ไม่แคร์ X",
note_en:"The person ignores something they ought to consider — usually mildly critical. 人目もかまわず泣いた.",
note_th:"คนนั้นเพิกเฉยต่อสิ่งที่ควรใส่ใจ มักมีน้ำเสียงติเล็กน้อย เช่น 人目もかまわず泣いた",
ex:[{j:"人目もかまわず泣き出した。",k:"ひとめも かまわず なきだした。",e:"She burst into tears heedless of onlookers.",t:"ร้องไห้ออกมาโดยไม่สนสายตาใคร"},
{j:"雨もかまわず走り続けた。",k:"あめも かまわず はしり つづけた。",e:"He kept running, rain and all.",t:"วิ่งต่อไปโดยไม่สนใจฝน"}]},

{id:"n2f09",lv:"N2",cat:"評価・判断",p:"〜のも当然だ / 〜のももっともだ",conn:"V普通形／イA／ナA な ＋ のもとうぜんだ",
en:"It's only natural that; no wonder.",
th:"ก็สมควรอยู่แล้วที่; ไม่แปลกเลยที่",
note_en:"Endorses someone's reaction as reasonable. もっともだ leans toward 'their complaint is fair'.",
note_th:"เป็นการรับรองว่าปฏิกิริยาของใครสมเหตุสมผล ส่วน もっともだ เอนไปทาง 'ที่เขาบ่นก็ถูกแล้ว'",
ex:[{j:"あれだけ練習したのだから、勝つのも当然だ。",k:"あれだけ れんしゅう したのだから、かつのも とうぜんだ。",e:"After all that practice, no wonder they won.",t:"ซ้อมมาขนาดนั้น ชนะก็สมควรอยู่แล้ว"},
{j:"彼が怒るのももっともだ。",k:"かれが おこるのも もっともだ。",e:"It's quite understandable that he's angry.",t:"ที่เขาโกรธก็สมเหตุสมผลแล้ว"}]},

{id:"n2f10",lv:"N2",cat:"評価・判断",p:"〜ものではない",conn:"V辞書形＋ものではない",
en:"One shouldn't do that — it's not the done thing.",
th:"ไม่ควรทำแบบนั้น — มันไม่เหมาะ",
note_en:"A social norm, not a rule with penalties. Often said to children: 人を指さすものではない.",
note_th:"เป็นบรรทัดฐานทางสังคม ไม่ใช่กฎที่มีบทลงโทษ มักพูดกับเด็ก เช่น 人を指さすものではない",
ex:[{j:"人の日記を読むものではない。",k:"ひとの にっきを よむ ものでは ない。",e:"You shouldn't read other people's diaries.",t:"ไม่ควรอ่านไดอารี่ของคนอื่น"},
{j:"食べ物を粗末にするものではありません。",k:"たべものを そまつに する ものでは ありません。",e:"One shouldn't waste food.",t:"ไม่ควรทิ้งขว้างอาหารครับ"}]},

{id:"n2f11",lv:"N2",cat:"評価・判断",p:"〜なくはない / 〜なくもない",conn:"Vない（ない削除）＋くはない",
en:"It's not that I don't; I sort of do.",
th:"ก็ไม่ใช่ว่าจะไม่; ก็มีอยู่บ้าง",
note_en:"A hedged, half-hearted yes. Softer than ないことはない and very common when politely declining to commit.",
note_th:"เป็นการตอบรับแบบครึ่ง ๆ กลาง ๆ นุ่มกว่า ないことはない และใช้บ่อยมากตอนเลี่ยงที่จะรับปากชัด ๆ",
ex:[{j:"興味がなくはないんですが…",k:"きょうみが なくは ないんですが…",e:"It's not that I'm uninterested, but...",t:"ก็ไม่ใช่ว่าจะไม่สนใจนะครับ แต่ว่า…"},
{j:"できなくもないと思います。",k:"できなくも ないと おもいます。",e:"I think it might just be doable.",t:"คิดว่าก็พอจะทำได้อยู่ครับ"}]},

{id:"n2f12",lv:"N2",cat:"慣用・書き言葉",p:"〜ずに済む / 〜なくて済む",conn:"Vない（ない削除）＋ずにすむ／Vなくて＋すむ",
en:"To get by without having to do X.",
th:"รอดไปได้โดยไม่ต้องทำ X",
note_en:"A relief that something unwanted was avoided. 済む means 'it's settled' — the problem resolved itself without that step.",
note_th:"เป็นความโล่งใจว่าเลี่ยงสิ่งที่ไม่อยากทำได้ 済む แปลว่า 'จบเรียบร้อย' คือปัญหาคลี่คลายโดยไม่ต้องทำขั้นตอนนั้น",
ex:[{j:"予約したので、待たずに済んだ。",k:"よやく したので、またずに すんだ。",e:"I'd booked, so I didn't have to wait.",t:"เพราะจองไว้ เลยไม่ต้องรอ"},
{j:"手術しなくて済みそうです。",k:"しゅじゅつ しなくて すみそう です。",e:"It looks like I won't need surgery.",t:"ท่าทางจะไม่ต้องผ่าตัดครับ"}]},

{id:"n2f13",lv:"N2",cat:"逆接・対比",p:"〜に関わらず / 〜にかかわらず",conn:"N／V辞書形＋V ない ＋ にかかわらず",
en:"Regardless of X.",
th:"ไม่ว่า X จะเป็นอย่างไรก็ตาม",
note_en:"Careful: にかかわらず = regardless of. にもかかわらず = despite. One も changes it from neutral to concessive.",
note_th:"ระวัง: にかかわらず = ไม่ว่าจะ... ส่วน にもかかわらず = ทั้ง ๆ ที่ แค่ も ตัวเดียวเปลี่ยนจากกลาง ๆ เป็นการยอมรับเงื่อนไข",
ex:[{j:"天候にかかわらず、開催します。",k:"てんこうに かかわらず、かいさい します。",e:"It will be held regardless of the weather.",t:"จะจัดขึ้นไม่ว่าสภาพอากาศจะเป็นอย่างไรครับ"},
{j:"経験の有無にかかわらず応募できます。",k:"けいけんの うむに かかわらず おうぼ できます。",e:"You may apply whether or not you have experience.",t:"สมัครได้ไม่ว่าจะมีประสบการณ์หรือไม่ครับ"}]},

{id:"n2f14",lv:"N2",cat:"立場・観点",p:"〜に関わる",conn:"N＋にかかわる",
en:"To affect; to have serious bearing on.",
th:"ส่งผลต่อ; เกี่ยวพันอย่างสำคัญกับ",
note_en:"Usually about serious matters: 命に関わる, 信用に関わる. Implies stakes, not casual relevance.",
note_th:"มักใช้กับเรื่องสำคัญ เช่น 命に関わる 信用に関わる สื่อถึงความเสี่ยงสูง ไม่ใช่แค่เกี่ยวข้องเฉย ๆ",
ex:[{j:"それは命に関わる問題です。",k:"それは いのちに かかわる もんだい です。",e:"That is a matter of life and death.",t:"นั่นเป็นปัญหาที่เกี่ยวกับชีวิตเลยครับ"},
{j:"店の信用に関わる問題です。",k:"みせの しんように かかわる もんだい です。",e:"It's a matter affecting the shop's reputation.",t:"เป็นปัญหาที่กระทบต่อความน่าเชื่อถือของร้านครับ"}]},

{id:"n2f15",lv:"N2",cat:"目的・手段",p:"〜に応えて",conn:"N＋にこたえて",
en:"In response to; living up to X.",
th:"ตอบสนองต่อ; สมกับ X",
note_en:"The noun is an expectation or request: 期待, 要望, 声援. You're meeting what someone hoped for.",
note_th:"คำนามข้างหน้าคือความคาดหวังหรือคำร้องขอ เช่น 期待 要望 声援 คือการทำให้สมกับที่ใครหวังไว้",
ex:[{j:"皆さんの期待に応えたいです。",k:"みなさんの きたいに こたえたい です。",e:"I want to live up to everyone's expectations.",t:"อยากทำให้สมกับความคาดหวังของทุกคนครับ"},
{j:"お客様の要望に応えて、営業時間を延ばした。",k:"おきゃくさまの ようぼうに こたえて、えいぎょう じかんを のばした。",e:"In response to customer requests, we extended opening hours.",t:"ตอบรับความต้องการของลูกค้า จึงขยายเวลาทำการ"}]},

{id:"n2f16",lv:"N2",cat:"立場・観点",p:"〜にしたら / 〜にすれば",conn:"N＋にしたら・にすれば",
en:"From X's point of view (usually a person).",
th:"จากมุมมองของ X (มักเป็นคน)",
note_en:"Only for people or groups whose feelings matter. Close to にとって, but にしたら stresses their subjective side.",
note_th:"ใช้เฉพาะคนหรือกลุ่มที่ความรู้สึกของเขาสำคัญ ใกล้เคียงกับ にとって แต่ にしたら เน้นด้านความรู้สึกส่วนตัวของเขา",
ex:[{j:"親にしたら、心配なのは当然だ。",k:"おやに したら、しんぱいなのは とうぜんだ。",e:"From a parent's view, worrying is natural.",t:"จากมุมของพ่อแม่ การเป็นห่วงก็เป็นเรื่องปกติ"},
{j:"外国人にすれば、ややこしい制度だ。",k:"がいこくじんに すれば、ややこしい せいどだ。",e:"From a foreigner's view, it's a confusing system.",t:"จากมุมของชาวต่างชาติ เป็นระบบที่ซับซ้อนวุ่นวาย"}]},

{id:"n2f17",lv:"N2",cat:"時・場面",p:"〜につけ",conn:"V辞書形＋につけ",
en:"Whenever X happens, it brings on Y (a feeling).",
th:"ทุกครั้งที่ X ก็จะทำให้รู้สึก Y",
note_en:"The second half must be an emotion or memory, never an action. 見るにつけ、思い出す. Also as a pair: 何かにつけ.",
note_th:"ประโยคหลังต้องเป็นอารมณ์หรือความทรงจำ ไม่ใช่การกระทำ เช่น 見るにつけ、思い出す และใช้เป็นคู่ได้ เช่น 何かにつけ",
ex:[{j:"この写真を見るにつけ、故郷を思い出す。",k:"この しゃしんを みるに つけ、こきょうを おもいだす。",e:"Whenever I see this photo, I think of home.",t:"ทุกครั้งที่เห็นรูปนี้ก็จะคิดถึงบ้านเกิด"},
{j:"何かにつけ、彼は文句を言う。",k:"なにかに つけ、かれは もんくを いう。",e:"At every opportunity, he complains.",t:"ทุกเรื่องเลย เขาต้องบ่นตลอด"}]},

{id:"n2f18",lv:"N2",cat:"慣用・書き言葉",p:"〜につき",conn:"N＋につき",
en:"Due to (formal notice); or: per / each.",
th:"เนื่องจาก (ประกาศทางการ); หรือ ต่อหนึ่ง",
note_en:"Two uses in signs: 工事中につき (due to construction) and 一人につき (per person). Both are notice-board Japanese.",
note_th:"ใช้สองแบบบนป้าย เช่น 工事中につき (เนื่องจากกำลังก่อสร้าง) และ 一人につき (ต่อคน) เป็นภาษาแบบป้ายประกาศทั้งคู่",
ex:[{j:"改装中につき、休業いたします。",k:"かいそうちゅうに つき、きゅうぎょう いたします。",e:"Closed due to renovation.",t:"ปิดทำการเนื่องจากกำลังปรับปรุงร้านครับ"},
{j:"お一人様につき2個までです。",k:"おひとりさまに つき にこまで です。",e:"Up to two per person.",t:"จำกัดคนละไม่เกิน 2 ชิ้นครับ"}]},

{id:"n2f19",lv:"N2",cat:"限定・強調",p:"〜を除いて",conn:"N＋をのぞいて",
en:"Except for; with the exception of.",
th:"ยกเว้น; นอกจาก",
note_en:"More formal and precise than 以外. Common in rules and schedules: 日曜を除いて毎日.",
note_th:"เป็นทางการและแม่นยำกว่า 以外 เจอบ่อยในกฎและตารางเวลา เช่น 日曜を除いて毎日",
ex:[{j:"日曜を除いて、毎日営業しています。",k:"にちようを のぞいて、まいにち えいぎょう して います。",e:"We're open every day except Sunday.",t:"เปิดทำการทุกวันยกเว้นวันอาทิตย์ครับ"},
{j:"一部の地域を除いて、配送可能です。",k:"いちぶの ちいきを のぞいて、はいそう かのう です。",e:"Delivery is available except in some areas.",t:"จัดส่งได้ยกเว้นบางพื้นที่ครับ"}]},

{id:"n2f20",lv:"N2",cat:"敬語",p:"お〜願う / お〜ください",conn:"お＋Vます形＋願います・ください／ご＋漢語N＋願います",
en:"Please do X — a formal request.",
th:"กรุณา...ครับ — คำขอร้องแบบทางการ",
note_en:"お〜願います is stiffer than お〜ください and appears in announcements and written notices: ご確認お願いいたします.",
note_th:"お〜願います แข็งกว่า お〜ください และเจอในประกาศและหนังสือแจ้ง",
ex:[{j:"少々お待ち願います。",k:"しょうしょう おまち ねがいます。",e:"Please wait a moment.",t:"กรุณารอสักครู่ครับ"},
{j:"こちらにお名前をお書きください。",k:"こちらに おなまえを おかき ください。",e:"Please write your name here.",t:"กรุณาเขียนชื่อตรงนี้ครับ"}]},

{id:"n2f21",lv:"N2",cat:"程度・比例",p:"ろくに〜ない",conn:"ろくに＋Vない",
en:"Hardly; not properly.",
th:"แทบไม่ได้...อย่างเป็นเรื่องเป็นราว",
note_en:"Carries frustration that something wasn't done adequately: ろくに寝ていない, ろくに話せない.",
note_th:"มีน้ำเสียงหงุดหงิดว่าทำได้ไม่ดีพอ เช่น ろくに寝ていない ろくに話せない",
ex:[{j:"忙しくて、ろくに寝ていない。",k:"いそがしくて、ろくに ねて いない。",e:"I'm so busy I've hardly slept.",t:"ยุ่งจนแทบไม่ได้นอนเลย"},
{j:"ろくに練習もせずに試合に出た。",k:"ろくに れんしゅうも せずに しあいに でた。",e:"He entered the match with barely any practice.",t:"ลงแข่งทั้งที่แทบไม่ได้ซ้อมเลย"}]},

{id:"n2f22",lv:"N2",cat:"限定・強調",p:"〜てでも",conn:"Vて＋でも",
en:"Even if I have to X, I'll do it.",
th:"ต่อให้ต้อง X ก็จะทำ",
note_en:"Shows determination to pay a high price. Contrast with てまで, which criticises someone for paying it.",
note_th:"แสดงความมุ่งมั่นที่จะยอมจ่ายราคาแพง ต่างจาก てまで ที่ใช้ตำหนิคนที่ยอมจ่าย",
ex:[{j:"徹夜してでも、明日までに終わらせます。",k:"てつや してでも、あしたまでに おわらせます。",e:"Even if I have to stay up all night, I'll finish by tomorrow.",t:"ต่อให้ต้องอดนอนทั้งคืน ก็จะทำให้เสร็จภายในพรุ่งนี้ครับ"},
{j:"借金してでも留学したい。",k:"しゃっきん してでも りゅうがく したい。",e:"I want to study abroad even if I must borrow money.",t:"อยากไปเรียนต่อต่างประเทศ ต่อให้ต้องกู้เงินก็ตาม"}]},

{id:"n2f23",lv:"N2",cat:"条件",p:"〜ていては",conn:"Vて＋いては",
en:"If you keep doing X, (bad result).",
th:"ถ้ายังทำ X แบบนี้ต่อไป ก็จะแย่",
note_en:"A warning about a continuing habit. The second clause is always negative.",
note_th:"เป็นคำเตือนเกี่ยวกับนิสัยที่ทำอยู่ต่อเนื่อง ประโยคหลังเป็นลบเสมอ",
ex:[{j:"そんなに悩んでいては、前に進めない。",k:"そんなに なやんで いては、まえに すすめない。",e:"If you keep agonising like that, you can't move forward.",t:"ถ้ายังกังวลแบบนี้ต่อไป ก็ก้าวไปข้างหน้าไม่ได้"},
{j:"単語だけ覚えていては、話せるようにならない。",k:"たんごだけ おぼえて いては、はなせる ように ならない。",e:"If you only memorise words, you'll never speak.",t:"ถ้าเอาแต่ท่องศัพท์อย่างเดียว ก็จะพูดไม่ได้สักที"}]},

{id:"n2f24",lv:"N2",cat:"評価・判断",p:"〜て当然だ",conn:"Vて／イA くて／ナA で ＋ とうぜんだ",
en:"It's only natural to X.",
th:"...ก็เป็นเรื่องธรรมดา",
note_en:"Declares a reaction fully justified. Close to のも当然だ but attaches directly to the て-form.",
note_th:"ประกาศว่าปฏิกิริยานั้นสมเหตุสมผลเต็มที่ ใกล้เคียงกับ のも当然だ แต่ต่อกับรูป て โดยตรง",
ex:[{j:"あんなに失礼なら、怒って当然だ。",k:"あんなに しつれいなら、おこって とうぜんだ。",e:"That rude, of course they got angry.",t:"เสียมารยาทขนาดนั้น โกรธก็ธรรมดา"},
{j:"初めてなら、緊張して当然です。",k:"はじめてなら、きんちょう して とうぜん です。",e:"If it's your first time, it's natural to be nervous.",t:"ถ้าเป็นครั้งแรก ตื่นเต้นก็ธรรมดาครับ"}]},

{id:"n2f25",lv:"N2",cat:"評価・判断",p:"〜てはいられない",conn:"Vて＋はいられない",
en:"I can't afford to keep doing X.",
th:"จะมัวทำ X อยู่ไม่ได้แล้ว",
note_en:"Urgency — circumstances demand you stop and act. こうしてはいられない is a set phrase meaning 'no time to stand around'.",
note_th:"แสดงความเร่งด่วน สถานการณ์บังคับให้หยุดแล้วลงมือ วลี こうしてはいられない เป็นสำนวนแปลว่า 'มัวยืนอยู่ไม่ได้แล้ว'",
ex:[{j:"のんびりしてはいられない。",k:"のんびり しては いられない。",e:"I can't afford to take it easy.",t:"จะมัวเรื่อย ๆ อยู่ไม่ได้แล้ว"},
{j:"落ち込んでばかりはいられない。",k:"おちこんで ばかりは いられない。",e:"I can't just stay down about it.",t:"จะเอาแต่ห่อเหี่ยวอยู่ไม่ได้"}]},

{id:"n2f26",lv:"N2",cat:"時・場面",p:"〜と同時に",conn:"V辞書形／N ＋ とどうじに",
en:"At the same time as; simultaneously with.",
th:"พร้อมกันกับ; ในเวลาเดียวกับ",
note_en:"Both literal simultaneity and 'in addition to being': 教師であると同時に、親でもある.",
note_th:"ใช้ได้ทั้งความหมายว่าเกิดพร้อมกันจริง ๆ และ 'ขณะเดียวกันก็เป็น' เช่น 教師であると同時に、親でもある",
ex:[{j:"ベルが鳴ると同時に、席を立った。",k:"ベルが なると どうじに、せきを たった。",e:"The moment the bell rang, I stood up.",t:"พร้อมกับที่กริ่งดัง ก็ลุกจากที่นั่ง"},
{j:"彼は学生であると同時に、経営者でもある。",k:"かれは がくせいで あると どうじに、けいえいしゃでも ある。",e:"He's a student and at the same time a business owner.",t:"เขาเป็นนักศึกษา และในขณะเดียวกันก็เป็นเจ้าของกิจการด้วย"}]},

{id:"n2f27",lv:"N2",cat:"添加・並列",p:"〜といった",conn:"N＋や＋N＋といった＋N",
en:"Such as; things like X and Y.",
th:"เช่น; อย่างเช่น X และ Y",
note_en:"Introduces examples that stand for a wider category. Different from という (naming one specific thing).",
note_th:"ใช้ยกตัวอย่างที่เป็นตัวแทนของหมวดที่กว้างกว่า ต่างจาก という ที่ระบุสิ่งใดสิ่งหนึ่งเจาะจง",
ex:[{j:"寿司や天ぷらといった和食が好きです。",k:"すしや てんぷらと いった わしょくが すき です。",e:"I like Japanese food such as sushi and tempura.",t:"ชอบอาหารญี่ปุ่นอย่างเช่นซูชิและเทมปุระครับ"},
{j:"文法や語彙といった基礎が大切だ。",k:"ぶんぽうや ごいと いった きそが たいせつだ。",e:"Basics such as grammar and vocabulary matter.",t:"พื้นฐานอย่างไวยากรณ์และคำศัพท์สำคัญมาก"}]},

{id:"n2f28",lv:"N2",cat:"名詞化・引用",p:"〜ということは",conn:"普通形＋ということは",
en:"That is to say; which means that.",
th:"นั่นก็คือ; ซึ่งหมายความว่า",
note_en:"Draws a logical inference from what was just said. Often opens the conclusion of an argument.",
note_th:"ใช้อนุมานตามหลักเหตุผลจากสิ่งที่เพิ่งพูด มักใช้เปิดข้อสรุปของการโต้แย้ง",
ex:[{j:"連絡がないということは、問題ないのだろう。",k:"れんらくが ないと いう ことは、もんだい ないのだろう。",e:"No contact means there's probably no problem.",t:"ไม่มีการติดต่อมา ก็คือคงไม่มีปัญหา"},
{j:"合格したということは、実力があるということだ。",k:"ごうかく したと いう ことは、じつりょくが あると いう ことだ。",e:"Passing means you have real ability.",t:"การที่สอบผ่านก็หมายความว่ามีความสามารถจริง"}]},

{id:"n2f29",lv:"N2",cat:"評価・判断",p:"〜というものではない",conn:"普通形＋というものではない",
en:"It's not necessarily true that; that's not how it works.",
th:"ไม่ใช่ว่าจะเป็นแบบนั้นเสมอไป",
note_en:"Rejects an oversimplified belief. 高ければいいというものではない = expensive doesn't automatically mean good.",
note_th:"ปฏิเสธความเชื่อที่ง่ายเกินไป เช่น 高ければいいというものではない = แพงไม่ได้แปลว่าดีเสมอไป",
ex:[{j:"高ければいいというものではない。",k:"たかければ いいと いう ものでは ない。",e:"Expensive doesn't automatically mean good.",t:"ไม่ใช่ว่าแพงแล้วจะดีเสมอไป"},
{j:"長く勉強すればいいというものでもない。",k:"ながく べんきょう すれば いいと いう ものでも ない。",e:"Studying longer isn't automatically better.",t:"ไม่ใช่ว่าเรียนนานแล้วจะดีเสมอไป"}]},

{id:"n2f30",lv:"N2",cat:"慣用・書き言葉",p:"〜と考えられる",conn:"普通形＋とかんがえられる",
en:"It is thought that; one can consider that.",
th:"เชื่อกันว่า; อาจพิจารณาได้ว่า",
note_en:"Academic hedging. Lets you present a view without claiming it as personal opinion — essential for essay writing.",
note_th:"เป็นการเลี่ยงยืนยันแบบวิชาการ ทำให้เสนอมุมมองได้โดยไม่อ้างว่าเป็นความเห็นส่วนตัว จำเป็นมากในการเขียนเรียงความ",
ex:[{j:"この原因は気候変動にあると考えられる。",k:"この げんいんは きこう へんどうに あると かんがえられる。",e:"The cause is thought to lie in climate change.",t:"เชื่อกันว่าสาเหตุอยู่ที่การเปลี่ยนแปลงสภาพภูมิอากาศ"},
{j:"今後も増加すると考えられます。",k:"こんごも ぞうか すると かんがえられます。",e:"It is expected to keep increasing.",t:"คาดว่าจะเพิ่มขึ้นต่อไปครับ"}]},

{id:"n2f31",lv:"N2",cat:"時・場面",p:"〜ところだった",conn:"V辞書形＋ところだった",
en:"Was just about to; nearly happened (but didn't).",
th:"เกือบจะ...แล้ว (แต่ไม่เกิด)",
note_en:"Relief at a near miss. Often with もう少しで: もう少しで遅刻するところだった.",
note_th:"เป็นความโล่งใจที่หวุดหวิด มักใช้กับ もう少しで เช่น もう少しで遅刻するところだった",
ex:[{j:"もう少しで電車に乗り遅れるところだった。",k:"もうすこしで でんしゃに のりおくれる ところ だった。",e:"I nearly missed the train.",t:"เกือบตกรถไฟแล้ว"},
{j:"危ない、転ぶところだった。",k:"あぶない、ころぶ ところ だった。",e:"Careful — I almost fell.",t:"หวาดเสียว เกือบล้มแล้ว"}]},

{id:"n2f32",lv:"N2",cat:"立場・観点",p:"〜ところを見ると",conn:"V普通形＋ところをみると",
en:"Judging from the fact that.",
th:"ดูจากการที่...แล้ว",
note_en:"You observe evidence and infer. Always followed by a guess: らしい, ようだ, のだろう.",
note_th:"สังเกตหลักฐานแล้วอนุมาน ตามด้วยการคาดเดาเสมอ เช่น らしい ようだ のだろう",
ex:[{j:"笑っているところを見ると、うまくいったらしい。",k:"わらって いる ところを みると、うまく いった らしい。",e:"Judging from the smile, it seems to have gone well.",t:"ดูจากที่ยิ้มอยู่ ท่าทางจะไปได้สวย"},
{j:"電気が消えているところを見ると、留守のようだ。",k:"でんきが きえて いる ところを みると、るすの ようだ。",e:"Given the lights are off, they seem to be out.",t:"ดูจากที่ไฟดับ ท่าทางจะไม่อยู่บ้าน"}]},

{id:"n2f33",lv:"N2",cat:"評価・判断",p:"〜よりほかない / 〜ほかない",conn:"V辞書形＋よりほかない・ほかない",
en:"There's nothing for it but to X.",
th:"ไม่มีทางอื่นนอกจากจะ X",
note_en:"Formal cousin of しかない, with the same resigned tone. Often 〜よりほか(に)方法がない.",
note_th:"เป็นญาติแบบทางการของ しかない ด้วยน้ำเสียงจำยอมเหมือนกัน มักใช้ว่า 〜よりほか(に)方法がない",
ex:[{j:"こうなったら、待つよりほかない。",k:"こう なったら、まつより ほか ない。",e:"At this point, there's nothing to do but wait.",t:"มาถึงขั้นนี้แล้ว ก็ไม่มีทางอื่นนอกจากรอ"},
{j:"自分でやるほかなかった。",k:"じぶんで やる ほか なかった。",e:"I had no choice but to do it myself.",t:"ไม่มีทางเลือกอื่นนอกจากทำเอง"}]},

{id:"n2f34",lv:"N2",cat:"意志・希望",p:"〜ようではないか",conn:"V意志形＋ではないか（ではありませんか）",
en:"Let's do X — a rousing call to a group.",
th:"มาทำ X กันเถอะ — คำเชิญชวนที่ปลุกใจ",
note_en:"Formal and speech-like; you'll hear it from leaders and in written appeals, not in casual chat.",
note_th:"เป็นทางการและออกแนวสุนทรพจน์ จะได้ยินจากผู้นำและในข้อเขียนเชิญชวน ไม่ใช้ในบทสนทนากันเอง",
ex:[{j:"みんなで力を合わせようではありませんか。",k:"みんなで ちからを あわせようでは ありませんか。",e:"Let us all join forces.",t:"มาร่วมแรงร่วมใจกันเถิดครับ"},
{j:"もう一度挑戦しようではないか。",k:"もういちど ちょうせん しようでは ないか。",e:"Let's take on the challenge once more.",t:"มาลองท้าทายกันอีกครั้งเถอะ"}]},

{id:"n2f35",lv:"N2",cat:"意志・希望",p:"〜(よ)うか〜まいか",conn:"V意志形＋か＋V辞書形＋まいか",
en:"Whether to do X or not — weighing a decision.",
th:"จะทำ X ดีหรือไม่ทำดี — กำลังชั่งใจ",
note_en:"Shows genuine indecision, usually with 迷う or 悩む. The formal version of 〜ようかどうしようか.",
note_th:"แสดงความลังเลจริง ๆ มักใช้กับ 迷う หรือ 悩む เป็นรูปทางการของ 〜ようかどうしようか",
ex:[{j:"参加しようかしまいか迷っている。",k:"さんか しようか しまいか まよって いる。",e:"I'm torn over whether to take part.",t:"กำลังลังเลว่าจะเข้าร่วมดีหรือไม่ดี"},
{j:"買おうか買うまいか、まだ決められない。",k:"かおうか かうまいか、まだ きめられない。",e:"I still can't decide whether to buy it.",t:"ยังตัดสินใจไม่ได้ว่าจะซื้อดีหรือไม่ซื้อดี"}]},

{id:"n2f36",lv:"N2",cat:"慣用・書き言葉",p:"〜ぬ / 〜ん（否定）",conn:"Vない（ない削除）＋ぬ・ん（する→せぬ）",
en:"Classical negative: does not.",
th:"รูปปฏิเสธแบบโบราณ: ไม่",
note_en:"Survives in set phrases and signs: 分かりません is literally this ん. Also 思わぬ, 知らぬ, 変わらぬ. Read-only for most learners.",
note_th:"ยังหลงเหลือในสำนวนตายตัวและป้าย เช่น 分かりません คือ ん ตัวนี้ และ 思わぬ 知らぬ 変わらぬ ผู้เรียนส่วนใหญ่แค่ต้องอ่านออกก็พอ",
ex:[{j:"思わぬ結果になった。",k:"おもわぬ けっかに なった。",e:"It turned out unexpectedly.",t:"ผลออกมาเกินคาด"},
{j:"変わらぬご支援に感謝します。",k:"かわらぬ ごしえんに かんしゃ します。",e:"Thank you for your unchanging support.",t:"ขอบคุณสำหรับการสนับสนุนที่ไม่เปลี่ยนแปลงครับ"}]},

{id:"n2f37",lv:"N2",cat:"程度・比例",p:"〜次第に",conn:"次第に＋V",
en:"Gradually; little by little.",
th:"ค่อย ๆ; ทีละน้อย",
note_en:"Third meaning of 次第 — as an adverb it means 'gradually'. Compare 〜次第 (as soon as) and 〜次第で (depending on).",
note_th:"เป็นความหมายที่สามของ 次第 เมื่อใช้เป็นคำวิเศษณ์แปลว่า 'ค่อย ๆ' ต่างจาก 〜次第 (ทันทีที่) และ 〜次第で (ขึ้นอยู่กับ)",
ex:[{j:"次第に日本語が聞き取れるようになった。",k:"しだいに にほんごが ききとれる ように なった。",e:"Gradually I became able to catch Japanese.",t:"ค่อย ๆ ฟังภาษาญี่ปุ่นออกมากขึ้น"},
{j:"雨は次第に弱くなった。",k:"あめは しだいに よわく なった。",e:"The rain gradually eased.",t:"ฝนค่อย ๆ เบาลง"}]},

{id:"n2f38",lv:"N2",cat:"原因・理由",p:"〜上は",conn:"V辞書形／Vた ＋ うえは",
en:"Now that X, naturally Y must follow.",
th:"ในเมื่อ X แล้ว ก็ต้อง Y",
note_en:"A third member of the からには / 以上は family, the stiffest of the three. Followed by resolve or obligation.",
note_th:"เป็นสมาชิกที่สามของตระกูล からには / 以上は และแข็งที่สุดในสามตัว ตามด้วยความตั้งใจหรือหน้าที่",
ex:[{j:"引き受けた上は、責任を持ちます。",k:"ひきうけた うえは、せきにんを もちます。",e:"Now that I've accepted, I'll take responsibility.",t:"ในเมื่อรับปากแล้ว ก็จะรับผิดชอบครับ"},
{j:"始めた上は、最後までやる。",k:"はじめた うえは、さいごまで やる。",e:"Now that I've started, I'll finish.",t:"ในเมื่อเริ่มแล้ว ก็จะทำจนจบ"}]}
,
{id:"n3g01",lv:"N3",cat:"意志・希望",p:"〜てもらいたい / 〜ていただきたい",conn:"Vて＋もらいたい・いただきたい",
en:"I would like you to do X (polite request for someone else's action).",
th:"อยากให้คุณทำ X (คำขอสุภาพให้อีกฝ่ายทำ)",
note_en:"Politeness ladder: 〜てほしい (plain) ＜ 〜てもらいたい ＜ 〜ていただきたい (most polite). At work always use いただきたい, and soften further with 〜のですが.",
note_th:"ลำดับความสุภาพ: 〜てほしい (ธรรมดา) ＜ 〜てもらいたい ＜ 〜ていただきたい (สุภาพที่สุด) ในที่ทำงานให้ใช้ いただきたい เสมอ และเติม 〜のですが เพื่อให้นุ่มขึ้นอีก",
ex:[{j:"この書類を確認していただきたいのですが。",k:"この しょるいを かくにん して いただきたいのですが。",e:"I'd like you to check these documents, if I may.",t:"อยากรบกวนให้ช่วยตรวจเอกสารนี้หน่อยครับ"},
{j:"もう少し早く来てもらいたい。",k:"もう すこし はやく きて もらいたい。",e:"I'd like you to come a bit earlier.",t:"อยากให้มาเร็วกว่านี้อีกหน่อย"}]},

{id:"n3g02",lv:"N3",cat:"敬語",p:"〜(さ)せていただきたい",conn:"V使役形＋ていただきたい・ていただけますか",
en:"I would like to be allowed to do X — asking permission very humbly.",
th:"ขออนุญาตทำ X อย่างถ่อมตนที่สุด",
note_en:"The most deferential way to ask for permission. 休ませていただきたいのですが is how you request a day off from a Japanese manager.",
note_th:"เป็นวิธีขออนุญาตที่นอบน้อมที่สุด ประโยค 休ませていただきたいのですが คือวิธีขอลาหยุดกับหัวหน้าคนญี่ปุ่น",
ex:[{j:"明日、休ませていただきたいのですが。",k:"あした、やすませて いただきたいのですが。",e:"I would like to request tomorrow off, if possible.",t:"พรุ่งนี้ขออนุญาตลาหยุดได้ไหมครับ"},
{j:"少し考えさせていただけますか。",k:"すこし かんがえさせて いただけますか。",e:"Might I have a little time to think?",t:"ขอเวลาคิดสักครู่ได้ไหมครับ"}]},

{id:"n3g03",lv:"N3",cat:"義務・許可",p:"命令形 / 禁止形（〜な）",conn:"Iグループ：〜え／IIグループ：〜ろ／する→しろ・来る→来い｜禁止：V辞書形＋な",
en:"Blunt command / blunt prohibition.",
th:"รูปคำสั่งห้วน / รูปห้ามห้วน",
note_en:"Very rough — used by coaches, in emergencies, on signs, and in manga. Almost never appropriate for you to say, but you must recognise it: 止まれ, 入るな, 触るな.",
note_th:"หยาบมาก ใช้โดยโค้ช ในเหตุฉุกเฉิน บนป้าย และในมังงะ แทบไม่มีโอกาสที่เราจะได้พูด แต่ต้องอ่านออก เช่น 止まれ 入るな 触るな",
ex:[{j:"危ないから、触るな。",k:"あぶないから、さわるな。",e:"It's dangerous — don't touch.",t:"อันตราย อย่าจับ"},
{j:"ここに止まれ。",k:"ここに とまれ。",e:"Stop here.",t:"หยุดตรงนี้"}]},

{id:"n3g04",lv:"N3",cat:"伝聞・推量",p:"〜と言われている",conn:"普通形＋といわれている",
en:"It is said that; people generally say.",
th:"ว่ากันว่า; คนทั่วไปพูดกันว่า",
note_en:"Passive, so no source is named — it reports a common belief. Useful in essays where you want to state a view without owning it.",
note_th:"เป็นรูปถูกกระทำ จึงไม่ระบุแหล่งที่มา คือรายงานความเชื่อของคนทั่วไป มีประโยชน์ในเรียงความเวลาที่อยากเสนอมุมมองโดยไม่อ้างว่าเป็นของตัวเอง",
ex:[{j:"日本語は難しいと言われている。",k:"にほんごは むずかしいと いわれて いる。",e:"Japanese is said to be difficult.",t:"ว่ากันว่าภาษาญี่ปุ่นยาก"},
{j:"この温泉は体にいいと言われています。",k:"この おんせんは からだに いいと いわれて います。",e:"This hot spring is said to be good for you.",t:"ว่ากันว่าออนเซ็นแห่งนี้ดีต่อร่างกายครับ"}]},

{id:"n3g05",lv:"N3",cat:"逆接",p:"〜ことは〜が",conn:"同じV／イA／ナA を繰り返す＋ことは＋〜が",
en:"It's true that X, but... — conceding a point before qualifying it.",
th:"จริงอยู่ว่า X แต่ว่า... — ยอมรับก่อนแล้วค่อยแย้ง",
note_en:"The same word repeats on both sides: 読むことは読んだが (I did read it, but...). A very natural way to half-agree.",
note_th:"คำเดียวกันซ้ำสองข้าง เช่น 読むことは読んだが (อ่านก็อ่านแล้วนะ แต่...) เป็นวิธีเห็นด้วยครึ่ง ๆ ที่ธรรมชาติมาก",
ex:[{j:"読むことは読んだが、よく分からなかった。",k:"よむことは よんだが、よく わからなかった。",e:"I did read it, but I didn't really understand.",t:"อ่านก็อ่านแล้วนะ แต่ไม่ค่อยเข้าใจ"},
{j:"高いことは高いが、質はいい。",k:"たかいことは たかいが、しつは いい。",e:"It is expensive, true, but the quality is good.",t:"แพงก็แพงจริง แต่คุณภาพดี"}]},

{id:"n3g06",lv:"N3",cat:"程度・比較",p:"〜くらいなら / 〜ぐらいなら",conn:"V辞書形＋くらいなら",
en:"Rather than do X (which I hate), I'd sooner do Y.",
th:"ถ้าต้องทำ X (ที่เกลียด) สู้ทำ Y ดีกว่า",
note_en:"X is the option you find unbearable; Y is the lesser evil. Usually ends with 〜ほうがいい or 〜たほうがましだ.",
note_th:"X คือตัวเลือกที่ทนไม่ได้ ส่วน Y คือตัวเลือกที่แย่น้อยกว่า มักลงท้ายด้วย 〜ほうがいい หรือ 〜たほうがましだ",
ex:[{j:"満員電車に乗るくらいなら、歩いたほうがいい。",k:"まんいん でんしゃに のる くらいなら、あるいた ほうが いい。",e:"Rather than ride a packed train, I'd sooner walk.",t:"ถ้าต้องขึ้นรถไฟที่คนแน่น สู้เดินดีกว่า"},
{j:"諦めるぐらいなら、最後まで頑張る。",k:"あきらめる ぐらいなら、さいごまで がんばる。",e:"Rather than give up, I'll push to the end.",t:"ถ้าต้องยอมแพ้ สู้พยายามจนถึงที่สุดดีกว่า"}]},

{id:"n3g07",lv:"N3",cat:"条件・仮定",p:"〜によっては",conn:"N＋によっては",
en:"Depending on X, in some cases.",
th:"ขึ้นอยู่กับ X ในบางกรณีก็อาจ",
note_en:"Different from によって (varies by X). によっては singles out SOME cases: 場合によっては中止になる = in some cases it'll be cancelled.",
note_th:"ต่างจาก によって (แตกต่างกันไปตาม X) โดย によっては เจาะจงเฉพาะ 'บางกรณี' เช่น 場合によっては中止になる = ในบางกรณีอาจถูกยกเลิก",
ex:[{j:"天気によっては、中止になるかもしれません。",k:"てんきに よっては、ちゅうしに なるかも しれません。",e:"Depending on the weather, it may be cancelled.",t:"ขึ้นอยู่กับสภาพอากาศ บางทีอาจถูกยกเลิกครับ"},
{j:"人によっては、辛く感じるかもしれない。",k:"ひとに よっては、からく かんじるかも しれない。",e:"Some people might find it spicy.",t:"บางคนอาจรู้สึกว่าเผ็ดก็ได้"}]},

{id:"n3g08",lv:"N3",cat:"程度・比較",p:"〜くらい〜はない / 〜ほど〜はない",conn:"N＋くらい・ほど＋〜はない",
en:"Nothing is as X as this — the Japanese superlative.",
th:"ไม่มีอะไร X เท่านี้อีกแล้ว — รูปขั้นสูงสุดของภาษาญี่ปุ่น",
note_en:"Japanese has no -est ending, so it builds superlatives by negation. 富士山ほど美しい山はない = no mountain is as beautiful as Fuji.",
note_th:"ภาษาญี่ปุ่นไม่มีคำลงท้ายแบบ -est จึงสร้างขั้นสูงสุดด้วยการปฏิเสธ เช่น 富士山ほど美しい山はない = ไม่มีภูเขาไหนสวยเท่าภูเขาไฟฟูจิ",
ex:[{j:"母の料理ほどおいしいものはない。",k:"ははの りょうり ほど おいしい ものは ない。",e:"Nothing tastes as good as my mother's cooking.",t:"ไม่มีอะไรอร่อยเท่าอาหารที่แม่ทำ"},
{j:"今日くらい暑い日はなかった。",k:"きょう くらい あつい ひは なかった。",e:"There's never been a day as hot as today.",t:"ไม่เคยมีวันไหนร้อนเท่าวันนี้เลย"}]},

{id:"n3g09",lv:"N3",cat:"伝聞・推量",p:"〜とのことだ",conn:"普通形＋とのことだ",
en:"I'm informed that — relaying a message formally.",
th:"ได้รับแจ้งมาว่า — ส่งต่อข้อความอย่างเป็นทางการ",
note_en:"Business register for passing on a message you received. More formal than そうだ and standard in email and phone messages.",
note_th:"เป็นระดับภาษาธุรกิจสำหรับส่งต่อข้อความที่ได้รับมา เป็นทางการกว่า そうだ และเป็นมาตรฐานในอีเมลและการฝากข้อความทางโทรศัพท์",
ex:[{j:"田中様は30分ほど遅れるとのことです。",k:"たなかさまは さんじゅっぷん ほど おくれると のこと です。",e:"I'm told Mr Tanaka will be about 30 minutes late.",t:"ได้รับแจ้งว่าคุณทานากะจะมาสายประมาณ 30 นาทีครับ"},
{j:"会議は延期になったとのことだ。",k:"かいぎは えんきに なったと のことだ。",e:"Word is the meeting has been postponed.",t:"ได้ยินแจ้งมาว่าการประชุมถูกเลื่อนแล้ว"}]},

{id:"n2g01",lv:"N2",cat:"立場・観点",p:"〜はさておき",conn:"N＋はさておき",
en:"Leaving X aside for now.",
th:"เรื่อง X พักไว้ก่อน",
note_en:"Near-twin of はともかく. さておき is slightly more formal and more literally 'set that down for the moment'.",
note_th:"เกือบเป็นฝาแฝดของ はともかく โดย さておき เป็นทางการกว่าเล็กน้อย และแปลตรงตัวว่า 'วางเรื่องนั้นลงก่อน'",
ex:[{j:"冗談はさておき、本題に入りましょう。",k:"じょうだんは さておき、ほんだいに はいりましょう。",e:"Joking aside, let's get to the main point.",t:"เรื่องล้อเล่นพักไว้ก่อน เข้าเรื่องหลักกันเถอะครับ"},
{j:"値段はさておき、デザインはいい。",k:"ねだんは さておき、デザインは いい。",e:"Price aside, the design is good.",t:"ราคาพักไว้ก่อน ดีไซน์ดีนะ"}]},

{id:"n2g02",lv:"N2",cat:"添加・並列",p:"〜というか〜というか",conn:"N／イA／ナA／普通形 ＋ というか（×2）",
en:"How shall I put it — X, or maybe Y — groping for the right word.",
th:"จะเรียกว่า X ดีหรือ Y ดี — กำลังหาคำที่เหมาะ",
note_en:"Shows you're searching for the accurate description. Very natural in speech and makes you sound thoughtful rather than vague.",
note_th:"แสดงว่ากำลังหาคำบรรยายที่ตรงที่สุด ใช้ในภาษาพูดได้ธรรมชาติมาก และทำให้ฟังดูครุ่นคิดมากกว่าคลุมเครือ",
ex:[{j:"嬉しいというか、驚いたというか、複雑な気持ちだ。",k:"うれしいと いうか、おどろいたと いうか、ふくざつな きもちだ。",e:"Happy, or maybe surprised — my feelings are mixed.",t:"จะเรียกว่าดีใจดีหรือตกใจดี ความรู้สึกซับซ้อนไปหมด"},
{j:"親切というか、おせっかいというか。",k:"しんせつと いうか、おせっかいと いうか。",e:"Kind, or maybe meddlesome — hard to say.",t:"จะเรียกว่าใจดีดีหรือเสือกดี"}]},

{id:"n2g03",lv:"N2",cat:"時・場面",p:"〜ずじまいだ",conn:"Vない（ない削除）＋ずじまいだ（する→せずじまい）",
en:"Ended up never doing it — and that's a shame.",
th:"สุดท้ายก็ไม่ได้ทำ — และน่าเสียดาย",
note_en:"Regret that an intention was never carried out. 会えずじまいだった = we never did get to meet.",
note_th:"เป็นความเสียดายที่ความตั้งใจไม่ได้ถูกทำจริง เช่น 会えずじまいだった = สุดท้ายก็ไม่ได้เจอกันเลย",
ex:[{j:"忙しくて、結局会えずじまいだった。",k:"いそがしくて、けっきょく あえずじまい だった。",e:"We were busy and in the end never managed to meet.",t:"ยุ่งกันทั้งคู่ สุดท้ายก็ไม่ได้เจอกันเลย"},
{j:"本を買ったが、読まずじまいだ。",k:"ほんを かったが、よまずじまいだ。",e:"I bought the book but never did read it.",t:"ซื้อหนังสือมาแต่สุดท้ายก็ไม่ได้อ่าน"}]},

{id:"n2g04",lv:"N2",cat:"限定・強調",p:"〜など / 〜なんか / 〜なんて",conn:"N／V普通形 ＋ など・なんか・なんて",
en:"Things like X — belittling, or modestly downplaying.",
th:"อะไรอย่าง X — ใช้ดูแคลน หรือถ่อมตัว",
note_en:"Two directions: dismissing something (あんな店なんか行かない) and modesty about yourself (私なんか、まだまだです). なんて can also express surprise.",
note_th:"มีสองทิศทาง: ดูแคลนบางสิ่ง (あんな店なんか行かない) และถ่อมตัวเกี่ยวกับตัวเอง (私なんか、まだまだです) ส่วน なんて ยังใช้แสดงความประหลาดใจได้",
ex:[{j:"私なんか、まだまだです。",k:"わたし なんか、まだまだ です。",e:"Someone like me still has a long way to go.",t:"อย่างผมยังอีกไกลเลยครับ"},
{j:"諦めるなんて、もったいない。",k:"あきらめる なんて、もったいない。",e:"Giving up would be such a waste.",t:"จะยอมแพ้เนี่ยนะ น่าเสียดายจะตาย"}]},

{id:"n2g05",lv:"N2",cat:"限定・強調",p:"〜として〜ない",conn:"一＋助数詞＋として＋Vない",
en:"Not a single one.",
th:"ไม่มีแม้แต่หนึ่งเดียว",
note_en:"Always starts with 一 plus a counter: 一日として, 一人として, 一度として. An emphatic total negation.",
note_th:"ขึ้นต้นด้วย 一 กับลักษณนามเสมอ เช่น 一日として 一人として 一度として เป็นการปฏิเสธทั้งหมดอย่างหนักแน่น",
ex:[{j:"一日として休んだことがない。",k:"いちにちと して やすんだ ことが ない。",e:"I haven't taken a single day off.",t:"ไม่เคยหยุดแม้แต่วันเดียว"},
{j:"一人として賛成する者はいなかった。",k:"ひとりと して さんせい する ものは いなかった。",e:"Not a single person agreed.",t:"ไม่มีแม้แต่คนเดียวที่เห็นด้วย"}]},

{id:"n2g06",lv:"N2",cat:"評価・判断",p:"〜ではあるまいか",conn:"普通形（ナA・N は語幹）＋ではあるまいか",
en:"Might it not be that... — a formal, tentative suggestion.",
th:"หรือว่าจะเป็น... — การเสนออย่างระมัดระวังและเป็นทางการ",
note_en:"The literary twin of 〜のではないだろうか. Appears in editorials and academic writing, rarely in speech.",
note_th:"เป็นฝาแฝดเชิงวรรณกรรมของ 〜のではないだろうか เจอในบทบรรณาธิการและงานเขียนวิชาการ ไม่ค่อยใช้พูด",
ex:[{j:"それは考えすぎではあるまいか。",k:"それは かんがえすぎでは あるまいか。",e:"Might that not be overthinking it?",t:"หรือว่านั่นจะคิดมากเกินไปหรือเปล่า"},
{j:"問題の本質はここにあるのではあるまいか。",k:"もんだいの ほんしつは ここに あるのでは あるまいか。",e:"Might the heart of the problem not lie here?",t:"หรือว่าแก่นของปัญหาจะอยู่ตรงนี้ก็ได้"}]},

{id:"n2g07",lv:"N2",cat:"意志・希望",p:"〜ないものだろうか",conn:"Vない＋ものだろうか・ものか",
en:"Isn't there some way to...? — a wistful wish.",
th:"จะไม่มีทางที่จะ...บ้างเหรอ — ความปรารถนาที่แฝงความหวัง",
note_en:"A longing for something you can't control. 何とかならないものだろうか = isn't there something that can be done?",
note_th:"เป็นความปรารถนาต่อสิ่งที่ควบคุมไม่ได้ เช่น 何とかならないものだろうか = จะไม่มีทางแก้ได้บ้างเหรอ",
ex:[{j:"もっと早く上達しないものだろうか。",k:"もっと はやく じょうたつ しない ものだろうか。",e:"Isn't there some way to improve faster?",t:"จะไม่มีทางเก่งเร็วกว่านี้บ้างเหรอ"},
{j:"何とかならないものか。",k:"なんとか ならない ものか。",e:"Isn't there anything to be done?",t:"จะไม่มีทางแก้ได้เลยเหรอ"}]},

{id:"n2g08",lv:"N2",cat:"原因・理由",p:"〜ことだし",conn:"V普通形／イA／ナA な／N の ＋ ことだし",
en:"Since X (among other reasons), let's...",
th:"ในเมื่อ X (และเหตุผลอื่น ๆ) ก็เลย...",
note_en:"Presents one reason while implying there are others. Softer than から, and usually leads to a suggestion.",
note_th:"เสนอเหตุผลหนึ่งพร้อมสื่อว่ายังมีเหตุผลอื่นอีก นุ่มกว่า から และมักนำไปสู่การเสนอแนะ",
ex:[{j:"天気もいいことだし、散歩に行こう。",k:"てんきも いい ことだし、さんぽに いこう。",e:"The weather's nice, so let's go for a walk.",t:"อากาศก็ดี ไปเดินเล่นกันเถอะ"},
{j:"時間もないことだし、今日はここまでにしよう。",k:"じかんも ない ことだし、きょうは ここまでに しよう。",e:"We're short on time, so let's stop here today.",t:"เวลาก็ไม่มี วันนี้จบแค่นี้ก่อนเถอะ"}]},

{id:"n2g09",lv:"N2",cat:"意志・希望",p:"〜てほしいものだ / 〜たいものだ",conn:"Vて＋ほしいものだ／Vたい＋ものだ",
en:"I do wish (they would) — a heartfelt wish, sometimes a mild complaint.",
