{id:"p01",lv:"N3",topic:"コンビニのアルバイト",
body:"日本に来て半年が過ぎた。最初はコンビニでアルバイトを始めた【1】で、レジの操作も分からず、毎日失敗ばかりしていた。お客様に何か聞かれる【2】、頭が真っ白になったものだ。しかし、先輩が根気よく教えてくれた【3】、今では一人で夜のシフトを任されるようになった。",
blanks:[
{opts:["ばかり","ところ","うち","まま"],ans:0,
why_en:"〜たばかり means you only just did something, and it stretches to how recent it FEELS. 半年 is far too long for 〜たところ, which means literally seconds ago.",
why_th:"〜たばかり แปลว่าเพิ่งทำ และยืดได้ตามความรู้สึกว่าเพิ่งเกิด ส่วนครึ่งปีนั้นนานเกินไปสำหรับ 〜たところ ซึ่งหมายถึงไม่กี่วินาทีที่แล้วจริง ๆ"},
{opts:["ついでに","たびに","うちに","あいだに"],ans:1,
why_en:"〜たびに = every single time it happens. The sentence describes a repeated experience, not one occasion, so あいだに (once, during) and ついでに (while I'm at it) both fail.",
why_th:"〜たびに = ทุกครั้งที่เกิดขึ้น ประโยคนี้บรรยายประสบการณ์ที่เกิดซ้ำ ไม่ใช่ครั้งเดียว ดังนั้น あいだに (ครั้งเดียวระหว่างนั้น) และ ついでに (ถือโอกาส) จึงใช้ไม่ได้"},
{opts:["せいで","くせに","おかげで","わりに"],ans:2,
why_en:"The result is good, so it must be おかげで. せいで assigns blame and only takes bad outcomes — that single distinction is tested constantly.",
why_th:"ผลลัพธ์เป็นบวก จึงต้องใช้ おかげで ส่วน せいで ใช้โทษและตามด้วยผลร้ายเท่านั้น ความต่างข้อนี้ออกสอบบ่อยมาก"}],
tr_th:"ผ่านมาครึ่งปีแล้วตั้งแต่มาญี่ปุ่น ตอนแรกเพิ่งเริ่มทำงานพาร์ตไทม์ที่ร้านสะดวกซื้อ ใช้เครื่องคิดเงินก็ยังไม่เป็น ทำพลาดทุกวัน ทุกครั้งที่ลูกค้าถามอะไร หัวก็ว่างเปล่าไปหมด แต่เพราะรุ่นพี่สอนอย่างอดทน ตอนนี้เลยได้รับมอบหมายให้ดูแลกะกลางคืนคนเดียวแล้ว",
tr_en:"Six months have passed since I came to Japan. At first I had only just started the convenience store job, couldn't even work the register, and made mistakes daily. Every time a customer asked me something, my mind went blank. But thanks to a senior patiently teaching me, I'm now trusted with the night shift alone."},

{id:"p02",lv:"N3",topic:"日本語の勉強",
body:"七年も日本語を勉強している【1】、まだ思うように話せない。単語を覚える【2】、文法をおろそかにしていたからだと思う。これからは毎日少しずつ文法を復習する【3】。",
blanks:[
{opts:["のに","ので","から","ため"],ans:0,
why_en:"〜のに carries frustration at a result that contradicts the effort. ので and から give a reason, which would mean 'because I studied, I can't speak' — nonsense.",
why_th:"〜のに สื่อความหงุดหงิดที่ผลขัดกับความพยายาม ส่วน ので และ から บอกเหตุผล ซึ่งจะกลายเป็น 'เพราะเรียนจึงพูดไม่ได้' ซึ่งไม่สมเหตุสมผล"},
{opts:["ばかりに","ばかりで","ばかりか","ばかりだ"],ans:1,
why_en:"〜てばかりで / 〜ばかりで = doing only that and nothing else, with criticism. ばかりに means 'just because of', which needs a bad consequence clause, not a contrast.",
why_th:"〜てばかりで / 〜ばかりで = เอาแต่ทำสิ่งนั้นอย่างเดียว มีน้ำเสียงตำหนิ ส่วน ばかりに แปลว่า 'เพียงเพราะ' ซึ่งต้องตามด้วยผลร้าย ไม่ใช่การเปรียบเทียบ"},
{opts:["ようになる","ようにする","ことになる","ことがある"],ans:1,
why_en:"ようにする is the effort you decide to make; ようになる is the result that arrives later. Here the speaker is resolving, so する.",
why_th:"ようにする คือความพยายามที่ตัดสินใจจะทำ ส่วน ようになる คือผลที่ตามมาทีหลัง ตรงนี้ผู้พูดกำลังตั้งใจ จึงใช้ する"}],
tr_th:"เรียนภาษาญี่ปุ่นมาตั้งเจ็ดปีแล้วแท้ ๆ แต่ก็ยังพูดไม่ได้อย่างที่คิด คิดว่าเป็นเพราะเอาแต่ท่องศัพท์อย่างเดียวจนละเลยไวยากรณ์ ต่อจากนี้จะพยายามทบทวนไวยากรณ์ทีละนิดทุกวัน",
tr_en:"I've studied Japanese for seven whole years and still can't speak as I'd like. I think it's because I did nothing but memorise vocabulary and neglected grammar. From now on I'll make a point of reviewing grammar a little every day."},

{id:"p03",lv:"N3",topic:"引っ越しの準備",
body:"来月から新しい職場で働く【1】、駅の近くに引っ越すことにした。家賃は高い【2】、通勤時間が半分になるので満足している。契約の【3】、保証人が必要だと言われて少し慌てた。",
blanks:[
{opts:["ことになって","ようになって","ところで","うちに"],ans:0,
why_en:"ことになる announces a decision, and Japanese prefers it even when you decided yourself because it sounds humble. ようになる would wrongly suggest a gradual change in ability.",
why_th:"ことになる ใช้ประกาศการตัดสินใจ และภาษาญี่ปุ่นนิยมใช้แม้จะตัดสินใจเอง เพราะฟังดูถ่อมตัว ส่วน ようになる จะสื่อผิดไปว่าเป็นการเปลี่ยนความสามารถแบบค่อยเป็นค่อยไป"},
{opts:["ものの","ながら","わりに","ものだから"],ans:2,
why_en:"〜わりに compares against a reasonable expectation and stays neutral or positive. ものの is written-style and implies the expected outcome failed, which clashes with 満足している.",
why_th:"〜わりに เปรียบเทียบกับความคาดหวังตามปกติ และเป็นกลางหรือบวก ส่วน ものの เป็นภาษาเขียนและสื่อว่าผลที่คาดไม่เกิด ซึ่งขัดกับ 満足している"},
{opts:["最中に","ところに","際に","たびに"],ans:2,
why_en:"〜際に is the formal 'when' used for procedures and official occasions — exactly the register of signing a contract. 最中に needs an interruption.",
why_th:"〜際に คือคำว่า 'เมื่อ' แบบทางการ ใช้กับขั้นตอนและโอกาสที่เป็นทางการ ซึ่งตรงกับระดับภาษาของการเซ็นสัญญาพอดี ส่วน 最中に ต้องมีเรื่องมาขัดจังหวะ"}],
tr_th:"เพราะเดือนหน้าจะได้ทำงานที่ใหม่ เลยตัดสินใจย้ายไปอยู่ใกล้สถานี ค่าเช่าแพงเมื่อเทียบกับที่คิด แต่เวลาเดินทางลดลงครึ่งหนึ่งเลยพอใจ ตอนทำสัญญา เขาบอกว่าต้องมีผู้ค้ำประกัน เลยตกใจนิดหน่อย",
tr_en:"Since I'll be working at a new workplace from next month, I've decided to move near the station. The rent is high for what it is, but my commute is halved so I'm satisfied. When signing the contract I panicked slightly on being told I needed a guarantor."},

{id:"p04",lv:"N3",topic:"面接の日",
body:"面接の会場に着いた【1】、緊張で手が震えてきた。控室で待っている【2】、担当の方が名前を呼んでくださった。想像していた【3】厳しい質問はなく、無事に終えることができた。",
blanks:[
{opts:["とたん","ながら","うちに","ばかり"],ans:0,
why_en:"〜たとたん = the instant X happened, something uncontrollable followed. Trembling isn't a choice, and the second clause is past — both conditions are met.",
why_th:"〜たとたん = ทันทีที่ X เกิดขึ้น สิ่งที่ควบคุมไม่ได้ก็ตามมา อาการมือสั่นไม่ใช่สิ่งที่เลือกได้ และประโยคหลังเป็นอดีต ตรงตามเงื่อนไขทั้งสองข้อ"},
{opts:["あいだ","うちに","ところに","さいちゅうに"],ans:1,
why_en:"〜ているうちに = while that state still lasts, something happened. The window (waiting) closes when the name is called, which is exactly the うちに feeling.",
why_th:"〜ているうちに = ระหว่างที่สภาพนั้นยังอยู่ ก็มีบางอย่างเกิดขึ้น ช่วงเวลา (การรอ) จบลงเมื่อถูกเรียกชื่อ ซึ่งตรงกับความรู้สึกของ うちに พอดี"},
{opts:["ほど","ぐらい","だけ","まで"],ans:0,
why_en:"〜ほど〜ない is the standard comparison of inferiority: not as harsh as I'd imagined. Japanese avoids a 'less than' word and says 'not to the extent of'.",
why_th:"〜ほど〜ない คือรูปเปรียบเทียบว่าน้อยกว่าแบบมาตรฐาน คือไม่โหดเท่าที่จินตนาการไว้ ภาษาญี่ปุ่นเลี่ยงคำว่า 'น้อยกว่า' แล้วใช้ว่า 'ไม่ถึงระดับของ' แทน"}],
tr_th:"พอไปถึงสถานที่สัมภาษณ์ปุ๊บ มือก็สั่นเพราะความตื่นเต้น ระหว่างที่รออยู่ในห้องพัก เจ้าหน้าที่ก็เรียกชื่อ ไม่มีคำถามโหดเท่าที่จินตนาการไว้ เลยผ่านไปได้ด้วยดี",
tr_en:"The instant I arrived at the interview venue, my hands started shaking from nerves. While I was waiting in the side room, the person in charge called my name. There were no questions as harsh as I'd imagined, and I got through it safely."},

{id:"p05",lv:"N3",topic:"大阪の暮らし",
body:"大阪に住み始めて三年になる。来た【1】は言葉も分からず不安だったが、近所の方が親切にしてくださった【2】、少しずつ慣れていった。今では休みの日に商店街を歩く【3】、店の人と世間話をするほどになった。",
blanks:[
{opts:["ころ","うち","まま","ほど"],ans:0,
why_en:"ころ marks a period in the past. うち would need a state that is about to change, and there's no such window here.",
why_th:"ころ ใช้ระบุช่วงเวลาในอดีต ส่วน うち ต้องมีสภาพที่กำลังจะเปลี่ยน ซึ่งประโยคนี้ไม่มีช่วงเวลาแบบนั้น"},
{opts:["せいで","おかげで","ために","くせに"],ans:1,
why_en:"Again the good-result marker. Kindness produced a positive change, so おかげで. Notice the exam returns to this pair repeatedly.",
why_th:"เป็นตัวชี้ผลลัพธ์ที่ดีอีกครั้ง ความใจดีทำให้เกิดการเปลี่ยนแปลงในทางบวก จึงใช้ おかげで สังเกตว่าข้อสอบวนกลับมาที่คู่นี้บ่อย ๆ"},
{opts:["ついでに","たびに","うちに","あいだに"],ans:0,
why_en:"〜ついでに = while you're already out doing the main thing, you also do something else. Walking is the main errand; chatting is the extra.",
why_th:"〜ついでに = ถือโอกาสตอนที่ออกไปทำธุระหลักอยู่แล้ว ก็ทำอย่างอื่นด้วย การเดินคือธุระหลัก ส่วนการคุยเล่นคือของแถม"}],
tr_th:"อยู่โอซาก้ามาจะสามปีแล้ว ตอนที่เพิ่งมาก็ไม่เข้าใจภาษาและรู้สึกกังวล แต่เพราะคนแถวบ้านใจดีกับเรา ก็เลยค่อย ๆ ชินไป ตอนนี้พอเดินเล่นย่านร้านค้าในวันหยุด ก็ถือโอกาสคุยเล่นกับคนขายของได้แล้ว",
tr_en:"It's been three years since I started living in Osaka. When I first came I didn't understand the language and felt anxious, but thanks to the kindness of my neighbours I gradually got used to it. Now, while walking the shopping street on days off, I even chat with the shopkeepers."},

{id:"p06",lv:"N3",topic:"友達との約束",
body:"来週、友達と会う【1】になっている。彼は約束を守る人だから、遅れる【2】。もし急な用事ができた【3】、必ず前もって連絡してくれるだろう。",
blanks:[
{opts:["こと","もの","ため","よう"],ans:0,
why_en:"〜ことになっている states an existing arrangement. ものになっている isn't a grammar form at all — a distractor built from a real word in the wrong slot.",
why_th:"〜ことになっている ใช้บอกข้อตกลงที่มีอยู่แล้ว ส่วน ものになっている ไม่ใช่รูปไวยากรณ์เลย เป็นตัวลวงที่สร้างจากคำจริงแต่วางผิดตำแหน่ง"},
{opts:["はずがない","わけだ","かもしれない","に決まっている"],ans:0,
why_en:"はずがない = there's no way, based on evidence (his character). に決まっている is far too blunt and casual for this calm written tone.",
why_th:"はずがない = ไม่มีทาง โดยอิงจากหลักฐาน (นิสัยของเขา) ส่วน に決まっている ตรงและเป็นกันเองเกินไปสำหรับน้ำเสียงเขียนที่สุขุมแบบนี้"},
{opts:["としても","としたら","ところで","ばかりに"],ans:1,
why_en:"〜としたら sets up a hypothetical: supposing that happened, then... としても would mean 'even if', which changes the logic to a concession.",
why_th:"〜としたら ใช้ตั้งสมมติฐาน คือถ้าเกิดเรื่องนั้นขึ้นแล้ว... ส่วน としても แปลว่า 'ต่อให้' ซึ่งเปลี่ยนตรรกะให้กลายเป็นการยอมรับเงื่อนไข"}],
tr_th:"สัปดาห์หน้ามีนัดจะเจอเพื่อน เขาเป็นคนรักษาสัญญา เลยไม่มีทางมาสายแน่นอน ถ้าสมมติว่ามีธุระด่วน เขาก็ต้องติดต่อมาบอกล่วงหน้าแน่",
tr_en:"I'm set to meet a friend next week. He's someone who keeps his promises, so there's no way he'll be late. If some urgent matter came up, he'd surely contact me in advance."},

{id:"p07",lv:"N2",topic:"ホテルの仕事",
body:"ホテルのフロントで働き始めて一年になる。この仕事は体力的に大変な【1】、人と接する喜びがある。お客様の要望【2】、柔軟に対応することが求められる。忙しい時期は休む【3】ないが、それでもこの仕事を選んでよかったと思っている。",
blanks:[
{opts:["一方で","反面","につれて","にしても"],ans:1,
why_en:"反面 requires the two opposing qualities to belong to the SAME subject — here both describe this one job. 一方で can also compare two different subjects, so 反面 is the tighter fit.",
why_th:"反面 ต้องเป็นสองด้านของสิ่งเดียวกัน ซึ่งตรงนี้ทั้งคู่บรรยายงานเดียวกัน ส่วน 一方で เปรียบเทียบสองสิ่งที่ต่างกันได้ด้วย ดังนั้น 反面 จึงตรงกว่า"},
{opts:["に応じて","に基づいて","にわたって","に沿って"],ans:0,
why_en:"〜に応じて implies flexible adjustment to something that varies — matching 柔軟に. に基づいて would mean following a fixed rule, which contradicts flexibility.",
why_th:"〜に応じて สื่อถึงการปรับตัวยืดหยุ่นตามสิ่งที่เปลี่ยนแปลง ซึ่งเข้ากับ 柔軟に ส่วน に基づいて จะแปลว่าทำตามกฎตายตัว ซึ่งขัดกับความยืดหยุ่น"},
{opts:["ものでは","わけでは","ひまも","どころでは"],ans:3,
why_en:"〜どころではない = circumstances make it out of the question. わけではない would only partially deny, which is far too weak for a peak season.",
why_th:"〜どころではない = สถานการณ์ทำให้เป็นไปไม่ได้เลย ส่วน わけではない เป็นการปฏิเสธเพียงบางส่วน ซึ่งเบาเกินไปสำหรับช่วงที่งานยุ่งที่สุด"}],
tr_th:"ทำงานที่แผนกต้อนรับของโรงแรมมาจะครบหนึ่งปีแล้ว งานนี้หนักทางร่างกายก็จริง แต่ในทางกลับกันก็มีความสุขที่ได้พบปะผู้คน ต้องรับมืออย่างยืดหยุ่นตามความต้องการของลูกค้า ช่วงที่ยุ่งไม่ต้องพูดถึงเรื่องพักเลย แต่ถึงอย่างนั้นก็คิดว่าเลือกงานนี้ถูกแล้ว",
tr_en:"It's been a year since I started at a hotel front desk. This job is physically demanding, but on the other hand there's the joy of dealing with people. We're expected to respond flexibly according to guests' requests. In busy periods rest is out of the question, but even so I'm glad I chose this work."},

{id:"p08",lv:"N2",topic:"敬語の難しさ",
body:"外国人【1】、日本語の敬語ほど習得が難しいものはない。文法を理解している【2】、実際の場面で正しく使えるとは限らない。しかし、毎日使っている【3】、自然に口から出るようになるものだ。",
blanks:[
{opts:["にとって","に対して","として","によって"],ans:0,
why_en:"〜にとって marks a standpoint and is followed by an evaluation (難しい). に対して marks the direction of an attitude, not a viewpoint.",
why_th:"〜にとって ใช้ระบุจุดยืนและตามด้วยคำประเมิน (難しい) ส่วน に対して ใช้ระบุทิศทางของท่าที ไม่ใช่มุมมอง"},
{opts:["からといって","からには","からこそ","からして"],ans:0,
why_en:"〜からといって is always followed by a negative such as とは限らない — the pair is fixed. It rejects the lazy conclusion 'understand the grammar, therefore can use it'.",
why_th:"〜からといって ต้องตามด้วยรูปปฏิเสธเช่น とは限らない เสมอ เป็นคู่ที่ตายตัว ใช้ปฏิเสธข้อสรุปที่ด่วนเกินไปว่า 'เข้าใจไวยากรณ์แล้วจึงใช้ได้'"},
{opts:["うちに","あいだに","ばかりに","たびに"],ans:0,
why_en:"〜ているうちに also covers gradual change that happens while you continue doing something. あいだに needs a single event inside the window, not a slow transformation.",
why_th:"〜ているうちに ยังครอบคลุมการเปลี่ยนแปลงทีละน้อยที่เกิดขึ้นระหว่างที่ทำสิ่งนั้นต่อเนื่อง ส่วน あいだに ต้องเป็นเหตุการณ์ครั้งเดียวในช่วงนั้น ไม่ใช่การเปลี่ยนแปลงแบบค่อยเป็นค่อยไป"}],
tr_th:"สำหรับชาวต่างชาติ ไม่มีอะไรยากไปกว่าการเรียนภาษายกย่องของญี่ปุ่นแล้ว ต่อให้เข้าใจไวยากรณ์ก็ไม่ได้แปลว่าจะใช้ถูกในสถานการณ์จริงเสมอไป แต่พอใช้ทุกวันไปเรื่อย ๆ มันก็จะออกมาจากปากเองโดยธรรมชาติ",
tr_en:"For a foreigner, nothing is as hard to acquire as Japanese keigo. Just because you understand the grammar doesn't mean you can use it correctly in a real situation. But while you keep using it daily, it does come to come out naturally."},

{id:"p09",lv:"N2",topic:"一人暮らし",
body:"一人暮らしを始めて【1】、家事の大変さを実感するようになった。実家にいた【2】は、食事が自動的に出てくるものだと思っていた。今は疲れて帰った日【3】、自分で作らなければならない。",
blanks:[
{opts:["以来","限り","次第","上で"],ans:0,
why_en:"〜て以来 = ever since, with the state continuing unbroken to now. 次第 means 'as soon as' and demands a future clause, which the past tense here forbids.",
why_th:"〜て以来 = ตั้งแต่นั้นเป็นต้นมา โดยสภาพต่อเนื่องมาจนถึงปัจจุบัน ส่วน 次第 แปลว่า 'ทันทีที่' และต้องตามด้วยประโยคอนาคต ซึ่งรูปอดีตตรงนี้ใช้ไม่ได้"},
{opts:["ころ","うち","ほど","まま"],ans:0,
why_en:"ころ names a past period of life. うち would imply that period was about to end, which isn't the point being made.",
why_th:"ころ ใช้เรียกช่วงหนึ่งของชีวิตในอดีต ส่วน うち จะสื่อว่าช่วงนั้นกำลังจะจบ ซึ่งไม่ใช่ประเด็นที่ต้องการสื่อ"},
{opts:["に限って","でさえ","において","につけ"],ans:1,
why_en:"〜でさえ picks the most extreme case to prove the point: even on days I come home exhausted. に限って would add ironic bad luck, which doesn't fit a plain statement of duty.",
why_th:"〜でさえ เลือกกรณีที่สุดขั้วที่สุดมาพิสูจน์ประเด็น คือแม้แต่วันที่กลับมาเหนื่อยมาก ส่วน に限って จะเพิ่มความโชคร้ายเชิงประชด ซึ่งไม่เข้ากับการบอกหน้าที่ตรง ๆ"}],
tr_th:"ตั้งแต่เริ่มอยู่คนเดียว ก็เริ่มรู้สึกจริง ๆ ว่างานบ้านลำบากแค่ไหน ตอนที่อยู่บ้านเกิดเคยคิดว่าอาหารมันโผล่มาเองโดยอัตโนมัติ ตอนนี้แม้แต่วันที่กลับมาเหนื่อย ๆ ก็ต้องทำเอง",
tr_en:"Ever since I started living alone, I've come to feel just how hard housework is. Back when I was at my parents' place, I thought food simply appeared automatically. Now, even on days I come home exhausted, I have to cook it myself."},

{id:"p10",lv:"N2",topic:"日本語能力試験",
body:"十二月の試験に向けて勉強している。合格する【1】、毎日欠かさず文法を復習するつもりだ。今まで単語ばかり覚えてきた【2】、文法の力が伸びなかったのだろう。努力すれば必ず報われる【3】が、やらなければ何も始まらない。",
blanks:[
{opts:["からには","からといって","からこそ","からして"],ans:0,
why_en:"〜からには is followed by determination or obligation — never a plain fact. つもりだ is exactly that resolve.",
why_th:"〜からには ต้องตามด้วยความตั้งใจหรือหน้าที่ ไม่ใช่ข้อเท็จจริงธรรมดา ซึ่ง つもりだ คือความมุ่งมั่นแบบนั้นพอดี"},
{opts:["ばかりに","おかげで","わりに","ものの"],ans:0,
why_en:"〜ばかりに = just because of that one thing, an unfortunate result followed. The speaker regrets a small cause with a large cost — exactly this sentence.",
why_th:"〜ばかりに = เพียงเพราะสิ่งเดียวนั้น ก็เกิดผลร้ายตามมา ผู้พูดเสียใจกับสาเหตุเล็กที่ทำให้เสียหายมาก ซึ่งตรงกับประโยคนี้พอดี"},
{opts:["わけではない","わけがない","というものだ","ものか"],ans:0,
why_en:"〜わけではない partially denies an over-generalisation: effort isn't ALWAYS rewarded. わけがない would flatly deny it, contradicting the encouraging second half.",
why_th:"〜わけではない ปฏิเสธการเหมารวมเพียงบางส่วน คือความพยายามไม่ได้ได้ผลตอบแทนเสมอไป ส่วน わけがない จะปฏิเสธแบบเด็ดขาด ซึ่งขัดกับประโยคหลังที่ให้กำลังใจ"}],
tr_th:"กำลังเตรียมสอบเดือนธันวาคม ในเมื่อจะสอบให้ผ่านแล้ว ก็ตั้งใจว่าจะทบทวนไวยากรณ์ทุกวันไม่ขาด คงเป็นเพราะที่ผ่านมาเอาแต่ท่องศัพท์อย่างเดียว ความสามารถด้านไวยากรณ์เลยไม่พัฒนา ไม่ใช่ว่าพยายามแล้วจะได้ผลตอบแทนเสมอไป แต่ถ้าไม่ลงมือทำก็ไม่มีอะไรเริ่มต้น",
tr_en:"I'm studying for the December exam. Since I intend to pass, I plan to review grammar every single day without fail. It's probably just because I've only memorised vocabulary until now that my grammar never grew. It's not that effort is always rewarded, but nothing begins unless you act."},

{id:"p11",lv:"N2",topic:"働き方の変化",
body:"近年、日本の働き方は大きく変わり【1】。以前は残業が当然だと考えられていた【2】、今では効率を重視する企業が増えている。この流れは今後も続く【3】。",
blanks:[
{opts:["つつある","ばかりだ","一方だ","がちだ"],ans:0,
why_en:"〜つつある marks gradual directional change and is the standard news register. 一方だ would also work grammatically but implies a one-way trend without the sense of an ongoing process.",
why_th:"〜つつある ใช้บอกการเปลี่ยนแปลงที่ค่อยเป็นค่อยไปและมีทิศทาง เป็นระดับภาษาข่าวมาตรฐาน ส่วน 一方だ ก็ถูกไวยากรณ์ แต่สื่อถึงแนวโน้มทางเดียวโดยไม่มีความรู้สึกว่าเป็นกระบวนการที่กำลังดำเนินอยู่"},
{opts:["ものの","のに対して","によって","につけ"],ans:1,
why_en:"〜に対して here marks contrast between two eras. ものの would concede a fact about the same subject, but this sentence sets past against present.",
why_th:"〜に対して ตรงนี้ใช้เปรียบเทียบสองยุคสมัย ส่วน ものの เป็นการยอมรับข้อเท็จจริงของสิ่งเดียวกัน แต่ประโยคนี้เทียบอดีตกับปัจจุบัน"},
{opts:["ものだ","と考えられる","にすぎない","ことか"],ans:1,
why_en:"〜と考えられる is academic hedging: it presents a view without claiming it as personal opinion. Essential register for the reading section.",
why_th:"〜と考えられる เป็นการเลี่ยงยืนยันแบบวิชาการ คือเสนอมุมมองโดยไม่อ้างว่าเป็นความเห็นส่วนตัว เป็นระดับภาษาที่จำเป็นสำหรับพาร์ตการอ่าน"}],
tr_th:"ในช่วงไม่กี่ปีมานี้ รูปแบบการทำงานของญี่ปุ่นกำลังค่อย ๆ เปลี่ยนไปอย่างมาก เมื่อก่อนการทำงานล่วงเวลาถูกมองว่าเป็นเรื่องธรรมดา ในขณะที่ตอนนี้บริษัทที่ให้ความสำคัญกับประสิทธิภาพมีมากขึ้น เชื่อกันว่ากระแสนี้จะดำเนินต่อไปในอนาคต",
tr_en:"In recent years Japanese working styles have been steadily changing. Whereas overtime was once considered a matter of course, companies emphasising efficiency are now increasing. This trend is thought likely to continue."},

{id:"p12",lv:"N2",topic:"外国人と日本社会",
body:"日本で暮らす外国人の数は増加【1】。言葉の壁がある【2】、地域社会に溶け込もうと努力している人は多い。互いに歩み寄って【3】、本当の共生が実現するのではないだろうか。",
blanks:[
{opts:["に伴って","しつつある","をめぐって","に応じて"],ans:1,
why_en:"The sentence needs a predicate, and 増加しつつある completes it. The other three are connectives that would leave the sentence unfinished — always check what slot the blank occupies.",
why_th:"ประโยคนี้ต้องการภาคแสดง ซึ่ง 増加しつつある เติมเต็มพอดี ส่วนอีกสามตัวเป็นคำเชื่อมที่จะทำให้ประโยคไม่จบ ให้ตรวจเสมอว่าช่องว่างอยู่ในตำแหน่งไหนของประโยค"},
{opts:["にもかかわらず","にかかわらず","からには","ばかりに"],ans:0,
why_en:"にもかかわらず = despite (a real obstacle). Drop the も and にかかわらず means 'regardless of', which needs a variable, not a stated difficulty. One kana decides it.",
why_th:"にもかかわらず = ทั้ง ๆ ที่ (มีอุปสรรคจริง) ถ้าตัด も ออก にかかわらず จะแปลว่า 'ไม่ว่าจะ' ซึ่งต้องมีตัวแปร ไม่ใช่อุปสรรคที่ระบุไว้ คานะตัวเดียวเป็นตัวชี้ขาด"},
{opts:["こそ","さえ","のみ","だけ"],ans:0,
why_en:"〜てこそ = only by doing X does the valuable Y become real. It's always positive and always about an indispensable condition.",
why_th:"〜てこそ = ต้องทำ X เท่านั้น Y ที่มีคุณค่าถึงจะเป็นจริง เป็นบวกเสมอ และเกี่ยวกับเงื่อนไขที่ขาดไม่ได้เสมอ"}],
tr_th:"จำนวนชาวต่างชาติที่อาศัยอยู่ในญี่ปุ่นกำลังค่อย ๆ เพิ่มขึ้น ทั้ง ๆ ที่มีกำแพงภาษา แต่ก็มีคนจำนวนมากที่พยายามจะกลมกลืนเข้ากับชุมชนท้องถิ่น หรือว่าต้องเข้าหากันทั้งสองฝ่ายเท่านั้น การอยู่ร่วมกันอย่างแท้จริงถึงจะเป็นจริงได้",
tr_en:"The number of foreigners living in Japan is steadily increasing. Despite the language barrier, many are making an effort to blend into their local communities. Might it not be that only by both sides moving toward each other does true coexistence become real?"}
];
GRAMMAR.forEach(function(g){var s=SHORT[g.id]||['','']; g.se=s[0]; g.st=s[1];});
var SIDX={};
GRAMMAR.forEach(function(g){SIDX[g.id]=(g.p+g.cat+g.se+g.st+g.en+g.th+g.conn+g.note_en+g.note_th+g.ex.map(function(e){return e.j+e.k+e.e+e.t;}).join('')).toLowerCase();});
var FORMMAP={};
GRAMMAR.forEach(function(g){
  FORMMAP[g.p]=g;
  var f=formsOf(g.p); if(f.length&&!FORMMAP[f[0]]) FORMMAP[f[0]]=g;
});
function formsOf(p){
  var out=[];
  String(p).split(/[／\/]/).forEach(function(part){
    part=part.trim().replace(/〜/g,''); if(!part) return;
    out.push(part);
    var bare=part.replace(/[（(][^）)]*[）)]/g,'').trim(); if(bare&&out.indexOf(bare)===-1) out.push(bare);
  });
  return out.filter(function(x){return x.length>1;}).sort(function(a,b){return b.length-a.length;});
}
function whyPanel(g,opts){
  var h='<div class="why"><div class="why-lb">なぜこの答え · WHY THIS ANSWER</div>';
  if(showTH()) h+='<div class="why-ok">'+esc(g.note_th)+'</div>';
  if(showEN()) h+='<div class="why-ok'+(showTH()?'-en':'')+'">'+esc(g.note_en)+'</div>';
  var others=(opts||[]).filter(function(o){return !o.ok;});
  if(others.length){
    h+='<div class="why-lb" style="margin:14px 0 4px">他の選択肢の意味 · WHAT THE OTHERS MEAN</div>';
    others.forEach(function(o){
      var d=FORMMAP[o.t];
      h+='<div class="why-row"><b>'+esc(o.t)+'</b><span>'+(d?esc(showTH()?d.st:d.se):'—')+'</span></div>';
    });
  }
  return h+'</div>';
}

/* ============ state ============ */
var KEY='sujimichi.v4';
var S={box:{},last:{},seen:{},lapse:{},att:{},cor:{},days:[],lang:'both',lv:'all',newPerDay:5,maxRev:40,rateBtns:2,theme:'light',dayStart:4,q:null};
var LISTF='all';
var _stamp=0;
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) S[k]=o[k]; _stamp=S.t||0;}}catch(e){}
if(!S.lapse) S.lapse={};
if(S.dayStart==null) S.dayStart=4;
if(S.q && !(S.q.q instanceof Array)) S.q=null;   /* a half-written queue is worse than none */

/* Another copy of the app (a Safari tab left open next to the home-screen one)
   shares this localStorage. Whoever saves last would otherwise silently clobber
   the other's progress, so on every resume we take the newer of the two. */
function reloadIfNewer(){
  try{
    var r=localStorage.getItem(KEY); if(!r) return false;
    var o=JSON.parse(r);
    if(o && (o.t||0)>_stamp){ for(var k in o) S[k]=o[k]; _stamp=o.t||0; clearCaches(); return true; }
  }catch(e){}
  return false;
}
function redrawAll(){ renderToday(); drawList(); drawRecord(); updBadge(); }
function onResume(){
  clearCaches();
  var changed=reloadIfNewer();
  if(changed || !S.q || S.q.date!==today()){   /* the day rolled over while the app slept */
    buildToday(); redrawAll();
  }
}
/* Phones kill backgrounded web apps without warning. Flush on the way out. */
document.addEventListener('visibilitychange',function(){ if(document.hidden) save(); else onResume(); });
window.addEventListener('pagehide',function(){ save(); });
window.addEventListener('focus',onResume);
setInterval(function(){ if(!document.hidden) onResume(); },120000);
function applyTheme(){
  var t=S.theme||'light';
  if(t==='auto'){
    try{t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
    catch(e){t='light';}
  }
  var dark=(t==='dark'), bg=dark?"#15181e":"#f7f0df", fg=dark?'#e8e3d8':'#2b2e34';
  var H=document.documentElement;
  if(dark) H.setAttribute('data-theme','dark'); else H.removeAttribute('data-theme');
  /* backgroundColor, not background — the shorthand would drop the paper grain */
  H.style.backgroundColor=bg;
  document.body.style.backgroundColor=bg;
  document.body.style.color=fg;
  var mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.setAttribute('content',bg);
  var cs=document.querySelector('meta[name="color-scheme"]'); if(cs) cs.setAttribute('content',dark?'dark only':'light only');
}
if(!S.att) S.att={};
if(!S.cor) S.cor={};
var _sc={};
/* A silent failure here looks exactly like "the app forgot my session", so a
   failed write gets one retry without the bulky generated questions, and then
   says so out loud rather than pretending everything is fine. */
var _saveFail=false;
function save(){
  _sc={}; S.t=_stamp=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); return warnSave(false); }catch(e){}
  try{
    if(S.q&&S.q.gen){
      var cur=S.q.gen[S.q.i], slim={};       /* keep the card on screen alive */
      if(cur) slim[S.q.i]=cur;
      S.q.gen=slim;

    }
  }catch(e){}

}
function warnSave(bad){

function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var _dnum={};
function dnum(s){var v=_dnum[s]; if(v===undefined){v=Math.round(Date.parse(s)/86400000); _dnum[s]=v;} return v;}
function dayGap(a,b){return dnum(b)-dnum(a);}
var _today=null,_todayAt=0;

var INTERVAL=[0,0,1,3,7,21];
function boxOf(id){return S.box[id]||0;}
function isDue(id){
  var b=boxOf(id); if(!b) return true;
  var last=S.last[id]; if(!last) return true;
  return dayGap(last,today())>=INTERVAL[Math.min(b,5)];
}
/* Anki-style rating -> Leitner box */
function applyRating(id,r){
  var b=boxOf(id);
  if(r==='again'){ S.box[id]=1; S.lapse[id]=(S.lapse[id]||0)+1; }
  else if(false){}
  else if(r==='hard') S.box[id]=Math.max(1,b);
  else if(r==='good') S.box[id]=Math.min(5,b+1);
  else if(r==='easy') S.box[id]=Math.min(5,b+2);
  S.last[id]=today(); S.seen[id]=1; save();
}
function markStudied(){var t=today(); if(S.days.indexOf(t)===-1){S.days.push(t);S.days=S.days.slice(-400);save();}}
function streak(){
  if(!S.days.length) return 0;
  var set={}; S.days.forEach(function(d){set[d]=1;});
  var n=0,d=new Date();
  if(!set[fmt(d)]){d.setDate(d.getDate()-1); if(!set[fmt(d)]) return 0;}
  while(set[fmt(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function masteryClass(b){return b>=5?'m5':b>=3?'m3':b>=1?'m1':'m0';}
/* 強度 0-100: ladder progress + accuracy + lapse penalty + decay when overdue */
function strength(id){
  if(_sc[id]!==undefined) return _sc[id];
  var b=boxOf(id), att=S.att[id]||0, cor=S.cor[id]||0;
  if(!b && !att) return (_sc[id]=0);
  var conf = Math.min(1, att/4);            /* one lucky answer shouldn't count as proof */
  var v = (b/5)*55 + (att?(cor/att)*30*conf:0) + 15 - Math.min(15,(S.lapse[id]||0)*5);
  var last=S.last[id];
  if(last && b){
    var over = dayGap(last,today()) - INTERVAL[Math.min(b,5)];
    if(over>0) v -= Math.min(30, over*2);
  }
  return (_sc[id]=Math.max(0,Math.min(100,Math.round(v))));
}

/* ============ helpers ============ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pool(){return S.lv==='all'?GRAMMAR:GRAMMAR.filter(function(g){return g.lv===S.lv;});}
function byId(id){for(var i=0;i<GRAMMAR.length;i++) if(GRAMMAR[i].id===id) return GRAMMAR[i]; return null;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var showEN=function(){return S.lang!=='th';}, showTH=function(){return S.lang!=='en';};

function forms(p){
  var out=[];
  String(p).split(/[／\/]/).forEach(function(part){
    part=part.trim().replace(/〜/g,''); if(!part) return;
    out.push(part);
    var bare=part.replace(/[（(][^）)]*[）)]/g,'').trim(); if(bare&&out.indexOf(bare)===-1) out.push(bare);
    var open=part.replace(/[（()）]/g,'').trim(); if(open&&out.indexOf(open)===-1) out.push(open);
  });
  return out.filter(function(x){return x.length>1;}).sort(function(a,b){return b.length-a.length;});
}
function clozeOf(g){
  var f=forms(g.p);
  for(var e=0;e<g.ex.length;e++) for(var i=0;i<f.length;i++){
    var idx=g.ex[e].j.indexOf(f[i]);
    if(idx>-1) return {exIdx:e,key:f[i],text:g.ex[e].j.slice(0,idx)+'\u0001'+g.ex[e].j.slice(idx+f[i].length)};
  }
  return null;
}
function speak(t){
  try{ if(!window.speechSynthesis) return; speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.86; speechSynthesis.speak(u);
  }catch(e){}
}
function makeSpec(g,base){
  var src=base&&base.length>=4?base:pool();
  var p=src.filter(function(x){return x.id!==g.id;});
  /* never offer a distractor that means the same thing as the answer */
  var mine=(g.se||'').toLowerCase().trim();
  var usable=p.filter(function(x){return (x.se||'').toLowerCase().trim()!==mine;});
  if(usable.length>=3) p=usable;
  /* prefer same-category distractors, then TOP UP from the pool instead of discarding them */
  var same=p.filter(function(x){return x.cat===g.cat;});
  var donors=shuffle(same.slice()).slice(0,3);
  if(donors.length<3){
    var rest=shuffle(p.filter(function(x){return donors.indexOf(x)===-1;}));
    donors=donors.concat(rest.slice(0,3-donors.length));
  }
  if(donors.length<3) return null;
  var cz=clozeOf(g);
  if(cz && Math.random()<0.62){
    var keys=donors.map(function(d){return forms(d.p)[0]||d.p;});
    if(keys.indexOf(cz.key)===-1)
      return {kind:'cloze',key:cz.key,ct:cz.text,exIdx:cz.exIdx,
        opts:shuffle([{t:cz.key,ok:true}].concat(keys.map(function(t){return {t:t,ok:false};})))};
  }
  return {kind:'sense',exIdx:0,
    opts:shuffle([{t:g.p,ok:true}].concat(donors.map(function(d){return {t:d.p,ok:false};})))};
}

var RATES4=[['again','もう一度','again'],['hard','難しい','hard'],['good','できた','good'],['easy','簡単','easy']];

/* ============ the plant ============ ==================================
   Same 16x16 grid as the app icon, drawn as one <rect> per run of pixels.
   It grows with today's session: bare pot before you start, a blossom when
   the day is done. Progress bars say how much is left; a plant says the day
   was tended, which is the habit worth building. */
var PLANT_POT=[
  [11,'...rrrrrrrrrd...'],
  [12,'...PhPPPPPPPd...'],
  [13,'....PhPPPPPd....'],
  [14,'.....PhPPPd.....']
];
var PLANT_TOP=[
  [],                                                   /* 0 — just soil */
  [[8,'.....gG..Gg.....'],[9,'......gSSg......'],[10,'.......SS.......']],
  [[6,'......gGGg......'],[7,'....gGGGGGGg....'],[8,'.....ggGGgg.....'],
   [9,'.......SS.......'],[10,'.......SS.......']],
  [[2,'.......gg.......'],[3,'......gGGg......'],[4,'...gg.gGGg.gg...'],
   [5,'..gGGggGGggGGg..'],[6,'..gGGGGGGGGGGg..'],[7,'...gGGGGGGGGg...'],
   [8,'....ggGGGGgg....'],[9,'.......SS.......'],[10,'.......SS.......']],
  [[0,'.......ff.......'],[1,'......fFFf......'],[2,'.......gg.......'],
   [3,'......gGGg......'],[4,'...gg.gGGg.gg...'],[5,'..gGGggGGggGGg..'],
   [6,'..gGGGGGGGGGGg..'],[7,'...gGGGGGGGGg...'],[8,'....ggGGGGgg....'],
   [9,'.......SS.......'],[10,'.......SS.......']]
];
var PLANT_COL={G:'var(--leaf)',g:'var(--leaf-lo)',S:'var(--leaf)',
  P:'var(--pot)',h:'var(--pot-hi)',r:'var(--pot-rim)',d:'var(--pot-lo)',
  F:'var(--bloom)',f:'var(--bloom-lo)'};
function plantSVG(stage,px){
  stage=Math.max(0,Math.min(4,stage|0));
  var rows=PLANT_TOP[stage].concat(PLANT_POT), out='';
  rows.forEach(function(row){
    var y=row[0], s=row[1], x=0;
    while(x<16){
      var ch=s.charAt(x);
      if(ch==='.'){x++;continue;}
      var run=1;
      while(x+run<16 && s.charAt(x+run)===ch) run++;      /* merge runs */
      out+='<rect x="'+x+'" y="'+y+'" width="'+run+'" height="1" fill="'+PLANT_COL[ch]+'"/>';
      x+=run;
    }
  });
  return '<svg class="plant" viewBox="0 0 16 16" width="'+px+'" height="'+px+'" '+
         'shape-rendering="crispEdges" aria-hidden="true">'+out+'</svg>';
}
/* 0 before you start, 4 when the day is done */
function plantStage(){
  if(!S.q||!S.q.q.length) return 3;
  if(S.q.fin||S.q.i>=S.q.q.length) return 4;
  return Math.min(3,Math.floor(S.q.i/S.q.q.length*4));
}

/* ============ daily queue ============ ================================
   S.q is only a *view* of the day — the durable record is S.day, the ledger.
   The queue gets rebuilt more often than you'd think: the level chip in the
   header, any setting in 記録, a day rollover, おかわり. Before, every rebuild
   recomputed "the first N cards still in box 0" — but the ten you had just
   learned were no longer in box 0, so it happily handed out ten *more*, and
   threw away the session you were in the middle of.

   So the ledger remembers, for today: which ids were handed out as new
   (newIds — the allowance, which never shrinks), which were finished
   (done), and which new ones you already pressed 覚えた on (learned).
   A rebuild keeps the answered head of the queue and re-plans only the tail. */
function dayLedger(){
  var t=today();
  if(!S.day || S.day.d!==t){
    S.day={d:t,newIds:[],done:{},learned:{},extra:0};
    /* Upgrading from a version without the ledger, part-way through a day:
       reconstruct today from the queue that is already there, or the very
       first build after the update would hand out a second batch — exactly
       the bug this is here to prevent. */
    if(S.q && S.q.date===t && S.q.q instanceof Array){
      var seen={}, L=S.day;
      S.q.q.forEach(function(c,n){
        if(c.m==='learn' && !seen[c.id]){ seen[c.id]=1; L.newIds.push(c.id); }
        if(n>=S.q.i) return;                        /* not reached yet */
        if(c.m==='learn') L.learned[c.id]=1;
        else if(S.q.rate && S.q.rate[n] && S.q.rate[n]!=='again') L.done[c.id]=1;
      });
    }
  }
  if(!(S.day.newIds instanceof Array)) S.day.newIds=[];
  if(!S.day.done) S.day.done={};
  if(!S.day.learned) S.day.learned={};
  if(S.day.extra==null) S.day.extra=0;
  return S.day;
}
function newAllowance(){return (S.newPerDay||0)+dayLedger().extra;}
function revDoneToday(){
  var L=dayLedger(),n=0,isNew={};
  L.newIds.forEach(function(id){isNew[id]=1;});
  for(var id in L.done) if(!isNew[id]) n++;
  return n;
}
function unlearnedLeft(){return pool().filter(function(g){return boxOf(g.id)===0;}).length;}
/* everything still owed today, in study order */
function planTail(){
  var L=dayLedger(), p=pool(), inPool={};
  p.forEach(function(g){inPool[g.id]=1;});

  /* new cards: whatever today already committed to, then top up to the allowance */
  var room=Math.max(0,newAllowance()-L.newIds.length);
  if(room>0){
    var held={}; L.newIds.forEach(function(id){held[id]=1;});
    for(var i=0;i<p.length&&room>0;i++){
      var g=p[i];
      if(held[g.id]||boxOf(g.id)!==0) continue;
      L.newIds.push(g.id); held[g.id]=1; room--;
    }
  }
  var nw=L.newIds.filter(function(id){return inPool[id];}), inNew={};
  nw.forEach(function(id){inNew[id]=1;});

  /* reviews: due, not already finished today, not part of today's new batch */
  var cap=Math.max(0,(S.maxRev||0)-revDoneToday());
  var rev=p.filter(function(g){return boxOf(g.id)>0&&!inNew[g.id]&&!L.done[g.id]&&isDue(g.id);})
           .sort(function(a,b){return (S.last[a.id]||'')<(S.last[b.id]||'')?-1:1;})
           .slice(0,cap).map(function(g){return g.id;});
  shuffle(rev);

  var q=[];
  nw.forEach(function(id){ if(!L.learned[id]) q.push({id:id,m:'learn'}); });
  rev.forEach(function(id){ q.push({id:id,m:'quiz'}); });
  nw.forEach(function(id){ if(!L.done[id])    q.push({id:id,m:'quiz'}); });
  return {q:q,rv:rev.length,nwTotal:nw.length};
}
function buildToday(force){
  var t=today(), stale=!S.q||S.q.date!==t||!(S.q.q instanceof Array);
  if(!force && !stale){
    if(!S.q.gen)S.q.gen={}; if(!S.q.ans)S.q.ans={}; if(!S.q.rate)S.q.rate={};
    dayLedger(); return;
  }
  var L=dayLedger(), prev=stale?null:S.q;
  /* Answered cards stay put. gen/ans/rate are keyed by queue position, so the
     head keeps its keys and only the discarded tail's keys are dropped. */
  var keep=(prev&&prev.i>0)?prev.q.slice(0,prev.i):[];
  var gen=prev?prev.gen||{}:{}, ans=prev?prev.ans||{}:{}, rate=prev?prev.rate||{}:{};
  [gen,ans,rate].forEach(function(m){ for(var k in m) if(+k>=keep.length) delete m[k]; });
  var plan=planTail();
  S.q={date:t, q:keep.concat(plan.q), i:keep.length,
       right:prev?prev.right||0:0, asked:prev?prev.asked||0:0,
       again:prev?prev.again||{}:{}, gen:gen, ans:ans, rate:rate,
       started:prev?!!prev.started:false, fin:false,
       nw:plan.nwTotal, rv:revDoneToday()+plan.rv};
  save();
}
function remaining(){return S.q?Math.max(0,S.q.q.length-S.q.i):0;}
function updBadge(){
  var b=document.getElementById('badge'), n=(S.q&&!S.q.fin)?remaining():0;
  b.textContent=n; b.classList.toggle('on',n>0);
}
function specAt(i){
  if(S.q.gen[i]) return S.q.gen[i];
  var g=byId(S.q.q[i].id); if(!g) return null;
  var sp=makeSpec(g); if(!sp) return null;
  S.q.gen[i]=sp; save(); return sp;
}

function renderToday(){

function learnedPool(){return pool().filter(function(g){return boxOf(g.id)>0||(S.att[g.id]||0)>0;});}
function kanaChunks(e){return e.k.trim().replace(/[。\s]+$/,'').split(/\s+/).filter(Boolean);}
/* align the kanji sentence to the kana chunk boundaries so the puzzle uses real writing */
var _isFixed=function(c){return /[\u3040-\u30ff\u30fc。、！？「」（）]/.test(c);};
function alignDP(j,K){
  var n=j.length,m=K.length,memo={};
  function solve(i,k){
    if(i===n) return k===m?[]:null;
    var key=i*(m+1)+k;
    if(memo[key]!==undefined) return memo[key];
    var res=null,r;
    if(_isFixed(j[i])){
      if(k<m&&K[k]===j[i]){ r=solve(i+1,k+1); if(r) res=[k].concat(r); }
    }else{
      var lens=[2,1,3,4,5,6];
      for(var x=0;x<lens.length;x++){
        var len=lens[x]; if(k+len>m) continue;
        r=solve(i+1,k+len); if(r){ res=[k].concat(r); break; }
      }
    }
    memo[key]=res; return res;
  }
  return solve(0,0);
}
function kanjiChunks(e){
  var parts=kanaChunks(e);
  if(parts.length<3||parts.length>8) return null;
  var K=parts.join(''), j=e.j.replace(/。\s*$/,'');
  var map=alignDP(j,K); if(!map) return null;
  var bounds=[],acc=0,i;
  for(i=0;i<parts.length-1;i++){acc+=parts[i].length;bounds.push(acc);}
  var cuts=[0];
  for(i=0;i<bounds.length;i++){
    var at=map.indexOf(bounds[i]);
    if(at===-1) return null;
    cuts.push(at);
  }
  cuts.push(j.length);
  var out=[];
  for(i=0;i<cuts.length-1;i++){var seg=j.slice(cuts[i],cuts[i+1]); if(!seg) return null; out.push(seg);}
  if(out.join('')!==j||out.length!==parts.length) return null;
  return mergeOrphans(out);
}
/* a lone inflection kana is never a standalone chunk — glue it to the one before */
function mergeOrphans(a){
  var orphan=/^[たてだでんっいくるれ]$/, out=[];
  for(var i=0;i<a.length;i++){
    if(i>0&&a[i].length===1&&orphan.test(a[i])) out[out.length-1]+=a[i];
    else out.push(a[i]);
  }
  return out;
}
function chunksOf(e){return kanjiChunks(e)||mergeOrphans(kanaChunks(e));}
function makeAsm(g){
  var kanji=g.ex.filter(function(e){return kanjiChunks(e);});
  var cands=kanji.length?kanji:g.ex.filter(function(e){var p=kanaChunks(e);return p.length>=3&&p.length<=8;});
  if(!cands.length) return null;
  var e=cands[Math.floor(Math.random()*cands.length)], parts=chunksOf(e);
  var bank=shuffle(parts.map(function(t,i){return {t:t,i:i};}));
  if(bank.map(function(b){return b.t;}).join('')===parts.join('') && parts.length>2){
    var t=bank[0];bank[0]=bank[bank.length-1];bank[bank.length-1]=t;
  }
  return {id:g.id,e:e,parts:parts,bank:bank};
}

    P.on=true;P.stage='run';P.q=shuffle(lvOK.slice()).slice(0,n);
    P.i=0;P.bi=0;P.right=0;P.pans={};P.total=0;
    P.q.forEach(function(p){P.total+=p.blanks.length;});
    renderPrac(); window.scrollTo(0,0); return;
  }
  var base = (P.scope==='learned' && learnedPool().length>=4) ? learnedPool() : pool();
  var src=shuffle(base.slice());
  var items=[];
  for(var i=0;i<src.length&&items.length<n;i++){
    if(P.mode==='asm'){ var a=makeAsm(src[i]); if(a) items.push(a); }
    else { var sp=makeSpec(src[i],base); if(sp) items.push({id:src[i].id,sp:sp}); }
  }
  P.on=true;P.stage='run';P.q=items;P.i=0;P.right=0;P.ans={};P.placed=[];P.checked=false;
  renderPrac(); window.scrollTo(0,0);
}
function nextPrac(){P.i++;P.bi=0;P.placed=[];P.checked=false;renderPrac();window.scrollTo(0,0);}
document.getElementById('prac').addEventListener('click',function(ev){
  var md=ev.target.closest('[data-mode]');
  if(md){P.mode=md.dataset.mode;P.stage='len';renderPrac();return;}
  var sc=ev.target.closest('[data-sc]');
  if(sc){P.scope=sc.dataset.sc;renderPrac();return;}
  if(ev.target.closest('#pback')){P.stage='mode';renderPrac();return;}
  var pk=ev.target.closest('[data-n]'); if(pk){startPrac(+pk.dataset.n);return;}
  if(ev.target.closest('#pquit')){P.on=false;P.stage='mode';renderPrac();window.scrollTo(0,0);return;}
  if(ev.target.closest('#pagain')){P.stage='len';renderPrac();return;}
  if(ev.target.closest('#pend')){P.on=false;P.stage='mode';renderPrac();return;}
  if(ev.target.closest('#pnx')){nextPrac();return;}

  /* --- passage interactions --- */
  var pb=ev.target.closest('[data-p]');
  if(pb&&P.mode==='psg'){
    var ps=P.q[P.i]; if(!P.pans[P.i]) P.pans[P.i]={};
    if(P.pans[P.i][P.bi]!==undefined) return;
    var pick=+pb.dataset.p;
    P.pans[P.i][P.bi]=pick;
    if(pick===ps.blanks[P.bi].ans) P.right++;
    renderPsg(document.getElementById('prac')); return;
  }
  if(ev.target.closest('#pbnext')){P.bi++;renderPsg(document.getElementById('prac'));window.scrollTo(0,0);return;}

  /* --- assembly interactions --- */
  var tp=ev.target.closest('[data-tray]');
  if(tp&&!P.checked){P.placed.splice(+tp.dataset.tray,1);renderAsm(document.getElementById('prac'));return;}
  var bp=ev.target.closest('[data-bank]');
  if(bp&&!P.checked){
    var n2=+bp.dataset.bank;
    if(P.placed.indexOf(n2)===-1){P.placed.push(n2);renderAsm(document.getElementById('prac'));}
    return;
  }
  if(ev.target.closest('#acheck')){
    var it=P.q[P.i];
    if(P.placed.length!==it.parts.length) return;
    P.checked=true;
    if(P.placed.map(function(x){return it.bank[x].t;}).join('')===it.parts.join('')) P.right++;
    renderAsm(document.getElementById('prac'));
    speak(it.e.j); return;
  }
  if(ev.target.closest('#asay')){speak(P.q[P.i].e.j);return;}

  /* --- multiple choice --- */
  var o=ev.target.closest('.opt'); if(!o||!P.on) return;
  if(P.ans[P.i]!==undefined) return;
  var it2=P.q[P.i], g=byId(it2.id), sp2=it2.sp, n3=+o.dataset.i, ok2=sp2.opts[n3].ok;
  P.ans[P.i]=n3; if(ok2) P.right++;
  document.querySelectorAll('#prac .opt').forEach(function(b,x){
    if(sp2.opts[x].ok) b.classList.add('right');
    else if(x===n3) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  var ex=g.ex[sp2.exIdx]||g.ex[0], v=document.getElementById('pverdict');
  v.innerHTML=pracVerdict(g,ex,sp2.opts); v.classList.add('on'); speak(ex.j);
});

/* ============ list ============ */
var qbox=document.getElementById('q');
qbox.addEventListener('input',drawList);
function passFilter(g){
  var b=boxOf(g.id);
  if(LISTF==='weak')  return (S.att[g.id]||0)>0 && strength(g.id)<60;
  if(LISTF==='learn') return b>0&&b<5;
  if(LISTF==='done')  return b>=5;
  if(LISTF==='new')   return b===0;
  return true;
}
function filterCounts(){
  var c={all:0,weak:0,learn:0,done:0,new:0}, keep=LISTF;
  pool().forEach(function(g){
    var b=boxOf(g.id); c.all++;
    if((S.att[g.id]||0)>0 && strength(g.id)<60) c.weak++;
    if(b>0&&b<5) c.learn++;
    if(b>=5) c.done++;
    if(b===0) c['new']++;
  });
  LISTF=keep; return c;
}
function drawList(){
  var term=qbox.value.trim().toLowerCase();
  var c=filterCounts();
  document.querySelectorAll('#filters button').forEach(function(x){
    x.classList.toggle('on',x.dataset.f===LISTF);
    var n=c[x.dataset.f];
    if(!x.querySelector('.cnt')) x.insertAdjacentHTML('beforeend','<span class="cnt"></span>');
    x.querySelector('.cnt').textContent=n;
  });
  var items=pool().filter(passFilter).filter(function(g){
    if(!term) return true;
    return SIDX[g.id].indexOf(term)>-1;
  });
  if(LISTF==='weak') items.sort(function(a,b){return strength(a.id)-strength(b.id);});
  var box=document.getElementById('list');
  if(!items.length){
    var msg = LISTF==='weak' ? '苦手はまだありません<br>Nothing below 60 yet — answer some questions first' : '該当なし<br>No match';
    box.innerHTML='<div class="empty">'+msg+'</div>';return;}
  var groups=[],map={};
  items.forEach(function(g){var k=g.lv+' '+g.cat; if(!map[k]){map[k]={lv:g.lv,cat:g.cat,items:[]};groups.push(map[k]);} map[k].items.push(g);});
  var h='';
  groups.forEach(function(gr){
    h+='<div class="grp"><div class="grp-hd"><h2>'+esc(gr.cat)+'</h2><div class="rule"></div><span class="n">'+gr.lv+' · '+gr.items.length+'</span></div>';
    gr.items.forEach(function(g){
      h+='<button class="row '+masteryClass(boxOf(g.id))+' '+strClass(g.id)+'" data-id="'+g.id+'" data-lv="'+g.lv+'"><span class="row-bar"></span>'+
         '<span class="row-txt"><span class="row-p">'+esc(g.p)+'</span>'+
         '<span class="row-g">'+esc(showTH()?g.st:g.se)+'</span></span>'+
         strChip(g.id)+'</button>';
    });
    h+='</div>';
  });
  box.innerHTML=h;
}

/* ============ record ============ */
function drawRecord(){
  var n3=GRAMMAR.filter(function(g){return g.lv==='N3';}), n2=GRAMMAR.filter(function(g){return g.lv==='N2';});
  function mast(a){return a.filter(function(g){return boxOf(g.id)>=5;}).length;}
  var m3=mast(n3),m2=mast(n2),C2=2*Math.PI*84,C3=2*Math.PI*66;
  var r2=document.getElementById('r2'),r3=document.getElementById('r3');
  r2.style.strokeDasharray=C2; r2.style.strokeDashoffset=C2*(1-m2/n2.length);
  r3.style.strokeDasharray=C3; r3.style.strokeDashoffset=C3*(1-m3/n3.length);
  document.getElementById('rpct').textContent=Math.round((m3+m2)/GRAMMAR.length*100)+'%';
  document.getElementById('lg3').textContent=m3+'/'+n3.length;
  document.getElementById('lg2').textContent=m2+'/'+n2.length;
  document.getElementById('s-seen').textContent=Object.keys(S.seen).length;
  document.getElementById('s-learn').textContent=GRAMMAR.filter(function(g){var b=boxOf(g.id);return b>0&&b<5;}).length;
  document.getElementById('s-streak').textContent=streak();
  var bandN=[0,0,0,0,0];
  pool().forEach(function(g){bandN[bandIdx(strength(g.id))]++;});
  var tot=pool().length;
  document.getElementById('dist').innerHTML=[4,3,2,1,0].map(function(i){
    return '<div class="dist-row"><span class="dist-nm">'+BANDS[i][1]+'</span>'+
      '<span class="dist-tr"><i class="s'+i+'" style="width:'+(bandN[i]/tot*100)+'%;background:'+
      BANDCOL[i]+'"></i></span>'+
      '<span class="dist-n">'+bandN[i]+'</span></div>';
  }).join('');
  var bk=document.getElementById('bk');
  if(bk && document.activeElement!==bk) bk.value=JSON.stringify({v:5,box:S.box,last:S.last,lapse:S.lapse,att:S.att,cor:S.cor,days:S.days,seen:S.seen,day:S.day});
  document.getElementById('bknote').innerHTML=(showTH()?'บันทึกอยู่ในเครื่องนี้เท่านั้น ถ้าล้างข้อมูล Safari จะหายหมด — ก๊อปข้อความนี้เก็บไว้ในโน้ตบ้าง':'')+
    (showEN()?'<br>Progress lives only on this device. Copy this text into a note now and then — it is your only backup.':'');
  var fc=[],lbl=['今日','+1','+2','+3','+4','+5','+6'];
  for(var d=0;d<7;d++){
    var t=new Date(); t.setDate(t.getDate()+d); var ds=fmt(t), n=0;
    pool().forEach(function(g){
      var b=boxOf(g.id); if(!b) return;
      var last=S.last[g.id]; if(!last) {n++;return;}
      if(dayGap(last,ds)>=INTERVAL[Math.min(b,5)] && dayGap(last,ds)<INTERVAL[Math.min(b,5)]+1) n++;
      else if(d===0 && dayGap(last,ds)>=INTERVAL[Math.min(b,5)]) n++;
    });
    /* today is not a forecast — it is whatever the queue still owes */
    if(d===0) n=(S.q&&S.q.date===today())?remaining():Math.min(n,S.maxRev)+Math.min(unlearnedLeft(),S.newPerDay);
    fc.push(n);
  }
  var mx=Math.max.apply(null,fc.concat([1]));
  document.getElementById('fc').innerHTML=fc.map(function(n,i){
    return '<div><b>'+n+'</b><i style="height:'+Math.round(n/mx*40)+'px"></i><span>'+lbl[i]+'</span></div>';
  }).join('');
  document.querySelectorAll('#segnew button').forEach(function(x){x.classList.toggle('on',+x.dataset.v===S.newPerDay);});
  document.querySelectorAll('#segrev button').forEach(function(x){x.classList.toggle('on',+x.dataset.v===S.maxRev);});
  document.querySelectorAll('#segrate button').forEach(function(x){x.classList.toggle('on',+x.dataset.v===(S.rateBtns||2));});
  document.querySelectorAll('#segtheme button').forEach(function(x){x.classList.toggle('on',x.dataset.v===(S.theme||'light'));});
  document.querySelectorAll('#segday button').forEach(function(x){x.classList.toggle('on',+x.dataset.v===(S.dayStart==null?4:S.dayStart));});
  var cats=[],cm={};
  pool().forEach(function(g){
    var k=g.lv+' '+g.cat;
    if(!cm[k]){cm[k]={lv:g.lv,cat:g.cat,t:0,m:0};cats.push(cm[k]);}
    cm[k].t++; if(boxOf(g.id)>=5) cm[k].m++;
  });
  document.getElementById('brk').innerHTML=cats.map(function(c){
    return '<div class="brk-row" data-lv="'+c.lv+'"><span class="brk-nm">'+esc(c.cat)+'</span>'+
      '<span class="brk-tr"><i style="width:'+(c.m/c.t*100)+'%"></i></span>'+
      '<span class="brk-n">'+c.m+'/'+c.t+'</span></div>';
  }).join('');
}

    this.textContent='読み込めません ✕';

  if(!confirm('全ての学習記録を消しますか？ / ลบบันทึกการเรียนทั้งหมด?')) return;
  S={box:{},last:{},seen:{},lapse:{},att:{},cor:{},days:[],lang:S.lang,lv:S.lv,newPerDay:S.newPerDay,maxRev:S.maxRev,rateBtns:S.rateBtns,theme:S.theme,dayStart:S.dayStart,q:null,day:null};
