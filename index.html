th:"อยากให้...จริง ๆ — ความปรารถนาจากใจ บางครั้งเป็นการบ่นเบา ๆ",
note_en:"ものだ intensifies the wish. Aimed at others it often carries a hint of reproach: もう少し考えてほしいものだ.",
note_th:"ものだ ทำให้ความปรารถนาแรงขึ้น ถ้าพูดถึงคนอื่นมักแฝงการตำหนิเล็กน้อย เช่น もう少し考えてほしいものだ",
ex:[{j:"もう少し考えてほしいものだ。",k:"もう すこし かんがえて ほしい ものだ。",e:"I do wish they'd think a bit more.",t:"อยากให้คิดมากกว่านี้อีกหน่อยจริง ๆ"},
{j:"いつか日本語で夢を見たいものだ。",k:"いつか にほんごで ゆめを みたい ものだ。",e:"One day I really would like to dream in Japanese.",t:"สักวันอยากฝันเป็นภาษาญี่ปุ่นจริง ๆ นะ"}]},

{id:"n2g10",lv:"N2",cat:"時・場面",p:"〜てこのかた",conn:"Vて＋このかた",
en:"Ever since X (and right up to now).",
th:"ตั้งแต่ X เป็นต้นมาจนถึงตอนนี้",
note_en:"Close to て以来 but more emphatic about the unbroken stretch, and slightly more literary.",
note_th:"ใกล้เคียงกับ て以来 แต่เน้นความต่อเนื่องไม่ขาดตอนมากกว่า และเป็นวรรณกรรมกว่าเล็กน้อย",
ex:[{j:"社会に出てこのかた、休んだことがない。",k:"しゃかいに でて このかた、やすんだ ことが ない。",e:"Since entering the workforce I've never taken time off.",t:"ตั้งแต่ออกมาทำงานก็ไม่เคยหยุดเลย"},
{j:"生まれてこのかた、雪を見たことがない。",k:"うまれて このかた、ゆきを みた ことが ない。",e:"I've never seen snow in my whole life.",t:"ตั้งแต่เกิดมาก็ไม่เคยเห็นหิมะเลย"}]},

{id:"n2g11",lv:"N2",cat:"条件",p:"〜(よ)うものなら",conn:"V意志形＋ものなら",
en:"If you were to do X, something terrible would follow.",
th:"ถ้าเผลอทำ X ล่ะก็ จะเกิดเรื่องแย่ตามมา",
note_en:"An exaggerated warning. Note the volitional form: 遅刻しようものなら怒られる. Different from V-可能形＋ものなら (wishful).",
note_th:"เป็นคำเตือนที่พูดเกินจริง สังเกตว่าใช้รูปเจตนา เช่น 遅刻しようものなら怒られる ต่างจาก รูปสามารถ＋ものなら (ที่เป็นความเพ้อฝัน)",
ex:[{j:"遅刻しようものなら、大変なことになる。",k:"ちこく しよう ものなら、たいへんな ことに なる。",e:"If you were to turn up late, there'd be hell to pay.",t:"ถ้าเผลอมาสายล่ะก็ เรื่องใหญ่แน่"},
{j:"一言でも文句を言おうものなら、彼は怒り出す。",k:"ひとことでも もんくを いおう ものなら、かれは おこりだす。",e:"Utter one word of complaint and he'll explode.",t:"ถ้าบ่นสักคำล่ะก็ เขาจะโกรธขึ้นมาทันที"}]},

{id:"n2g12",lv:"N2",cat:"立場・観点",p:"〜(のこと)となると",conn:"N（のこと）＋となると",
en:"When it comes to X, (they change completely).",
th:"พอเป็นเรื่อง X ล่ะก็ (จะเปลี่ยนไปเลย)",
note_en:"Introduces the one topic that transforms someone's behaviour. 娘のこととなると、父は人が変わる.",
note_th:"ใช้แนะนำหัวข้อเดียวที่ทำให้พฤติกรรมของใครเปลี่ยนไป เช่น 娘のこととなると、父は人が変わる",
ex:[{j:"アニメのこととなると、彼は止まらない。",k:"アニメの ことと なると、かれは とまらない。",e:"When it comes to anime, he never stops.",t:"พอเป็นเรื่องอนิเมะล่ะก็ เขาพูดไม่หยุดเลย"},
{j:"お金のこととなると、慎重になる。",k:"おかねの ことと なると、しんちょうに なる。",e:"When money comes into it, he turns cautious.",t:"พอเป็นเรื่องเงินล่ะก็ จะระมัดระวังขึ้นมาทันที"}]},

{id:"n2g13",lv:"N2",cat:"伝聞・推量",p:"〜とみえる / 〜とみえて",conn:"普通形＋とみえる・とみえて",
en:"It appears that — inferring from visible evidence.",
th:"ดูเหมือนว่า — อนุมานจากหลักฐานที่มองเห็น",
note_en:"You saw something and drew a conclusion. とみえて links to the evidence clause: 疲れているとみえて、よく寝ている.",
note_th:"เห็นบางอย่างแล้วสรุป ส่วน とみえて เชื่อมกับประโยคหลักฐาน เช่น 疲れているとみえて、よく寝ている",
ex:[{j:"疲れているとみえて、よく眠っている。",k:"つかれて いると みえて、よく ねむって いる。",e:"He seems tired — he's sleeping soundly.",t:"ดูเหมือนจะเหนื่อย เลยหลับสนิทเลย"},
{j:"留守だとみえる。返事がない。",k:"るすだと みえる。へんじが ない。",e:"They seem to be out — no answer.",t:"ดูเหมือนจะไม่อยู่บ้าน ไม่มีเสียงตอบ"}]},

{id:"n2g14",lv:"N2",cat:"限定・強調",p:"〜限りでは",conn:"V辞書形／Vた／Vている ＋ かぎりでは",
en:"As far as X goes (as far as I know / have heard / can see).",
th:"เท่าที่ X (เท่าที่รู้ / เท่าที่ได้ยิน / เท่าที่เห็น)",
note_en:"Marks the limit of your information, so it hedges. 私が知る限りでは、問題ありません.",
note_th:"ใช้ระบุขอบเขตของข้อมูลที่เรามี จึงเป็นการพูดแบบสงวนท่าที เช่น 私が知る限りでは、問題ありません",
ex:[{j:"私が知る限りでは、問題ありません。",k:"わたしが しる かぎりでは、もんだい ありません。",e:"As far as I know, there's no problem.",t:"เท่าที่ผมรู้ ไม่มีปัญหาครับ"},
{j:"調べた限りでは、記録は残っていない。",k:"しらべた かぎりでは、きろくは のこって いない。",e:"As far as I checked, no record remains.",t:"เท่าที่ตรวจสอบ ไม่มีบันทึกหลงเหลืออยู่"}]},

{id:"n2g15",lv:"N2",cat:"評価・判断",p:"〜ことだろう / 〜ことか",conn:"（どんなに）＋V普通形／イA／ナA な ＋ ことだろう",
en:"How very...! — exclaiming at a degree you can only imagine.",
th:"ช่างเป็น...เสียเหลือเกิน! — อุทานถึงระดับที่ได้แต่จินตนาการ",
note_en:"ことか exclaims about your own feeling; ことだろう imagines someone else's. どんなに嬉しいことだろう = how happy they must be.",
note_th:"ことか ใช้อุทานถึงความรู้สึกของตัวเอง ส่วน ことだろう ใช้จินตนาการถึงความรู้สึกของคนอื่น เช่น どんなに嬉しいことだろう = เขาคงดีใจเหลือเกิน",
ex:[{j:"ご両親はどんなに喜ぶことだろう。",k:"ごりょうしんは どんなに よろこぶ ことだろう。",e:"How delighted your parents must be.",t:"พ่อแม่คงจะดีใจเหลือเกิน"},
{j:"合格したら、どんなに嬉しいことか。",k:"ごうかく したら、どんなに うれしい ことか。",e:"How happy I'd be if I passed!",t:"ถ้าสอบผ่านคงจะดีใจเหลือเกิน"}]}
,
{id:"a301",lv:"N3",cat:"副詞",p:"ふと",conn:"ふと＋V（無意識の動作）",
en:"Suddenly, without meaning to — a thought or action that arrives unbidden.",
th:"จู่ ๆ ก็...โดยไม่ได้ตั้งใจ — ความคิดหรือการกระทำที่ผุดขึ้นมาเอง",
note_en:"Only for things that happen in your mind or eyes without intention: ふと思う, ふと気づく, ふと見る. You cannot say ふと立ち上がった for a deliberate act.",
note_th:"ใช้เฉพาะสิ่งที่เกิดขึ้นในใจหรือสายตาโดยไม่ตั้งใจ เช่น ふと思う ふと気づく ふと見る พูดว่า ふと立ち上がった ไม่ได้เพราะเป็นการกระทำที่ตั้งใจ",
ex:[{j:"ふと故郷のことを思い出した。",k:"ふと こきょうの ことを おもいだした。",e:"My hometown suddenly came to mind.",t:"จู่ ๆ ก็นึกถึงบ้านเกิดขึ้นมา"},
{j:"ふと空を見上げると、月が出ていた。",k:"ふと そらを みあげると、つきが でて いた。",e:"I happened to look up and the moon was out.",t:"พอเผลอเงยหน้ามองท้องฟ้า ก็เห็นพระจันทร์ขึ้นแล้ว"}]},

{id:"a302",lv:"N3",cat:"副詞",p:"まさか",conn:"まさか＋〜ない／まさか〜とは思わなかった",
en:"Surely not; you can't be serious — disbelief at something unexpected.",
th:"ไม่มีทาง; ล้อเล่นน่า — ความไม่อยากเชื่อกับสิ่งที่ไม่คาดคิด",
note_en:"Pairs with a negative or with 〜とは思わなかった. On its own, まさか！ means 'no way!'. It always signals the speaker's surprise, never a neutral statement.",
note_th:"ใช้คู่กับรูปปฏิเสธหรือ 〜とは思わなかった ถ้าพูดเดี่ยว ๆ ว่า まさか！ แปลว่า 'ไม่จริงน่า!' สื่อความประหลาดใจของผู้พูดเสมอ ไม่ใช่ประโยคบอกเล่ากลาง ๆ",
ex:[{j:"まさか彼が来るとは思わなかった。",k:"まさか かれが くるとは おもわなかった。",e:"I never dreamed he would come.",t:"ไม่คิดเลยว่าเขาจะมา"},
{j:"まさか、そんなことはないでしょう。",k:"まさか、そんな ことは ないでしょう。",e:"Surely that can't be so.",t:"ไม่มีทางหรอก คงไม่ใช่แบบนั้นหรอกครับ"}]},

{id:"a303",lv:"N3",cat:"副詞",p:"もしかしたら / もしかすると",conn:"もしかしたら＋〜かもしれない",
en:"Perhaps; it might just be that.",
th:"บางที; เผลอ ๆ อาจจะ",
note_en:"Almost always closes with 〜かもしれない. It flags a low-probability guess right at the start of the sentence, which helps the listener.",
note_th:"มักลงท้ายด้วย 〜かもしれない เสมอ ใช้ส่งสัญญาณตั้งแต่ต้นประโยคว่ากำลังเดาแบบความน่าจะเป็นต่ำ ซึ่งช่วยให้ผู้ฟังเข้าใจง่ายขึ้น",
ex:[{j:"もしかしたら、彼はもう知っているかもしれない。",k:"もしかしたら、かれは もう しって いるかも しれない。",e:"He might already know, actually.",t:"เผลอ ๆ เขาอาจจะรู้แล้วก็ได้"},
{j:"もしかすると、雨になるかもしれません。",k:"もしかすると、あめに なるかも しれません。",e:"It might possibly rain.",t:"บางทีฝนอาจจะตกก็ได้ครับ"}]},

{id:"a304",lv:"N3",cat:"副詞",p:"むしろ",conn:"AよりむしろB／〜というよりむしろ",
en:"Rather; if anything, the opposite.",
th:"เสียมากกว่า; ถ้าจะว่าไปกลับตรงข้าม",
note_en:"Corrects a comparison toward the truer option. Often follows a denial: 難しいというより、むしろ面倒だ.",
note_th:"ใช้แก้การเปรียบเทียบให้ตรงความจริงมากขึ้น มักตามหลังการปฏิเสธ เช่น 難しいというより、むしろ面倒だ",
ex:[{j:"高いというより、むしろ質が悪い。",k:"たかいと いうより、むしろ しつが わるい。",e:"It's not so much expensive as poor quality.",t:"มากกว่าจะแพง คุณภาพแย่เสียมากกว่า"},
{j:"謝るより、むしろ行動で示すべきだ。",k:"あやまるより、むしろ こうどうで しめす べきだ。",e:"Rather than apologise, you should show it through action.",t:"แทนที่จะขอโทษ ควรแสดงออกด้วยการกระทำเสียมากกว่า"}]},

{id:"a305",lv:"N3",cat:"副詞",p:"なかなか",conn:"なかなか＋イA／ナA（肯定＝かなり）／なかなか＋Vない（否定＝なかなか…しない）",
en:"Quite, rather (positive); or: not easily at all (with a negative).",
th:"ค่อนข้าง...ทีเดียว (รูปบอกเล่า); หรือ ไม่...สักที (คู่กับรูปปฏิเสธ)",
note_en:"Two opposite feelings from one word. With a positive it praises: なかなかおいしい. With a negative it expresses frustration at slowness: なかなか来ない.",
note_th:"คำเดียวให้ความรู้สึกตรงข้ามกันสองแบบ ถ้าคู่กับรูปบอกเล่าคือคำชม เช่น なかなかおいしい ถ้าคู่กับรูปปฏิเสธคือความหงุดหงิดที่ช้า เช่น なかなか来ない",
ex:[{j:"この店、なかなかおいしいですね。",k:"この みせ、なかなか おいしいですね。",e:"This place is really rather good.",t:"ร้านนี้อร่อยใช้ได้เลยนะครับ"},
{j:"バスがなかなか来ない。",k:"バスが なかなか こない。",e:"The bus just won't come.",t:"รถเมล์ไม่มาสักที"}]},

{id:"a306",lv:"N3",cat:"副詞",p:"なるべく / できるだけ",conn:"なるべく＋V／イA",
en:"As much as possible; if you can.",
th:"เท่าที่จะทำได้; ถ้าเป็นไปได้",
note_en:"Softens a request without weakening it: なるべく早くお願いします is polite but still means hurry. できるだけ is slightly stronger.",
note_th:"ทำให้คำขอนุ่มลงโดยไม่ลดความหมาย เช่น なるべく早くお願いします สุภาพแต่ก็ยังแปลว่าให้รีบ ส่วน できるだけ แรงกว่าเล็กน้อย",
ex:[{j:"なるべく早くご連絡ください。",k:"なるべく はやく ごれんらく ください。",e:"Please contact me as soon as you can.",t:"กรุณาติดต่อกลับให้เร็วที่สุดเท่าที่จะทำได้ครับ"},
{j:"できるだけ毎日練習しています。",k:"できるだけ まいにち れんしゅう して います。",e:"I practise every day as much as I can.",t:"พยายามฝึกทุกวันเท่าที่จะทำได้ครับ"}]},

{id:"a307",lv:"N3",cat:"副詞",p:"さすが(に)",conn:"さすが＋N／さすがに＋文",
en:"As one would expect; true to their reputation. さすがに = even so, admittedly.",
th:"สมกับที่เป็น; สมชื่อจริง ๆ ส่วน さすがに = ถึงอย่างนั้นก็เถอะ",
note_en:"さすが alone is admiration. Add に and it concedes a limit: さすがに疲れた = even I got tired. Two related but distinct uses.",
note_th:"さすが เดี่ยว ๆ คือการชื่นชม แต่พอเติม に จะกลายเป็นการยอมรับขีดจำกัด เช่น さすがに疲れた = ขนาดเราก็ยังเหนื่อย เป็นสองความหมายที่เกี่ยวกันแต่ต่างกัน",
ex:[{j:"さすが先輩、説明が分かりやすい。",k:"さすが せんぱい、せつめいが わかりやすい。",e:"That's my senior for you — such a clear explanation.",t:"สมกับเป็นรุ่นพี่ อธิบายเข้าใจง่ายจริง ๆ"},
{j:"12時間働いて、さすがに疲れた。",k:"じゅうにじかん はたらいて、さすがに つかれた。",e:"Twelve hours of work — even I'm tired.",t:"ทำงาน 12 ชั่วโมง ขนาดเราก็ยังเหนื่อยเลย"}]},

{id:"a308",lv:"N3",cat:"副詞",p:"わざと",conn:"わざと＋V",
en:"On purpose; deliberately (usually something bad).",
th:"ตั้งใจ; จงใจ (มักเป็นเรื่องไม่ดี)",
note_en:"Do not confuse with わざわざ. わざと = with bad intent (わざと負けた). わざわざ = going out of one's way, often kindly (わざわざ来てくれた). The exam loves this pair.",
note_th:"อย่าสับสนกับ わざわざ โดย わざと = ตั้งใจในทางไม่ดี (わざと負けた) ส่วน わざわざ = อุตส่าห์ลำบากมาทำให้ มักเป็นความเอื้อเฟื้อ (わざわざ来てくれた) ข้อสอบชอบคู่นี้มาก",
ex:[{j:"彼はわざと間違えたと思う。",k:"かれは わざと まちがえたと おもう。",e:"I think he got it wrong on purpose.",t:"คิดว่าเขาตั้งใจทำผิด"},
{j:"わざと聞こえないふりをした。",k:"わざと きこえない ふりを した。",e:"She deliberately pretended not to hear.",t:"เธอจงใจแกล้งทำเป็นไม่ได้ยิน"}]},

{id:"a309",lv:"N3",cat:"副詞",p:"わざわざ",conn:"わざわざ＋V",
en:"To go to the trouble of; specially.",
th:"อุตส่าห์; ลำบากมาเป็นพิเศษ",
note_en:"Marks effort beyond what was necessary. Often gratitude (わざわざありがとうございます) but can be reproach (わざわざ言わなくてもいい).",
note_th:"ใช้ระบุความพยายามที่มากเกินความจำเป็น มักใช้ขอบคุณ (わざわざありがとうございます) แต่ก็ใช้ตำหนิได้ (わざわざ言わなくてもいい)",
ex:[{j:"わざわざお越しいただき、ありがとうございます。",k:"わざわざ おこし いただき、ありがとう ございます。",e:"Thank you for going out of your way to come.",t:"ขอบคุณที่อุตส่าห์เดินทางมานะครับ"},
{j:"わざわざ言わなくてもいいのに。",k:"わざわざ いわなくても いいのに。",e:"You needn't have gone and said that.",t:"ไม่เห็นต้องอุตส่าห์พูดออกมาเลย"}]},

{id:"a310",lv:"N3",cat:"副詞",p:"確かに",conn:"確かに＋文（〜が／しかし と呼応）",
en:"Certainly, admittedly — conceding a point before disagreeing.",
th:"จริงอยู่ว่า — ยอมรับก่อนแล้วค่อยแย้ง",
note_en:"The classic essay move. 確かにAだ。しかしBだ。 Learn this shape for the writing and reading sections — it signals a counter-argument is coming.",
note_th:"เป็นรูปแบบคลาสสิกของเรียงความ คือ 確かにAだ。しかしBだ。 ควรจำโครงนี้ไว้ใช้ในพาร์ตเขียนและอ่าน เพราะเป็นสัญญาณว่ากำลังจะโต้แย้ง",
ex:[{j:"確かに難しいが、不可能ではない。",k:"たしかに むずかしいが、ふかのうでは ない。",e:"It's certainly hard, but not impossible.",t:"จริงอยู่ว่ายาก แต่ก็ไม่ใช่ว่าเป็นไปไม่ได้"},
{j:"確かにそう言いました。",k:"たしかに そう いいました。",e:"I definitely did say that.",t:"ผมพูดแบบนั้นจริง ๆ ครับ"}]},

{id:"a311",lv:"N3",cat:"副詞",p:"結局",conn:"結局＋文（多く過去形）",
en:"In the end; after all that.",
th:"สุดท้ายแล้ว; ในที่สุดก็",
note_en:"Sums up an outcome after a long process, often disappointing. Sits near あげく in feeling but is a plain adverb, so it needs no special connection.",
note_th:"ใช้สรุปผลหลังกระบวนการอันยาวนาน มักเป็นเรื่องน่าผิดหวัง ความรู้สึกใกล้เคียง あげく แต่เป็นคำวิเศษณ์ธรรมดา จึงไม่ต้องมีรูปเชื่อมพิเศษ",
ex:[{j:"結局、その日は何もできなかった。",k:"けっきょく、その ひは なにも できなかった。",e:"In the end I got nothing done that day.",t:"สุดท้ายวันนั้นก็ไม่ได้ทำอะไรเลย"},
{j:"結局、彼の言う通りだった。",k:"けっきょく、かれの いう とおり だった。",e:"In the end it was just as he said.",t:"สุดท้ายก็เป็นอย่างที่เขาพูดจริง ๆ"}]},

{id:"a312",lv:"N3",cat:"副詞",p:"ついに / とうとう",conn:"ついに＋V（結果）",
en:"At last; finally (after a long wait).",
th:"ในที่สุดก็; ท้ายที่สุดแล้ว",
note_en:"Both mark a long-awaited result. ついに leans positive and dramatic; とうとう can lean negative or resigned. やっと is warmer relief.",
note_th:"ทั้งคู่ใช้กับผลลัพธ์ที่รอคอยมานาน โดย ついに เอนไปทางบวกและดราม่า ส่วน とうとう เอนไปทางลบหรือจำยอม ส่วน やっと ให้ความรู้สึกโล่งใจที่อบอุ่นกว่า",
ex:[{j:"ついに合格することができた。",k:"ついに ごうかく する ことが できた。",e:"At last I managed to pass.",t:"ในที่สุดก็สอบผ่านจนได้"},
{j:"とうとう最後まで来なかった。",k:"とうとう さいごまで こなかった。",e:"In the end he never came at all.",t:"ท้ายที่สุดก็ไม่มาจนจบเลย"}]},

{id:"a313",lv:"N3",cat:"副詞",p:"すでに",conn:"すでに＋Vた／Vている",
en:"Already (formal, written).",
th:"ได้...ไปแล้ว (ทางการ ภาษาเขียน)",
note_en:"The written twin of もう. Reports and notices prefer すでに; conversation prefers もう.",
note_th:"เป็นฝาแฝดในภาษาเขียนของ もう รายงานและประกาศนิยมใช้ すでに ส่วนบทสนทนานิยมใช้ もう",
ex:[{j:"受付はすでに終了しております。",k:"うけつけは すでに しゅうりょう して おります。",e:"Reception has already closed.",t:"ปิดรับลงทะเบียนไปแล้วครับ"},
{j:"その件はすでに報告済みです。",k:"その けんは すでに ほうこくずみ です。",e:"That matter has already been reported.",t:"เรื่องนั้นได้รายงานไปแล้วครับ"}]},

{id:"a314",lv:"N3",cat:"副詞",p:"しばらく",conn:"しばらく＋V／しばらくの間",
en:"For a while; for a moment.",
th:"สักครู่; สักพักหนึ่ง",
note_en:"Elastic — anything from a minute (しばらくお待ちください) to years (しばらく会っていない). Context sets the length.",
note_th:"ยืดหยุ่นมาก ตั้งแต่หนึ่งนาที (しばらくお待ちください) ไปจนถึงหลายปี (しばらく会っていない) บริบทเป็นตัวกำหนดความยาว",
ex:[{j:"しばらくお待ちください。",k:"しばらく おまち ください。",e:"Please wait a moment.",t:"กรุณารอสักครู่ครับ"},
{j:"しばらく会っていませんね。",k:"しばらく あって いませんね。",e:"We haven't met in a while, have we?",t:"ไม่ได้เจอกันนานเลยนะครับ"}]},

{id:"a315",lv:"N3",cat:"副詞",p:"さらに",conn:"さらに＋V／イA（比較・追加）",
en:"Furthermore; even more so.",
th:"ยิ่งไปกว่านั้น; มากยิ่งขึ้นไปอีก",
note_en:"Adds another step on top of what's already there. Different from また (also) — さらに implies escalation, not mere addition.",
note_th:"ใช้เพิ่มอีกขั้นบนสิ่งที่มีอยู่แล้ว ต่างจาก また (อีกด้วย) เพราะ さらに สื่อถึงการยกระดับ ไม่ใช่แค่การเพิ่ม",
ex:[{j:"来年はさらに難しくなるだろう。",k:"らいねんは さらに むずかしく なるだろう。",e:"Next year will be harder still.",t:"ปีหน้าคงยากขึ้นไปอีก"},
{j:"さらに詳しく説明します。",k:"さらに くわしく せつめい します。",e:"I'll explain in yet more detail.",t:"จะอธิบายให้ละเอียดยิ่งขึ้นไปอีกครับ"}]},

{id:"a316",lv:"N3",cat:"副詞",p:"せいぜい",conn:"せいぜい＋数量／せいぜい＋V",
en:"At most; at best (and that's not much).",
th:"อย่างมากก็แค่; เต็มที่ก็",
note_en:"Always downplays. せいぜい3000円 means 3000 yen and no more, said dismissively. It never praises.",
note_th:"ใช้ลดทอนเสมอ เช่น せいぜい3000円 แปลว่าอย่างมากก็ 3000 เยน พูดในเชิงมองข้าม ไม่ใช้ชม",
ex:[{j:"どんなに急いでも、せいぜい5分早くなるだけだ。",k:"どんなに いそいでも、せいぜい ごふん はやく なる だけだ。",e:"However much you rush, you'll gain five minutes at most.",t:"ต่อให้รีบแค่ไหน อย่างมากก็เร็วขึ้นแค่ 5 นาที"},
{j:"参加者はせいぜい20人くらいだろう。",k:"さんかしゃは せいぜい にじゅうにん くらいだろう。",e:"There'll be twenty participants at most.",t:"ผู้เข้าร่วมอย่างมากก็คงราว 20 คน"}]},

{id:"a317",lv:"N3",cat:"副詞",p:"一度に / 一気に",conn:"一度に・一気に＋V",
en:"All at once; in one go.",
th:"ทีเดียวหมด; รวดเดียวจบ",
note_en:"一度に = at the same time, several things together. 一気に = in one unbroken push, without stopping. The second stresses momentum.",
note_th:"一度に = พร้อมกันทีเดียวหลายอย่าง ส่วน 一気に = รวดเดียวไม่หยุดพัก โดยตัวหลังเน้นแรงส่ง",
ex:[{j:"一度にたくさん覚えようとしないほうがいい。",k:"いちどに たくさん おぼえようと しない ほうが いい。",e:"You'd better not try to memorise a lot at once.",t:"อย่าพยายามจำเยอะ ๆ ทีเดียวจะดีกว่า"},
{j:"最後まで一気に読んでしまった。",k:"さいごまで いっきに よんで しまった。",e:"I read it right through in one go.",t:"อ่านรวดเดียวจนจบเลย"}]},

{id:"a318",lv:"N3",cat:"副詞",p:"一体",conn:"一体＋疑問詞＋〜のか",
en:"On earth; just what/why — an emphatic question.",
th:"...อะไรกันแน่; ทำไมกันแน่ — คำถามที่เน้นอารมณ์",
note_en:"Always sits with a question word and usually ends in 〜のか. It conveys frustration or genuine bewilderment, never a neutral question.",
note_th:"ต้องอยู่คู่กับคำคำถามเสมอ และมักลงท้ายด้วย 〜のか สื่อถึงความหงุดหงิดหรือความงุนงงจริง ๆ ไม่ใช่คำถามกลาง ๆ",
ex:[{j:"一体どうしたんですか。",k:"いったい どう したんですか。",e:"What on earth happened?",t:"เกิดอะไรขึ้นกันแน่ครับ"},
{j:"一体いつになったら終わるのか。",k:"いったい いつに なったら おわるのか。",e:"When on earth is this going to end?",t:"เมื่อไหร่มันจะจบกันแน่เนี่ย"}]},

{id:"a319",lv:"N3",cat:"副詞",p:"どうしても",conn:"どうしても＋Vたい／どうしても＋Vない",
en:"No matter what (with a wish); or: simply cannot (with a negative).",
th:"ยังไงก็ต้อง (คู่กับความอยาก); หรือ ยังไงก็ไม่ (คู่กับรูปปฏิเสธ)",
note_en:"Two directions from one word. With 〜たい it's determination. With a negative it's helplessness: どうしても分からない.",
note_th:"คำเดียวไปได้สองทาง ถ้าคู่กับ 〜たい คือความมุ่งมั่น ถ้าคู่กับรูปปฏิเสธคือความจนปัญญา เช่น どうしても分からない",
ex:[{j:"どうしてもN1に合格したい。",k:"どうしても エヌいちに ごうかく したい。",e:"I want to pass N1 no matter what.",t:"ยังไงก็อยากสอบ N1 ให้ผ่านให้ได้"},
{j:"この漢字がどうしても覚えられない。",k:"この かんじが どうしても おぼえられない。",e:"I simply cannot memorise this kanji.",t:"คันจิตัวนี้ยังไงก็จำไม่ได้สักที"}]},

{id:"a320",lv:"N3",cat:"副詞",p:"あまりにも",conn:"あまりにも＋イA／ナA",
en:"Far too; excessively.",
th:"...เกินไปมาก",
note_en:"Intensifies an adjective past the acceptable point. Stronger than あまり and always followed by a consequence or complaint.",
note_th:"ใช้เน้นคำคุณศัพท์ให้เกินจุดที่รับได้ แรงกว่า あまり และมักตามด้วยผลลัพธ์หรือคำบ่น",
ex:[{j:"あまりにも忙しくて、食事する時間もない。",k:"あまりにも いそがしくて、しょくじ する じかんも ない。",e:"I'm so terribly busy I've no time even to eat.",t:"ยุ่งเกินไปจนไม่มีเวลากินข้าวเลย"},
{j:"あまりにも突然のことで驚いた。",k:"あまりにも とつぜんの ことで おどろいた。",e:"It was so utterly sudden that I was shocked.",t:"เป็นเรื่องกะทันหันเกินไปจนตกใจ"}]},

{id:"a321",lv:"N3",cat:"呼応表現",p:"ちっとも〜ない / 少しも〜ない",conn:"ちっとも・少しも＋Vない",
en:"Not in the least; not one bit.",
th:"ไม่...แม้แต่นิดเดียว",
note_en:"ちっとも is casual and emotional; 少しも is neutral and works in writing. Both demand a negative — they cannot stand alone.",
note_th:"ちっとも เป็นกันเองและมีอารมณ์ ส่วน 少しも เป็นกลางและใช้ในภาษาเขียนได้ ทั้งคู่ต้องมีรูปปฏิเสธ ใช้เดี่ยว ๆ ไม่ได้",
ex:[{j:"薬を飲んだが、ちっともよくならない。",k:"くすりを のんだが、ちっとも よく ならない。",e:"I took the medicine but I'm not one bit better.",t:"กินยาแล้วแต่ก็ไม่ดีขึ้นเลยแม้แต่นิดเดียว"},
{j:"少しも疲れていません。",k:"すこしも つかれて いません。",e:"I'm not the least bit tired.",t:"ไม่เหนื่อยเลยแม้แต่นิดเดียวครับ"}]},

{id:"a322",lv:"N3",cat:"呼応表現",p:"全然〜ない / まったく〜ない",conn:"全然・まったく＋Vない",
en:"Not at all; completely not.",
th:"ไม่...เลย; ไม่...โดยสิ้นเชิง",
note_en:"まったく is the stronger and more formal of the two. In casual modern speech 全然 sometimes appears with a positive (全然いい) — recognise it, but don't write it in an exam.",
note_th:"まったく แรงกว่าและเป็นทางการกว่า ในภาษาพูดสมัยใหม่แบบกันเอง 全然 บางครั้งใช้กับรูปบอกเล่า (全然いい) ให้ฟังออกได้ แต่อย่าเขียนในข้อสอบ",
ex:[{j:"その話は全然知りませんでした。",k:"その はなしは ぜんぜん しりません でした。",e:"I knew nothing at all about that.",t:"เรื่องนั้นผมไม่รู้เลยครับ"},
{j:"まったく問題ありません。",k:"まったく もんだい ありません。",e:"There's absolutely no problem.",t:"ไม่มีปัญหาเลยแม้แต่น้อยครับ"}]},

{id:"a323",lv:"N3",cat:"呼応表現",p:"何も / 誰も / どこも〜ない",conn:"疑問詞＋も＋Vない",
en:"Nothing / nobody / nowhere.",
th:"ไม่มีอะไร / ไม่มีใคร / ไม่มีที่ไหน",
note_en:"Japanese builds these from a question word plus も plus a negative. There is no separate word for 'nothing' — this pattern IS the word.",
note_th:"ภาษาญี่ปุ่นสร้างคำเหล่านี้จาก คำคำถาม + も + รูปปฏิเสธ ไม่มีคำแยกสำหรับ 'ไม่มีอะไร' รูปประโยคนี้แหละคือคำนั้น",
ex:[{j:"今日は何も食べていない。",k:"きょうは なにも たべて いない。",e:"I haven't eaten anything today.",t:"วันนี้ยังไม่ได้กินอะไรเลย"},
{j:"誰も来なかった。",k:"だれも こなかった。",e:"Nobody came.",t:"ไม่มีใครมาเลย"}]},

{id:"a324",lv:"N3",cat:"接続詞",p:"つまり",conn:"文＋。つまり＋文",
en:"In other words; that is to say.",
th:"กล่าวคือ; พูดง่าย ๆ ก็คือ",
note_en:"Restates what came before in simpler or clearer terms. In listening, つまり is a signal that the important summary is coming next.",
note_th:"ใช้พูดสิ่งที่กล่าวไปแล้วใหม่ให้ง่ายหรือชัดขึ้น ในพาร์ตการฟัง つまり เป็นสัญญาณว่าบทสรุปสำคัญกำลังจะมา",
ex:[{j:"つまり、もう間に合わないということです。",k:"つまり、もう まにあわないと いう ことです。",e:"In other words, we won't make it in time.",t:"กล่าวคือ ไม่ทันแล้วครับ"},
{j:"彼は私の母の弟、つまり叔父です。",k:"かれは わたしの ははの おとうと、つまり おじ です。",e:"He's my mother's younger brother — that is, my uncle.",t:"เขาเป็นน้องชายของแม่ผม กล่าวคือเป็นน้าครับ"}]},

{id:"a325",lv:"N3",cat:"接続詞",p:"すなわち",conn:"文＋。すなわち＋文",
en:"Namely; in other words (formal, written).",
th:"กล่าวคือ; นั่นก็คือ (ทางการ ภาษาเขียน)",
note_en:"The stiff written form of つまり. You'll meet it in academic reading and legal text, rarely in speech.",
note_th:"เป็นรูปแบบเขียนที่แข็งของ つまり จะเจอในบทอ่านวิชาการและตัวบทกฎหมาย แทบไม่ใช้ในการพูด",
ex:[{j:"日本の首都、すなわち東京に住んでいる。",k:"にほんの しゅと、すなわち とうきょうに すんで いる。",e:"I live in Japan's capital, namely Tokyo.",t:"อาศัยอยู่ในเมืองหลวงของญี่ปุ่น นั่นก็คือโตเกียว"},
{j:"結論、すなわち最も重要な点はここだ。",k:"けつろん、すなわち もっとも じゅうような てんは ここだ。",e:"The conclusion — namely the most important point — is this.",t:"ข้อสรุป กล่าวคือประเด็นที่สำคัญที่สุด อยู่ตรงนี้"}]},

{id:"a326",lv:"N3",cat:"接続詞",p:"なぜなら（〜から）",conn:"なぜなら＋文＋からだ",
en:"The reason is that; because.",
th:"เหตุผลก็คือ; เพราะว่า",
note_en:"Must close with 〜からだ — the pair is fixed. It states a reason AFTER the claim, which is the reverse of から and useful in essays.",
note_th:"ต้องลงท้ายด้วย 〜からだ เป็นคู่ที่ตายตัว ใช้บอกเหตุผล 'หลัง' ข้อความหลัก ซึ่งกลับด้านกับ から และมีประโยชน์ในการเขียนเรียงความ",
ex:[{j:"私は反対だ。なぜなら危険だからだ。",k:"わたしは はんたいだ。なぜなら きけんだからだ。",e:"I'm against it. The reason is that it's dangerous.",t:"ผมไม่เห็นด้วย เหตุผลก็คือมันอันตรายครับ"},
{j:"文法を勉強する。なぜなら話せるようになりたいからだ。",k:"ぶんぽうを べんきょう する。なぜなら はなせる ように なりたいからだ。",e:"I study grammar, because I want to become able to speak.",t:"ผมเรียนไวยากรณ์ เพราะอยากพูดให้ได้ครับ"}]},

{id:"a327",lv:"N3",cat:"接続詞",p:"ところが",conn:"文＋。ところが＋文（意外な結果）",
en:"However — and what happened next was unexpected.",
th:"แต่ทว่า — และสิ่งที่เกิดขึ้นต่อมาไม่คาดคิด",
note_en:"Unlike しかし (neutral 'but'), ところが always introduces a surprise, and the following clause is usually a past fact, not an opinion.",
note_th:"ต่างจาก しかし ('แต่' แบบกลาง ๆ) เพราะ ところが ใช้แนะนำเรื่องเหนือความคาดหมายเสมอ และประโยคที่ตามมามักเป็นข้อเท็จจริงในอดีต ไม่ใช่ความเห็น",
ex:[{j:"急いで駅に行った。ところが、電車はもう出ていた。",k:"いそいで えきに いった。ところが、でんしゃは もう でて いた。",e:"I hurried to the station. However, the train had already left.",t:"รีบไปที่สถานี แต่ทว่ารถไฟออกไปแล้ว"},
{j:"簡単だと思っていた。ところが、全然できなかった。",k:"かんたんだと おもって いた。ところが、ぜんぜん できなかった。",e:"I thought it would be easy. As it turned out, I couldn't do it at all.",t:"คิดว่าจะง่าย แต่ทว่าทำไม่ได้เลยสักนิด"}]},

{id:"a328",lv:"N3",cat:"接続詞",p:"それとも",conn:"疑問文＋。それとも＋疑問文",
en:"Or (between two questions).",
th:"หรือว่า (ใช้ระหว่างคำถามสองข้อ)",
note_en:"Only joins questions or choices. For statements use または. Asking コーヒー、それとも紅茶？ is natural; ×コーヒーそれとも紅茶を買った is not.",
note_th:"ใช้เชื่อมคำถามหรือตัวเลือกเท่านั้น ถ้าเป็นประโยคบอกเล่าให้ใช้ または เช่น コーヒー、それとも紅茶？ ฟังธรรมชาติ แต่ ×コーヒーそれとも紅茶を買った ใช้ไม่ได้",
ex:[{j:"コーヒーにしますか。それとも紅茶にしますか。",k:"コーヒーに しますか。それとも こうちゃに しますか。",e:"Will you have coffee, or tea?",t:"จะรับกาแฟ หรือว่าชาดีครับ"},
{j:"行きますか、それともやめますか。",k:"いきますか、それとも やめますか。",e:"Are we going, or calling it off?",t:"จะไป หรือว่าจะเลิกดีครับ"}]},

{id:"a329",lv:"N3",cat:"接続詞",p:"例えば",conn:"例えば＋N／文",
en:"For example.",
th:"ตัวอย่างเช่น",
note_en:"Often paired with 〜など or 〜といった at the end of the example list. Essential for the writing section, where a claim without an example scores poorly.",
note_th:"มักใช้คู่กับ 〜など หรือ 〜といった ท้ายรายการตัวอย่าง จำเป็นมากในพาร์ตเขียน เพราะข้อความที่ไม่มีตัวอย่างจะได้คะแนนน้อย",
ex:[{j:"例えば、寿司や天ぷらなどが有名です。",k:"たとえば、すしや てんぷら などが ゆうめい です。",e:"For example, sushi and tempura are famous.",t:"ตัวอย่างเช่น ซูชิและเทมปุระเป็นที่รู้จักครับ"},
{j:"例えばこういう場合はどうしますか。",k:"たとえば こういう ばあいは どう しますか。",e:"For instance, what would you do in a case like this?",t:"ตัวอย่างเช่นในกรณีแบบนี้จะทำยังไงครับ"}]},

{id:"a330",lv:"N3",cat:"接続詞",p:"そのために / そのため",conn:"文＋。そのため＋文",
en:"For that reason; consequently (formal).",
th:"ด้วยเหตุนั้น; จึงทำให้ (ทางการ)",
note_en:"Written register for cause and effect. Notices use it constantly: 事故がありました。そのため、電車が遅れています。",
note_th:"เป็นระดับภาษาเขียนสำหรับเหตุและผล ประกาศต่าง ๆ ใช้บ่อยมาก เช่น 事故がありました。そのため、電車が遅れています。",
ex:[{j:"大雪が降った。そのため、電車が止まった。",k:"おおゆきが ふった。そのため、でんしゃが とまった。",e:"Heavy snow fell. Consequently the trains stopped.",t:"หิมะตกหนัก ด้วยเหตุนั้นรถไฟจึงหยุดวิ่ง"},
{j:"準備不足でした。そのために失敗しました。",k:"じゅんび ぶそく でした。そのために しっぱい しました。",e:"We were underprepared, and for that reason we failed.",t:"เตรียมตัวไม่พอ ด้วยเหตุนั้นจึงล้มเหลวครับ"}]}
,
{id:"a401",lv:"N2",cat:"副詞",p:"どうせ",conn:"どうせ＋文（あきらめ・開き直り）",
en:"Anyway; in any case — with resignation, it won't matter.",
th:"ยังไงก็...อยู่ดี (น้ำเสียงจำยอม พูดแบบปลงแล้ว)",
note_en:"Always carries resignation or defiance, never neutral. どうせ無理だ = it's hopeless anyway. Don't confuse with どうやら (apparently), which is a guess, not an attitude.",
note_th:"มีน้ำเสียงจำยอมหรือปลงเสมอ ไม่เป็นกลาง เช่น どうせ無理だ = ยังไงก็ไม่ไหวอยู่ดี อย่าสับสนกับ どうやら (ท่าทางจะ) ซึ่งเป็นการเดา ไม่ใช่ทัศนคติ",
ex:[{j:"どうせ間に合わないから、ゆっくり行こう。",k:"どうせ まにあわないから、ゆっくり いこう。",e:"We won't make it anyway, so let's take our time.",t:"ยังไงก็ไม่ทันอยู่ดี ค่อย ๆ ไปเถอะ"},
{j:"どうせやるなら、完璧にやりたい。",k:"どうせ やるなら、かんぺきに やりたい。",e:"If I'm going to do it anyway, I want to do it perfectly.",t:"ในเมื่อยังไงก็ต้องทำ ก็อยากทำให้สมบูรณ์แบบ"}]},

{id:"a402",lv:"N2",cat:"副詞",p:"どうやら",conn:"どうやら＋〜らしい・〜ようだ",
en:"Apparently; it seems — a guess from partial evidence.",
th:"ท่าทางจะ; ดูเหมือนว่า — เดาจากหลักฐานที่มีบางส่วน",
note_en:"Pairs with らしい or ようだ at the end. It signals uncertainty from the start of the sentence, so the listener knows a guess is coming.",
note_th:"ใช้คู่กับ らしい หรือ ようだ ท้ายประโยค ส่งสัญญาณความไม่แน่ใจตั้งแต่ต้น ทำให้ผู้ฟังรู้ว่ากำลังจะเดา",
ex:[{j:"どうやら道を間違えたようだ。",k:"どうやら みちを まちがえた ようだ。",e:"It seems we've taken the wrong road.",t:"ท่าทางจะเดินทางผิดแล้วล่ะ"},
{j:"どうやら彼は知らなかったらしい。",k:"どうやら かれは しらなかった らしい。",e:"Apparently he didn't know.",t:"ท่าทางเขาจะไม่รู้เรื่อง"}]},

{id:"a403",lv:"N2",cat:"副詞",p:"かえって",conn:"かえって＋文（予想と逆の結果）",
en:"On the contrary; it backfired and produced the opposite.",
th:"กลับกลายเป็น; ผลออกมาตรงข้ามกับที่คาด",
note_en:"Different from むしろ. むしろ corrects a description ('rather, it's B'); かえって reports a real result that went the wrong way. 薬を飲んだら、かえって悪くなった.",
note_th:"ต่างจาก むしろ โดย むしろ ใช้แก้คำบรรยาย ('ที่จริงคือ B มากกว่า') ส่วน かえって รายงานผลจริงที่ออกมาตรงข้าม เช่น 薬を飲んだら、かえって悪くなった",
ex:[{j:"急いだら、かえって時間がかかった。",k:"いそいだら、かえって じかんが かかった。",e:"I rushed, and it ended up taking longer.",t:"พอรีบ กลับกลายเป็นใช้เวลานานกว่าเดิม"},
{j:"謝ったら、かえって怒らせてしまった。",k:"あやまったら、かえって おこらせて しまった。",e:"I apologised and it only made him angrier.",t:"พอขอโทษ กลับทำให้เขาโกรธหนักกว่าเดิม"}]},

{id:"a404",lv:"N2",cat:"副詞",p:"せっかく",conn:"せっかく＋Vた／N ＋なのに・だから",
en:"After going to all that trouble; a precious chance that may be wasted.",
th:"อุตส่าห์...ทั้งที (และอาจเสียเปล่า)",
note_en:"Different from わざわざ. わざわざ describes the EFFORT made; せっかく mourns that the effort or chance may go to waste. It usually leads into のに or だから.",
note_th:"ต่างจาก わざわざ โดย わざわざ บรรยาย 'ความพยายาม' ที่ทุ่มลงไป ส่วน せっかく เสียดายว่าความพยายามหรือโอกาสนั้นอาจสูญเปล่า มักตามด้วย のに หรือ だから",
ex:[{j:"せっかく来たのに、店は閉まっていた。",k:"せっかく きたのに、みせは しまって いた。",e:"I came all that way and the shop was shut.",t:"อุตส่าห์มาทั้งที ร้านดันปิด"},
{j:"せっかくの機会だから、挑戦してみます。",k:"せっかくの きかいだから、ちょうせん して みます。",e:"It's a rare chance, so I'll give it a go.",t:"ในเมื่อเป็นโอกาสดีทั้งที ก็จะลองดูครับ"}]},

{id:"a405",lv:"N2",cat:"副詞",p:"せめて",conn:"せめて＋最低限の希望＋〜たい・〜てほしい",
en:"At least this much — a minimum wish when the ideal is out of reach.",
th:"อย่างน้อยก็ขอ... — ความหวังขั้นต่ำเมื่อสิ่งที่ดีที่สุดเป็นไปไม่ได้",
note_en:"Different from 少なくとも. 少なくとも states a factual minimum (少なくとも3人来た). せめて expresses a wish you'd settle for: せめて連絡してほしかった.",
note_th:"ต่างจาก 少なくとも โดย 少なくとも บอกขั้นต่ำที่เป็นข้อเท็จจริง (少なくとも3人来た) ส่วน せめて แสดงความหวังที่ยอมรับได้ เช่น せめて連絡してほしかった",
ex:[{j:"せめて一言、連絡してほしかった。",k:"せめて ひとこと、れんらく して ほしかった。",e:"I wish he'd at least sent one word.",t:"อย่างน้อยก็อยากให้ติดต่อมาสักคำ"},
{j:"合格は無理でも、せめて半分は解きたい。",k:"ごうかくは むりでも、せめて はんぶんは ときたい。",e:"Even if I can't pass, I want to answer at least half.",t:"ถึงจะสอบผ่านไม่ได้ อย่างน้อยก็อยากทำให้ได้ครึ่งหนึ่ง"}]},

{id:"a406",lv:"N2",cat:"副詞",p:"少なくとも",conn:"少なくとも＋数量／文",
en:"At least — a factual minimum.",
th:"อย่างน้อยที่สุด (ขั้นต่ำเชิงข้อเท็จจริง)",
note_en:"States a floor you can verify, not a wish. Often opens a concession: 少なくとも彼は嘘をついていない.",
note_th:"บอกขั้นต่ำที่ตรวจสอบได้ ไม่ใช่ความปรารถนา มักใช้เปิดการยอมรับบางส่วน เช่น 少なくとも彼は嘘をついていない",
ex:[{j:"少なくとも三年はかかるだろう。",k:"すくなくとも さんねんは かかるだろう。",e:"It'll take at least three years.",t:"อย่างน้อยก็คงใช้เวลาสามปี"},
{j:"少なくとも、彼は正直だ。",k:"すくなくとも、かれは しょうじきだ。",e:"At the very least, he's honest.",t:"อย่างน้อยที่สุด เขาก็เป็นคนซื่อสัตย์"}]},

{id:"a407",lv:"N2",cat:"副詞",p:"一応",conn:"一応＋V（とりあえず・念のため）",
en:"For now; just in case; more or less.",
th:"เอาไว้ก่อน; เผื่อไว้; ก็ประมาณนั้น",
note_en:"Signals something is done but not thoroughly. 一応終わりました = it's finished, sort of. Very common in Japanese offices as a modest hedge.",
note_th:"สื่อว่าทำแล้วแต่ยังไม่สมบูรณ์เต็มที่ เช่น 一応終わりました = เสร็จแล้วครับ ก็ประมาณนั้น ใช้บ่อยมากในที่ทำงานญี่ปุ่นเพื่อพูดแบบถ่อมตัว",
ex:[{j:"一応、資料は準備しておきました。",k:"いちおう、しりょうは じゅんび して おきました。",e:"I've prepared the materials, more or less.",t:"เตรียมเอกสารไว้แล้วครับ ก็ประมาณนั้น"},
{j:"一応、傘を持っていこう。",k:"いちおう、かさを もって いこう。",e:"Let's take an umbrella just in case.",t:"เอาร่มไปด้วยเผื่อไว้ก่อนดีกว่า"}]},

{id:"a408",lv:"N2",cat:"副詞",p:"いきなり",conn:"いきなり＋V",
en:"All of a sudden, with no warning.",
th:"จู่ ๆ ก็ โดยไม่มีสัญญาณเตือน",
note_en:"Emphasises the absence of any preparation or preamble. 突然 is neutral suddenness; いきなり adds that no step was taken first.",
note_th:"เน้นว่าไม่มีการเตรียมตัวหรือเกริ่นนำใด ๆ ส่วน 突然 เป็นความกะทันหันแบบกลาง ๆ แต่ いきなり เพิ่มความหมายว่าไม่ได้ผ่านขั้นตอนใดมาก่อน",
ex:[{j:"いきなり名前を呼ばれて驚いた。",k:"いきなり なまえを よばれて おどろいた。",e:"I was startled to have my name called out of nowhere.",t:"จู่ ๆ ก็ถูกเรียกชื่อ เลยตกใจ"},
{j:"いきなり本題に入るのは失礼だ。",k:"いきなり ほんだいに はいるのは しつれいだ。",e:"Launching straight into the main point is rude.",t:"การเข้าเรื่องหลักทันทีถือว่าเสียมารยาท"}]},

{id:"a409",lv:"N2",cat:"副詞",p:"いよいよ",conn:"いよいよ＋V（待った出来事の到来）",
en:"At last, the moment has come; more and more.",
th:"ในที่สุดก็ถึงเวลา; ยิ่งขึ้นเรื่อย ๆ",
note_en:"Marks the arrival of a long-anticipated moment, usually with excitement. Different from ついに, which reports a result; いよいよ points forward at what is about to begin.",
note_th:"ใช้บอกว่าช่วงเวลาที่รอคอยมาถึงแล้ว มักมีความตื่นเต้น ต่างจาก ついに ที่รายงานผลลัพธ์ ส่วน いよいよ ชี้ไปข้างหน้าถึงสิ่งที่กำลังจะเริ่ม",
ex:[{j:"いよいよ明日が試験だ。",k:"いよいよ あしたが しけんだ。",e:"At last, the exam is tomorrow.",t:"ในที่สุดพรุ่งนี้ก็จะสอบแล้ว"},
{j:"雨がいよいよ激しくなってきた。",k:"あめが いよいよ はげしく なって きた。",e:"The rain has grown heavier and heavier.",t:"ฝนเริ่มตกหนักขึ้นเรื่อย ๆ แล้ว"}]},

{id:"a410",lv:"N2",cat:"副詞",p:"やがて",conn:"やがて＋V（自然な時の経過）",
en:"Before long; in due course.",
th:"ไม่ช้าก็; ในไม่ช้า",
note_en:"Literary and calm. Unlike もうすぐ, it suggests time passing naturally rather than an imminent event you are waiting for.",
note_th:"เป็นภาษาวรรณกรรมและให้ความรู้สึกสงบ ต่างจาก もうすぐ เพราะสื่อถึงเวลาที่ผ่านไปตามธรรมชาติ ไม่ใช่เหตุการณ์ที่กำลังจะถึงและเรารออยู่",
ex:[{j:"やがて春が来るだろう。",k:"やがて はるが くるだろう。",e:"Spring will come before long.",t:"ไม่ช้าฤดูใบไม้ผลิก็คงมาถึง"},
{j:"やがて彼も理解するようになった。",k:"やがて かれも りかい する ように なった。",e:"In time he too came to understand.",t:"ในที่สุดเขาก็เริ่มเข้าใจ"}]},

{id:"a411",lv:"N2",cat:"副詞",p:"とっくに",conn:"とっくに＋Vた／Vている",
en:"Long ago, ages ago — and you are only realising now.",
th:"ตั้งนานแล้ว — และเพิ่งจะมารู้ตัวเอาตอนนี้",
note_en:"Carries a hint of 'why are you asking now?'. すでに is neutral and formal; とっくに is casual and slightly impatient.",
note_th:"แฝงความรู้สึกว่า 'ทำไมเพิ่งมาถามตอนนี้' ส่วน すでに เป็นกลางและทางการ แต่ とっくに เป็นกันเองและออกแนวหงุดหงิดนิดหน่อย",
ex:[{j:"その話はとっくに知っているよ。",k:"その はなしは とっくに しって いるよ。",e:"I've known about that for ages.",t:"เรื่องนั้นรู้ตั้งนานแล้ว"},
{j:"電車はとっくに出てしまった。",k:"でんしゃは とっくに でて しまった。",e:"The train left long ago.",t:"รถไฟออกไปตั้งนานแล้ว"}]},

{id:"a412",lv:"N2",cat:"副詞",p:"再び",conn:"再び＋V（書き言葉）",
en:"Once again (formal, written).",
th:"อีกครั้งหนึ่ง (ทางการ ภาษาเขียน)",
note_en:"The written form of また. Appears in news and formal narration; もう一度 is the spoken equivalent.",
note_th:"เป็นรูปเขียนของ また เจอในข่าวและการบรรยายแบบทางการ ส่วน もう一度 เป็นรูปพูด",
ex:[{j:"彼は再び日本を訪れた。",k:"かれは ふたたび にほんを おとずれた。",e:"He visited Japan once again.",t:"เขาได้มาเยือนญี่ปุ่นอีกครั้ง"},
{j:"再び同じ過ちを繰り返してはならない。",k:"ふたたび おなじ あやまちを くりかえしては ならない。",e:"We must not repeat the same mistake again.",t:"ต้องไม่ทำผิดพลาดแบบเดิมซ้ำอีก"}]},

{id:"a413",lv:"N2",cat:"副詞",p:"逆に",conn:"逆に＋文",
en:"Conversely; the other way round.",
th:"ในทางกลับกัน; กลับกันเลย",
note_en:"Flips the direction of a statement. Softer and more conversational than かえって, and it does not require an unexpected outcome — just a reversal.",
note_th:"ใช้กลับทิศทางของข้อความ นุ่มและเป็นภาษาพูดมากกว่า かえって และไม่จำเป็นต้องมีผลลัพธ์ที่เหนือความคาดหมาย แค่กลับด้านก็พอ",
ex:[{j:"安いと逆に不安になる。",k:"やすいと ぎゃくに ふあんに なる。",e:"If it's cheap, I actually get worried instead.",t:"ถ้าถูกก็กลับกลายเป็นไม่สบายใจ"},
{j:"逆に言えば、これはチャンスだ。",k:"ぎゃくに いえば、これは チャンスだ。",e:"Put the other way round, this is an opportunity.",t:"ถ้าพูดกลับกัน นี่คือโอกาส"}]},

{id:"a414",lv:"N2",cat:"副詞",p:"恐らく",conn:"恐らく＋〜だろう・〜と思う",
en:"Probably; in all likelihood (formal).",
th:"คงจะ; น่าจะ (ทางการ)",
note_en:"The formal cousin of たぶん. Confidence ladder: もしかしたら ＜ たぶん ＜ 恐らく ＜ きっと. Pairs with だろう.",
note_th:"เป็นญาติแบบทางการของ たぶん ลำดับความมั่นใจ: もしかしたら ＜ たぶん ＜ 恐らく ＜ きっと มักใช้คู่กับ だろう",
ex:[{j:"恐らく彼は来ないだろう。",k:"おそらく かれは こないだろう。",e:"In all likelihood he won't come.",t:"เขาคงจะไม่มาหรอก"},
{j:"恐らくこれが最後の機会だ。",k:"おそらく これが さいごの きかいだ。",e:"This is probably the last chance.",t:"นี่คงจะเป็นโอกาสสุดท้าย"}]},

{id:"a415",lv:"N2",cat:"副詞",p:"果たして",conn:"果たして＋疑問文／果たして＋期待通りの結果",
en:"I wonder whether (in a question); or: sure enough (with a result).",
th:"จะ...จริงหรือ (ในคำถาม); หรือ ก็เป็นอย่างที่คิดจริง ๆ (กับผลลัพธ์)",
note_en:"Two uses that look unrelated. With a question it means genuine doubt: 果たして間に合うだろうか. With a past result it means the expectation was confirmed: 果たしてその通りだった.",
note_th:"มีสองความหมายที่ดูไม่เกี่ยวกัน ถ้าใช้กับคำถามคือความสงสัยจริง ๆ เช่น 果たして間に合うだろうか ถ้าใช้กับผลในอดีตคือสิ่งที่คาดไว้เป็นจริง เช่น 果たしてその通りだった",
ex:[{j:"果たして間に合うだろうか。",k:"はたして まにあうだろうか。",e:"I wonder whether we'll really make it.",t:"จะทันจริงหรือเปล่านะ"},
{j:"果たして彼の予想通りになった。",k:"はたして かれの よそうどおりに なった。",e:"Sure enough, it turned out just as he predicted.",t:"ก็เป็นไปตามที่เขาคาดไว้จริง ๆ"}]}
,
{id:"a416",lv:"N2",cat:"副詞",p:"いわゆる",conn:"いわゆる＋N（助詞なし）",
en:"What is called; the so-called.",
th:"ที่เรียกกันว่า",
note_en:"Attaches directly to a noun with no particle. It flags that you are using a label other people use, sometimes with mild distance from it.",
note_th:"ต่อกับคำนามโดยตรงไม่ต้องมีคำช่วย ใช้บอกว่ากำลังใช้คำเรียกที่คนอื่นใช้กัน บางครั้งแฝงระยะห่างเล็กน้อยจากคำนั้น",
ex:[{j:"これがいわゆる「おもてなし」の文化です。",k:"これが いわゆる おもてなしの ぶんか です。",e:"This is what's known as the culture of omotenashi.",t:"นี่คือสิ่งที่เรียกกันว่าวัฒนธรรมโอโมเตนาชิครับ"},
{j:"彼はいわゆる天才タイプだ。",k:"かれは いわゆる てんさい タイプだ。",e:"He's what you'd call the genius type.",t:"เขาเป็นคนประเภทที่เรียกกันว่าอัจฉริยะ"}]},

{id:"a417",lv:"N2",cat:"副詞",p:"わずか / わずかに",conn:"わずか＋数量／わずかに＋V",
en:"Only a tiny amount; barely.",
th:"เพียงน้อยนิด; แค่นิดเดียว",
note_en:"Emphasises how small a quantity is, often with surprise. わずか3日 = a mere three days. Formal; ちょっと is the casual version.",
note_th:"เน้นว่าปริมาณน้อยแค่ไหน มักมีความประหลาดใจ เช่น わずか3日 = แค่ 3 วันเท่านั้น เป็นทางการ ส่วน ちょっと เป็นรูปกันเอง",
ex:[{j:"わずか3か月でN3に合格した。",k:"わずか さんかげつで エヌさんに ごうかく した。",e:"He passed N3 in a mere three months.",t:"สอบ N3 ผ่านในเวลาแค่ 3 เดือนเท่านั้น"},
{j:"痛みがわずかに残っている。",k:"いたみが わずかに のこって いる。",e:"A slight pain remains.",t:"ยังมีความเจ็บหลงเหลืออยู่นิดหน่อย"}]},

{id:"a418",lv:"N2",cat:"副詞",p:"よほど / よっぽど",conn:"よほど＋イA／ナA／〜のだろう",
en:"Must have been quite — inferring a strong degree from evidence.",
th:"คงจะ...มากเลยทีเดียว (อนุมานระดับความเข้มข้นจากหลักฐาน)",
note_en:"You infer intensity from what you can see: よほど疲れていたのだろう = he must have been really tired. よっぽど is the spoken form.",
note_th:"เป็นการอนุมานระดับความเข้มข้นจากสิ่งที่เห็น เช่น よほど疲れていたのだろう = เขาคงจะเหนื่อยมากจริง ๆ ส่วน よっぽど เป็นรูปพูด",
ex:[{j:"よほど疲れていたのだろう、すぐに眠ってしまった。",k:"よほど つかれて いたのだろう、すぐに ねむって しまった。",e:"He must have been exhausted — he fell asleep at once.",t:"คงจะเหนื่อยมากจริง ๆ หลับไปทันทีเลย"},
{j:"よっぽど嬉しかったに違いない。",k:"よっぽど うれしかったに ちがいない。",e:"He must have been really delighted.",t:"ต้องดีใจมากแน่ ๆ เลย"}]},

{id:"a419",lv:"N2",cat:"副詞",p:"直ちに",conn:"直ちに＋V（公的・緊急）",
en:"Immediately, at once (formal and official).",
th:"ทันที; โดยพลัน (ทางการและใช้ในภาวะฉุกเฉิน)",
note_en:"Reserved for announcements, emergencies and official instructions. すぐに is the everyday word; 直ちに carries authority.",
note_th:"ใช้เฉพาะในประกาศ เหตุฉุกเฉิน และคำสั่งทางการ ส่วน すぐに เป็นคำในชีวิตประจำวัน แต่ 直ちに มีน้ำหนักของอำนาจ",
ex:[{j:"直ちに避難してください。",k:"ただちに ひなん して ください。",e:"Please evacuate immediately.",t:"กรุณาอพยพทันทีครับ"},
{j:"直ちに対応いたします。",k:"ただちに たいおう いたします。",e:"We will deal with it at once.",t:"จะดำเนินการทันทีครับ"}]},

{id:"a420",lv:"N2",cat:"副詞",p:"もう少しで",conn:"もう少しで＋V辞書形＋ところだった",
en:"Very nearly; almost — but it did not happen.",
th:"เกือบจะ (แต่ก็ไม่เกิดขึ้น)",
note_en:"Almost always with 〜ところだった. It reports a near miss with relief: もう少しで遅刻するところだった.",
note_th:"มักใช้คู่กับ 〜ところだった เสมอ ใช้รายงานเหตุการณ์หวุดหวิดพร้อมความโล่งใจ เช่น もう少しで遅刻するところだった",
ex:[{j:"もう少しで転ぶところだった。",k:"もう すこしで ころぶ ところ だった。",e:"I very nearly fell over.",t:"เกือบล้มแล้ว"},
{j:"もう少しで完成する。",k:"もう すこしで かんせい する。",e:"It's almost finished.",t:"อีกนิดเดียวก็เสร็จแล้ว"}]},

{id:"a421",lv:"N2",cat:"副詞",p:"幸いなことに / 〜なことに",conn:"イA／ナA／Vた ＋ ことに＋文",
en:"Fortunately; to my surprise — framing the whole sentence with a feeling.",
th:"โชคดีที่; น่าประหลาดใจที่ — ใส่กรอบอารมณ์ให้ทั้งประโยค",
note_en:"A whole family worth learning together: 幸いなことに, 驚いたことに, 残念なことに, 面白いことに. The feeling comes first, the fact follows.",
note_th:"เป็นชุดคำที่ควรจำพร้อมกัน เช่น 幸いなことに 驚いたことに 残念なことに 面白いことに โดยอารมณ์มาก่อน แล้วข้อเท็จจริงตามมา",
ex:[{j:"幸いなことに、けが人はいなかった。",k:"さいわいな ことに、けがにんは いなかった。",e:"Fortunately, nobody was injured.",t:"โชคดีที่ไม่มีผู้บาดเจ็บ"},
{j:"驚いたことに、彼は全部覚えていた。",k:"おどろいた ことに、かれは ぜんぶ おぼえて いた。",e:"To my surprise, he remembered everything.",t:"น่าประหลาดใจที่เขาจำได้ทั้งหมด"}]},

{id:"a422",lv:"N2",cat:"副詞",p:"〜ならまだしも",conn:"N／文 ＋ ならまだしも",
en:"If it were only X, that would be tolerable — but it is not.",
th:"ถ้าแค่ X ก็ยังพอทน — แต่นี่ไม่ใช่",
note_en:"Sets up a comparison where even the bad option would be better than reality. 一度ならまだしも、三度も遅刻した.",
note_th:"ใช้ตั้งการเปรียบเทียบว่าตัวเลือกที่แย่ยังดีกว่าความจริงที่เกิดขึ้น เช่น 一度ならまだしも、三度も遅刻した",
ex:[{j:"一度ならまだしも、三度も遅刻するとは。",k:"いちどなら まだしも、さんども ちこく するとは。",e:"Once would be one thing, but being late three times!",t:"ถ้าครั้งเดียวก็ยังพอทน แต่นี่มาสายตั้งสามครั้ง"},
{j:"子供ならまだしも、大人がそれはひどい。",k:"こどもなら まだしも、おとなが それは ひどい。",e:"For a child perhaps, but from an adult that's awful.",t:"ถ้าเป็นเด็กก็ยังพอทน แต่ผู้ใหญ่ทำแบบนั้นแย่มาก"}]},

{id:"a423",lv:"N2",cat:"接続詞",p:"ちなみに",conn:"文＋。ちなみに＋補足",
en:"By the way; incidentally — adding a related aside.",
th:"อนึ่ง; เสริมอีกนิดว่า",
note_en:"Adds supplementary information related to what you just said. Different from ところで, which changes the subject entirely.",
note_th:"ใช้เสริมข้อมูลที่เกี่ยวข้องกับสิ่งที่เพิ่งพูด ต่างจาก ところで ที่เปลี่ยนหัวข้อไปเลย",
ex:[{j:"会議は3時からです。ちなみに場所は5階です。",k:"かいぎは さんじから です。ちなみに ばしょは ごかい です。",e:"The meeting is from three. Incidentally, it's on the fifth floor.",t:"ประชุมเริ่มบ่ายสามครับ อนึ่ง สถานที่อยู่ชั้น 5"},
{j:"ちなみに、これは無料です。",k:"ちなみに、これは むりょう です。",e:"By the way, this one is free.",t:"เสริมอีกนิด อันนี้ฟรีครับ"}]},

{id:"a424",lv:"N2",cat:"接続詞",p:"あるいは",conn:"N＋あるいは＋N／文",
en:"Or; alternatively (formal).",
th:"หรือ; หรือไม่ก็ (ทางการ)",
note_en:"The written form of または. Unlike それとも, it can join statements as well as questions.",
note_th:"เป็นรูปเขียนของ または ต่างจาก それとも ตรงที่เชื่อมประโยคบอกเล่าได้ด้วย ไม่ใช่แค่คำถาม",
ex:[{j:"メールあるいは電話でご連絡ください。",k:"メール あるいは でんわで ごれんらく ください。",e:"Please contact us by email or telephone.",t:"กรุณาติดต่อทางอีเมลหรือโทรศัพท์ครับ"},
{j:"あるいは彼が正しいのかもしれない。",k:"あるいは かれが ただしいのかも しれない。",e:"Or perhaps he's the one who's right.",t:"หรือไม่ก็อาจเป็นเขาที่ถูกก็ได้"}]},

{id:"a425",lv:"N2",cat:"接続詞",p:"しかも",conn:"文＋。しかも＋文（同方向の追加）",
en:"What's more; and on top of that.",
th:"ยิ่งไปกว่านั้น; แถมยัง",
note_en:"Both halves must point the same way, like 〜上に. 安い。しかもおいしい。 You cannot use it to introduce a contrast.",
note_th:"ทั้งสองส่วนต้องไปทางเดียวกัน เหมือน 〜上に เช่น 安い。しかもおいしい。 ใช้แนะนำการเปรียบเทียบตรงข้ามไม่ได้",
ex:[{j:"この店は安い。しかも味もいい。",k:"この みせは やすい。しかも あじも いい。",e:"This place is cheap. What's more, the food is good.",t:"ร้านนี้ถูก แถมรสชาติยังดีอีก"},
{j:"駅から近い。しかも家賃も安い。",k:"えきから ちかい。しかも やちんも やすい。",e:"It's near the station. What's more, the rent is cheap.",t:"อยู่ใกล้สถานี แถมค่าเช่ายังถูกอีก"}]},

{id:"a426",lv:"N2",cat:"接続詞",p:"その上",conn:"文＋。その上＋文",
en:"Furthermore; in addition.",
th:"นอกจากนั้นแล้ว; ยิ่งไปกว่านั้น",
note_en:"Very close to しかも but slightly more formal and more common in writing. Same rule: both halves point the same way.",
note_th:"ใกล้เคียงกับ しかも มาก แต่เป็นทางการกว่าเล็กน้อยและใช้ในภาษาเขียนบ่อยกว่า กฎเดียวกันคือทั้งสองส่วนต้องไปทางเดียวกัน",
ex:[{j:"道に迷った。その上、雨まで降ってきた。",k:"みちに まよった。そのうえ、あめまで ふって きた。",e:"I got lost. On top of that, it started raining.",t:"หลงทาง นอกจากนั้นฝนยังตกลงมาอีก"},
{j:"彼は優秀だ。その上、努力家でもある。",k:"かれは ゆうしゅうだ。そのうえ、どりょくかでも ある。",e:"He's brilliant, and a hard worker besides.",t:"เขาเก่ง นอกจากนั้นยังเป็นคนขยันอีกด้วย"}]},

{id:"a427",lv:"N2",cat:"接続詞",p:"おまけに",conn:"文＋。おまけに＋文（多くマイナス）",
en:"To make matters worse; and on top of everything.",
th:"ซ้ำร้ายไปกว่านั้น; แถมยัง (มักเป็นเรื่องแย่)",
note_en:"Usually piles on a further misfortune. その上 is neutral; おまけに leans negative and conversational.",
note_th:"มักใช้ซ้ำเติมเรื่องร้ายที่เพิ่มเข้ามา ส่วน その上 เป็นกลาง แต่ おまけに เอนไปทางลบและเป็นภาษาพูด",
ex:[{j:"電車が遅れた。おまけに傘も忘れた。",k:"でんしゃが おくれた。おまけに かさも わすれた。",e:"The train was late. To make it worse, I'd forgotten my umbrella.",t:"รถไฟมาช้า ซ้ำร้ายยังลืมร่มอีก"},
{j:"風邪をひいて、おまけに熱まで出た。",k:"かぜを ひいて、おまけに ねつまで でた。",e:"I caught a cold, and on top of that ran a fever.",t:"เป็นหวัด แถมยังมีไข้อีก"}]},

{id:"a428",lv:"N2",cat:"接続詞",p:"それなのに",conn:"文＋。それなのに＋文",
en:"And yet; in spite of that.",
th:"ทั้ง ๆ ที่เป็นอย่างนั้น แต่กลับ",
note_en:"The sentence-initial version of のに, carrying the same complaint or disappointment. しかし would be neutral by comparison.",
note_th:"เป็นรูป のに ที่วางต้นประโยค แบกอารมณ์บ่นหรือผิดหวังแบบเดียวกัน ถ้าเทียบกับ しかし จะเป็นกลางกว่า",
ex:[{j:"毎日練習した。それなのに、勝てなかった。",k:"まいにち れんしゅう した。それなのに、かてなかった。",e:"I practised every day. And yet I couldn't win.",t:"ซ้อมทุกวันแท้ ๆ แต่กลับชนะไม่ได้"},
{j:"約束したのに。それなのに彼は来なかった。",k:"やくそく したのに。それなのに かれは こなかった。",e:"He promised. And yet he never came.",t:"สัญญาไว้แท้ ๆ แต่กลับไม่มา"}]},

{id:"a429",lv:"N2",cat:"接続詞",p:"それなら / それでは",conn:"相手の発言＋。それなら＋提案",
en:"In that case; if so.",
th:"ถ้าอย่างนั้น",
note_en:"Picks up what the other person just said and proposes something based on it. It is the conversational cousin of なら.",
note_th:"รับสิ่งที่อีกฝ่ายเพิ่งพูดมาแล้วเสนอบางอย่างต่อ เป็นญาติในภาษาพูดของ なら",
ex:[{j:"時間がないんです。それなら、明日にしましょう。",k:"じかんが ないんです。それなら、あしたに しましょう。",e:"I've no time. In that case, let's make it tomorrow.",t:"ไม่มีเวลาครับ ถ้าอย่างนั้นเอาเป็นพรุ่งนี้ดีกว่า"},
{j:"それでは、始めましょうか。",k:"それでは、はじめましょうか。",e:"Well then, shall we begin?",t:"ถ้าอย่างนั้น เริ่มกันเลยไหมครับ"}]},

{id:"a430",lv:"N2",cat:"接続詞",p:"要するに",conn:"文＋。要するに＋要約",
en:"In short; to sum up.",
th:"สรุปแล้วก็คือ; พูดสั้น ๆ ก็คือ",
note_en:"Signals the summary of a long explanation. Stronger and more decisive than つまり — it says 'here is the whole point'.",
note_th:"เป็นสัญญาณว่ากำลังสรุปคำอธิบายที่ยาว หนักแน่นและเด็ดขาดกว่า つまり เพราะบอกว่า 'ประเด็นทั้งหมดคือตรงนี้'",
ex:[{j:"要するに、準備が足りなかったということだ。",k:"ようするに、じゅんびが たりなかったと いう ことだ。",e:"In short, we simply weren't prepared enough.",t:"สรุปแล้วก็คือเตรียมตัวไม่พอนั่นเอง"},
{j:"要するに、毎日続けることが大切だ。",k:"ようするに、まいにち つづける ことが たいせつだ。",e:"To sum up, what matters is keeping at it daily.",t:"สรุปแล้วสิ่งสำคัญคือการทำต่อเนื่องทุกวัน"}]},

{id:"a431",lv:"N2",cat:"接続詞",p:"そう言えば",conn:"会話中＋。そう言えば＋新しい話題",
en:"That reminds me; come to think of it.",
th:"พูดแล้วก็นึกขึ้นได้ว่า",
note_en:"Introduces something you suddenly remembered, prompted by the conversation. A natural and very common way to shift topics politely.",
note_th:"ใช้แนะนำสิ่งที่จู่ ๆ ก็นึกขึ้นได้จากบทสนทนา เป็นวิธีเปลี่ยนหัวข้ออย่างสุภาพที่ใช้บ่อยและธรรมชาติมาก",
ex:[{j:"そう言えば、明日は休みでしたね。",k:"そう いえば、あしたは やすみ でしたね。",e:"That reminds me — tomorrow's a holiday, isn't it?",t:"พูดแล้วนึกขึ้นได้ พรุ่งนี้เป็นวันหยุดนี่นะครับ"},
{j:"そう言えば、彼から連絡がない。",k:"そう いえば、かれから れんらくが ない。",e:"Come to think of it, I haven't heard from him.",t:"พูดแล้วนึกขึ้นได้ เขายังไม่ติดต่อมาเลย"}]},

{id:"a432",lv:"N2",cat:"接続詞",p:"そうすると / そうしたら",conn:"文＋。そうすると＋結果",
en:"And then; if you do that, then.",
th:"แล้วก็; ถ้าทำแบบนั้นแล้วก็",
note_en:"そうすると introduces a logical consequence or a discovery. そうしたら is more casual and often reports what happened next in a story.",
note_th:"そうすると ใช้แนะนำผลตามหลักเหตุผลหรือการค้นพบ ส่วน そうしたら เป็นกันเองกว่าและมักใช้เล่าว่าเกิดอะไรขึ้นต่อในเรื่อง",
ex:[{j:"このボタンを押します。そうすると、切符が出ます。",k:"この ボタンを おします。そうすると、きっぷが でます。",e:"You press this button. Then the ticket comes out.",t:"กดปุ่มนี้ครับ แล้วตั๋วก็จะออกมา"},
{j:"窓を開けた。そうしたら、猫が入ってきた。",k:"まどを あけた。そうしたら、ねこが はいって きた。",e:"I opened the window, and then a cat came in.",t:"เปิดหน้าต่าง แล้วก็มีแมวเดินเข้ามา"}]},

{id:"a433",lv:"N2",cat:"接続詞",p:"それにしても",conn:"文＋。それにしても＋感想",
en:"Even so; all the same — pausing to remark on something striking.",
th:"ถึงอย่างนั้นก็เถอะ; ว่าแต่ว่า",
note_en:"Accepts what was said, then adds an impressed or exasperated comment. それにしても暑いですね is a natural conversational filler.",
note_th:"ยอมรับสิ่งที่พูดไปแล้ว จากนั้นเสริมความเห็นที่ทึ่งหรือเอือมระอา เช่น それにしても暑いですね เป็นคำเชื่อมบทสนทนาที่ธรรมชาติมาก",
ex:[{j:"それにしても、今日は暑いですね。",k:"それにしても、きょうは あついですね。",e:"All the same, it really is hot today, isn't it?",t:"ถึงอย่างนั้นก็เถอะ วันนี้ร้อนจริง ๆ นะครับ"},
{j:"それにしても、彼はよく働くね。",k:"それにしても、かれは よく はたらくね。",e:"Even so, he really does work hard.",t:"ว่าแต่ว่า เขาขยันทำงานจริง ๆ นะ"}]},

{id:"a434",lv:"N2",cat:"接続詞",p:"及び / 並びに",conn:"N＋及び＋N（公文書）",
en:"And; as well as (official documents).",
th:"และ; ตลอดจน (เอกสารราชการ)",
note_en:"Strictly for lists in formal documents, forms and regulations. Never in conversation — と or や would be used there.",
note_th:"ใช้เฉพาะการแจกแจงในเอกสารทางการ แบบฟอร์ม และระเบียบข้อบังคับ ไม่ใช้ในบทสนทนาเด็ดขาด กรณีนั้นใช้ と หรือ や",
ex:[{j:"氏名及び住所をご記入ください。",k:"しめい および じゅうしょを ごきにゅう ください。",e:"Please fill in your name and address.",t:"กรุณากรอกชื่อและที่อยู่ครับ"},
{j:"社員及び家族が対象です。",k:"しゃいん および かぞくが たいしょう です。",e:"Employees and their families are eligible.",t:"พนักงานและครอบครัวเป็นผู้มีสิทธิ์ครับ"}]},

{id:"a435",lv:"N2",cat:"接続詞",p:"というのは（〜からだ）",conn:"文＋。というのは＋理由＋からだ",
en:"The reason being that; you see, it's because.",
th:"ที่เป็นอย่างนั้นก็เพราะว่า",
note_en:"Explains a reason after stating the fact, closing with からだ. Softer and more conversational than なぜなら.",
note_th:"ใช้อธิบายเหตุผลหลังจากบอกข้อเท็จจริงไปแล้ว ลงท้ายด้วย からだ นุ่มและเป็นภาษาพูดมากกว่า なぜなら",
ex:[{j:"今日は行けません。というのは、仕事が入ったからです。",k:"きょうは いけません。というのは、しごとが はいったから です。",e:"I can't go today — you see, work came up.",t:"วันนี้ไปไม่ได้ครับ ที่เป็นอย่างนั้นก็เพราะมีงานเข้ามา"},
{j:"彼は来ないだろう。というのは、体調が悪いからだ。",k:"かれは こないだろう。というのは、たいちょうが わるいからだ。",e:"He probably won't come — the reason being he's unwell.",t:"เขาคงไม่มา ที่เป็นอย่างนั้นก็เพราะร่างกายไม่สบาย"}]}
,
{id:"b301",lv:"N3",cat:"伝聞・推量",p:"〜ような気がする",conn:"V普通形／イA／ナA な／N の ＋ ような気がする",
en:"I have a feeling that; it feels as though.",
th:"รู้สึกว่า; รู้สึกเหมือนว่า",
note_en:"A hunch, not evidence. Weaker than 〜と思う — you are reporting an impression you cannot justify. Very common when softening an opinion.",
note_th:"เป็นความรู้สึกลาง ๆ ไม่ใช่หลักฐาน เบากว่า 〜と思う เพราะเป็นการบอกความรู้สึกที่อธิบายเหตุผลไม่ได้ ใช้บ่อยมากตอนพูดความเห็นให้นุ่มลง",
ex:[{j:"どこかで会ったような気がします。",k:"どこかで あった ような きが します。",e:"I have a feeling we've met somewhere.",t:"รู้สึกเหมือนเคยเจอกันที่ไหนสักแห่งครับ"},
{j:"最近、少し上達したような気がする。",k:"さいきん、すこし じょうたつ した ような きが する。",e:"I feel like I've improved a little lately.",t:"ช่วงนี้รู้สึกว่าเก่งขึ้นมานิดหน่อย"}]},

{id:"b302",lv:"N3",cat:"伝聞・推量",p:"〜ように見える",conn:"V普通形／イA／ナA な／N の ＋ ように見える",
en:"Looks as if; appears to be.",
th:"ดูเหมือนว่า; มองแล้วเหมือน",
note_en:"Strictly about visual impression. 〜そうだ judges from appearance too, but ように見える explicitly names seeing as the source.",
note_th:"เกี่ยวกับสิ่งที่ตาเห็นโดยเฉพาะ ส่วน 〜そうだ ก็ตัดสินจากภายนอกเหมือนกัน แต่ ように見える ระบุชัดว่าแหล่งที่มาคือการมองเห็น",
ex:[{j:"彼は元気なように見えるが、実は疲れている。",k:"かれは げんきな ように みえるが、じつは つかれて いる。",e:"He looks well, but he's actually tired.",t:"เขาดูเหมือนสดใส แต่จริง ๆ แล้วเหนื่อยอยู่"},
{j:"この問題は簡単なように見える。",k:"この もんだいは かんたんな ように みえる。",e:"This problem looks easy.",t:"ปัญหานี้ดูเหมือนจะง่าย"}]},

{id:"b303",lv:"N3",cat:"意志・希望",p:"〜(よ)うとしない",conn:"V意志形＋としない",
en:"Refuses to; makes no attempt to.",
th:"ไม่ยอมจะ; ไม่พยายามจะ",
note_en:"The negative of 〜ようとする, and it carries criticism. It says the person could act but chooses not to: 話を聞こうとしない.",
note_th:"เป็นรูปปฏิเสธของ 〜ようとする และแฝงการตำหนิ สื่อว่าคนนั้นทำได้แต่เลือกที่จะไม่ทำ เช่น 話を聞こうとしない",
ex:[{j:"彼は人の話を聞こうとしない。",k:"かれは ひとの はなしを きこうと しない。",e:"He refuses to listen to anyone.",t:"เขาไม่ยอมฟังคนอื่นเลย"},
{j:"子供が薬を飲もうとしない。",k:"こどもが くすりを のもうと しない。",e:"The child won't take the medicine.",t:"เด็กไม่ยอมกินยา"}]},

{id:"b304",lv:"N3",cat:"伝聞・推量",p:"〜そうもない / 〜そうにない",conn:"Vます形＋そうもない・そうにない",
en:"Shows no sign of; very unlikely to happen.",
th:"ไม่มีวี่แววว่าจะ; ท่าทางจะไม่",
note_en:"The negative of appearance-そうだ. 雨がやみそうもない = there's no sign of the rain stopping. Note it is not 〜なさそう, which negates the adjective instead.",
note_th:"เป็นรูปปฏิเสธของ そうだ แบบดูเหมือน เช่น 雨がやみそうもない = ไม่มีวี่แววว่าฝนจะหยุด สังเกตว่าไม่ใช่ 〜なさそう ซึ่งเป็นการปฏิเสธคำคุณศัพท์แทน",
ex:[{j:"この雨はやみそうもない。",k:"この あめは やみそうも ない。",e:"This rain shows no sign of stopping.",t:"ฝนนี้ไม่มีวี่แววว่าจะหยุดเลย"},
{j:"今日中には終わりそうにない。",k:"きょうじゅうには おわりそうに ない。",e:"It doesn't look like finishing today.",t:"ท่าทางจะไม่เสร็จภายในวันนี้"}]},

{id:"b305",lv:"N3",cat:"意志・希望",p:"〜つもりだった / 〜つもりで",conn:"V辞書形＋つもりだった／〜つもりで＋V",
en:"つもりだった = I had intended to (but didn't). つもりで = acting as if / with the intention of.",
th:"つもりだった = เคยตั้งใจจะ (แต่ไม่ได้ทำ) ส่วน つもりで = ทำราวกับว่า / ด้วยความตั้งใจว่า",
note_en:"つもりだった almost always implies the plan failed. つもりで sets a mindset you adopt: 新人のつもりで働く = work as though you were a newcomer.",
note_th:"つもりだった มักสื่อว่าแผนไม่สำเร็จ ส่วน つもりで ใช้กำหนดกรอบความคิดที่เราสวมเข้าไป เช่น 新人のつもりで働く = ทำงานราวกับว่าเป็นพนักงานใหม่",
ex:[{j:"早く帰るつもりだったが、残業になった。",k:"はやく かえる つもり だったが、ざんぎょうに なった。",e:"I'd intended to go home early, but ended up working late.",t:"ตั้งใจว่าจะกลับเร็ว แต่กลายเป็นต้องทำโอที"},
{j:"新人のつもりで一から勉強します。",k:"しんじんの つもりで いちから べんきょう します。",e:"I'll study from scratch as though I were a beginner.",t:"จะเรียนใหม่ตั้งแต่ต้นราวกับว่าเป็นมือใหม่ครับ"}]},

{id:"b306",lv:"N3",cat:"義務・許可",p:"〜てごらん",conn:"Vて＋ごらん（なさい）",
en:"Try doing it — a gentle instruction to someone below you.",
th:"ลองทำดูสิ — คำแนะนำอ่อนโยนต่อผู้ที่อายุน้อยกว่า",
note_en:"Softer than 〜なさい but still downward-facing: adults say it to children, teachers to students. Never use it to a superior or a customer.",
note_th:"นุ่มกว่า 〜なさい แต่ยังเป็นการพูดจากบนลงล่าง ผู้ใหญ่พูดกับเด็ก ครูพูดกับนักเรียน ห้ามใช้กับผู้ใหญ่กว่าหรือลูกค้าเด็ดขาด",
ex:[{j:"ちょっと食べてごらん。おいしいよ。",k:"ちょっと たべて ごらん。おいしいよ。",e:"Go on, try a bite. It's good.",t:"ลองชิมดูสิ อร่อยนะ"},
{j:"もう一度読んでごらんなさい。",k:"もういちど よんで ごらんなさい。",e:"Try reading it once more.",t:"ลองอ่านอีกครั้งดูสิ"}]},

{id:"b307",lv:"N3",cat:"評価・判断",p:"〜てもしょうがない / 〜ても仕方がない",conn:"Vて＋もしょうがない",
en:"There's no point doing it; it can't be helped.",
th:"ทำไปก็เท่านั้น; ทำไปก็ไม่มีประโยชน์",
note_en:"Says the action would change nothing, so stop. Distinguish from 〜てしょうがない (without も), which means 'unbearably' — one particle flips the meaning entirely.",
note_th:"บอกว่าทำไปก็ไม่เปลี่ยนอะไร ดังนั้นเลิกเถอะ ต้องแยกจาก 〜てしょうがない (ไม่มี も) ซึ่งแปลว่า 'เหลือเกิน' คำช่วยตัวเดียวเปลี่ยนความหมายทั้งหมด",
ex:[{j:"今さら後悔してもしょうがない。",k:"いまさら こうかい しても しょうが ない。",e:"There's no point regretting it now.",t:"ตอนนี้จะมาเสียใจก็ไม่มีประโยชน์แล้ว"},
{j:"心配しても仕方がないよ。",k:"しんぱい しても しかたが ないよ。",e:"There's no use worrying.",t:"กังวลไปก็เท่านั้นแหละ"}]},

{id:"b308",lv:"N3",cat:"接続・助詞",p:"〜か何か",conn:"N＋か何か",
en:"Or something like that.",
th:"หรืออะไรทำนองนั้น",
note_en:"Vague listing when the exact item doesn't matter. Also 誰か何か, どこか — the か family all soften specificity.",
note_th:"ใช้แจกแจงแบบคลุมเครือเมื่อสิ่งนั้นไม่สำคัญว่าคืออะไรแน่ และตระกูล か ทั้งหมด เช่น 誰か どこか ก็ทำให้ความเจาะจงนุ่มลงเหมือนกัน",
ex:[{j:"お茶か何か飲みませんか。",k:"おちゃか なにか のみませんか。",e:"Would you like tea or something?",t:"ดื่มชาหรืออะไรสักอย่างไหมครับ"},
{j:"風邪か何かでしょう。",k:"かぜか なにか でしょう。",e:"It's probably a cold or something.",t:"คงเป็นหวัดหรืออะไรทำนองนั้นแหละครับ"}]},

{id:"b309",lv:"N3",cat:"接続・助詞",p:"〜に代わって / 〜に代わり",conn:"N＋にかわって",
en:"On behalf of; in place of.",
th:"แทน; ในนามของ",
note_en:"Someone or something takes over another's role. Different from 〜の代わりに, which is a broader swap; に代わって leans formal and often means representing.",
note_th:"คนหรือสิ่งหนึ่งเข้ามาทำหน้าที่แทนอีกฝ่าย ต่างจาก 〜の代わりに ที่เป็นการแลกเปลี่ยนกว้าง ๆ ส่วน に代わって เป็นทางการและมักแปลว่าเป็นตัวแทน",
ex:[{j:"社長に代わって、私がご挨拶します。",k:"しゃちょうに かわって、わたしが ごあいさつ します。",e:"On behalf of the president, I'll say a few words.",t:"ผมขอกล่าวทักทายแทนท่านประธานครับ"},
{j:"人に代わってロボットが働く時代だ。",k:"ひとに かわって ロボットが はたらく じだいだ。",e:"It's an age where robots work in place of people.",t:"เป็นยุคที่หุ่นยนต์ทำงานแทนคน"}]},

{id:"b310",lv:"N3",cat:"接続・助詞",p:"〜のでしょうか / 〜んでしょうか",conn:"普通形＋のでしょうか",
en:"I wonder if — a softened, polite question.",
th:"ไม่ทราบว่า...หรือเปล่าครับ — คำถามที่ทำให้นุ่มและสุภาพ",
note_en:"Adding の before でしょうか makes a direct question much gentler. In customer service this is standard: どちらがよろしいのでしょうか.",
note_th:"การเติม の หน้า でしょうか ทำให้คำถามตรง ๆ นุ่มลงมาก ในงานบริการลูกค้าถือเป็นมาตรฐาน เช่น どちらがよろしいのでしょうか",
ex:[{j:"どうすればよろしいのでしょうか。",k:"どう すれば よろしいのでしょうか。",e:"What would be the best thing to do?",t:"ไม่ทราบว่าควรทำอย่างไรดีครับ"},
{j:"何か問題があるのでしょうか。",k:"なにか もんだいが あるのでしょうか。",e:"Is there some problem, I wonder?",t:"ไม่ทราบว่ามีปัญหาอะไรหรือเปล่าครับ"}]},

{id:"b311",lv:"N3",cat:"伝聞・推量",p:"〜んだって / 〜だって",conn:"普通形＋んだって（会話）",
en:"I hear that (very casual).",
th:"ได้ยินมาว่า (ภาษาพูดกันเองมาก)",
note_en:"The friends-only version of そうだ. Never at work. Note だって at the start of a sentence means 'but/because', a different word entirely.",
note_th:"เป็นรูปที่ใช้กับเพื่อนเท่านั้นของ そうだ ห้ามใช้ในที่ทำงาน สังเกตว่า だって ที่ต้นประโยคแปลว่า 'แต่/เพราะ' ซึ่งเป็นคนละคำกัน",
ex:[{j:"あの店、閉店するんだって。",k:"あの みせ、へいてん するんだって。",e:"I hear that shop is closing down.",t:"ได้ยินมาว่าร้านนั้นจะปิดตัวลง"},
{j:"明日は雨だって。",k:"あしたは あめだって。",e:"They say it'll rain tomorrow.",t:"ได้ยินว่าพรุ่งนี้ฝนจะตก"}]},

{id:"b312",lv:"N3",cat:"接続・助詞",p:"〜ずつ",conn:"数量詞＋ずつ",
en:"Each; at a time; in increments of.",
th:"คนละ; ครั้งละ; ทีละ",
note_en:"Distributes a quantity evenly. 少しずつ (little by little) is the phrase you'll use most about your own studying.",
note_th:"ใช้แบ่งปริมาณอย่างเท่า ๆ กัน วลี 少しずつ (ทีละนิด) คือวลีที่จะได้ใช้บ่อยที่สุดในการพูดถึงการเรียนของตัวเอง",
ex:[{j:"毎日少しずつ文法を覚えています。",k:"まいにち すこしずつ ぶんぽうを おぼえて います。",e:"I'm learning grammar little by little every day.",t:"จำไวยากรณ์ทีละนิดทุกวันครับ"},
{j:"一人に二枚ずつ配ってください。",k:"ひとりに にまいずつ くばって ください。",e:"Please hand out two sheets each.",t:"กรุณาแจกคนละ 2 แผ่นครับ"}]},

{id:"b313",lv:"N3",cat:"程度・比較",p:"〜よりも / 〜よりむしろ",conn:"N／V普通形 ＋ よりも",
en:"More than; rather than.",
th:"มากกว่า; แทนที่จะ",
note_en:"よりも is より with emphasis added by も. Combine with むしろ for a stronger correction: 話すよりむしろ聞くほうが大事だ.",
note_th:"よりも คือ より ที่เน้นด้วย も ถ้าใช้คู่กับ むしろ จะเป็นการแก้ที่หนักแน่นขึ้น เช่น 話すよりむしろ聞くほうが大事だ",
ex:[{j:"去年よりも寒いですね。",k:"きょねん よりも さむいですね。",e:"It's colder than last year, isn't it?",t:"หนาวกว่าปีที่แล้วนะครับ"},
{j:"量よりも質が大切だ。",k:"りょう よりも しつが たいせつだ。",e:"Quality matters more than quantity.",t:"คุณภาพสำคัญกว่าปริมาณ"}]},

{id:"b314",lv:"N3",cat:"時・順序",p:"〜途中で / 〜途中に",conn:"V辞書形／N の ＋ とちゅうで",
en:"On the way; midway through.",
th:"ระหว่างทาง; ตอนกลางคัน",
note_en:"Physical journeys (帰る途中で) or ongoing processes (仕事の途中で). で marks where something else happened; に marks the point in time.",
note_th:"ใช้กับการเดินทางจริง (帰る途中で) หรือกระบวนการที่กำลังดำเนินอยู่ (仕事の途中で) โดย で ระบุจุดที่มีอย่างอื่นเกิดขึ้น ส่วน に ระบุจุดของเวลา",
ex:[{j:"帰る途中で雨に降られた。",k:"かえる とちゅうで あめに ふられた。",e:"I got caught in the rain on the way home.",t:"โดนฝนตกใส่ระหว่างทางกลับบ้าน"},
{j:"話の途中で電話が鳴った。",k:"はなしの とちゅうで でんわが なった。",e:"The phone rang midway through our talk.",t:"โทรศัพท์ดังขึ้นตอนกำลังคุยกันอยู่กลางคัน"}]},

{id:"b315",lv:"N3",cat:"条件・仮定",p:"もしも〜たら / 万一〜たら",conn:"もしも・万一＋Vた＋ら",
en:"If by any chance; in the unlikely event that.",
th:"หากบังเอิญว่า; ในกรณีที่ไม่คาดคิด",
note_en:"もしも is もし intensified — a more remote hypothetical. 万一 is the formal version used in warnings and instructions: 万一の場合は.",
note_th:"もしも คือ もし ที่เน้นขึ้น เป็นสมมติที่ห่างไกลกว่า ส่วน 万一 เป็นรูปทางการที่ใช้ในคำเตือนและคำแนะนำ เช่น 万一の場合は",
ex:[{j:"もしも私が日本人だったら、と考えることがある。",k:"もしも わたしが にほんじん だったら、と かんがえる ことが ある。",e:"Sometimes I think, what if I were Japanese.",t:"บางครั้งก็คิดว่า หากฉันเป็นคนญี่ปุ่นล่ะ"},
{j:"万一遅れる場合は、必ずご連絡ください。",k:"まんいち おくれる ばあいは、かならず ごれんらく ください。",e:"In the unlikely event you're delayed, be sure to contact us.",t:"ในกรณีที่อาจมาสาย กรุณาติดต่อมาด้วยนะครับ"}]}
,
{id:"b401",lv:"N2",cat:"評価・判断",p:"〜ても始まらない",conn:"Vて＋も始まらない",
en:"It's no use doing it; nothing will come of it.",
th:"ทำไปก็ไม่เริ่มอะไรขึ้นมา; ทำไปก็เปล่าประโยชน์",
note_en:"Stronger and more final than 〜てもしょうがない. It says the action cannot even begin to help, so redirect your energy.",
note_th:"หนักแน่นและเด็ดขาดกว่า 〜てもしょうがない เพราะบอกว่าการกระทำนั้นช่วยอะไรไม่ได้เลยแม้แต่จะเริ่ม ให้เอาแรงไปทำอย่างอื่น",
ex:[{j:"今さら文句を言っても始まらない。",k:"いまさら もんくを いっても はじまらない。",e:"Complaining now won't get us anywhere.",t:"ตอนนี้จะมาบ่นก็ไม่ได้อะไรขึ้นมา"},
{j:"悩んでいても始まらないから、行動しよう。",k:"なやんで いても はじまらないから、こうどう しよう。",e:"Worrying gets us nowhere, so let's act.",t:"กังวลไปก็ไม่ได้อะไร ลงมือทำกันเถอะ"}]},

{id:"b402",lv:"N2",cat:"評価・判断",p:"〜ている場合ではない",conn:"Vている＋場合ではない",
en:"This is no time to be doing that.",
th:"ไม่ใช่เวลาที่จะมามัวทำแบบนั้น",
note_en:"Close to 〜どころではない but sharper and more urgent — it rebukes the current behaviour rather than just noting impossibility.",
note_th:"ใกล้เคียงกับ 〜どころではない แต่คมและเร่งด่วนกว่า เพราะเป็นการตำหนิพฤติกรรมตอนนี้ ไม่ใช่แค่บอกว่าเป็นไปไม่ได้",
ex:[{j:"笑っている場合じゃないよ。",k:"わらって いる ばあいじゃ ないよ。",e:"This is no time to be laughing.",t:"ไม่ใช่เวลามานั่งหัวเราะนะ"},
{j:"試験前だ。遊んでいる場合ではない。",k:"しけんまえだ。あそんで いる ばあいでは ない。",e:"The exam's coming. No time to be playing around.",t:"ใกล้สอบแล้ว ไม่ใช่เวลามาเล่นสนุก"}]},

{id:"b403",lv:"N2",cat:"評価・判断",p:"〜てばかりはいられない",conn:"Vて＋ばかりはいられない",
en:"I can't just keep doing this.",
th:"จะเอาแต่ทำแบบนี้อยู่ไม่ได้",
note_en:"Combines 〜てばかりいる (does nothing but) with 〜てはいられない (can't afford to). It marks the moment you decide to stop and move.",
note_th:"เป็นการรวม 〜てばかりいる (เอาแต่ทำ) กับ 〜てはいられない (จะมัวทำอยู่ไม่ได้) ใช้ระบุจังหวะที่ตัดสินใจหยุดแล้วลงมือ",
ex:[{j:"落ち込んでばかりはいられない。",k:"おちこんで ばかりは いられない。",e:"I can't just keep feeling sorry for myself.",t:"จะเอาแต่ห่อเหี่ยวอยู่ไม่ได้"},
{j:"休んでばかりはいられないので、そろそろ始めます。",k:"やすんで ばかりは いられないので、そろそろ はじめます。",e:"I can't just keep resting, so I'll get started.",t:"จะเอาแต่พักอยู่ไม่ได้ ใกล้จะเริ่มแล้วครับ"}]},

{id:"b404",lv:"N2",cat:"慣用・書き言葉",p:"〜ふうに",conn:"こんな／そんな／どんな ＋ ふうに",
en:"In such a way; like this.",
th:"ในลักษณะแบบนั้น; แบบนี้",
note_en:"Describes a manner rather than a thing. こんなふうに = like this. Also 〜というふうに for reporting how something was expressed.",
note_th:"ใช้บรรยายลักษณะวิธี ไม่ใช่ตัวสิ่งของ เช่น こんなふうに = แบบนี้ และ 〜というふうに ใช้รายงานว่าสิ่งนั้นถูกแสดงออกอย่างไร",
ex:[{j:"こんなふうに書けばいいですか。",k:"こんな ふうに かけば いいですか。",e:"Should I write it like this?",t:"เขียนแบบนี้ได้ไหมครับ"},
{j:"彼はいつもそんなふうに考える。",k:"かれは いつも そんな ふうに かんがえる。",e:"He always thinks in that sort of way.",t:"เขาคิดในแบบนั้นเสมอ"}]},

{id:"b405",lv:"N2",cat:"立場・観点",p:"〜の上では",conn:"N＋のうえでは",
en:"According to; on paper (though reality may differ).",
th:"ตามที่ระบุไว้ใน; ในทางทฤษฎี (แต่ความจริงอาจต่าง)",
note_en:"Almost always sets up a contrast with reality: 暦の上では春だが、まだ寒い. Spot it and you know a 'but' is coming.",
note_th:"มักตั้งการเปรียบเทียบกับความเป็นจริงเสมอ เช่น 暦の上では春だが、まだ寒い ถ้าเห็นก็รู้ได้ว่า 'แต่' กำลังจะตามมา",
ex:[{j:"暦の上では春だが、まだ寒い。",k:"こよみの うえでは はるだが、まだ さむい。",e:"On the calendar it's spring, but it's still cold.",t:"ตามปฏิทินเป็นฤดูใบไม้ผลิแล้ว แต่ก็ยังหนาวอยู่"},
{j:"数字の上では改善している。",k:"すうじの うえでは かいぜん して いる。",e:"On paper the figures have improved.",t:"ในแง่ตัวเลขถือว่าดีขึ้น"}]},

{id:"b406",lv:"N2",cat:"立場・観点",p:"〜は別として / 〜は別にして",conn:"N＋はべつとして",
en:"Apart from; leaving X aside.",
th:"ยกเว้น X ไว้; ไม่นับ X",
note_en:"Close to はともかく but more neutral — it excludes an item from consideration rather than postponing it as less urgent.",
note_th:"ใกล้เคียงกับ はともかく แต่เป็นกลางกว่า เพราะเป็นการกันสิ่งนั้นออกจากการพิจารณา ไม่ใช่พักไว้เพราะด่วนน้อยกว่า",
ex:[{j:"値段は別として、品質はいい。",k:"ねだんは べつと して、ひんしつは いい。",e:"Price aside, the quality is good.",t:"ไม่นับเรื่องราคา คุณภาพถือว่าดี"},
{j:"結果は別にして、努力は認めるべきだ。",k:"けっかは べつに して、どりょくは みとめる べきだ。",e:"Whatever the result, the effort deserves recognition.",t:"ไม่นับผลลัพธ์ ความพยายามก็ควรได้รับการยอมรับ"}]},

{id:"b407",lv:"N2",cat:"逆接・対比",p:"〜くせして",conn:"V普通形／イA／ナA な／N の ＋ くせして",
en:"Although — even ruder than くせに.",
th:"ทั้ง ๆ ที่ — หยาบกว่า くせに อีก",
note_en:"The most colloquial member of the くせに family. Recognise it in dramas and casual speech, but there is no situation at work where you should say it.",
note_th:"เป็นสมาชิกที่เป็นภาษาพูดที่สุดในตระกูล くせに ให้ฟังออกในละครและบทสนทนากันเอง แต่ไม่มีสถานการณ์ใดในที่ทำงานที่ควรพูดคำนี้",
ex:[{j:"知っているくせして、教えてくれない。",k:"しって いる くせして、おしえて くれない。",e:"He knows full well and still won't tell me.",t:"รู้อยู่แท้ ๆ แต่ก็ไม่ยอมบอก"},
{j:"下手なくせして、偉そうに言う。",k:"へたな くせして、えらそうに いう。",e:"He's bad at it and still talks big.",t:"ทำไม่เก่งแท้ ๆ แต่ก็พูดจาวางท่า"}]},

{id:"b408",lv:"N2",cat:"条件",p:"〜ては〜ては / 〜ては",conn:"Vて＋は＋V（繰り返し）",
en:"Repeatedly doing X and then Y, over and over.",
th:"ทำ X แล้ว Y สลับกันไปมาซ้ำ ๆ",
note_en:"Depicts a cycle repeating. 書いては消し、書いては消し = writing and erasing, again and again. Often conveys weariness at the repetition.",
note_th:"ใช้บรรยายวงจรที่วนซ้ำ เช่น 書いては消し、書いては消し = เขียนแล้วลบ เขียนแล้วลบ ซ้ำไปซ้ำมา มักสื่อความเหนื่อยล้าจากการทำซ้ำ",
ex:[{j:"書いては消し、書いては消しを繰り返した。",k:"かいては けし、かいては けしを くりかえした。",e:"I wrote and erased, wrote and erased, over and over.",t:"เขียนแล้วลบ เขียนแล้วลบ วนไปวนมา"},
{j:"寝ては起き、寝ては起きで、よく眠れなかった。",k:"ねては おき、ねては おきで、よく ねむれなかった。",e:"I kept dropping off and waking again, and slept badly.",t:"หลับแล้วตื่น หลับแล้วตื่น เลยนอนไม่ค่อยหลับ"}]},

{id:"b409",lv:"N2",cat:"目的・手段",p:"〜てはいけないから / 〜ないように",conn:"Vて＋はいけないから／Vない＋ように",
en:"So that X does not happen; to avoid X.",
th:"เพื่อไม่ให้ X เกิดขึ้น; เพื่อเลี่ยง X",
note_en:"Both give a preventive purpose. 〜ないように is the standard written form; 〜てはいけないから is more conversational reasoning.",
note_th:"ทั้งคู่บอกจุดประสงค์เชิงป้องกัน โดย 〜ないように เป็นรูปเขียนมาตรฐาน ส่วน 〜てはいけないから เป็นการให้เหตุผลแบบภาษาพูดมากกว่า",
ex:[{j:"遅れてはいけないから、早めに出ます。",k:"おくれては いけないから、はやめに でます。",e:"I'll leave early so as not to be late.",t:"ออกเร็วหน่อย เพราะจะได้ไม่สาย"},
{j:"忘れないように、メモしておきます。",k:"わすれない ように、メモして おきます。",e:"I'll make a note so I don't forget.",t:"จะจดไว้ เพื่อจะได้ไม่ลืม"}]},

{id:"b410",lv:"N2",cat:"敬語",p:"〜たまえ",conn:"Vます形＋たまえ（男性・目上から）",
en:"Do it — an old-fashioned command from a superior man.",
th:"จงทำ — คำสั่งแบบเก่าจากผู้ชายที่มีตำแหน่งสูงกว่า",
note_en:"Archaic and now almost exclusively literary. You will meet it in novels and period drama; you will never need to say it. Recognition only.",
note_th:"เป็นภาษาโบราณ ปัจจุบันเกือบใช้เฉพาะในวรรณกรรม จะเจอในนิยายและละครย้อนยุค แต่ไม่มีความจำเป็นต้องพูดเอง แค่อ่านออกก็พอ",
ex:[{j:"まあ、座りたまえ。",k:"まあ、すわりたまえ。",e:"Well, do sit down.",t:"เอ้า นั่งลงเถอะ"},
{j:"少し休みたまえ。",k:"すこし やすみたまえ。",e:"Take a little rest.",t:"พักสักหน่อยเถอะ"}]},

{id:"b411",lv:"N2",cat:"名詞化・引用",p:"〜と言うと / 〜というと",conn:"N／普通形 ＋ というと",
en:"Speaking of; when you mention X.",
th:"พอพูดถึง X ก็",
note_en:"Picks up a word the other person said and develops it. といえば is nearly identical; というと leans slightly more toward confirming what you heard.",
note_th:"หยิบคำที่อีกฝ่ายพูดมาขยายต่อ ส่วน といえば เกือบเหมือนกัน แต่ というと เอนไปทางการยืนยันสิ่งที่ได้ยินมากกว่าเล็กน้อย",
ex:[{j:"京都というと、やはりお寺ですね。",k:"きょうとと いうと、やはり おてら ですね。",e:"When you say Kyoto, it has to be the temples.",t:"พอพูดถึงเกียวโต ก็ต้องวัดสินะครับ"},
{j:"田中さんというと、あの背の高い方ですか。",k:"たなかさんと いうと、あの せの たかい かた ですか。",e:"By Tanaka-san, do you mean that tall gentleman?",t:"ที่ว่าคุณทานากะ หมายถึงคนที่ตัวสูงคนนั้นหรือเปล่าครับ"}]},

{id:"b412",lv:"N2",cat:"接続詞",p:"だけど / でも / けれども",conn:"文＋。だけど＋文",
en:"But; however (casual to neutral).",
th:"แต่ (ตั้งแต่กันเองไปจนถึงกลาง ๆ)",
note_en:"Formality ladder: だけど・でも (casual) ＜ けれども (neutral) ＜ しかし (formal) ＜ ところが (formal, surprise). Choose by who you're speaking to.",
note_th:"ลำดับความเป็นทางการ: だけど・でも (กันเอง) ＜ けれども (กลาง ๆ) ＜ しかし (ทางการ) ＜ ところが (ทางการ เหนือคาด) ให้เลือกตามคู่สนทนา",
ex:[{j:"疲れた。だけど、もう少し頑張る。",k:"つかれた。だけど、もう すこし がんばる。",e:"I'm tired. But I'll push on a bit more.",t:"เหนื่อยแล้ว แต่จะสู้ต่ออีกหน่อย"},
{j:"難しいですけれども、面白いです。",k:"むずかしいですけれども、おもしろいです。",e:"It's difficult, but it's interesting.",t:"ยากก็จริง แต่ก็น่าสนใจครับ"}]},

{id:"b413",lv:"N2",cat:"接続・助詞",p:"〜じゃない / 〜ではないか",conn:"普通形＋じゃない（上昇調＝確認）",
en:"Isn't it? — seeking agreement or pointing something out.",
th:"ใช่ไหมล่ะ — ขอความเห็นพ้องหรือชี้ให้เห็น",
note_en:"Said with rising intonation it confirms; with falling intonation it can be an accusation. ではないか is the formal written equivalent used in essays.",
note_th:"ถ้าออกเสียงสูงท้ายประโยคคือการยืนยัน ถ้าเสียงตกอาจเป็นการตำหนิ ส่วน ではないか เป็นรูปเขียนทางการที่ใช้ในเรียงความ",
ex:[{j:"すごいじゃない！よく頑張ったね。",k:"すごいじゃない！よく がんばったね。",e:"That's amazing! You really worked hard.",t:"เก่งมากเลยนี่ พยายามได้ดีมากเลยนะ"},
{j:"これこそ本当の問題ではないか。",k:"これこそ ほんとうの もんだいでは ないか。",e:"Is this not the real problem?",t:"นี่ต่างหากที่เป็นปัญหาที่แท้จริงไม่ใช่หรือ"}]},

{id:"b414",lv:"N2",cat:"程度・比例",p:"〜一方で",conn:"V普通形／N である ＋ 一方で",
en:"While on the one hand; meanwhile.",
th:"ในขณะที่อีกด้านหนึ่ง; ในเวลาเดียวกัน",
note_en:"Also marks two things happening in parallel, not only contrast: 働く一方で勉強も続けた. Watch for this second, less-taught use.",
note_th:"ยังใช้บอกสองสิ่งที่เกิดขึ้นคู่ขนานกันได้ ไม่ใช่แค่การเปรียบเทียบ เช่น 働く一方で勉強も続けた ให้ระวังความหมายที่สองนี้ซึ่งมักไม่ค่อยมีคนสอน",
ex:[{j:"働く一方で、勉強も続けている。",k:"はたらく いっぽうで、べんきょうも つづけて いる。",e:"While working, I'm also keeping up my studies.",t:"ทำงานไปด้วย และก็เรียนต่อไปด้วย"},
{j:"便利になる一方で、失うものもある。",k:"べんりに なる いっぽうで、うしなう ものも ある。",e:"While things grow more convenient, some things are lost.",t:"ในขณะที่สะดวกขึ้น ก็มีบางอย่างที่สูญเสียไป"}]},

{id:"b415",lv:"N2",cat:"慣用・書き言葉",p:"〜に過ぎない / 〜でしかない（まとめ）",conn:"V普通形／N ＋ にすぎない",
en:"Is no more than; merely.",
th:"เป็นเพียงแค่",
note_en:"Three ways to downplay, in rising strength: 〜だけだ ＜ 〜にすぎない ＜ 〜でしかない. Knowing the ladder lets you pick the right weight.",
note_th:"มีสามวิธีในการลดทอน เรียงจากเบาไปหนัก: 〜だけだ ＜ 〜にすぎない ＜ 〜でしかない การรู้ลำดับนี้ช่วยให้เลือกน้ำหนักได้ถูก",
ex:[{j:"私は一人の学習者にすぎません。",k:"わたしは ひとりの がくしゅうしゃに すぎません。",e:"I'm no more than one learner among many.",t:"ผมเป็นเพียงผู้เรียนคนหนึ่งเท่านั้นครับ"},
{j:"それは始まりにすぎない。",k:"それは はじまりに すぎない。",e:"That is merely the beginning.",t:"นั่นเป็นเพียงจุดเริ่มต้นเท่านั้น"}]}
];
