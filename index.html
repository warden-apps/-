<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="筋道">
<meta name="application-name" content="Sujimichi">
<meta name="theme-color" content="#f7f0df">
<title>筋道 — N3・N2 文法</title>

<!-- Home-screen icons. iOS reads apple-touch-icon; Android reads the manifest. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --paper:#f7f0df; --paper2:#f0e7d2; --paper3:#e7dcc2; --card:#fffcf4;
  --ink:#2b2e34; --ink2:#5d636c; --ink3:#6e737a;
  --line:#e4dccb; --line2:#d6ccb6;
  --leaf:#4e7c55; --leaf-lo:#7ba377; --pot:#b45b3c; --pot-hi:#ce7a57;
  --pot-rim:#a65133; --pot-lo:#8e4529; --bloom:#c9a227; --bloom-lo:#e0c87e;
  --ai:#4a7295; --ai-soft:#9db8cd;
  --bengara:#b1573a; --bengara-soft:#d8a795;
  --kin:#8a6a1c; --kin-soft:#dcc98f;
  --green:#4b7a53; --green-bg:#eef5ee;
  --red:#a8503f; --red-bg:#faeeeb;
  --jp-serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --jp-sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --lat:"Iowan Old Style","Charter","Palatino","Palatino Linotype",Georgia,serif;
  --th:"Thonburi","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --nav:calc(60px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background-color:#f7f0df}
/* Cream alone reads as flat colour on a phone. Blending a fine grain tile into
   it in soft-light (mid-grey is neutral there) gives it the tooth of paper. */
body{background-image:url(icons/paper.png);background-size:112px 112px;background-blend-mode:soft-light}
html[data-theme="dark"] body{background-blend-mode:overlay;opacity:1}
body{color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}

.hdr{position:sticky;top:0;z-index:40;padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;background:linear-gradient(180deg,var(--paper) 68%,rgba(247,240,223,0))}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand-jp{font-family:var(--jp-serif);font-size:24px;letter-spacing:.16em;color:var(--ink)}
.brand-ro{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink3)}
.tagline{font-family:var(--jp-serif);font-size:11px;color:var(--ink3);letter-spacing:.12em;margin-top:2px}
.lvpick{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex:none;background:var(--card)}
.lvpick button{padding:6px 13px;font-size:11px;letter-spacing:.12em;color:var(--ink3);transition:color .16s,background .16s}
.lvpick button+button{border-left:1px solid var(--line)}
.lvpick button.on{background:var(--paper3);color:var(--ink)}
.lvpick button[data-lv="N3"].on{color:var(--ai)}
.lvpick button[data-lv="N2"].on{color:var(--bengara)}

main{padding:0 18px var(--nav);max-width:720px;margin:0 auto}
.pane{display:none;animation:rise .18s ease both}
.pane.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane,.sheet-in{animation:none}*{transition:none!important}}

/* ---- shared card look ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(90,75,45,.05)}

/* ---- intro / today ---- */
.hello{font-family:var(--jp-serif);font-size:14px;color:var(--ink2);text-align:center;margin:14px 0 0;letter-spacing:.06em}
.intro{text-align:center;padding:14px 0 10px}
.intro-n{font-family:var(--jp-serif);font-size:60px;line-height:1;color:var(--ink)}
.intro-lb{font-size:9.5px;letter-spacing:.3em;color:var(--ink3);margin-top:8px;text-transform:uppercase}
.split{display:flex;justify-content:center;margin:22px 0 4px}
.split div{flex:1;max-width:120px;text-align:center;padding:0 6px}
.split div+div{border-left:1px solid var(--line)}
.split b{display:block;font-family:var(--jp-serif);font-size:25px;font-weight:400;line-height:1.2}
.split .nw b{color:var(--kin)} .split .rv b{color:var(--ai)}
.split span{display:block;font-size:9px;letter-spacing:.18em;color:var(--ink3);margin-top:5px}
.go{width:100%;margin-top:22px;padding:16px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:12.5px;letter-spacing:.22em;transition:opacity .15s,transform .12s}
.go:active{transform:scale(.99);opacity:.85}
.go.quiet{background:var(--card);border:1px solid var(--line2);color:var(--ink2);margin-top:10px}
.intro-note{font-family:var(--th);font-size:13px;color:var(--ink3);margin-top:20px;line-height:1.75}
.intro-note em{display:block;font-family:var(--lat);font-style:normal;font-size:13px;margin-top:3px}

.drill-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.drill-hd .cnt{font-size:10.5px;letter-spacing:.16em;color:var(--ink3)}
.chip{font-size:10px;letter-spacing:.14em;color:var(--ink2);border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px}
.prog{height:3px;background:var(--paper3);border-radius:2px;overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;background:var(--kin);width:0;transition:width .3s ease;border-radius:2px}

.q-kind{font-size:9px;letter-spacing:.26em;color:var(--ink3);text-transform:uppercase;margin-bottom:10px}
.q-new{color:var(--kin)}
.q-main{font-family:var(--jp-serif);font-size:21px;line-height:1.7;color:var(--ink);margin-bottom:6px}
.q-sub{font-family:var(--th);font-size:14px;color:var(--ink2);line-height:1.6;margin-bottom:20px}
.blank{color:var(--kin);border-bottom:2px solid var(--kin-soft);padding:0 .35em}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:14px 16px;border-radius:13px;background:var(--card);border:1px solid var(--line2);font-family:var(--jp-serif);font-size:16.5px;color:var(--ink);transition:background .15s,border-color .15s,transform .12s;box-shadow:0 1px 2px rgba(90,75,45,.04)}
.opt:active{transform:scale(.99);background:var(--paper2)}
.opt.right{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.opt.dim{opacity:.42}

.verdict{margin-top:20px;display:none}
.verdict.on{display:block;animation:rise .16s ease both}
.v-p{font-family:var(--jp-serif);font-size:18px;color:var(--ink);margin-bottom:4px}
.v-s{font-family:var(--th);font-size:14.5px;color:var(--ink);line-height:1.6}
.v-se{font-family:var(--lat);font-size:14px;color:var(--ink2);line-height:1.45;margin-top:3px}

/* ---- anki-style rating row ---- */
.rate-lb{font-size:9px;letter-spacing:.26em;color:var(--ink3);text-transform:uppercase;margin:20px 0 8px;text-align:center}
.rate{display:flex;gap:7px}
.rate button{flex:1;padding:12px 4px;border-radius:12px;border:1px solid var(--line2);background:var(--card);transition:transform .12s,background .15s}
.rate button:active{transform:scale(.97)}
.rate .rj{display:block;font-family:var(--jp-serif);font-size:14px;line-height:1.2}
.rate .rr{display:block;font-size:8.5px;letter-spacing:.12em;color:var(--ink3);margin-top:4px;text-transform:uppercase}
.rate .again{border-color:var(--bengara-soft)} .rate .again .rj{color:var(--bengara)}
.rate .hard .rj{color:var(--ink2)}
.rate .good{border-color:var(--ai-soft)} .rate .good .rj{color:var(--ai)}
.rate .easy{border-color:var(--kin-soft)} .rate .easy .rj{color:var(--kin)}
.rate button.picked{background:var(--paper3);border-color:var(--ink3)}

.done{text-align:center;padding:30px 6px}
.done-n{font-family:var(--jp-serif);font-size:54px;color:var(--kin);line-height:1}
.done-t{font-size:10.5px;letter-spacing:.18em;color:var(--ink3);margin-top:10px}
.done-s{font-family:var(--th);font-size:13.5px;color:var(--ink2);margin-top:18px;line-height:1.75}
.done-s em{display:block;font-family:var(--lat);font-style:normal;margin-top:4px}

/* ---- practice ---- */
.pk{display:flex;gap:9px;margin:20px 0 0}
.pk button{flex:1;padding:18px 6px;border-radius:14px;border:1px solid var(--line2);background:var(--card);box-shadow:0 1px 2px rgba(90,75,45,.04)}
.pk b{display:block;font-family:var(--jp-serif);font-size:26px;font-weight:400;color:var(--ink)}
.pk span{display:block;font-size:8.5px;letter-spacing:.16em;color:var(--ink3);margin-top:4px}

/* ---- list ---- */
.tools{display:flex;gap:9px;align-items:center;margin:4px 0 16px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:9px 15px}
.search svg{flex:none;color:var(--ink3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:15px;font-family:var(--jp-sans)}
.langtog{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:9px 13px;font-size:10.5px;letter-spacing:.12em;color:var(--ink2)}
.langtog.on{color:var(--kin);border-color:var(--kin-soft)}
.grp{margin-bottom:22px}
.grp-hd{display:flex;align-items:center;gap:10px;margin:0 0 9px}
.grp-hd .rule{flex:1;height:1px;background:var(--line)}
.grp-hd h2{margin:0;font-family:var(--jp-serif);font-size:14px;font-weight:400;letter-spacing:.12em;color:var(--ink2)}
.grp-hd .n{font-size:10px;letter-spacing:.08em;color:var(--ink3)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);margin-bottom:7px;transition:background .15s,transform .12s;box-shadow:0 1px 2px rgba(90,75,45,.035)}
.row:active{transform:scale(.985);background:var(--paper2)}
.row-bar{flex:none;width:4px;align-self:stretch;border-radius:3px;background:var(--line2)}
.row-txt{flex:1;min-width:0}
.row-p{font-family:var(--jp-serif);font-size:17px;color:var(--ink);line-height:1.35}
.row-g{font-family:var(--th);font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row-lv{flex:none;font-size:8.5px;letter-spacing:.1em;color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:2px 7px}
/* mastery colouring — the bar and tint say how well you know it */
.row.m1 .row-bar{background:var(--ai-soft)}
.row.m3 .row-bar{background:var(--ai)}
.row.m5 .row-bar{background:var(--kin)}
.row.m5{background:linear-gradient(90deg,rgba(138,106,28,.10),var(--card) 60%);border-color:var(--kin-soft)}
.row.m5 .row-lv{color:var(--kin);border-color:var(--kin-soft)}
.row.m3{border-color:#cddbe6}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:44px 20px}

/* ---- sheet ---- */
.sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(60,50,35,.32);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet.on{display:block}
.sheet-in{position:absolute;left:0;right:0;bottom:0;top:34px;background:var(--paper);border-radius:22px 22px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .22s cubic-bezier(.22,.9,.3,1) both}
@keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 0}
.sheet-body{padding:6px 18px calc(30px + env(safe-area-inset-bottom))}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 4px}
.tag{font-size:9.5px;letter-spacing:.18em;padding:3px 10px;border-radius:999px;border:1px solid}
.tag.N3{color:var(--ai);border-color:var(--ai-soft)}
.tag.N2{color:var(--bengara);border-color:var(--bengara-soft)}
.d-cat{font-family:var(--jp-serif);font-size:11.5px;color:var(--ink3);letter-spacing:.08em}
.d-pat{font-family:var(--jp-serif);font-size:30px;line-height:1.35;color:var(--ink);margin:4px 0 2px}
.d-short{border-left:3px solid var(--kin);padding:2px 0 2px 14px;margin:14px 0 20px}
.ds-th{font-family:var(--th);font-size:18px;line-height:1.55;color:var(--ink)}
.ds-en{font-family:var(--lat);font-size:17px;line-height:1.4;color:var(--ink);margin-top:3px}
.rail{margin:0 0 4px}
.rail-lb,.d-lb{font-size:9px;letter-spacing:.26em;color:var(--ink3);text-transform:uppercase;margin-bottom:7px}
.rail-bar{position:relative;padding-left:15px}
.rail-bar::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--ai-soft)}
.sheet-in[data-lv="N2"] .rail-bar::before{background:var(--bengara-soft)}
.rail-txt{font-family:var(--jp-serif);font-size:15px;line-height:1.8;color:var(--ink2)}
.more{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;margin:20px 0 0;border-radius:13px;background:var(--card);border:1px solid var(--line2);font-size:11.5px;letter-spacing:.14em;color:var(--ink2)}
.more .chev{transition:transform .2s ease;font-size:10px}
.more.open .chev{transform:rotate(180deg)}
.long{display:none;margin-top:12px}
.long.open{display:block;animation:rise .18s ease both}
.d-sec{margin-bottom:16px}
.d-en{font-family:var(--lat);font-size:15.5px;line-height:1.6;color:var(--ink)}
.d-th{font-family:var(--th);font-size:15px;line-height:1.75;color:var(--ink);margin-top:5px}
.slip{background:var(--paper2);border-radius:5px 14px 14px 5px;padding:15px 16px 15px 19px;position:relative;overflow:hidden;border:1px solid var(--line)}
.slip::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:rgba(177,87,58,.35)}
.slip-lb{font-family:var(--jp-serif);font-size:10.5px;letter-spacing:.2em;color:var(--bengara);margin-bottom:8px}
.slip-en{font-family:var(--lat);font-size:14.5px;line-height:1.6;color:var(--ink)}
.slip-th{font-family:var(--th);font-size:14px;line-height:1.7;color:var(--ink);margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.ex{border-top:1px solid var(--line);padding:14px 0 2px}
.ex-j{font-family:var(--jp-serif);font-size:18.5px;line-height:1.65;color:var(--ink)}
.ex-k{font-family:var(--jp-sans);font-size:11.5px;line-height:1.6;color:var(--ink3);margin-top:4px}
.ex-e{font-family:var(--lat);font-size:14.5px;line-height:1.5;color:var(--ink2);margin-top:7px}
.ex-t{font-family:var(--th);font-size:14px;line-height:1.65;color:var(--ink2);margin-top:3px}
.say{margin-top:9px;display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.14em;color:var(--ink2);border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 13px}
.d-mark{display:flex;gap:8px;margin:22px 0 6px}
.d-mark button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:12px;letter-spacing:.06em;color:var(--ink2);transition:background .15s,color .15s}
.d-mark button.on{background:var(--paper3);color:var(--ink);border-color:var(--ink3)}
.d-mark button.on[data-mk="5"]{color:var(--kin);border-color:var(--kin)}
.d-close{width:100%;padding:14px;margin-top:6px;border-radius:12px;background:var(--paper2);font-size:12px;letter-spacing:.18em;color:var(--ink2)}

/* ---- record ---- */
.rings{display:flex;justify-content:center;padding:10px 0 4px}
.rings svg{width:196px;height:196px}
.ring-bg{fill:none;stroke:var(--paper3);stroke-width:8}
.ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .7s cubic-bezier(.3,.9,.35,1)}
.ring-n3{stroke:var(--ai)} .ring-n2{stroke:var(--bengara)}
.rings text{font-family:var(--jp-serif)}
.legend{display:flex;justify-content:center;gap:22px;margin:2px 0 20px}
.leg{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.1em;color:var(--ink2)}
.leg i{width:8px;height:8px;border-radius:50%;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--jp-serif);font-size:24px;color:var(--ink);font-weight:400;line-height:1.15}
.stat span{display:block;font-size:9px;letter-spacing:.16em;color:var(--ink3);margin-top:5px}
.brk-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.brk-nm{flex:1;font-family:var(--jp-serif);font-size:13px;color:var(--ink2);min-width:0}
.brk-tr{flex:none;width:78px;height:4px;background:var(--paper3);border-radius:2px;overflow:hidden}
.brk-tr i{display:block;height:100%;background:var(--ai);border-radius:2px}
.brk-row[data-lv="N2"] .brk-tr i{background:var(--bengara)}
.brk-n{flex:none;width:44px;text-align:right;font-size:10.5px;color:var(--ink3)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setlb{font-family:var(--jp-serif);font-size:13.5px;color:var(--ink2)}
.setlb small{display:block;font-family:var(--th);font-size:10.5px;color:var(--ink3);letter-spacing:0;margin-top:2px}
.seg{display:flex;border:1px solid var(--line2);background:var(--card);border-radius:999px;overflow:hidden;flex:none}
.seg button{padding:7px 12px;font-size:11px;color:var(--ink3)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--paper3);color:var(--kin)}
.reset{width:100%;margin:22px 0 8px;padding:13px;border-radius:12px;border:1px solid var(--line2);font-size:11px;letter-spacing:.16em;color:var(--ink3)}

/* ---- sentence assembly (文の組み立て) ---- */
.asm-goal{font-family:var(--th);font-size:16px;line-height:1.65;color:var(--ink);margin-bottom:4px}
.asm-goal-en{font-family:var(--lat);font-size:15px;line-height:1.5;color:var(--ink2);margin-bottom:18px}
.tray{min-height:64px;border:1px dashed var(--line2);border-radius:14px;background:var(--card);
  padding:11px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;margin-bottom:8px}
.tray.done-ok{border-style:solid;border-color:var(--green);background:var(--green-bg)}
.tray.done-no{border-style:solid;border-color:var(--red);background:var(--red-bg)}
.tray-hint{font-size:11px;color:var(--ink3);letter-spacing:.1em;align-self:center;margin:0 auto}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px}
.pill{font-family:var(--jp-serif);font-size:16px;padding:9px 14px;border-radius:11px;
  background:var(--card);border:1px solid var(--line2);color:var(--ink);
  transition:transform .12s,background .15s,opacity .15s;box-shadow:0 1px 2px rgba(90,75,45,.04)}
.pill:active{transform:scale(.96)}
.pill.used{opacity:.28;pointer-events:none}
.tray .pill{background:var(--paper2);border-color:var(--line2)}
.asm-answer{font-family:var(--jp-serif);font-size:19px;line-height:1.7;color:var(--ink);margin-top:4px}
.mode-pick{display:flex;flex-direction:column;gap:10px;margin:22px 0 0}
.mode-pick button{text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--line2);
  background:var(--card);box-shadow:0 1px 2px rgba(90,75,45,.04)}
.mode-pick b{display:block;font-family:var(--jp-serif);font-size:18px;font-weight:400;color:var(--ink)}
.mode-pick span{display:block;font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.5}

/* ---- filter chips + forecast ---- */
.filters{display:flex;gap:7px;margin:0 0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.filters button{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line2);
  background:var(--card);font-size:11.5px;letter-spacing:.06em;color:var(--ink2);transition:background .15s,color .15s}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button .cnt{font-size:10px;opacity:.65;margin-left:5px}
.rate .sub{display:block;font-size:8.5px;color:var(--ink3);margin-top:3px;letter-spacing:.04em}
.learn-note{font-size:11px;color:var(--ink3);text-align:center;margin-top:14px;line-height:1.6}
.fc{display:flex;gap:5px;align-items:flex-end;height:64px;margin:6px 0 4px}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.fc i{display:block;width:100%;background:var(--ai-soft);border-radius:3px 3px 0 0;min-height:2px}
.fc div:first-child i{background:var(--kin)}
.fc b{font-size:9.5px;color:var(--ink2);font-weight:400}
.fc span{font-size:8.5px;color:var(--ink3)}

/* ---- why-this-answer panel ---- */
.why{margin-top:16px;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.why-lb{font-size:9px;letter-spacing:.24em;color:var(--bengara);text-transform:uppercase;margin-bottom:8px}
.why-ok{font-family:var(--th);font-size:14px;line-height:1.7;color:var(--ink)}
.why-ok-en{font-family:var(--lat);font-size:13.5px;line-height:1.55;color:var(--ink2);margin-top:7px}
.why-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line2)}
.why-row b{flex:none;font-family:var(--jp-serif);font-size:14.5px;font-weight:400;color:var(--ink2);min-width:88px}
.why-row span{flex:1;font-family:var(--th);font-size:12.5px;line-height:1.5;color:var(--ink3)}
/* ---- passage mode ---- */
.psg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin-bottom:18px}
.psg-topic{font-size:9px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin-bottom:10px}
.psg-body{font-family:var(--jp-serif);font-size:17.5px;line-height:2.15;color:var(--ink)}
.psg-body .bl{display:inline-block;min-width:58px;text-align:center;border-bottom:2px solid var(--line2);color:var(--ink3);padding:0 4px}
.psg-body .bl.now{border-color:var(--kin);color:var(--kin);background:rgba(138,106,28,.08);border-radius:3px 3px 0 0}
.psg-body .bl.got{border-color:var(--green);color:var(--green)}
.psg-body .bl.miss{border-color:var(--red);color:var(--red)}
.psg-tr{font-family:var(--th);font-size:14px;line-height:1.8;color:var(--ink2);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.psg-tr-en{font-family:var(--lat);font-size:13.5px;line-height:1.6;color:var(--ink3);margin-top:8px}

/* ---- strength scale ---- */
.str{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:38px}
.str b{font-family:var(--ui);font-size:13px;font-weight:600;line-height:1;letter-spacing:-.02em}
.str i{display:block;width:34px;height:3px;border-radius:2px;background:var(--paper3);overflow:hidden}
.str i em{display:block;height:100%;border-radius:2px}
.s0 b{color:var(--ink3)}       .s0 i em{background:var(--line2)}
.s1 b{color:var(--bengara)}    .s1 i em{background:var(--bengara)}
.s2 b{color:#8a7a3f}           .s2 i em{background:#c2ac6a}
.s3 b{color:var(--ai)}         .s3 i em{background:var(--ai)}
.s4 b{color:var(--kin)}        .s4 i em{background:var(--kin)}
.row.s4{background:linear-gradient(90deg,rgba(138,106,28,.09),var(--card) 60%);border-color:var(--kin-soft)}
.row.s1{border-color:var(--bengara-soft)}
/* strength block in the detail sheet */
.sb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin:16px 0 4px}
.sb-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.sb-n{font-family:var(--jp-serif);font-size:34px;line-height:1}
.sb-lb{font-size:9px;letter-spacing:.24em;color:var(--ink3);text-transform:uppercase}
.sb-band{font-family:var(--jp-serif);font-size:14px}
.sb-tr{height:5px;border-radius:3px;background:var(--paper3);overflow:hidden;margin-bottom:12px}
.sb-tr i{display:block;height:100%;border-radius:3px}
.sb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
.sb-grid div{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.sb-grid span{color:var(--ink3)} .sb-grid b{font-weight:500;color:var(--ink)}
/* distribution in record */
.dist{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.dist-row{display:flex;align-items:center;gap:10px}
.dist-nm{flex:none;width:78px;font-family:var(--jp-serif);font-size:12.5px;color:var(--ink2)}
.dist-tr{flex:1;height:8px;background:var(--paper3);border-radius:4px;overflow:hidden}
.dist-tr i{display:block;height:100%;border-radius:4px}
.dist-n{flex:none;width:34px;text-align:right;font-size:11px;color:var(--ink3)}
/* backup */
.bk{width:100%;height:76px;border:1px solid var(--line2);border-radius:12px;background:var(--card);
  padding:11px 13px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink2);resize:none;outline:none}
.bk-row{display:flex;gap:8px;margin-top:9px}
.bk-row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:11.5px;color:var(--ink2)}
.bk-note{font-family:var(--th);font-size:11.5px;color:var(--ink3);line-height:1.65;margin-top:10px}

/* ---- dark theme ---- */
html[data-theme="dark"]{background-color:#15181e}
/* background-color, not the shorthand — it would drop the paper grain */
html[data-theme="dark"] body{background-color:#15181e;color:#e8e3d8}
html[data-theme="dark"]{
  --paper:#15181e; --paper2:#20252d; --paper3:#2a303a; --card:#1c2129;
  --ink:#e8e3d8; --ink2:#aab1bc; --ink3:#868d99;
  --line:#2b313b; --line2:#3a4250;
  --ai:#82abcc; --ai-soft:#4e6d87;
  --bengara:#e08a6c; --bengara-soft:#8a5340;
  --kin:#d6b46b; --kin-soft:#6f5c33;
  --green:#84c092; --green-bg:#1a2620;
  --red:#e0968a; --red-bg:#2a1d1b;
}
html[data-theme="dark"] .hdr{background:linear-gradient(180deg,#15181e 68%,rgba(21,24,30,0))}
html[data-theme="dark"] nav{background:rgba(21,24,30,.95)}
html[data-theme="dark"] .sheet{background:rgba(0,0,0,.55)}
html[data-theme="dark"] .card,html[data-theme="dark"] .opt,html[data-theme="dark"] .row,
html[data-theme="dark"] .stat,html[data-theme="dark"] .psg{box-shadow:none}
html[data-theme="dark"] .slip::before{background:rgba(224,138,108,.45)}
html[data-theme="dark"] nav .badge{color:#15181e}
html[data-theme="dark"] .row.s4{background:linear-gradient(90deg,rgba(214,180,107,.13),var(--card) 60%)}
html[data-theme="dark"] .bk{font-family:ui-monospace,Menlo,monospace}

/* ---- the pixel plant ---- */
.plant{display:block;margin:2px auto 10px;image-rendering:pixelated}
.intro .plant{margin-bottom:14px}
.done .plant{margin-bottom:6px}
/* it settles onto the shelf rather than just appearing */
@keyframes sprout{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.plant{animation:sprout .32s ease both}
@media (prefers-reduced-motion:reduce){.plant{animation:none}}

/* the progress bar as a row of pixel blocks, to match */
.prog{height:6px;background:var(--paper3);border-radius:0;overflow:hidden;margin-bottom:22px;
  box-shadow:inset 0 0 0 1px var(--line)}
.prog i{display:block;height:100%;background:var(--leaf);width:0;border-radius:0;
  transition:width .3s steps(12,end)}

/* ---- "your progress is not being saved" banner ---- */
.savewarn{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + 8px);z-index:80;
  background:var(--red-bg);border:1px solid var(--red);color:var(--red);border-radius:12px;
  padding:11px 14px;font-family:var(--th);font-size:12px;line-height:1.55;text-align:center;
  box-shadow:0 6px 20px -8px rgba(90,40,30,.4)}
.savewarn b{font-family:var(--lat);font-weight:600}

/* ---- nothing-due state + practice scope ---- */
.clear-mark{font-family:var(--jp-serif);font-size:46px;color:var(--ai);line-height:1}
.scope{display:flex;gap:7px;margin:18px 0 0;justify-content:center}
.scope button{flex:1;max-width:150px;padding:11px 8px;border-radius:12px;border:1px solid var(--line2);
  background:var(--card);font-size:11.5px;color:var(--ink2);line-height:1.4}
.scope button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scope button b{display:block;font-family:var(--jp-serif);font-size:14px;font-weight:400;margin-bottom:2px}
.scope-note{font-family:var(--th);font-size:11.5px;color:var(--ink3);text-align:center;margin-top:10px;line-height:1.6}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(247,240,223,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);transition:color .15s;position:relative}
nav button .jp{font-family:var(--jp-serif);font-size:15px;letter-spacing:.06em}
nav button .ro{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase}
nav button.on{color:var(--ink)}
nav .badge{position:absolute;top:5px;right:calc(50% - 24px);min-width:16px;height:16px;border-radius:8px;background:var(--kin);color:#fff;font-size:9.5px;line-height:16px;text-align:center;font-family:var(--ui);padding:0 4px;display:none}
nav .badge.on{display:block}
</style>

{id:"n3a04",lv:"N3",cat:"時・順序",p:"〜間に / 〜間",conn:"V辞書形／Vている／N の／イA／ナA な ＋ あいだ(に)",
en:"間に = at some point during. 間 = throughout the whole period.",
th:"間に = ช่วงใดช่วงหนึ่งระหว่างนั้น ส่วน 間 = ตลอดช่วงเวลานั้นทั้งหมด",
note_en:"The に is not decoration. With に, the action happens once inside the window. Without に, the action continues for the full window. 寝ている間に地震があった (once) vs 寝ている間ずっと雨だった (throughout).",
note_th:"に ไม่ใช่แค่ประดับ ถ้ามี に = การกระทำเกิดครั้งเดียวในช่วงนั้น ถ้าไม่มี に = การกระทำต่อเนื่องตลอดช่วง เช่น 寝ている間に地震があった (ครั้งเดียว) กับ 寝ている間ずっと雨だった (ตลอด)",
ex:[{j:"母が寝ている間に、掃除をした。",k:"ははが ねている あいだに、そうじを した。",e:"I cleaned while my mother was asleep.",t:"ทำความสะอาดตอนที่แม่หลับอยู่"},
{j:"夏休みの間、ずっとアルバイトをしていた。",k:"なつやすみの あいだ、ずっと アルバイトを していた。",e:"I worked part-time the whole summer holiday.",t:"ทำงานพาร์ตไทม์ตลอดช่วงปิดเทอมฤดูร้อน"}]},

{id:"n3a05",lv:"N3",cat:"時・順序",p:"〜たとたん(に)",conn:"Vた＋とたん(に)",
en:"The instant something happened, something else happened — unexpectedly.",
th:"ทันทีที่...ก็... โดยสิ่งที่เกิดตามมามักเป็นเรื่องไม่คาดคิด",
note_en:"Two hard rules: the second clause must be PAST, and it must be something outside your control. You cannot say ドアを開けたとたん、入ろうと思った — your own intention doesn't fit.",
note_th:"กฎเข้ม 2 ข้อ: ประโยคหลังต้องเป็นอดีต และต้องเป็นสิ่งที่ควบคุมไม่ได้ พูดว่า ドアを開けたとたん、入ろうと思った ไม่ได้ เพราะเป็นความตั้งใจของตัวเอง",
ex:[{j:"立ち上がったとたん、めまいがした。",k:"たちあがった とたん、めまいが した。",e:"The moment I stood up, I felt dizzy.",t:"พอลุกขึ้นยืนปุ๊บก็เวียนหัวเลย"},
{j:"窓を開けたとたんに、猫が飛び出した。",k:"まどを あけた とたんに、ねこが とびだした。",e:"The instant I opened the window, the cat shot out.",t:"พอเปิดหน้าต่างปุ๊บ แมวก็พุ่งออกไปเลย"}]},

{id:"n3a06",lv:"N3",cat:"時・順序",p:"〜最中に",conn:"Vている／N の ＋ さいちゅうに",
en:"Right in the thick of doing something — and then an interruption.",
th:"กำลัง...อยู่พอดีเลย แล้วก็มีอะไรมาขัดจังหวะ",
note_en:"Stronger than 〜ている間に. 最中 implies the peak of the activity, so it almost always pairs with an interruption or trouble.",
note_th:"แรงกว่า 〜ている間に เพราะ 最中 หมายถึงช่วงที่กำลังเข้มข้นที่สุด จึงมักตามด้วยเรื่องที่มาขัดจังหวะหรือปัญหา",
ex:[{j:"食事の最中に電話がかかってきた。",k:"しょくじの さいちゅうに でんわが かかって きた。",e:"A call came in right in the middle of dinner.",t:"มีโทรศัพท์เข้ามาตอนกำลังกินข้าวอยู่พอดี"},
{j:"面接をしている最中に、地震が起きた。",k:"めんせつを している さいちゅうに、じしんが おきた。",e:"An earthquake hit right in the middle of the interview.",t:"แผ่นดินไหวตอนกำลังสัมภาษณ์อยู่พอดี"}]},

{id:"n3a07",lv:"N3",cat:"時・順序",p:"〜際(に)",conn:"V辞書形／Vた／N の ＋ さい(に)",
en:"On the occasion of; when (formal).",
th:"เมื่อ...; ในโอกาสที่... (ภาษาทางการ)",
note_en:"The formal cousin of 〜とき. You will meet this constantly in announcements, manuals and customer service Japanese — exactly the register you need for front desk work.",
note_th:"เป็นรูปทางการของ 〜とき เจอบ่อยมากในประกาศ คู่มือ และภาษาบริการลูกค้า ซึ่งเป็นระดับภาษาที่ต้องใช้ในงานต้อนรับพอดี",
ex:[{j:"ご来店の際は、マスクをご着用ください。",k:"ごらいてんの さいは、マスクを ごちゃくよう ください。",e:"Please wear a mask when visiting the store.",t:"กรุณาสวมหน้ากากเมื่อเข้ามาในร้านครับ"},
{j:"お帰りの際に、鍵をお返しください。",k:"おかえりの さいに、かぎを おかえし ください。",e:"Please return the key when you leave.",t:"กรุณาคืนกุญแจตอนกลับด้วยครับ"}]},

{id:"n3a08",lv:"N3",cat:"時・順序",p:"〜てはじめて",conn:"Vて＋はじめて",
en:"Only after doing X did I finally realise/understand Y.",
th:"หลังจากได้...แล้วถึงเพิ่งจะเข้าใจ/รู้",
note_en:"The second half is almost always a realisation verb: 分かる, 気づく, 知る. It carries a note of 'I didn't get it before'.",
note_th:"ประโยคหลังมักเป็นคำที่เกี่ยวกับการรับรู้ เช่น 分かる 気づく 知る มีความรู้สึกว่า 'ก่อนหน้านี้ไม่เข้าใจเลย'",
ex:[{j:"一人暮らしをしてはじめて、親のありがたさが分かった。",k:"ひとりぐらしを して はじめて、おやの ありがたさが わかった。",e:"Only after living alone did I understand how grateful I should be to my parents.",t:"พอได้อยู่คนเดียวถึงเพิ่งเข้าใจว่าพ่อแม่มีค่าแค่ไหน"},
{j:"失ってはじめて、その大切さに気づいた。",k:"うしなって はじめて、その たいせつさに きづいた。",e:"It was only after losing it that I realised its worth.",t:"พอเสียมันไปถึงเพิ่งรู้ว่ามันสำคัญแค่ไหน"}]},

{id:"n3a09",lv:"N3",cat:"時・順序",p:"〜まま",conn:"Vた／Vない／イA／ナA な／N の ＋ まま",
en:"A state left unchanged; doing something while still in that state.",
th:"ปล่อยให้อยู่ในสภาพเดิม; ทำสิ่งหนึ่งทั้ง ๆ ที่ยังอยู่ในสภาพนั้น",
note_en:"Note it takes the た-form, not the ている-form: 靴を履いたまま (with shoes still on), not 履いているまま. This trips up nearly everyone.",
note_th:"ต้องใช้รูป た ไม่ใช่รูป ている เช่น 靴を履いたまま (ใส่รองเท้าอยู่) ไม่ใช่ 履いているまま จุดนี้คนพลาดกันเยอะมาก",
ex:[{j:"靴を履いたまま入らないでください。",k:"くつを はいた まま はいらないで ください。",e:"Please don't come in with your shoes on.",t:"กรุณาอย่าเข้ามาทั้ง ๆ ที่ใส่รองเท้าครับ"},
{j:"電気をつけたまま寝てしまった。",k:"でんきを つけた まま ねて しまった。",e:"I fell asleep with the light still on.",t:"เผลอหลับไปทั้ง ๆ ที่เปิดไฟทิ้งไว้"}]},

{id:"n3a10",lv:"N3",cat:"時・順序",p:"〜ついでに",conn:"V辞書形／Vた／N の ＋ ついでに",
en:"While you're at it; taking the opportunity of doing X, also do Y.",
th:"ถือโอกาสตอนที่ทำ X ก็ทำ Y ไปด้วยเลย",
note_en:"X must be the main errand and Y the extra. Reverse them and it sounds odd. Very common in daily conversation.",
note_th:"X ต้องเป็นธุระหลัก ส่วน Y เป็นของแถม ถ้าสลับกันจะฟังดูแปลก ใช้บ่อยมากในบทสนทนาประจำวัน",
ex:[{j:"買い物のついでに、郵便局に寄った。",k:"かいものの ついでに、ゆうびんきょくに よった。",e:"While I was out shopping, I dropped by the post office.",t:"ถือโอกาสตอนไปซื้อของ ก็แวะไปรษณีย์ด้วย"},
{j:"散歩に行くついでに、これを出してきて。",k:"さんぽに いく ついでに、これを だして きて。",e:"While you're out for your walk, post this for me.",t:"ตอนออกไปเดินเล่น ช่วยเอานี่ไปส่งด้วยนะ"}]},

{id:"n3a11",lv:"N3",cat:"時・順序",p:"〜たび(に)",conn:"V辞書形／N の ＋ たび(に)",
en:"Every time X happens, Y happens.",
th:"ทุกครั้งที่ X ก็จะ Y",
note_en:"Use for repeated events, not one-offs. Cannot take a た-form: ×行ったたびに → ○行くたびに.",
note_th:"ใช้กับเหตุการณ์ที่เกิดซ้ำ ๆ ไม่ใช่ครั้งเดียว และใช้รูป た ไม่ได้ ×行ったたびに → ○行くたびに",
ex:[{j:"この曲を聞くたびに、故郷を思い出す。",k:"この きょくを きく たびに、こきょうを おもいだす。",e:"Every time I hear this song I think of my hometown.",t:"ทุกครั้งที่ฟังเพลงนี้ก็จะคิดถึงบ้านเกิด"},
{j:"試験のたびに緊張してしまう。",k:"しけんの たびに きんちょうして しまう。",e:"I get nervous every single exam.",t:"ตื่นเต้นทุกครั้งที่สอบเลย"}]},

{id:"n3a12",lv:"N3",cat:"時・順序",p:"〜おきに / 〜ごとに",conn:"数量詞＋おきに／数量詞・N＋ごとに",
en:"おきに = at intervals of, skipping. ごとに = every single one, without skipping.",
th:"おきに = เว้นระยะ (ข้าม) ส่วน ごとに = ทุก ๆ อันโดยไม่ข้าม",
note_en:"1日おきに = every other day (skip a day). 1日ごとに = every day. The difference costs points on the exam constantly.",
note_th:"1日おきに = วันเว้นวัน (ข้ามไป 1 วัน) ส่วน 1日ごとに = ทุกวัน ข้อแตกต่างนี้ออกสอบบ่อยมาก",
ex:[{j:"薬は6時間おきに飲んでください。",k:"くすりは ろくじかん おきに のんで ください。",e:"Take the medicine at six-hour intervals.",t:"ทานยาทุก 6 ชั่วโมงครับ"},
{j:"3か月ごとに検査があります。",k:"さんかげつ ごとに けんさが あります。",e:"There's a check-up every three months.",t:"มีการตรวจทุก ๆ 3 เดือนครับ"}]},

{id:"n3a13",lv:"N3",cat:"原因・理由",p:"〜せいで / 〜せいか",conn:"Vた／Vない／イA／ナA な／N の ＋ せいで・せいか",
en:"Because of X — and X is to blame. せいか = maybe because.",
th:"เพราะ X (ในความหมายลบ โทษว่าเป็นความผิดของ X) ส่วน せいか = อาจเป็นเพราะ",
note_en:"せい is always negative — it assigns blame. Its opposite is おかげで (thanks to). Never use せいで for a good result.",
note_th:"せい ใช้ในทางลบเสมอ คือโทษว่าเป็นเพราะสิ่งนั้น ตรงข้ามกับ おかげで (ต้องขอบคุณ) อย่าใช้ せいで กับผลลัพธ์ที่ดี",
ex:[{j:"雨のせいで試合が中止になった。",k:"あめの せいで しあいが ちゅうしに なった。",e:"The match was cancelled because of the rain.",t:"การแข่งถูกยกเลิกเพราะฝนตก"},
{j:"寝不足のせいか、頭が痛い。",k:"ねぶそくの せいか、あたまが いたい。",e:"Maybe because I didn't sleep enough, I have a headache.",t:"อาจเป็นเพราะนอนไม่พอ เลยปวดหัว"}]},

{id:"n3a14",lv:"N3",cat:"原因・理由",p:"〜おかげで",conn:"Vた／イA／ナA な／N の ＋ おかげで",
en:"Thanks to X (positive result).",
th:"ต้องขอบคุณ X (ผลลัพธ์ในทางบวก)",
note_en:"The positive mirror of せいで. Used sarcastically it flips: 君のおかげでひどい目にあったよ.",
note_th:"เป็นคู่ตรงข้ามด้านบวกของ せいで ถ้าใช้ประชดจะกลายเป็นลบ เช่น 君のおかげでひどい目にあったよ",
ex:[{j:"先生のおかげで合格できました。",k:"せんせいの おかげで ごうかく できました。",e:"Thanks to you, sensei, I was able to pass.",t:"ต้องขอบคุณอาจารย์ ผมถึงสอบผ่านครับ"},
{j:"薬を飲んだおかげで、熱が下がった。",k:"くすりを のんだ おかげで、ねつが さがった。",e:"Thanks to taking the medicine, my fever went down.",t:"เพราะได้ทานยา ไข้เลยลดลง"}]},

{id:"n3a15",lv:"N3",cat:"原因・理由",p:"〜ため(に)",conn:"V普通形／イA／ナA な／N の ＋ ため(に)",
en:"Because of (formal, written); also 'in order to'.",
th:"เนื่องจาก (ทางการ ภาษาเขียน); และยังแปลว่า 'เพื่อที่จะ' ได้ด้วย",
note_en:"Two jobs in one form. If the front clause is uncontrollable, it means CAUSE (事故のため遅れた). If it's a volitional verb, it means PURPOSE (合格するために勉強する).",
note_th:"รูปเดียวทำสองหน้าที่ ถ้าประโยคหน้าเป็นสิ่งที่ควบคุมไม่ได้ = สาเหตุ (事故のため遅れた) ถ้าเป็นกริยาที่ตั้งใจทำ = จุดประสงค์ (合格するために勉強する)",
ex:[{j:"事故のため、電車が遅れています。",k:"じこの ため、でんしゃが おくれて います。",e:"Trains are delayed due to an accident.",t:"รถไฟล่าช้าเนื่องจากอุบัติเหตุครับ"},
{j:"N1に合格するために、毎日勉強しています。",k:"エヌいちに ごうかく する ために、まいにち べんきょう して います。",e:"I study every day in order to pass N1.",t:"เรียนทุกวันเพื่อที่จะสอบ N1 ให้ผ่าน"}]},

{id:"n3a16",lv:"N3",cat:"原因・理由",p:"〜もので / 〜ものだから",conn:"V普通形／イA／ナA な／N な ＋ もので・ものだから",
en:"Because — used to excuse or explain yourself.",
th:"เพราะว่า... ใช้ตอนแก้ตัวหรืออธิบายเหตุผลของตัวเอง",
note_en:"This is the excuse form. It softens and asks for understanding, so it's very common when apologising: 道が混んでいたもので、遅れました.",
note_th:"เป็นรูปสำหรับแก้ตัว ทำให้น้ำเสียงนุ่มลงและขอความเข้าใจ จึงใช้บ่อยตอนขอโทษ เช่น 道が混んでいたもので、遅れました",
ex:[{j:"道が混んでいたもので、遅れてしまいました。",k:"みちが こんで いた もので、おくれて しまいました。",e:"The roads were jammed, so I'm afraid I'm late.",t:"เพราะรถติดมาก เลยมาสายครับ ขอโทษด้วย"},
{j:"急いでいたものだから、忘れ物をした。",k:"いそいで いた ものだから、わすれものを した。",e:"I was in such a rush that I left something behind.",t:"เพราะรีบมาก เลยลืมของ"}]},

{id:"n3a17",lv:"N3",cat:"原因・理由",p:"〜からには",conn:"V普通形／イA／ナA である／N である ＋ からには",
en:"Now that / since you've done X, you must naturally do Y.",
th:"ในเมื่อได้ X แล้ว ก็ต้อง Y เป็นธรรมดา",
note_en:"Always followed by determination, obligation or advice — never a plain fact. It's the grammar of resolve.",
note_th:"ประโยคหลังต้องเป็นความตั้งใจ หน้าที่ หรือคำแนะนำเสมอ ไม่ใช่ข้อเท็จจริงธรรมดา เป็นไวยากรณ์ของความมุ่งมั่น",
ex:[{j:"やるからには、最後までやります。",k:"やる からには、さいごまで やります。",e:"If I'm going to do it, I'll see it through to the end.",t:"ในเมื่อจะทำแล้ว ก็จะทำจนถึงที่สุด"},
{j:"日本に住むからには、日本語を話せるようになりたい。",k:"にほんに すむ からには、にほんごを はなせる ように なりたい。",e:"Since I live in Japan, I want to become able to speak Japanese.",t:"ในเมื่ออยู่ญี่ปุ่นแล้ว ก็อยากพูดญี่ปุ่นให้ได้"}]},

{id:"n3a18",lv:"N3",cat:"目的",p:"〜ように",conn:"V可能形／Vない／状態を表すV ＋ ように",
en:"So that a certain state comes about (no direct control).",
th:"เพื่อให้เกิดสภาพนั้น (สิ่งที่เราควบคุมโดยตรงไม่ได้)",
note_en:"The great pair with ために. ように takes non-volitional verbs (見える, 分かる, 忘れない, potential forms). ために takes volitional ones. Same subject or not also differs.",
note_th:"เป็นคู่สำคัญกับ ために โดย ように ใช้กับกริยาที่ไม่ได้ตั้งใจควบคุม (見える 分かる 忘れない รูปสามารถ) ส่วน ために ใช้กับกริยาที่ตั้งใจทำ",
ex:[{j:"後ろの人にも見えるように、大きく書いた。",k:"うしろの ひとにも みえる ように、おおきく かいた。",e:"I wrote it large so the people at the back could see too.",t:"เขียนตัวใหญ่ ๆ เพื่อให้คนข้างหลังมองเห็นด้วย"},
{j:"忘れないように、メモしておきます。",k:"わすれない ように、メモして おきます。",e:"I'll make a note so I don't forget.",t:"จะจดไว้ก่อน เพื่อจะได้ไม่ลืม"}]},

{id:"n3a19",lv:"N3",cat:"目的",p:"〜のに（用途）",conn:"V辞書形＋のに",
en:"For the purpose of doing X — used to evaluate tools and usefulness.",
th:"สำหรับใช้ทำ X — ใช้ตอนประเมินว่าเครื่องมือดีหรือมีประโยชน์ไหม",
note_en:"Do not confuse with the 'although' のに. This one is followed by 便利だ, 必要だ, 使う, いい — words about utility.",
note_th:"อย่าสับสนกับ のに ที่แปลว่า 'ทั้ง ๆ ที่' ตัวนี้จะตามด้วยคำที่บอกประโยชน์ เช่น 便利だ 必要だ 使う いい",
ex:[{j:"このアプリは単語を覚えるのに便利です。",k:"この アプリは たんごを おぼえるのに べんり です。",e:"This app is handy for memorising vocabulary.",t:"แอปนี้สะดวกสำหรับใช้ท่องศัพท์"},
{j:"引っ越しをするのに、お金がかかる。",k:"ひっこしを するのに、おかねが かかる。",e:"Moving house costs money.",t:"การย้ายบ้านต้องใช้เงิน"}]},

{id:"n3a20",lv:"N3",cat:"条件・仮定",p:"〜ば",conn:"V仮定形（〜えば）／イA ければ／ナA なら／N なら",
en:"General conditional: if X, then naturally Y.",
th:"เงื่อนไขทั่วไป: ถ้า X ก็ Y เป็นธรรมดา",
note_en:"Best for general truths and advice. Restriction: if the second clause is a command, request or invitation, the first verb must be a state verb — ×行けば、電話してください.",
note_th:"เหมาะกับความจริงทั่วไปและคำแนะนำ ข้อจำกัด: ถ้าประโยคหลังเป็นคำสั่ง ขอร้อง หรือชวน กริยาหน้าต้องเป็นกริยาบอกสภาพ ×行けば、電話してください",
ex:[{j:"春になれば、桜が咲きます。",k:"はるに なれば、さくらが さきます。",e:"When spring comes, the cherry blossoms bloom.",t:"พอถึงฤดูใบไม้ผลิ ซากุระก็จะบาน"},
{j:"安ければ買います。",k:"やすければ かいます。",e:"I'll buy it if it's cheap.",t:"ถ้าถูกก็จะซื้อ"}]},

{id:"n3a21",lv:"N3",cat:"条件・仮定",p:"〜たら",conn:"Vた／イA かったら／ナA だったら／N だったら ＋ ら",
en:"The all-purpose conditional: once X happens, then Y.",
th:"เงื่อนไขอเนกประสงค์: พอ X เกิดขึ้นแล้วก็ Y",
note_en:"The safest of the four conditionals — it accepts commands, requests, and one-off events. When unsure which to use, たら is usually acceptable.",
note_th:"ปลอดภัยที่สุดในบรรดาเงื่อนไขทั้ง 4 แบบ ใช้กับคำสั่ง คำขอร้อง และเหตุการณ์ครั้งเดียวได้ ถ้าไม่แน่ใจว่าจะใช้ตัวไหน たら มักใช้ได้",
ex:[{j:"駅に着いたら、電話してください。",k:"えきに ついたら、でんわして ください。",e:"Please call me once you arrive at the station.",t:"พอถึงสถานีแล้วโทรหาด้วยนะครับ"},
{j:"お金があったら、留学したい。",k:"おかねが あったら、りゅうがく したい。",e:"If I had money, I'd like to study abroad.",t:"ถ้ามีเงินก็อยากไปเรียนต่อต่างประเทศ"}]},

{id:"n3a22",lv:"N3",cat:"条件・仮定",p:"〜なら",conn:"V普通形／イA／ナA／N ＋ なら",
en:"If that's the case — picking up on what the other person just said.",
th:"ถ้าอย่างนั้น... เป็นการรับเรื่องที่อีกฝ่ายเพิ่งพูดมาต่อ",
note_en:"なら responds to information. It's the only conditional where the second clause can happen BEFORE the first: 日本へ行くなら、航空券を買ったほうがいい (buy the ticket before going).",
note_th:"なら ใช้ตอบรับข้อมูลที่ได้ยินมา และเป็นเงื่อนไขเดียวที่ประโยคหลังเกิดก่อนประโยคหน้าได้ เช่น 日本へ行くなら、航空券を買ったほうがいい (ซื้อตั๋วก่อนไป)",
ex:[{j:"大阪に行くなら、新幹線が速いですよ。",k:"おおさかに いくなら、しんかんせんが はやいですよ。",e:"If you're going to Osaka, the shinkansen is fast.",t:"ถ้าจะไปโอซาก้า ชินคันเซ็นเร็วนะครับ"},
{j:"安いのなら、買ってもいい。",k:"やすいのなら、かっても いい。",e:"If it's cheap, I don't mind buying it.",t:"ถ้าถูกก็ซื้อได้อยู่นะ"}]},

{id:"n3a23",lv:"N3",cat:"条件・仮定",p:"〜と",conn:"V辞書形／Vない／イA／ナA だ／N だ ＋ と",
en:"Whenever X, Y automatically follows — natural law, machines, directions.",
th:"พอ X ปุ๊บ Y ก็เกิดตามอัตโนมัติ — กฎธรรมชาติ เครื่องจักร การบอกทาง",
note_en:"Hard rule: the second clause can NEVER be a command, request, invitation or intention. ×このボタンを押すと、待ってください.",
note_th:"กฎเข้ม: ประโยคหลังห้ามเป็นคำสั่ง คำขอร้อง คำชวน หรือความตั้งใจเด็ดขาด ×このボタンを押すと、待ってください",
ex:[{j:"このボタンを押すと、切符が出ます。",k:"この ボタンを おすと、きっぷが でます。",e:"If you press this button, a ticket comes out.",t:"พอกดปุ่มนี้ ตั๋วก็จะออกมา"},
{j:"まっすぐ行くと、右に銀行があります。",k:"まっすぐ いくと、みぎに ぎんこうが あります。",e:"Go straight and there's a bank on the right.",t:"ตรงไปเรื่อย ๆ แล้วจะมีธนาคารอยู่ทางขวา"}]},

{id:"n3a24",lv:"N3",cat:"条件・仮定",p:"たとえ〜ても",conn:"たとえ＋Vて／イA くて／ナA で／N で ＋ も",
en:"Even if X (hypothetical), still Y.",
th:"ต่อให้ X (สมมติ) ก็ยัง Y",
note_en:"たとえ signals from the start that a concession is coming. Dropping it still works, but keeping it makes the sentence much clearer in speech.",
note_th:"たとえ เป็นสัญญาณตั้งแต่ต้นว่ากำลังจะยอมรับเงื่อนไข ตัดออกก็ยังใช้ได้ แต่ถ้าใส่ไว้จะทำให้ประโยคชัดขึ้นมากเวลาพูด",
ex:[{j:"たとえ雨が降っても、行きます。",k:"たとえ あめが ふっても、いきます。",e:"Even if it rains, I'm going.",t:"ต่อให้ฝนตกก็จะไป"},
{j:"たとえ何年かかっても、N1を取ります。",k:"たとえ なんねん かかっても、エヌいちを とります。",e:"However many years it takes, I'll get N1.",t:"ต่อให้ใช้เวลากี่ปีก็จะเอา N1 ให้ได้"}]},

{id:"n3a25",lv:"N3",cat:"条件・仮定",p:"〜としたら / 〜とすれば",conn:"普通形＋としたら・とすれば",
en:"Supposing that X were the case, then...",
th:"สมมติว่า X เป็นจริง แล้ว...",
note_en:"Purely hypothetical reasoning, common in test questions and discussion. More logical and colder than たら.",
note_th:"เป็นการคิดแบบสมมติล้วน ๆ เจอบ่อยในข้อสอบและการอภิปราย ให้ความรู้สึกเป็นเหตุเป็นผลและเย็นชากว่า たら",
ex:[{j:"留学するとしたら、どこの国がいいですか。",k:"りゅうがく する としたら、どこの くにが いいですか。",e:"Supposing you studied abroad, which country would be good?",t:"สมมติว่าจะไปเรียนต่อ ประเทศไหนดีครับ"},
{j:"これが本当だとすれば、大変なことだ。",k:"これが ほんとうだ とすれば、たいへんな ことだ。",e:"If this is true, it's serious.",t:"ถ้าเรื่องนี้จริง ก็เป็นเรื่องใหญ่แล้ว"}]},

{id:"n3a26",lv:"N3",cat:"条件・仮定",p:"〜場合は",conn:"V普通形／イA／ナA な／N の ＋ ばあいは",
en:"In the case that X (formal, for rules and instructions).",
th:"ในกรณีที่ X (ทางการ ใช้กับกฎระเบียบและคำแนะนำ)",
note_en:"Notice-board Japanese. If you work front desk, you will read and say this daily.",
note_th:"เป็นภาษาแบบป้ายประกาศ ถ้าทำงานต้อนรับจะได้อ่านและได้พูดทุกวัน",
ex:[{j:"遅れる場合は、必ず連絡してください。",k:"おくれる ばあいは、かならず れんらく して ください。",e:"In the event you'll be late, be sure to contact us.",t:"ในกรณีที่จะมาสาย กรุณาติดต่อมาด้วยนะครับ"},
{j:"火事の場合は、エレベーターを使わないでください。",k:"かじの ばあいは、エレベーターを つかわないで ください。",e:"In case of fire, do not use the elevator.",t:"ในกรณีเกิดไฟไหม้ กรุณาอย่าใช้ลิฟต์"}]},

{id:"n3a27",lv:"N3",cat:"逆接",p:"〜のに",conn:"V普通形／イA／ナA な／N な ＋ のに",
en:"Although X — with surprise, disappointment or complaint.",
th:"ทั้ง ๆ ที่ X — มีอารมณ์แปลกใจ ผิดหวัง หรือบ่น",
note_en:"のに always carries emotion. けれど is neutral; のに is not. That emotional charge is why it can't be followed by a command or invitation.",
note_th:"のに มีอารมณ์เสมอ ต่างจาก けれど ที่เป็นกลาง เพราะมีอารมณ์นี่เอง จึงตามด้วยคำสั่งหรือคำชวนไม่ได้",
ex:[{j:"7年も勉強しているのに、まだ話せない。",k:"ななねんも べんきょう して いるのに、まだ はなせない。",e:"I've studied for seven whole years and I still can't speak.",t:"เรียนมาตั้ง 7 ปีแล้วแท้ ๆ แต่ก็ยังพูดไม่ได้"},
{j:"約束したのに、来なかった。",k:"やくそく したのに、こなかった。",e:"He promised, and yet he didn't come.",t:"สัญญาไว้แท้ ๆ แต่ก็ไม่มา"}]},

{id:"n3a28",lv:"N3",cat:"逆接",p:"〜くせに",conn:"V普通形／イA／ナA な／N の ＋ くせに",
en:"Although X — with contempt or blame toward the person.",
th:"ทั้ง ๆ ที่ X — มีอารมณ์ดูถูกหรือตำหนิอีกฝ่าย",
note_en:"Much ruder than のに. Only use about other people, never neutral facts, and never in polite settings. Knowing it is for listening, not for speaking at work.",
note_th:"หยาบกว่า のに มาก ใช้พูดถึงคนอื่นเท่านั้น ห้ามใช้กับข้อเท็จจริงกลาง ๆ และห้ามใช้ในที่ทางการ รู้ไว้เพื่อฟังออก ไม่ใช่เพื่อพูดในที่ทำงาน",
ex:[{j:"知っているくせに、教えてくれない。",k:"しって いる くせに、おしえて くれない。",e:"He knows perfectly well and still won't tell me.",t:"รู้อยู่แท้ ๆ แต่ก็ไม่ยอมบอก"},
{j:"子供のくせに、生意気だ。",k:"こどもの くせに、なまいきだ。",e:"He's only a kid and he's so cheeky.",t:"เป็นแค่เด็กแท้ ๆ แต่ทำเป็นอวดดี"}]},

{id:"n3a29",lv:"N3",cat:"逆接",p:"〜わりに(は)",conn:"V普通形／イA／ナA な／N の ＋ わりに(は)",
en:"Considering X, unexpectedly Y — not what you'd predict from X.",
th:"เมื่อเทียบกับ X แล้ว กลับ Y — ไม่เป็นอย่างที่คาดจาก X",
note_en:"It compares against a reasonable expectation. 値段のわりにおいしい = good given how cheap it is. Neutral, often complimentary.",
note_th:"เป็นการเทียบกับสิ่งที่คาดหวังตามปกติ เช่น 値段のわりにおいしい = อร่อยเมื่อเทียบกับราคา น้ำเสียงเป็นกลาง มักใช้ในทางชม",
ex:[{j:"この店は値段のわりにおいしい。",k:"この みせは ねだんの わりに おいしい。",e:"This place is tasty for the price.",t:"ร้านนี้อร่อยเมื่อเทียบกับราคา"},
{j:"彼は年齢のわりに若く見える。",k:"かれは ねんれいの わりに わかく みえる。",e:"He looks young for his age.",t:"เขาดูเด็กกว่าอายุ"}]},

{id:"n3a30",lv:"N3",cat:"逆接",p:"〜ながら(も)",conn:"Vます形／イA／ナA／N ＋ ながら(も)",
en:"Even though X — a written-style concession.",
th:"ถึงแม้ว่า X — เป็นการยอมรับแบบภาษาเขียน",
note_en:"Different from the 'while doing' ながら. Here it means 'although', and it usually attaches to states: 残念ながら, 知っていながら, 狭いながらも.",
note_th:"ต่างจาก ながら ที่แปลว่า 'ขณะที่ทำ' ตัวนี้แปลว่า 'ถึงแม้ว่า' และมักต่อกับคำบอกสภาพ เช่น 残念ながら 知っていながら 狭いながらも",
ex:[{j:"残念ながら、今回は不合格でした。",k:"ざんねん ながら、こんかいは ふごうかく でした。",e:"Regrettably, I didn't pass this time.",t:"น่าเสียดายที่ครั้งนี้สอบไม่ผ่านครับ"},
{j:"狭いながらも、居心地のいい部屋だ。",k:"せまい ながらも、いごこちの いい へやだ。",e:"It's small, but it's a comfortable room.",t:"ถึงจะแคบ แต่ก็เป็นห้องที่อยู่สบาย"}]},
{id:"n3b01",lv:"N3",cat:"伝聞・推量",p:"〜そうだ（伝聞）",conn:"普通形＋そうだ",
en:"I hear that / they say that — reporting information from elsewhere.",
th:"ได้ยินมาว่า / เขาว่ากันว่า — เป็นการรายงานข้อมูลที่ได้มาจากที่อื่น",
note_en:"The connection is the whole giveaway. Hearsay そうだ takes the PLAIN form (雨が降るそうだ). Appearance そうだ takes the stem (雨が降りそうだ). One kana decides the meaning.",
note_th:"รูปเชื่อมคือจุดชี้ขาด そうだ แบบได้ยินมาต่อรูปธรรมดา (雨が降るそうだ) ส่วน そうだ แบบดูเหมือนต่อรูป ます ที่ตัด ます (雨が降りそうだ) แค่คานะตัวเดียวเปลี่ยนความหมาย",
ex:[{j:"天気予報によると、明日は雨だそうです。",k:"てんきよほうに よると、あしたは あめだ そうです。",e:"According to the forecast, it'll rain tomorrow.",t:"ตามพยากรณ์อากาศ พรุ่งนี้ฝนจะตกครับ"},
{j:"田中さんは来月結婚するそうだ。",k:"たなかさんは らいげつ けっこん する そうだ。",e:"I hear Tanaka-san is getting married next month.",t:"ได้ยินมาว่าคุณทานากะจะแต่งงานเดือนหน้า"}]},

{id:"n3b02",lv:"N3",cat:"伝聞・推量",p:"〜そうだ（様態）",conn:"Vます形／イA（い削除）／ナA ＋ そうだ",
en:"It looks like / seems about to — a judgement from what you can see.",
th:"ดูเหมือนว่า / ท่าจะ — เป็นการตัดสินจากสิ่งที่มองเห็น",
note_en:"Only for things visible right now. Exceptions to memorise: いい→よさそう, ない→なさそう. And you cannot use it for things obvious to the eye — ×彼は若そうだ is odd if you can plainly see he's young.",
note_th:"ใช้กับสิ่งที่มองเห็นตอนนี้เท่านั้น ข้อยกเว้นที่ต้องจำ: いい→よさそう, ない→なさそう และใช้กับสิ่งที่เห็นชัดอยู่แล้วไม่ได้ ×彼は若そうだ จะแปลกถ้ามองเห็นชัดว่าเขาเด็ก",
ex:[{j:"このケーキ、おいしそうですね。",k:"この ケーキ、おいしそう ですね。",e:"This cake looks delicious.",t:"เค้กชิ้นนี้ดูน่าอร่อยจังเลยนะครับ"},
{j:"雨が降りそうだから、傘を持っていこう。",k:"あめが ふりそうだから、かさを もって いこう。",e:"It looks like rain, so let's take an umbrella.",t:"ท่าฝนจะตก เอาร่มไปด้วยดีกว่า"}]},

{id:"n3b03",lv:"N3",cat:"伝聞・推量",p:"〜ようだ / 〜みたいだ",conn:"V普通形／イA／ナA な／N の ＋ ようだ｜普通形（ナA・N は語幹）＋みたいだ",
en:"It seems — based on your own senses and reasoning. Also used for similes.",
th:"ดูเหมือนว่า — จากประสาทสัมผัสและการคิดของตัวเอง และใช้เปรียบเทียบได้ด้วย",
note_en:"ようだ is the writing/formal form; みたいだ is the spoken one. Same meaning, different register. Both also mean 'like/similar to': 夢のようだ.",
note_th:"ようだ เป็นรูปเขียน/ทางการ ส่วน みたいだ เป็นรูปพูด ความหมายเดียวกันแต่ระดับภาษาต่างกัน ทั้งคู่ยังแปลว่า 'เหมือนกับ' ได้ เช่น 夢のようだ",
ex:[{j:"誰かいるようだ。物音がする。",k:"だれか いる ようだ。ものおとが する。",e:"It seems someone's here — I hear a noise.",t:"เหมือนจะมีใครอยู่นะ ได้ยินเสียงอะไรบางอย่าง"},
{j:"彼は日本人みたいに話す。",k:"かれは にほんじん みたいに はなす。",e:"He speaks like a Japanese person.",t:"เขาพูดได้เหมือนคนญี่ปุ่นเลย"}]},

{id:"n3b04",lv:"N3",cat:"伝聞・推量",p:"〜らしい",conn:"普通形（ナA・N は語幹）＋らしい",
en:"Apparently — based on outside information you half-trust. Also 'typical of'.",
th:"ท่าทางจะ / ดูเหมือนว่า — จากข้อมูลภายนอกที่เชื่อครึ่งไม่เชื่อครึ่ง และแปลว่า 'สมกับเป็น' ได้ด้วย",
note_en:"らしい keeps its distance — you're passing on what you heard without vouching for it. The second use, 男らしい / 学生らしい, means 'behaving as one should'.",
note_th:"らしい มีระยะห่าง คือส่งต่อสิ่งที่ได้ยินมาโดยไม่รับประกัน ส่วนความหมายที่สอง เช่น 男らしい 学生らしい แปลว่า 'ทำตัวสมกับที่เป็น'",
ex:[{j:"あの店は今日休みらしいですよ。",k:"あの みせは きょう やすみ らしいですよ。",e:"Apparently that shop is closed today.",t:"ร้านนั้นท่าทางวันนี้จะปิดนะครับ"},
{j:"今日は春らしい天気だ。",k:"きょうは はるらしい てんきだ。",e:"Today the weather feels properly like spring.",t:"วันนี้อากาศสมกับเป็นฤดูใบไม้ผลิเลย"}]},

{id:"n3b05",lv:"N3",cat:"伝聞・推量",p:"〜はずだ / 〜はずがない",conn:"V普通形／イA／ナA な／N の ＋ はずだ",
en:"It should be so, logically. はずがない = there's no way.",
th:"ตามหลักเหตุผลแล้วน่าจะเป็นอย่างนั้น ส่วน はずがない = เป็นไปไม่ได้",
note_en:"はず is grounded in evidence or arrangement, not in hope. 'He should arrive at 3' because the timetable says so — not because you want him to.",
note_th:"はず ตั้งอยู่บนหลักฐานหรือการนัดหมาย ไม่ใช่ความหวัง เช่น 'เขาน่าจะมาถึงบ่าย 3' เพราะตารางบอกไว้ ไม่ใช่เพราะเราอยากให้มา",
ex:[{j:"彼は昨日出発したから、もう着いているはずだ。",k:"かれは きのう しゅっぱつ したから、もう ついて いる はずだ。",e:"He left yesterday, so he should have arrived by now.",t:"เขาออกเดินทางเมื่อวาน ก็น่าจะถึงแล้ว"},
{j:"そんなに簡単なはずがない。",k:"そんなに かんたんな はずが ない。",e:"There's no way it's that easy.",t:"ไม่มีทางง่ายขนาดนั้นหรอก"}]},

{id:"n3b06",lv:"N3",cat:"伝聞・推量",p:"〜にちがいない",conn:"V普通形／イA／ナA／N ＋ にちがいない",
en:"I'm certain it must be so.",
th:"ต้องเป็นอย่างนั้นแน่ ๆ",
note_en:"Stronger than はず and more subjective — it's your conviction. はずだ says 'the logic gives this'; にちがいない says 'I'm sure'.",
note_th:"แรงกว่า はず และเป็นความรู้สึกส่วนตัวมากกว่า はずだ บอกว่า 'ตามเหตุผลควรเป็นแบบนี้' ส่วน にちがいない บอกว่า 'ฉันมั่นใจ'",
ex:[{j:"電気が消えている。もう寝たにちがいない。",k:"でんきが きえて いる。もう ねた に ちがいない。",e:"The lights are off — he must have gone to bed.",t:"ไฟดับแล้ว เขาต้องนอนแล้วแน่ ๆ"},
{j:"あれだけ練習したのだから、合格するにちがいない。",k:"あれだけ れんしゅう したのだから、ごうかく する に ちがいない。",e:"After all that practice, he's bound to pass.",t:"ซ้อมมาขนาดนั้น ต้องสอบผ่านแน่นอน"}]},

{id:"n3b07",lv:"N3",cat:"伝聞・推量",p:"〜かもしれない",conn:"V普通形／イA／ナA／N ＋ かもしれない",
en:"It might be — low confidence, around 50% or less.",
th:"อาจจะ — ความมั่นใจต่ำ ราว 50% หรือน้อยกว่า",
note_en:"The confidence ladder, weakest to strongest: かもしれない → でしょう → はずだ → にちがいない → 絶対.",
note_th:"ลำดับความมั่นใจจากน้อยไปมาก: かもしれない → でしょう → はずだ → にちがいない → 絶対",
ex:[{j:"もしかしたら、彼は来ないかもしれない。",k:"もしかしたら、かれは こない かも しれない。",e:"He might not come, actually.",t:"เผลอ ๆ เขาอาจจะไม่มาก็ได้"},
{j:"この方法のほうが速いかもしれません。",k:"この ほうほうの ほうが はやい かも しれません。",e:"This method might be faster.",t:"วิธีนี้อาจจะเร็วกว่าก็ได้ครับ"}]},

{id:"n3b08",lv:"N3",cat:"伝聞・推量",p:"〜わけだ",conn:"V普通形／イA／ナA な／N の ＋ わけだ",
en:"No wonder / that explains it — a conclusion that now makes sense.",
th:"มิน่าล่ะ / นั่นเองถึงได้... — ข้อสรุปที่ตอนนี้เข้าใจแล้ว",
note_en:"わけだ is the 'aha' grammar. You've just received information and the puzzle clicks into place. Often paired with どうりで.",
note_th:"わけだ คือไวยากรณ์ของการ 'อ๋อ เข้าใจแล้ว' คือเพิ่งได้ข้อมูลมาแล้วทุกอย่างต่อกันติด มักใช้คู่กับ どうりで",
ex:[{j:"10年も住んでいたのか。日本語が上手なわけだ。",k:"じゅうねんも すんで いたのか。にほんごが じょうずな わけだ。",e:"You lived here ten years? No wonder your Japanese is good.",t:"อยู่มาตั้ง 10 ปีเหรอ มิน่าล่ะภาษาญี่ปุ่นถึงเก่ง"},
{j:"エアコンが壊れている。暑いわけだ。",k:"エアコンが こわれて いる。あつい わけだ。",e:"The aircon's broken — that's why it's hot.",t:"แอร์เสียนี่เอง มิน่าล่ะถึงร้อน"}]},

{id:"n3b09",lv:"N3",cat:"伝聞・推量",p:"〜わけではない",conn:"V普通形／イA／ナA な／N の ＋ わけではない",
en:"It's not that... — partial denial, correcting an assumption.",
th:"ไม่ได้หมายความว่า... — เป็นการปฏิเสธบางส่วน แก้ความเข้าใจผิด",
note_en:"Three sisters worth separating: わけだ (so that's why) / わけではない (not entirely) / わけがない (impossible). The exam loves testing which one fits.",
note_th:"สามพี่น้องที่ต้องแยกให้ออก: わけだ (มิน่าล่ะ) / わけではない (ไม่ได้หมายความว่า) / わけがない (เป็นไปไม่ได้) ข้อสอบชอบถามว่าตัวไหนถูก",
ex:[{j:"嫌いなわけではないが、あまり食べない。",k:"きらいな わけでは ないが、あまり たべない。",e:"It's not that I dislike it, I just don't eat it much.",t:"ไม่ได้ไม่ชอบนะ แค่ไม่ค่อยได้กิน"},
{j:"全部分かったわけではありません。",k:"ぜんぶ わかった わけでは ありません。",e:"It's not as if I understood all of it.",t:"ไม่ได้เข้าใจทั้งหมดนะครับ"}]},

{id:"n3b10",lv:"N3",cat:"伝聞・推量",p:"〜ということだ",conn:"普通形＋ということだ",
en:"I'm told that (hearsay); or: which means that (restating).",
th:"ทราบมาว่า (ได้ยินมา) หรือ ก็คือหมายความว่า (สรุปใหม่)",
note_en:"More formal than そうだ for hearsay — you'll see it in news and business email. The second use restates something in clearer terms.",
note_th:"เป็นทางการกว่า そうだ ในความหมายได้ยินมา เจอในข่าวและอีเมลธุรกิจ ส่วนความหมายที่สองคือการพูดใหม่ให้ชัดขึ้น",
ex:[{j:"部長は今日来られないということです。",k:"ぶちょうは きょう こられない という ことです。",e:"I'm told the manager can't come today.",t:"ทราบมาว่าวันนี้ผู้จัดการมาไม่ได้ครับ"},
{j:"つまり、もう間に合わないということですね。",k:"つまり、もう まにあわない という ことですね。",e:"So in other words, we won't make it in time.",t:"ก็คือหมายความว่าไม่ทันแล้วสินะครับ"}]},

{id:"n3b11",lv:"N3",cat:"変化・状態",p:"〜ようになる",conn:"V辞書形／V可能形／Vない ＋ ようになる",
en:"To reach the point where you can/do something — gradual change.",
th:"เปลี่ยนไปจนถึงจุดที่ทำได้/ทำเป็น — การเปลี่ยนแปลงแบบค่อยเป็นค่อยไป",
note_en:"The single best sentence pattern for describing your own language progress. 話せるようになった is what you're aiming to say — and the ability form before it is essential.",
note_th:"เป็นรูปประโยคที่ดีที่สุดสำหรับเล่าความก้าวหน้าทางภาษาของตัวเอง 話せるようになった คือประโยคที่เราอยากพูดให้ได้ และรูปสามารถข้างหน้าสำคัญมาก",
ex:[{j:"最近、ニュースが聞き取れるようになりました。",k:"さいきん、ニュースが ききとれる ように なりました。",e:"Recently I've become able to catch the news.",t:"ช่วงนี้เริ่มฟังข่าวออกแล้วครับ"},
{j:"甘い物を食べないようになった。",k:"あまい ものを たべない ように なった。",e:"I've stopped eating sweet things.",t:"เลิกกินของหวานแล้ว"}]},

{id:"n3b12",lv:"N3",cat:"変化・状態",p:"〜ようにする",conn:"V辞書形／Vない ＋ ようにする",
en:"To make an effort to do / not do something habitually.",
th:"พยายามทำ/ไม่ทำสิ่งนั้นเป็นนิสัย",
note_en:"Pairs with ようになる: する is the effort, なる is the result. 毎日話すようにする → 話せるようになる.",
note_th:"คู่กับ ようになる โดย する คือความพยายาม ส่วน なる คือผลลัพธ์ เช่น 毎日話すようにする → 話せるようになる",
ex:[{j:"毎日日本語で日記を書くようにしています。",k:"まいにち にほんごで にっきを かく ように して います。",e:"I make a point of writing a diary in Japanese every day.",t:"พยายามเขียนไดอารี่เป็นภาษาญี่ปุ่นทุกวันครับ"},
{j:"夜遅く食べないようにしている。",k:"よる おそく たべない ように して いる。",e:"I try not to eat late at night.",t:"พยายามไม่กินดึก"}]},

{id:"n3b13",lv:"N3",cat:"変化・状態",p:"〜ことになる / 〜ことにする",conn:"V辞書形／Vない ＋ ことになる・ことにする",
en:"ことになる = it has been decided (by circumstances/others). ことにする = I decide.",
th:"ことになる = ถูกตัดสินใจแล้ว (โดยสถานการณ์หรือคนอื่น) ส่วน ことにする = ฉันตัดสินใจเอง",
note_en:"Japanese prefers ことになりました even when you decided yourself — it sounds humble. 来月から働くことになりました is the polite way to announce your own new job.",
note_th:"ภาษาญี่ปุ่นนิยมใช้ ことになりました แม้จะตัดสินใจเอง เพราะฟังดูถ่อมตัว เช่น 来月から働くことになりました เป็นวิธีสุภาพในการประกาศงานใหม่ของตัวเอง",
ex:[{j:"来月から大阪で働くことになりました。",k:"らいげつから おおさかで はたらく ことに なりました。",e:"It's been decided that I'll work in Osaka from next month.",t:"ตั้งแต่เดือนหน้าจะได้ทำงานที่โอซาก้าแล้วครับ"},
{j:"今年はN1を受けることにした。",k:"ことしは エヌいちを うける ことに した。",e:"I've decided to take N1 this year.",t:"ตัดสินใจแล้วว่าปีนี้จะสอบ N1"}]},

{id:"n3b14",lv:"N3",cat:"変化・状態",p:"〜ことにしている",conn:"V辞書形／Vない ＋ ことにしている",
en:"I make it a rule to — an ongoing personal policy.",
th:"ยึดถือเป็นกฎของตัวเองว่าจะ — เป็นนโยบายส่วนตัวที่ทำต่อเนื่อง",
note_en:"ことにした is a one-time decision; ことにしている is the habit that decision became.",
note_th:"ことにした คือการตัดสินใจครั้งเดียว ส่วน ことにしている คือนิสัยที่เกิดจากการตัดสินใจนั้น",
ex:[{j:"毎朝6時に起きることにしている。",k:"まいあさ ろくじに おきる ことに して いる。",e:"I make it a rule to get up at six every morning.",t:"ยึดเป็นกฎว่าจะตื่น 6 โมงเช้าทุกวัน"},
{j:"人の悪口は言わないことにしています。",k:"ひとの わるくちは いわない ことに して います。",e:"I make it a rule never to speak ill of people.",t:"ยึดเป็นกฎว่าจะไม่นินทาคนอื่นครับ"}]},

{id:"n3b15",lv:"N3",cat:"変化・状態",p:"〜てくる / 〜ていく",conn:"Vて＋くる・いく",
en:"てくる = change up to now / coming toward. ていく = change from now on / going away.",
th:"てくる = เปลี่ยนแปลงมาจนถึงตอนนี้ / เข้ามาหา ส่วน ていく = เปลี่ยนต่อไปจากนี้ / ออกไปจาก",
note_en:"Picture a timeline with 'now' in the middle. てくる arrows point at now from the past; ていく arrows point away into the future. 増えてきた (has been rising) vs 増えていく (will keep rising).",
note_th:"ให้นึกภาพเส้นเวลาโดยมี 'ตอนนี้' อยู่ตรงกลาง てくる คือลูกศรจากอดีตชี้เข้ามา ส่วน ていく คือลูกศรชี้ออกไปสู่อนาคต เช่น 増えてきた (เพิ่มขึ้นมาเรื่อย ๆ) กับ 増えていく (จะเพิ่มขึ้นต่อไป)",
ex:[{j:"日本語が少しずつ分かってきた。",k:"にほんごが すこしずつ わかって きた。",e:"I've gradually come to understand Japanese.",t:"เริ่มเข้าใจภาษาญี่ปุ่นขึ้นทีละนิดแล้ว"},
{j:"これからも勉強を続けていきます。",k:"これからも べんきょうを つづけて いきます。",e:"I'll keep on studying from here too.",t:"จากนี้ไปก็จะเรียนต่อไปเรื่อย ๆ ครับ"}]},

{id:"n3b16",lv:"N3",cat:"変化・状態",p:"〜てしまう",conn:"Vて＋しまう（口語：〜ちゃう・〜じゃう）",
en:"To finish completely; or to do something regrettable.",
th:"ทำจนเสร็จสมบูรณ์ หรือ ทำสิ่งที่น่าเสียดาย/ผิดพลาด",
note_en:"Context decides which. 読んでしまった can be 'I finished reading it' or 'I read it, unfortunately'. In speech it contracts to 〜ちゃった, which you'll hear constantly.",
note_th:"บริบทเป็นตัวตัดสิน เช่น 読んでしまった อาจแปลว่า 'อ่านจบแล้ว' หรือ 'เผลออ่านไป' เวลาพูดจะย่อเป็น 〜ちゃった ซึ่งจะได้ยินบ่อยมาก",
ex:[{j:"財布を落としてしまいました。",k:"さいふを おとして しまいました。",e:"I'm afraid I dropped my wallet.",t:"ทำกระเป๋าสตางค์หายซะแล้วครับ"},
{j:"宿題はもうやってしまった。",k:"しゅくだいは もう やって しまった。",e:"I've already finished the homework.",t:"ทำการบ้านเสร็จหมดแล้ว"}]},

{id:"n3b17",lv:"N3",cat:"変化・状態",p:"〜ておく",conn:"Vて＋おく（口語：〜とく）",
en:"To do something in advance, and leave it done.",
th:"ทำเตรียมไว้ล่วงหน้า แล้วปล่อยไว้แบบนั้น",
note_en:"The preparation form. Essential at work: 予約しておきます, 準備しておきました. Spoken contraction is 〜とく.",
note_th:"เป็นรูปของการเตรียมการ จำเป็นมากในที่ทำงาน เช่น 予約しておきます, 準備しておきました เวลาพูดจะย่อเป็น 〜とく",
ex:[{j:"会議の前に資料を読んでおいてください。",k:"かいぎの まえに しりょうを よんで おいて ください。",e:"Please read the materials before the meeting.",t:"กรุณาอ่านเอกสารเตรียมไว้ก่อนประชุมด้วยครับ"},
{j:"ビールを冷やしておきました。",k:"ビールを ひやして おきました。",e:"I've chilled the beer ready.",t:"แช่เบียร์เตรียมไว้แล้วครับ"}]},

{id:"n3b18",lv:"N3",cat:"変化・状態",p:"〜てある",conn:"他動詞のVて＋ある",
en:"Something has been done and remains in that state — someone did it on purpose.",
th:"มีคนทำไว้แล้วและยังอยู่ในสภาพนั้น — ทำไว้อย่างตั้งใจ",
note_en:"The classic contrast: 窓が開けてある (someone opened it deliberately, transitive) vs 窓が開いている (it's simply open, intransitive). てある always implies human intention.",
note_th:"จุดเปรียบเทียบคลาสสิก: 窓が開けてある (มีคนตั้งใจเปิดไว้ กริยาสกรรม) กับ 窓が開いている (มันเปิดอยู่เฉย ๆ กริยาอกรรม) てある สื่อถึงความตั้งใจของคนเสมอ",
ex:[{j:"壁に地図が貼ってあります。",k:"かべに ちずが はって あります。",e:"There's a map put up on the wall.",t:"มีแผนที่ติดไว้บนกำแพงครับ"},
{j:"ホテルはもう予約してあります。",k:"ホテルは もう よやく して あります。",e:"The hotel has already been booked.",t:"จองโรงแรมไว้แล้วครับ"}]},

{id:"n3b19",lv:"N3",cat:"授受・受身",p:"〜てあげる / 〜てくれる / 〜てもらう",conn:"Vて＋あげる・くれる・もらう",
en:"Giving and receiving actions: I do for you / someone does for me / I get someone to do.",
th:"การให้และรับการกระทำ: ฉันทำให้เธอ / มีคนทำให้ฉัน / ฉันขอให้คนอื่นทำให้",
note_en:"Japanese demands you mark direction of favour. Leaving it out sounds cold. Careful: 〜てあげる to a superior sounds patronising — use お〜します instead.",
note_th:"ภาษาญี่ปุ่นบังคับให้ระบุทิศทางของบุญคุณ ถ้าไม่ใส่จะฟังดูเย็นชา ระวัง: ใช้ 〜てあげる กับผู้ใหญ่จะฟังดูวางตัวสูง ให้ใช้ お〜します แทน",
ex:[{j:"友達が空港まで送ってくれた。",k:"ともだちが くうこうまで おくって くれた。",e:"My friend gave me a lift to the airport.",t:"เพื่อนไปส่งที่สนามบินให้"},
{j:"先生に推薦状を書いてもらいました。",k:"せんせいに すいせんじょうを かいて もらいました。",e:"I had my teacher write me a reference.",t:"ขอให้อาจารย์เขียนจดหมายแนะนำให้ครับ"}]},

{id:"n3b20",lv:"N3",cat:"授受・受身",p:"受身形（〜られる）",conn:"Iグループ：〜あれる／IIグループ：〜られる／する→される・来る→来られる",
en:"Passive: X is done to me/it — often with a nuisance feeling.",
th:"รูปถูกกระทำ: X ถูกทำ — มักมีความรู้สึกว่าเดือดร้อน",
note_en:"Japanese has a passive English doesn't: the 'suffering passive'. 雨に降られた = I got rained on, and it bothered me. There's no direct English equivalent, so it must be learned as a feeling.",
note_th:"ภาษาญี่ปุ่นมีรูปถูกกระทำแบบที่อังกฤษไม่มี คือ 'รูปถูกกระทำแบบเดือดร้อน' เช่น 雨に降られた = โดนฝนตกใส่แล้วเดือดร้อน ไม่มีคำแปลตรงตัวในภาษาอังกฤษ ต้องจำเป็นความรู้สึก",
ex:[{j:"電車で足を踏まれました。",k:"でんしゃで あしを ふまれました。",e:"Someone stepped on my foot on the train.",t:"โดนเหยียบเท้าบนรถไฟ"},
{j:"この寺は300年前に建てられた。",k:"この てらは さんびゃくねん まえに たてられた。",e:"This temple was built 300 years ago.",t:"วัดนี้ถูกสร้างเมื่อ 300 ปีก่อน"}]},

{id:"n3b21",lv:"N3",cat:"授受・受身",p:"使役形（〜させる）",conn:"Iグループ：〜あせる／IIグループ：〜させる／する→させる・来る→来させる",
en:"Causative: make or let someone do something.",
th:"รูปให้กระทำ: บังคับหรืออนุญาตให้ใครทำอะไร",
note_en:"The particle decides the flavour. を marks forcing (子供を行かせる); に often marks letting, especially with a direct object (子供に本を読ませる).",
note_th:"คำช่วยเป็นตัวกำหนดความรู้สึก を สื่อการบังคับ (子供を行かせる) ส่วน に มักสื่อการอนุญาต โดยเฉพาะเมื่อมีกรรมตรง (子供に本を読ませる)",
ex:[{j:"部長は私に残業させた。",k:"ぶちょうは わたしに ざんぎょう させた。",e:"The manager made me work overtime.",t:"ผู้จัดการให้ฉันทำงานล่วงเวลา"},
{j:"少し休ませてください。",k:"すこし やすませて ください。",e:"Please let me rest a little.",t:"ขออนุญาตพักสักครู่นะครับ"}]},

{id:"n3b22",lv:"N3",cat:"授受・受身",p:"使役受身（〜させられる）",conn:"使役形＋られる（Iグループは〜される に短縮可）",
en:"Made to do something against your will.",
th:"ถูกบังคับให้ทำทั้งที่ไม่อยากทำ",
note_en:"Always carries reluctance. Group I usually shortens: 飲まされる rather than 飲ませられる. But す-ending verbs don't shorten: 話させられる.",
note_th:"มีความรู้สึกไม่เต็มใจเสมอ กลุ่ม 1 มักย่อ เช่น 飲まされる แทน 飲ませられる แต่กริยาที่ลงท้ายด้วย す ย่อไม่ได้ เช่น 話させられる",
ex:[{j:"飲み会で歌わされた。",k:"のみかいで うたわされた。",e:"I was made to sing at the drinking party.",t:"โดนบังคับให้ร้องเพลงในงานเลี้ยง"},
{j:"子供のころ、毎日ピアノを練習させられた。",k:"こどもの ころ、まいにち ピアノを れんしゅう させられた。",e:"As a child I was made to practise piano every day.",t:"ตอนเด็ก ๆ โดนบังคับให้ซ้อมเปียโนทุกวัน"}]},

{id:"n3b23",lv:"N3",cat:"授受・受身",p:"〜てほしい",conn:"Vて＋ほしい／Vない＋でほしい",
en:"I want someone else to do something.",
th:"อยากให้คนอื่นทำอะไรบางอย่าง",
note_en:"〜たい is what I want to do; 〜てほしい is what I want YOU to do. The person wanted is marked with に.",
note_th:"〜たい คือสิ่งที่ฉันอยากทำ ส่วน 〜てほしい คือสิ่งที่อยากให้เธอทำ คนที่เราอยากให้ทำใช้คำช่วย に",
ex:[{j:"もっと日本語で話してほしいです。",k:"もっと にほんごで はなして ほしいです。",e:"I'd like you to speak more in Japanese.",t:"อยากให้คุยเป็นภาษาญี่ปุ่นมากกว่านี้ครับ"},
{j:"心配しないでほしい。",k:"しんぱい しないで ほしい。",e:"I don't want you to worry.",t:"ไม่อยากให้เป็นห่วงเลย"}]},

{id:"n3b24",lv:"N3",cat:"程度・比較",p:"〜ば〜ほど",conn:"V仮定形＋V辞書形＋ほど／イA ければ〜いほど／ナA なら〜な ほど",
en:"The more X, the more Y.",
th:"ยิ่ง X ก็ยิ่ง Y",
note_en:"The verb repeats — first in ば-form, then in dictionary form. 練習すればするほど. Learners often forget the repetition.",
note_th:"กริยาต้องซ้ำ ครั้งแรกรูป ば ครั้งที่สองรูปพจนานุกรม เช่น 練習すればするほど ผู้เรียนมักลืมส่วนที่ซ้ำ",
ex:[{j:"話せば話すほど、上手になります。",k:"はなせば はなす ほど、じょうずに なります。",e:"The more you speak, the better you get.",t:"ยิ่งพูดก็ยิ่งเก่งขึ้นครับ"},
{j:"安ければ安いほどいい。",k:"やすければ やすい ほど いい。",e:"The cheaper the better.",t:"ยิ่งถูกยิ่งดี"}]},

{id:"n3b25",lv:"N3",cat:"程度・比較",p:"〜ほど〜ない",conn:"N／V辞書形 ＋ ほど〜ない",
en:"Not as ... as — the standard Japanese comparison of inferiority.",
th:"ไม่...เท่ากับ — เป็นรูปเปรียบเทียบว่าน้อยกว่าแบบมาตรฐาน",
note_en:"Japanese avoids 'less than'. Instead it says 'not to the extent of'. AはBほど〜ない is the only natural way to say A is less X than B.",
note_th:"ภาษาญี่ปุ่นเลี่ยงการพูดว่า 'น้อยกว่า' แต่ใช้ว่า 'ไม่ถึงระดับของ' แทน AはBほど〜ない เป็นวิธีเดียวที่ธรรมชาติในการบอกว่า A น้อยกว่า B",
ex:[{j:"今年は去年ほど暑くない。",k:"ことしは きょねん ほど あつく ない。",e:"This year isn't as hot as last year.",t:"ปีนี้ไม่ร้อนเท่าปีที่แล้ว"},
{j:"N2はN1ほど難しくない。",k:"エヌにーは エヌいち ほど むずかしく ない。",e:"N2 isn't as hard as N1.",t:"N2 ไม่ยากเท่า N1"}]},

{id:"n3b26",lv:"N3",cat:"程度・比較",p:"〜くらい / 〜ぐらい",conn:"V普通形／イA／ナA な／N ＋ くらい・ぐらい",
en:"To the extent that — showing degree by example.",
th:"ถึงขนาดที่ — เป็นการบอกระดับด้วยตัวอย่าง",
note_en:"Use it to make a degree vivid: 歩けないくらい疲れた (so tired I couldn't walk). It also means 'only/merely' when downplaying: それくらいできるよ.",
note_th:"ใช้ทำให้ระดับเห็นภาพ เช่น 歩けないくらい疲れた (เหนื่อยจนเดินไม่ไหว) และยังแปลว่า 'แค่นี้เอง' ตอนพูดลดความสำคัญ เช่น それくらいできるよ",
ex:[{j:"立てないくらい疲れました。",k:"たてない くらい つかれました。",e:"I was so tired I couldn't stand up.",t:"เหนื่อยจนยืนไม่ไหวเลยครับ"},
{j:"泣きたいぐらい嬉しかった。",k:"なきたい ぐらい うれしかった。",e:"I was so happy I could have cried.",t:"ดีใจจนอยากร้องไห้"}]},

{id:"n3b27",lv:"N3",cat:"意志・希望",p:"〜(よ)うとする",conn:"V意志形＋とする",
en:"To try to do / to be on the verge of doing.",
th:"พยายามจะทำ / กำลังจะทำอยู่พอดี",
note_en:"Different from 〜てみる. 〜てみる is 'try it and see'; 〜ようとする is 'attempt, usually unsuccessfully'. 出ようとしたとき = just as I was about to leave.",
note_th:"ต่างจาก 〜てみる ตรงที่ 〜てみる คือ 'ลองดู' ส่วน 〜ようとする คือ 'พยายาม' ซึ่งมักไม่สำเร็จ เช่น 出ようとしたとき = ตอนที่กำลังจะออกไปพอดี",
ex:[{j:"出かけようとしたとき、電話が鳴った。",k:"でかけようと した とき、でんわが なった。",e:"Just as I was about to go out, the phone rang.",t:"ตอนที่กำลังจะออกไปพอดี โทรศัพท์ก็ดังขึ้น"},
{j:"何度も説明しようとしたが、聞いてくれなかった。",k:"なんども せつめい しようと したが、きいて くれなかった。",e:"I tried again and again to explain, but he wouldn't listen.",t:"พยายามอธิบายหลายครั้ง แต่เขาก็ไม่ยอมฟัง"}]},

{id:"n3b28",lv:"N3",cat:"意志・希望",p:"〜つもりだ",conn:"V辞書形／Vない ＋ つもりだ",
en:"I intend to — a personal plan already formed.",
th:"ตั้งใจจะ — เป็นแผนส่วนตัวที่คิดไว้แล้ว",
note_en:"Don't use it about other people's plans or about things already fixed — for scheduled events use 予定だ.",
note_th:"อย่าใช้กับแผนของคนอื่นหรือสิ่งที่กำหนดไว้แน่แล้ว ถ้าเป็นกำหนดการให้ใช้ 予定だ",
ex:[{j:"12月にN2を受けるつもりです。",k:"じゅうにがつに エヌにーを うける つもりです。",e:"I intend to take N2 in December.",t:"ตั้งใจจะสอบ N2 เดือนธันวาคมครับ"},
{j:"今日はもう出かけないつもりだ。",k:"きょうは もう でかけない つもりだ。",e:"I don't plan to go out again today.",t:"วันนี้ไม่ตั้งใจจะออกไปไหนอีกแล้ว"}]},

{id:"n3b29",lv:"N3",cat:"意志・希望",p:"〜たらどうですか",conn:"Vた＋らどうですか",
en:"Why don't you...? — a suggestion.",
th:"ลอง...ดูไหม — เป็นการเสนอแนะ",
note_en:"Softer than 〜たほうがいい, which can sound like an instruction. Casual form is 〜たら？ with rising intonation.",
note_th:"นุ่มกว่า 〜たほうがいい ซึ่งอาจฟังดูเหมือนสั่ง รูปกันเองคือ 〜たら？ พร้อมเสียงสูงท้ายประโยค",
ex:[{j:"疲れているなら、少し休んだらどうですか。",k:"つかれて いるなら、すこし やすんだら どうですか。",e:"If you're tired, why not rest a bit?",t:"ถ้าเหนื่อยก็ลองพักสักหน่อยไหมครับ"},
{j:"先生に相談してみたらどう？",k:"せんせいに そうだん して みたら どう？",e:"How about talking it over with the teacher?",t:"ลองปรึกษาอาจารย์ดูไหม"}]},

{id:"n3b30",lv:"N3",cat:"意志・希望",p:"〜べきだ",conn:"V辞書形＋べきだ（する→すべき も可）",
en:"Ought to — a moral or social should.",
th:"ควรจะ — เป็นความควรในเชิงศีลธรรมหรือสังคม",
note_en:"Stronger and more principled than ほうがいい. Do not use it about rules or laws — for those use なければならない.",
note_th:"แรงและมีหลักการมากกว่า ほうがいい อย่าใช้กับกฎหรือกฎหมาย กรณีนั้นให้ใช้ なければならない",
ex:[{j:"約束は守るべきだ。",k:"やくそくは まもる べきだ。",e:"You ought to keep your promises.",t:"ควรจะรักษาสัญญา"},
{j:"もっと早く相談すべきでした。",k:"もっと はやく そうだん すべき でした。",e:"I should have consulted you sooner.",t:"ควรจะปรึกษาให้เร็วกว่านี้ครับ"}]},
{id:"n3c01",lv:"N3",cat:"義務・許可",p:"〜なければならない / 〜なきゃ",conn:"Vない（ない削除）＋ければならない",
en:"Must — an external obligation, rule or duty.",
th:"ต้อง — เป็นหน้าที่หรือกฎจากภายนอก",
note_en:"Written: なければなりません. Spoken: なきゃ / なくちゃ. In real conversation people just say 行かなきゃ and stop — the rest is understood.",
note_th:"ภาษาเขียน: なければなりません ภาษาพูด: なきゃ / なくちゃ ในบทสนทนาจริงคนจะพูดแค่ 行かなきゃ แล้วหยุด ส่วนที่เหลือเข้าใจกันเอง",
ex:[{j:"明日までに提出しなければなりません。",k:"あしたまでに ていしゅつ しなければ なりません。",e:"I have to submit it by tomorrow.",t:"ต้องส่งภายในพรุ่งนี้ครับ"},
{j:"もう行かなきゃ。",k:"もう いかなきゃ。",e:"I've got to go.",t:"ต้องไปแล้วล่ะ"}]},

{id:"n3c02",lv:"N3",cat:"義務・許可",p:"〜ないといけない",conn:"Vない＋といけない",
en:"Have to — slightly softer and more spoken than なければならない.",
th:"ต้อง — นุ่มกว่าและเป็นภาษาพูดมากกว่า なければならない",
note_en:"Literally 'if you don't, it's no good'. Very common in speech; Kansai speakers often say 〜なあかん instead.",
note_th:"แปลตรงตัวว่า 'ถ้าไม่ทำก็ไม่ดี' ใช้บ่อยมากในภาษาพูด คนคันไซมักพูดว่า 〜なあかん แทน",
ex:[{j:"薬を飲まないといけません。",k:"くすりを のまないと いけません。",e:"I have to take my medicine.",t:"ต้องกินยาครับ"},
{j:"もっと勉強しないといけないな。",k:"もっと べんきょう しないと いけないな。",e:"I really have to study more.",t:"ต้องเรียนให้มากกว่านี้แล้วสิ"}]},

{id:"n3c03",lv:"N3",cat:"義務・許可",p:"〜なくてもいい",conn:"Vない（ない削除）＋くてもいい",
en:"You don't have to.",
th:"ไม่ต้อง...ก็ได้",
note_en:"The direct opposite of なければならない. Note the te-form of ない is なくて.",
note_th:"ตรงข้ามกับ なければならない โดยตรง จำไว้ว่ารูป て ของ ない คือ なくて",
ex:[{j:"急がなくてもいいですよ。",k:"いそがなくても いいですよ。",e:"You don't need to hurry.",t:"ไม่ต้องรีบก็ได้ครับ"},
{j:"予約しなくても大丈夫です。",k:"よやく しなくても だいじょうぶ です。",e:"It's fine without a reservation.",t:"ไม่ต้องจองก็ได้ครับ"}]},

{id:"n3c04",lv:"N3",cat:"義務・許可",p:"〜てもいい / 〜てはいけない",conn:"Vて＋もいい／Vて＋はいけない",
en:"May do / must not do.",
th:"ทำได้ / ห้ามทำ",
note_en:"For customer service, soften both: 〜てもよろしいでしょうか to ask permission, and ご遠慮ください instead of the blunt 〜てはいけません.",
note_th:"ในงานบริการลูกค้าให้ทำให้นุ่มลงทั้งคู่ ใช้ 〜てもよろしいでしょうか ตอนขออนุญาต และใช้ ご遠慮ください แทน 〜てはいけません ที่ตรงเกินไป",
ex:[{j:"ここに座ってもいいですか。",k:"ここに すわっても いいですか。",e:"May I sit here?",t:"นั่งตรงนี้ได้ไหมครับ"},
{j:"館内では走ってはいけません。",k:"かんないでは はしっては いけません。",e:"You must not run inside the building.",t:"ห้ามวิ่งภายในอาคารครับ"}]},

{id:"n3c05",lv:"N3",cat:"義務・許可",p:"〜しかない",conn:"V辞書形／N ＋ しかない",
en:"There's no choice but to; there's only.",
th:"ไม่มีทางเลือกนอกจาก; มีแค่",
note_en:"しか always pairs with a negative. Note the resigned tone — 待つしかない means you'd rather not, but you must.",
note_th:"しか ต้องคู่กับรูปปฏิเสธเสมอ สังเกตน้ำเสียงที่จำยอม เช่น 待つしかない หมายถึงไม่อยากรอ แต่ต้องรอ",
ex:[{j:"電車がないので、歩くしかない。",k:"でんしゃが ないので、あるく しか ない。",e:"There's no train, so I've no choice but to walk.",t:"ไม่มีรถไฟ ก็เลยต้องเดินอย่างเดียว"},
{j:"財布には千円しかありません。",k:"さいふには せんえん しか ありません。",e:"I've only got a thousand yen in my wallet.",t:"ในกระเป๋ามีแค่พันเยนครับ"}]},

{id:"n3c06",lv:"N3",cat:"義務・許可",p:"〜わけにはいかない",conn:"V辞書形／Vない ＋ わけにはいかない",
en:"I can't (for social, moral or practical reasons) — even though I'm physically able.",
th:"ทำไม่ได้ (ด้วยเหตุผลทางสังคม ศีลธรรม หรือสถานการณ์) ทั้ง ๆ ที่ทำได้ทางกายภาพ",
note_en:"Different from できない. できない = incapable. わけにはいかない = capable but not permitted by circumstance. 熱があるが、休むわけにはいかない.",
note_th:"ต่างจาก できない ตรงที่ できない = ทำไม่ได้จริง ๆ ส่วน わけにはいかない = ทำได้แต่สถานการณ์ไม่อนุญาต เช่น 熱があるが、休むわけにはいかない",
ex:[{j:"大事な会議だから、休むわけにはいかない。",k:"だいじな かいぎだから、やすむ わけには いかない。",e:"It's an important meeting, so I can't take the day off.",t:"เป็นประชุมสำคัญ จะหยุดไม่ได้"},
{j:"友達の頼みだから、断るわけにはいかない。",k:"ともだちの たのみだから、ことわる わけには いかない。",e:"It's a friend asking, so I can't very well refuse.",t:"เพื่อนขอมา จะปฏิเสธก็ไม่ได้"}]},

{id:"n3c07",lv:"N3",cat:"名詞化・引用",p:"〜こと / 〜の（名詞化）",conn:"V辞書形／V普通形 ＋ こと・の",
en:"Turns a verb or clause into a noun.",
th:"เปลี่ยนกริยาหรืออนุประโยคให้เป็นคำนาม",
note_en:"の for things you see, hear or feel directly (見る, 聞こえる, 手伝う). こと for abstract things (できる, 大切だ, 決める). 音楽を聞くのが好き uses の.",
note_th:"ใช้ の กับสิ่งที่เห็น ได้ยิน หรือรู้สึกโดยตรง (見る 聞こえる 手伝う) ใช้ こと กับสิ่งที่เป็นนามธรรม (できる 大切だ 決める) เช่น 音楽を聞くのが好き ใช้ の",
ex:[{j:"日本語を話すことは楽しいです。",k:"にほんごを はなす ことは たのしいです。",e:"Speaking Japanese is fun.",t:"การพูดภาษาญี่ปุ่นสนุกครับ"},
{j:"彼が走っているのが見えた。",k:"かれが はしって いるのが みえた。",e:"I saw him running.",t:"เห็นเขากำลังวิ่งอยู่"}]},

{id:"n3c08",lv:"N3",cat:"名詞化・引用",p:"〜という",conn:"N／普通形 ＋ という＋N",
en:"Called; the fact that — introduces a name or defines a following noun.",
th:"ที่ชื่อว่า; ข้อเท็จจริงที่ว่า — ใช้แนะนำชื่อหรือขยายคำนามข้างหลัง",
note_en:"Use it when the listener doesn't know the name yet: 山田という人 (a person called Yamada). Also joins a whole sentence to a noun: 合格したという知らせ.",
note_th:"ใช้ตอนที่ผู้ฟังยังไม่รู้จักชื่อนั้น เช่น 山田という人 (คนที่ชื่อยามาดะ) และใช้เชื่อมทั้งประโยคเข้ากับคำนามได้ เช่น 合格したという知らせ",
ex:[{j:"「ラーメン」という料理を知っていますか。",k:"「ラーメン」という りょうりを しって いますか。",e:"Do you know a dish called ramen?",t:"รู้จักอาหารที่ชื่อว่าราเมงไหมครับ"},
{j:"試験に落ちたという話を聞いた。",k:"しけんに おちたという はなしを きいた。",e:"I heard the news that he failed the exam.",t:"ได้ยินเรื่องที่ว่าเขาสอบตก"}]},

{id:"n3c09",lv:"N3",cat:"名詞化・引用",p:"〜さ（形容詞の名詞化）",conn:"イA（い削除）＋さ／ナA＋さ",
en:"Turns an adjective into a noun expressing degree.",
th:"เปลี่ยนคำคุณศัพท์ให้เป็นคำนามที่บอกระดับ",
note_en:"さ = objective degree (高さ = height as a measurement). み = subjective feeling (温かみ = a sense of warmth). さ is far more productive.",
note_th:"さ = ระดับเชิงวัตถุวิสัย (高さ = ความสูงที่วัดได้) ส่วน み = ความรู้สึกเชิงอัตวิสัย (温かみ = ความรู้สึกอบอุ่น) さ ใช้ได้กว้างกว่ามาก",
ex:[{j:"この山の高さは3000メートルです。",k:"この やまの たかさは さんぜん メートル です。",e:"This mountain's height is 3,000 metres.",t:"ภูเขาลูกนี้สูง 3,000 เมตรครับ"},
{j:"家族の大切さに気づいた。",k:"かぞくの たいせつさに きづいた。",e:"I realised how precious family is.",t:"เพิ่งรู้ว่าครอบครัวสำคัญแค่ไหน"}]},

{id:"n3c10",lv:"N3",cat:"名詞化・引用",p:"〜がる / 〜がっている",conn:"イA（い削除）／ナA ＋ がる",
en:"Shows that a THIRD PERSON appears to feel something.",
th:"แสดงว่า 'บุคคลที่สาม' ดูเหมือนจะรู้สึกอย่างนั้น",
note_en:"A rule that surprises learners: you can't say 彼は寂しい. Feelings of others need がる — 彼は寂しがっている. Japanese treats other people's insides as unknowable.",
note_th:"กฎที่ผู้เรียนมักตกใจ: พูดว่า 彼は寂しい ไม่ได้ ความรู้สึกของคนอื่นต้องใช้ がる เช่น 彼は寂しがっている ภาษาญี่ปุ่นถือว่าใจคนอื่นเรารู้ไม่ได้",
ex:[{j:"子供が犬を怖がっている。",k:"こどもが いぬを こわがって いる。",e:"The child is scared of the dog.",t:"เด็กกำลังกลัวหมาอยู่"},
{j:"母がタイに行きたがっています。",k:"ははが タイに いきたがって います。",e:"My mother wants to go to Thailand.",t:"แม่อยากไปเมืองไทยครับ"}]},

{id:"n3c11",lv:"N3",cat:"複合動詞",p:"〜はじめる / 〜だす",conn:"Vます形＋はじめる・だす",
en:"To start doing. だす = suddenly, unexpectedly.",
th:"เริ่มทำ ส่วน だす = เริ่มขึ้นอย่างกะทันหันโดยไม่คาดคิด",
note_en:"はじめる can be planned; だす cannot. So 勉強しはじめる is fine, but 泣きだす (burst into tears) needs だす. You can't command with だす.",
note_th:"はじめる วางแผนได้ ส่วน だす วางแผนไม่ได้ เช่น 勉強しはじめる ใช้ได้ แต่ 泣きだす (ร้องไห้โฮ) ต้องใช้ だす และใช้ だす เป็นคำสั่งไม่ได้",
ex:[{j:"去年から日本語を習いはじめました。",k:"きょねんから にほんごを ならい はじめました。",e:"I started learning Japanese last year.",t:"เริ่มเรียนภาษาญี่ปุ่นตั้งแต่ปีที่แล้วครับ"},
{j:"急に雨が降りだした。",k:"きゅうに あめが ふりだした。",e:"It suddenly started raining.",t:"จู่ ๆ ฝนก็ตกลงมา"}]},

{id:"n3c12",lv:"N3",cat:"複合動詞",p:"〜つづける / 〜おわる",conn:"Vます形＋つづける・おわる",
en:"To keep doing / to finish doing.",
th:"ทำต่อไปเรื่อย ๆ / ทำเสร็จ",
note_en:"つづける is transitive (you keep doing it); つづく is intransitive (it continues by itself). 雨が降り続く vs 勉強を続ける.",
note_th:"つづける เป็นสกรรมกริยา (เราทำต่อ) ส่วน つづく เป็นอกรรมกริยา (มันดำเนินไปเอง) เช่น 雨が降り続く กับ 勉強を続ける",
ex:[{j:"7年間、日本語を勉強し続けています。",k:"ななねんかん、にほんごを べんきょう しつづけて います。",e:"I've kept studying Japanese for seven years.",t:"เรียนภาษาญี่ปุ่นต่อเนื่องมา 7 ปีแล้วครับ"},
{j:"この本を読み終わったら貸します。",k:"この ほんを よみおわったら かします。",e:"I'll lend you this book when I finish it.",t:"อ่านหนังสือเล่มนี้จบแล้วจะให้ยืมนะ"}]},

{id:"n3c13",lv:"N3",cat:"複合動詞",p:"〜きる / 〜きれない",conn:"Vます形＋きる・きれない",
en:"To do completely, to the very end. きれない = can't finish / too much to.",
th:"ทำจนหมดจนสุด ส่วน きれない = ทำไม่หมด / มากเกินกว่าจะทำได้",
note_en:"Adds a sense of exhausting the whole amount. 食べきる = eat every last bit. 数えきれない = countless, too many to count.",
note_th:"เพิ่มความรู้สึกว่าทำจนหมดเกลี้ยง เช่น 食べきる = กินหมดเกลี้ยง ส่วน 数えきれない = นับไม่ถ้วน มากจนนับไม่หมด",
ex:[{j:"この量は一人では食べきれません。",k:"この りょうは ひとりでは たべきれません。",e:"I can't finish this amount alone.",t:"ปริมาณขนาดนี้คนเดียวกินไม่หมดครับ"},
{j:"最後まで走りきった。",k:"さいごまで はしりきった。",e:"I ran it right to the finish.",t:"วิ่งจนจบถึงเส้นชัย"}]},

{id:"n3c14",lv:"N3",cat:"複合動詞",p:"〜かける / 〜かけだ",conn:"Vます形＋かける・かけだ",
en:"To start and leave unfinished; to be on the verge of.",
th:"เริ่มทำแล้วค้างไว้ไม่เสร็จ; กำลังจะ",
note_en:"読みかけの本 = a book I've started but not finished. Also 死にかける = to nearly die. The image is 'halfway through the doorway'.",
note_th:"読みかけの本 = หนังสือที่เริ่มอ่านแต่ยังไม่จบ และ 死にかける = เกือบตาย ภาพในหัวคือ 'อยู่กลางประตู'",
ex:[{j:"読みかけの本が机の上にある。",k:"よみかけの ほんが つくえの うえに ある。",e:"There's a half-read book on the desk.",t:"มีหนังสือที่อ่านค้างไว้อยู่บนโต๊ะ"},
{j:"何か言いかけて、やめた。",k:"なにか いいかけて、やめた。",e:"He started to say something, then stopped.",t:"เขาจะพูดอะไรบางอย่างแล้วก็หยุด"}]},

{id:"n3c15",lv:"N3",cat:"複合動詞",p:"〜やすい / 〜にくい",conn:"Vます形＋やすい・にくい",
en:"Easy to / hard to do.",
th:"ทำง่าย / ทำยาก",
note_en:"These become い-adjectives, so they conjugate normally: 分かりやすかった, 使いにくくて. Very useful for describing tools, textbooks, and explanations.",
note_th:"เมื่อรวมแล้วจะกลายเป็นคำคุณศัพท์ い จึงผันได้ เช่น 分かりやすかった, 使いにくくて ใช้ได้ดีมากตอนบรรยายเครื่องมือ หนังสือเรียน และคำอธิบาย",
