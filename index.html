ex:[{j:"この先生の説明は分かりやすい。",k:"この せんせいの せつめいは わかりやすい。",e:"This teacher's explanations are easy to follow.",t:"คำอธิบายของอาจารย์คนนี้เข้าใจง่าย"},
{j:"この漢字は覚えにくいです。",k:"この かんじは おぼえにくい です。",e:"This kanji is hard to memorise.",t:"คันจิตัวนี้จำยากครับ"}]},

{id:"n3c16",lv:"N3",cat:"接続・助詞",p:"〜について",conn:"N＋について",
en:"About; concerning — the topic of thinking, writing, speaking.",
th:"เกี่ยวกับ — เป็นหัวข้อของการคิด เขียน พูด",
note_en:"について is the content itself. に対して is the direction you aim at. 日本について話す (talk about Japan) vs 日本に対して意見がある (have an opinion toward Japan).",
note_th:"について คือตัวเนื้อหา ส่วน に対して คือทิศทางที่มุ่งไป เช่น 日本について話す (พูดเกี่ยวกับญี่ปุ่น) กับ 日本に対して意見がある (มีความเห็นต่อญี่ปุ่น)",
ex:[{j:"日本の文化について研究しています。",k:"にほんの ぶんかに ついて けんきゅう して います。",e:"I'm researching Japanese culture.",t:"กำลังวิจัยเกี่ยวกับวัฒนธรรมญี่ปุ่นครับ"},
{j:"この件については、後で説明します。",k:"この けんに ついては、あとで せつめい します。",e:"I'll explain about this matter later.",t:"เรื่องนี้จะอธิบายทีหลังครับ"}]},

{id:"n3c17",lv:"N3",cat:"接続・助詞",p:"〜に対して",conn:"N＋に対して",
en:"Toward; in contrast to — direction of attitude or action.",
th:"ต่อ; ในทางตรงข้ามกับ — ทิศทางของท่าที หรือการกระทำ",
note_en:"Two uses: aiming an attitude at someone (お客様に対して丁寧に), and contrasting two things (兄は静かなのに対して、弟は騒がしい).",
note_th:"มีสองความหมาย: มุ่งท่าทีไปยังใคร (お客様に対して丁寧に) และเปรียบเทียบสองสิ่ง (兄は静かなのに対して、弟は騒がしい)",
ex:[{j:"お客様に対して失礼な態度を取ってはいけない。",k:"おきゃくさまに たいして しつれいな たいどを とっては いけない。",e:"You must not be rude toward customers.",t:"ห้ามทำท่าทีเสียมารยาทต่อลูกค้าครับ"},
{j:"兄は静かなのに対して、弟はよく話す。",k:"あにはしずかなのに たいして、おとうとは よく はなす。",e:"Whereas my older brother is quiet, my younger brother talks a lot.",t:"พี่ชายเงียบ ๆ ในขณะที่น้องชายพูดเก่ง"}]},

{id:"n3c18",lv:"N3",cat:"接続・助詞",p:"〜によって / 〜による",conn:"N＋によって・による",
en:"Depending on; by means of; by (agent); due to.",
th:"ขึ้นอยู่กับ; โดยวิธี; โดย (ผู้กระทำ); เนื่องจาก",
note_en:"Four meanings in one form — read the context. In passive sentences it marks the doer: この本は夏目漱石によって書かれた.",
note_th:"รูปเดียวมีสี่ความหมาย ต้องดูบริบท ในประโยคถูกกระทำจะใช้ระบุผู้กระทำ เช่น この本は夏目漱石によって書かれた",
ex:[{j:"人によって考え方が違う。",k:"ひとに よって かんがえかたが ちがう。",e:"Ways of thinking differ from person to person.",t:"วิธีคิดต่างกันไปตามแต่ละคน"},
{j:"地震による被害が大きい。",k:"じしんに よる ひがいが おおきい。",e:"The damage from the earthquake is severe.",t:"ความเสียหายจากแผ่นดินไหวรุนแรงมาก"}]},

{id:"n3c19",lv:"N3",cat:"接続・助詞",p:"〜として",conn:"N＋として",
en:"As; in the capacity of.",
th:"ในฐานะ; ในบทบาทของ",
note_en:"Marks a role or status. Essential in interviews: スタッフとして, 責任者として, 外国人として.",
note_th:"ใช้ระบุบทบาทหรือสถานะ จำเป็นมากในการสัมภาษณ์งาน เช่น スタッフとして, 責任者として, 外国人として",
ex:[{j:"留学生として日本に来ました。",k:"りゅうがくせいとして にほんに きました。",e:"I came to Japan as an exchange student.",t:"มาญี่ปุ่นในฐานะนักเรียนแลกเปลี่ยนครับ"},
{j:"スタッフとして、お客様を第一に考えます。",k:"スタッフとして、おきゃくさまを だいいちに かんがえます。",e:"As a staff member, I put customers first.",t:"ในฐานะพนักงาน ผมคิดถึงลูกค้าเป็นอันดับแรกครับ"}]},

{id:"n3c20",lv:"N3",cat:"接続・助詞",p:"〜とともに",conn:"N／V辞書形 ＋ とともに",
en:"Together with; as X changes, Y changes too.",
th:"พร้อมกับ; เมื่อ X เปลี่ยน Y ก็เปลี่ยนตาม",
note_en:"Formal and written. Same as 〜につれて for the change meaning, but とともに can also simply mean 'along with someone'.",
note_th:"เป็นทางการและเป็นภาษาเขียน ความหมายเรื่องการเปลี่ยนแปลงเหมือน 〜につれて แต่ とともに ยังแปลว่า 'พร้อมกับใครสักคน' ได้ด้วย",
ex:[{j:"年をとるとともに、記憶力が落ちる。",k:"としを とると ともに、きおくりょくが おちる。",e:"As you age, your memory declines.",t:"พออายุมากขึ้น ความจำก็แย่ลง"},
{j:"家族とともに大阪に住んでいます。",k:"かぞくと ともに おおさかに すんで います。",e:"I live in Osaka with my family.",t:"อาศัยอยู่ที่โอซาก้ากับครอบครัวครับ"}]},

{id:"n3c21",lv:"N3",cat:"接続・助詞",p:"〜だらけ",conn:"N＋だらけ",
en:"Covered in; full of (something unpleasant).",
th:"เต็มไปด้วย (สิ่งที่ไม่น่าพอใจ)",
note_en:"Always negative and always visible mess: 泥だらけ, 間違いだらけ, 傷だらけ. Never use it for good things.",
note_th:"เป็นลบเสมอ และมักเป็นความเลอะเทอะที่มองเห็น เช่น 泥だらけ, 間違いだらけ, 傷だらけ ห้ามใช้กับสิ่งดี ๆ",
ex:[{j:"作文が間違いだらけだった。",k:"さくぶんが まちがい だらけ だった。",e:"My essay was riddled with mistakes.",t:"เรียงความเต็มไปด้วยข้อผิดพลาด"},
{j:"子供が泥だらけになって帰ってきた。",k:"こどもが どろ だらけに なって かえって きた。",e:"The child came home covered in mud.",t:"เด็กกลับบ้านมาตัวเปื้อนโคลนไปหมด"}]},

{id:"n3c22",lv:"N3",cat:"接続・助詞",p:"〜がち",conn:"Vます形／N ＋ がち",
en:"Tends to; prone to (usually a bad tendency).",
th:"มักจะ; มีแนวโน้มที่จะ (มักเป็นแนวโน้มไม่ดี)",
note_en:"Describes frequency you'd rather reduce: 忘れがち, 休みがち, 遅れがち. Not for neutral habits.",
note_th:"บอกความถี่ที่เราอยากลด เช่น 忘れがち, 休みがち, 遅れがち ไม่ใช้กับนิสัยกลาง ๆ",
ex:[{j:"忙しいと、食事が不規則になりがちだ。",k:"いそがしいと、しょくじが ふきそくに なりがちだ。",e:"When you're busy, meals tend to become irregular.",t:"พอยุ่ง มื้ออาหารก็มักจะไม่เป็นเวลา"},
{j:"最近、彼は学校を休みがちです。",k:"さいきん、かれは がっこうを やすみがち です。",e:"Lately he's been missing school a lot.",t:"ช่วงนี้เขามักจะขาดเรียนบ่อยครับ"}]},

{id:"n3c23",lv:"N3",cat:"接続・助詞",p:"〜っぽい",conn:"N／イA（い削除）／Vます形 ＋ っぽい",
en:"-ish; has the quality of; tends to.",
th:"ออกแนว; มีลักษณะแบบ; มักจะ",
note_en:"Casual and often mildly critical. 子供っぽい (childish) is negative, whereas 子供らしい (childlike, as a child should be) is positive. Big difference.",
note_th:"เป็นภาษากันเองและมักออกแนวติเล็กน้อย 子供っぽい (ทำตัวเป็นเด็ก) เป็นลบ ในขณะที่ 子供らしい (สมกับเป็นเด็ก) เป็นบวก ต่างกันมาก",
ex:[{j:"その言い方は子供っぽいよ。",k:"その いいかたは こどもっぽいよ。",e:"That way of speaking sounds childish.",t:"พูดแบบนั้นฟังดูเด็ก ๆ นะ"},
{j:"最近、忘れっぽくなった。",k:"さいきん、わすれっぽく なった。",e:"I've become forgetful lately.",t:"ช่วงนี้กลายเป็นคนขี้ลืม"}]},

{id:"n3c24",lv:"N3",cat:"接続・助詞",p:"〜ば〜ほど（強調）/ 〜ほど",conn:"N／V辞書形 ＋ ほど",
en:"To the degree of; so much that.",
th:"ถึงขนาดที่; มากจนถึงขั้น",
note_en:"ほど gives the yardstick for a degree. It's the same word used in ば〜ほど and in 〜ほど〜ない — one core meaning, three uses.",
note_th:"ほど เป็นไม้บรรทัดวัดระดับ เป็นคำเดียวกับที่ใช้ใน ば〜ほど และ 〜ほど〜ない คือแก่นความหมายเดียว แต่ใช้ได้สามแบบ",
ex:[{j:"泣きたいほど嬉しかった。",k:"なきたい ほど うれしかった。",e:"I was happy enough to cry.",t:"ดีใจจนถึงขั้นอยากร้องไห้"},
{j:"死ぬほど疲れた。",k:"しぬ ほど つかれた。",e:"I'm dead tired.",t:"เหนื่อยจะตายอยู่แล้ว"}]},

{id:"n3c25",lv:"N3",cat:"接続・助詞",p:"〜ものだ",conn:"V辞書形／Vた／イA／ナA な ＋ ものだ",
en:"Three uses: a general truth, a nostalgic memory, or strong feeling.",
th:"มีสามความหมาย: ความจริงทั่วไป, ความทรงจำที่คิดถึง, หรืออารมณ์ที่รุนแรง",
note_en:"Dictionary form = general truth (人は年をとるものだ). た-form = 'I used to...' with nostalgia (よく遊んだものだ). Neither is optional at N2.",
note_th:"รูปพจนานุกรม = ความจริงทั่วไป (人は年をとるものだ) รูป た = 'เมื่อก่อนเคย...' พร้อมความคิดถึง (よく遊んだものだ) ทั้งสองแบบต้องรู้ในระดับ N2",
ex:[{j:"時間が経つのは早いものだ。",k:"じかんが たつのは はやい ものだ。",e:"How quickly time passes.",t:"เวลาผ่านไปเร็วจริง ๆ นะ"},
{j:"子供のころ、よくこの川で泳いだものだ。",k:"こどもの ころ、よく この かわで およいだ ものだ。",e:"As a child I used to swim in this river a lot.",t:"ตอนเด็ก ๆ เคยว่ายน้ำในแม่น้ำสายนี้บ่อย ๆ"}]},

{id:"n3c26",lv:"N3",cat:"接続・助詞",p:"〜ことがある / 〜たことがある",conn:"V辞書形＋ことがある／Vた＋ことがある",
en:"Dictionary form = it sometimes happens. た-form = I have experience of.",
th:"รูปพจนานุกรม = บางครั้งก็มี ส่วนรูป た = เคยมีประสบการณ์",
note_en:"One kana, two completely different meanings. 行くことがある = I sometimes go. 行ったことがある = I've been there before.",
note_th:"คานะตัวเดียวแต่ความหมายต่างกันสิ้นเชิง 行くことがある = บางครั้งก็ไป ส่วน 行ったことがある = เคยไปมาแล้ว",
ex:[{j:"たまに朝ごはんを抜くことがある。",k:"たまに あさごはんを ぬく ことが ある。",e:"I sometimes skip breakfast.",t:"บางครั้งก็ข้ามมื้อเช้า"},
{j:"京都に行ったことがありますか。",k:"きょうとに いった ことが ありますか。",e:"Have you ever been to Kyoto?",t:"เคยไปเกียวโตไหมครับ"}]},

{id:"n3c27",lv:"N3",cat:"接続・助詞",p:"〜ほうがいい",conn:"Vた／Vない ＋ ほうがいい",
en:"You'd better; it's better to.",
th:"ควรจะ...ดีกว่า",
note_en:"Affirmative advice uses the た-form — 休んだほうがいい, not 休むほうがいい. This is a very common error.",
note_th:"คำแนะนำในรูปบอกเล่าต้องใช้รูป た เช่น 休んだほうがいい ไม่ใช่ 休むほうがいい เป็นข้อผิดพลาดที่พบบ่อยมาก",
ex:[{j:"熱があるなら、病院に行ったほうがいい。",k:"ねつが あるなら、びょういんに いった ほうが いい。",e:"If you have a fever, you'd better go to the doctor.",t:"ถ้ามีไข้ ไปโรงพยาบาลดีกว่านะ"},
{j:"無理しないほうがいいですよ。",k:"むり しない ほうが いいですよ。",e:"You'd better not overdo it.",t:"อย่าฝืนดีกว่านะครับ"}]},

{id:"n3c28",lv:"N3",cat:"接続・助詞",p:"〜たがる",conn:"Vます形＋たがる",
en:"A third person shows they want to do something.",
th:"บุคคลที่สามแสดงออกว่าอยากทำอะไรบางอย่าง",
note_en:"Same rule as がる. 私は行きたい but 彼は行きたがっている. Using たい about others sounds like you can read their mind.",
note_th:"กฎเดียวกับ がる คือ 私は行きたい แต่ต้อง 彼は行きたがっている ถ้าใช้ たい กับคนอื่นจะฟังเหมือนเราอ่านใจเขาได้",
ex:[{j:"弟が新しいゲームを買いたがっている。",k:"おとうとが あたらしい ゲームを かいたがって いる。",e:"My little brother wants to buy a new game.",t:"น้องชายอยากซื้อเกมใหม่"},
{j:"彼はあまり話したがらない。",k:"かれは あまり はなしたがらない。",e:"He's reluctant to talk much.",t:"เขาไม่ค่อยอยากพูด"}]},

{id:"n3c29",lv:"N3",cat:"接続・助詞",p:"〜において / 〜における",conn:"N＋において・における",
en:"In; at; regarding (formal written 'in').",
th:"ใน; ที่; ในด้าน (คำว่า 'ใน' แบบทางการในภาษาเขียน)",
note_en:"The formal replacement for で. Appears in ceremonies, reports, and notices. 会議室において行われる.",
note_th:"เป็นรูปทางการที่ใช้แทน で เจอในพิธีการ รายงาน และประกาศ เช่น 会議室において行われる",
ex:[{j:"式は大ホールにおいて行われます。",k:"しきは だいホールに おいて おこなわれます。",e:"The ceremony will be held in the main hall.",t:"พิธีจะจัดขึ้นที่ห้องโถงใหญ่ครับ"},
{j:"現代社会における問題を考える。",k:"げんだい しゃかいに おける もんだいを かんがえる。",e:"To consider problems in modern society.",t:"พิจารณาปัญหาในสังคมสมัยใหม่"}]},

{id:"n3c30",lv:"N3",cat:"接続・助詞",p:"〜にとって",conn:"N＋にとって",
en:"From the standpoint of; for someone.",
th:"สำหรับ; จากมุมมองของ",
note_en:"Followed by an evaluation: 大切だ, 難しい, 必要だ. Don't confuse with に対して (direction) or として (role).",
note_th:"ตามด้วยคำประเมิน เช่น 大切だ 難しい 必要だ อย่าสับสนกับ に対して (ทิศทาง) หรือ として (บทบาท)",
ex:[{j:"私にとって、家族が一番大切です。",k:"わたしに とって、かぞくが いちばん たいせつ です。",e:"For me, family matters most.",t:"สำหรับผม ครอบครัวสำคัญที่สุดครับ"},
{j:"外国人にとって、敬語は難しい。",k:"がいこくじんに とって、けいごは むずかしい。",e:"For foreigners, keigo is difficult.",t:"สำหรับชาวต่างชาติ ภาษายกย่องยากมาก"}]},

{id:"n3c31",lv:"N3",cat:"接続・助詞",p:"〜ながら（同時）",conn:"Vます形＋ながら",
en:"While doing — two actions at once by the same person.",
th:"ขณะที่ทำ — คนเดียวกันทำสองอย่างพร้อมกัน",
note_en:"The ながら clause is the SECONDARY action; the main verb comes last. 音楽を聞きながら勉強する means studying is the main thing.",
note_th:"ประโยค ながら คือการกระทำรอง ส่วนกริยาหลักอยู่ท้าย เช่น 音楽を聞きながら勉強する หมายความว่าการเรียนคือสิ่งหลัก",
ex:[{j:"音楽を聞きながら勉強します。",k:"おんがくを ききながら べんきょう します。",e:"I study while listening to music.",t:"เรียนไปฟังเพลงไป"},
{j:"働きながら日本語学校に通っている。",k:"はたらきながら にほんご がっこうに かよって いる。",e:"I attend Japanese school while working.",t:"ทำงานไปด้วยเรียนโรงเรียนสอนภาษาญี่ปุ่นไปด้วย"}]},

{id:"n3c32",lv:"N3",cat:"接続・助詞",p:"〜てから",conn:"Vて＋から",
en:"After doing X, then Y — clear sequence.",
th:"หลังจากทำ X แล้วจึง Y — เป็นลำดับที่ชัดเจน",
note_en:"Emphasises order more strongly than the plain て-form. Use it when the sequence actually matters.",
note_th:"เน้นลำดับหนักแน่นกว่ารูป て เฉย ๆ ใช้เมื่อลำดับนั้นสำคัญจริง ๆ",
ex:[{j:"手を洗ってから食べてください。",k:"てを あらってから たべて ください。",e:"Please wash your hands before eating.",t:"กรุณาล้างมือก่อนแล้วค่อยทานครับ"},
{j:"日本に来てから、3年が経ちました。",k:"にほんに きてから、さんねんが たちました。",e:"Three years have passed since I came to Japan.",t:"ตั้งแต่มาญี่ปุ่นก็ผ่านมา 3 ปีแล้วครับ"}]},

{id:"n3c33",lv:"N3",cat:"接続・助詞",p:"〜たところ",conn:"Vた＋ところ",
en:"When I did X, it turned out that Y — a discovery.",
th:"พอทำ X แล้วก็พบว่า Y — เป็นการค้นพบ",
note_en:"Formal, written. The second clause is always a result you found out, never something you planned. 問い合わせたところ、在庫がなかった.",
note_th:"เป็นทางการและภาษาเขียน ประโยคหลังคือผลที่ค้นพบเสมอ ไม่ใช่สิ่งที่วางแผนไว้ เช่น 問い合わせたところ、在庫がなかった",
ex:[{j:"店に問い合わせたところ、まだ在庫があった。",k:"みせに といあわせた ところ、まだ ざいこが あった。",e:"When I enquired at the shop, they still had stock.",t:"พอสอบถามไปที่ร้าน ก็พบว่ายังมีของอยู่"},
{j:"調べてみたところ、間違いが見つかった。",k:"しらべて みた ところ、まちがいが みつかった。",e:"On checking, I found a mistake.",t:"พอลองตรวจดู ก็เจอข้อผิดพลาด"}]},

{id:"n3c34",lv:"N3",cat:"接続・助詞",p:"〜きり / 〜っきり",conn:"Vた＋きり／N＋きり",
en:"Only; and nothing since then.",
th:"แค่...เท่านั้น; และหลังจากนั้นก็ไม่มีอีกเลย",
note_en:"た＋きり implies the expected follow-up never came: 出かけたきり帰ってこない (went out and never came back).",
note_th:"た＋きり สื่อว่าสิ่งที่ควรตามมาไม่เกิดขึ้น เช่น 出かけたきり帰ってこない (ออกไปแล้วก็ไม่กลับมาอีกเลย)",
ex:[{j:"彼とは去年会ったきりです。",k:"かれとは きょねん あった きりです。",e:"I haven't seen him since last year.",t:"เจอเขาครั้งสุดท้ายเมื่อปีที่แล้วครับ"},
{j:"二人きりで話したい。",k:"ふたりきりで はなしたい。",e:"I want to talk just the two of us.",t:"อยากคุยกันแค่สองคน"}]},

{id:"n3c35",lv:"N3",cat:"接続・助詞",p:"〜みたいに / 〜ように（比喩）",conn:"N＋みたいに・のように",
en:"Like; in the manner of — simile.",
th:"เหมือนกับ; ในลักษณะของ — การเปรียบเทียบ",
note_en:"ように is formal, みたいに casual. Before a noun they become ような / みたいな.",
note_th:"ように เป็นทางการ ส่วน みたいに เป็นกันเอง เมื่ออยู่หน้าคำนามจะกลายเป็น ような / みたいな",
ex:[{j:"彼のように日本語を話したい。",k:"かれの ように にほんごを はなしたい。",e:"I want to speak Japanese like he does.",t:"อยากพูดภาษาญี่ปุ่นได้เหมือนเขา"},
{j:"夢みたいな話だ。",k:"ゆめ みたいな はなしだ。",e:"It's a story like a dream.",t:"เป็นเรื่องที่เหมือนฝันเลย"}]},
{id:"n2a01",lv:"N2",cat:"時・場面",p:"〜に際して",conn:"V辞書形／N ＋ にさいして",
en:"On the occasion of; at the time of (very formal).",
th:"ในโอกาสที่; ณ เวลาที่ (ทางการมาก)",
note_en:"Reserved for significant, formal occasions — never for everyday events. ×トイレに行くに際して. Ceremonies, contracts, openings only.",
note_th:"ใช้เฉพาะโอกาสสำคัญและเป็นทางการ ห้ามใช้กับเรื่องประจำวัน ×トイレに行くに際して ใช้กับพิธี สัญญา หรือการเปิดกิจการเท่านั้น",
ex:[{j:"入学に際して、一言申し上げます。",k:"にゅうがくに さいして、ひとこと もうしあげます。",e:"On the occasion of your enrolment, allow me a few words.",t:"ในโอกาสเข้าศึกษา ขออนุญาตกล่าวสักคำครับ"},
{j:"契約に際して、必要な書類をご用意ください。",k:"けいやくに さいして、ひつような しょるいを ごようい ください。",e:"Please prepare the necessary documents for the contract.",t:"กรุณาเตรียมเอกสารที่จำเป็นสำหรับการทำสัญญาครับ"}]},

{id:"n2a02",lv:"N2",cat:"時・場面",p:"〜に先立って / 〜に先立ち",conn:"V辞書形／N ＋ にさきだって",
en:"Prior to; in advance of (formal preparation).",
th:"ก่อนหน้า; ล่วงหน้าก่อนที่จะ (การเตรียมการอย่างเป็นทางการ)",
note_en:"Implies preparation done because the main event is coming. Not just 'before' — it's 'before, in readiness for'.",
note_th:"สื่อถึงการเตรียมตัวเพราะเหตุการณ์หลักกำลังจะมาถึง ไม่ใช่แค่ 'ก่อน' แต่คือ 'ก่อน เพื่อเตรียมพร้อมสำหรับ'",
ex:[{j:"開店に先立ち、スタッフの研修を行います。",k:"かいてんに さきだち、スタッフの けんしゅうを おこないます。",e:"Prior to opening, we will hold staff training.",t:"ก่อนเปิดร้าน จะมีการอบรมพนักงานครับ"},
{j:"出発に先立って、パスポートを確認した。",k:"しゅっぱつに さきだって、パスポートを かくにん した。",e:"Ahead of departure, I checked my passport.",t:"ก่อนออกเดินทาง ได้ตรวจสอบพาสปอร์ตแล้ว"}]},

{id:"n2a03",lv:"N2",cat:"時・場面",p:"〜次第",conn:"Vます形／N ＋ しだい",
en:"As soon as X happens (then I'll do Y).",
th:"ทันทีที่ X เกิดขึ้น (แล้วจะทำ Y)",
note_en:"The second clause must be FUTURE and volitional — you cannot use past tense. This is the business email version of 〜たらすぐ.",
note_th:"ประโยคหลังต้องเป็นอนาคตและเป็นความตั้งใจ ใช้รูปอดีตไม่ได้ เป็นรูปแบบอีเมลธุรกิจของ 〜たらすぐ",
ex:[{j:"到着次第、ご連絡いたします。",k:"とうちゃく しだい、ごれんらく いたします。",e:"I'll contact you as soon as I arrive.",t:"จะติดต่อกลับทันทีที่ไปถึงครับ"},
{j:"準備ができ次第、始めましょう。",k:"じゅんびが でき しだい、はじめましょう。",e:"Let's begin as soon as preparations are done.",t:"พอเตรียมเสร็จก็เริ่มกันเลยครับ"}]},

{id:"n2a04",lv:"N2",cat:"時・場面",p:"〜次第だ / 〜次第で",conn:"N＋しだいだ・しだいで",
en:"It depends entirely on X.",
th:"ขึ้นอยู่กับ X ทั้งหมด",
note_en:"Same word as above, completely different meaning — this one attaches to a NOUN and means 'depends on'. 天気次第です.",
note_th:"คำเดียวกับข้างบนแต่ความหมายต่างกันสิ้นเชิง ตัวนี้ต่อกับคำนามและแปลว่า 'ขึ้นอยู่กับ' เช่น 天気次第です",
ex:[{j:"行くかどうかは天気次第です。",k:"いくか どうかは てんき しだい です。",e:"Whether we go depends on the weather.",t:"จะไปหรือไม่ขึ้นอยู่กับสภาพอากาศครับ"},
{j:"努力次第で結果は変わる。",k:"どりょく しだいで けっかは かわる。",e:"Results change depending on your effort.",t:"ผลลัพธ์เปลี่ยนได้ขึ้นอยู่กับความพยายาม"}]},

{id:"n2a05",lv:"N2",cat:"時・場面",p:"〜てからでないと / 〜てからでなければ",conn:"Vて＋からでないと・からでなければ",
en:"Unless you do X first, Y is impossible.",
th:"ถ้าไม่ทำ X ก่อน ก็ Y ไม่ได้",
note_en:"The second half must be negative or express impossibility. It's a strict prerequisite.",
note_th:"ประโยคหลังต้องเป็นรูปปฏิเสธหรือแสดงความเป็นไปไม่ได้ เป็นเงื่อนไขบังคับที่เข้มงวด",
ex:[{j:"上司に確認してからでないと、お答えできません。",k:"じょうしに かくにん してからでないと、おこたえ できません。",e:"I can't answer until I check with my supervisor.",t:"ถ้ายังไม่ได้ยืนยันกับหัวหน้าก่อน ก็ตอบไม่ได้ครับ"},
{j:"申し込んでからでなければ、参加できない。",k:"もうしこんでからでなければ、さんか できない。",e:"You can't take part unless you've applied first.",t:"ถ้าไม่สมัครก่อนก็เข้าร่วมไม่ได้"}]},

{id:"n2a06",lv:"N2",cat:"時・場面",p:"〜か〜ないかのうちに",conn:"V辞書形＋か＋Vない＋かのうちに",
en:"No sooner had X happened than Y — almost simultaneous.",
th:"ยังไม่ทันจะ X ดีก็ Y แล้ว — เกือบพร้อมกัน",
note_en:"Even faster than たとたん. The second clause is past tense. Think of it as 'before X had even finished'.",
note_th:"เร็วกว่า たとたん อีก ประโยคหลังเป็นอดีต ให้นึกภาพว่า 'ก่อนที่ X จะจบด้วยซ้ำ'",
ex:[{j:"ベルが鳴るか鳴らないかのうちに、彼は教室を出た。",k:"ベルが なるか ならないかの うちに、かれは きょうしつを でた。",e:"The bell had barely rung when he was out of the classroom.",t:"เสียงกริ่งยังไม่ทันดังดี เขาก็ออกจากห้องเรียนแล้ว"},
{j:"横になるかならないかのうちに、眠ってしまった。",k:"よこに なるか ならないかの うちに、ねむって しまった。",e:"I was asleep almost before I'd lain down.",t:"ยังไม่ทันเอนตัวลงดีก็หลับไปแล้ว"}]},

{id:"n2a07",lv:"N2",cat:"時・場面",p:"〜かと思うと / 〜かと思ったら",conn:"Vた＋かとおもうと・かとおもったら",
en:"No sooner than; just when I thought X, then Y — surprise at a sudden change.",
th:"พอคิดว่า X ก็ Y ทันที — แปลกใจกับการเปลี่ยนแปลงกะทันหัน",
note_en:"Cannot be used about yourself, and the second clause can't be a request or command. It's for observing others' abrupt shifts.",
note_th:"ใช้กับตัวเองไม่ได้ และประโยคหลังห้ามเป็นคำขอร้องหรือคำสั่ง ใช้สำหรับสังเกตการเปลี่ยนแปลงกะทันหันของคนอื่น",
ex:[{j:"泣いていたかと思うと、もう笑っている。",k:"ないて いたかと おもうと、もう わらって いる。",e:"One moment he was crying, the next he's laughing.",t:"เมื่อกี้ยังร้องไห้อยู่เลย ตอนนี้หัวเราะแล้ว"},
{j:"帰ってきたかと思ったら、また出かけた。",k:"かえって きたかと おもったら、また でかけた。",e:"He'd barely got home before he went out again.",t:"เพิ่งกลับมาแท้ ๆ ก็ออกไปอีกแล้ว"}]},

{id:"n2a08",lv:"N2",cat:"時・場面",p:"〜て以来",conn:"Vて＋いらい／N＋いらい",
en:"Ever since X — and the state has continued unbroken.",
th:"ตั้งแต่ X เป็นต้นมา — และสภาพนั้นดำเนินต่อเนื่องมาโดยตลอด",
note_en:"Only for the distant-ish past with an unbroken continuation to now. Not for recent or trivial events: ×昨日食べて以来.",
note_th:"ใช้กับอดีตที่ค่อนข้างไกลและต่อเนื่องมาจนถึงปัจจุบันโดยไม่ขาดตอน ไม่ใช้กับเรื่องเพิ่งเกิดหรือเรื่องเล็ก ×昨日食べて以来",
ex:[{j:"日本に来て以来、一度も国に帰っていない。",k:"にほんに きて いらい、いちども くにに かえって いない。",e:"I haven't been back home once since coming to Japan.",t:"ตั้งแต่มาญี่ปุ่นก็ยังไม่เคยกลับบ้านเกิดเลยสักครั้ง"},
{j:"卒業以来、彼に会っていません。",k:"そつぎょう いらい、かれに あって いません。",e:"I haven't seen him since graduation.",t:"ตั้งแต่เรียนจบก็ไม่ได้เจอเขาอีกเลยครับ"}]},

{id:"n2a09",lv:"N2",cat:"時・場面",p:"〜上で",conn:"Vた／N の ＋ うえで",
en:"After doing X (and on that basis), do Y.",
th:"หลังจากทำ X (และบนพื้นฐานนั้น) จึงทำ Y",
note_en:"Not just 'after' — X provides the information or basis for Y. 相談した上で決める = decide based on having consulted.",
note_th:"ไม่ใช่แค่ 'หลังจาก' แต่ X เป็นข้อมูลหรือฐานสำหรับ Y เช่น 相談した上で決める = ตัดสินใจบนพื้นฐานที่ได้ปรึกษาแล้ว",
ex:[{j:"よく考えた上で、お返事します。",k:"よく かんがえた うえで、おへんじ します。",e:"I'll reply after giving it careful thought.",t:"จะตอบกลับหลังจากคิดให้ดีก่อนครับ"},
{j:"面接の上で、採用を決定します。",k:"めんせつの うえで、さいようを けってい します。",e:"We decide on hiring on the basis of the interview.",t:"จะตัดสินใจรับเข้าทำงานจากการสัมภาษณ์ครับ"}]},

{id:"n2a10",lv:"N2",cat:"時・場面",p:"〜ところに / 〜ところへ / 〜ところを",conn:"V辞書形／Vている／Vた ＋ ところに・ところへ・ところを",
en:"Right at the moment when X, something intruded.",
th:"ตรงจังหวะที่กำลัง X พอดี ก็มีอะไรเข้ามาแทรก",
note_en:"に/へ take an arriving event (電話がかかってきた). を takes a verb done TO you (見られた, 呼び止められた). The particle tells you who acts.",
note_th:"に/へ ใช้กับเหตุการณ์ที่เข้ามา (電話がかかってきた) ส่วน を ใช้กับกริยาที่คนอื่นทำกับเรา (見られた, 呼び止められた) คำช่วยบอกว่าใครเป็นผู้กระทำ",
ex:[{j:"出かけようとしたところに、来客があった。",k:"でかけようと した ところに、らいきゃくが あった。",e:"Just as I was leaving, a visitor arrived.",t:"ตอนกำลังจะออกไปพอดี ก็มีแขกมา"},
{j:"サボっているところを部長に見られた。",k:"サボって いる ところを ぶちょうに みられた。",e:"The manager caught me slacking off.",t:"โดนผู้จัดการเห็นตอนกำลังอู้งานพอดี"}]},

{id:"n2a11",lv:"N2",cat:"時・場面",p:"〜あげく(に)",conn:"Vた／N の ＋ あげく(に)",
en:"After all that, in the end (a bad outcome).",
th:"หลังจาก...มานาน สุดท้ายก็ (ผลลัพธ์ในทางลบ)",
note_en:"Always negative. The front clause must describe a long or troublesome process. 悩んだあげく、やめた.",
note_th:"เป็นลบเสมอ ประโยคหน้าต้องบรรยายกระบวนการที่ยาวนานหรือลำบาก เช่น 悩んだあげく、やめた",
ex:[{j:"さんざん迷ったあげく、買わないことにした。",k:"さんざん まよった あげく、かわない ことに した。",e:"After agonising over it, I decided not to buy it.",t:"ลังเลอยู่นานสุดท้ายก็ตัดสินใจไม่ซื้อ"},
{j:"長い議論のあげく、結論は出なかった。",k:"ながい ぎろんの あげく、けつろんは でなかった。",e:"After a long argument, no conclusion was reached.",t:"ถกเถียงกันนานสุดท้ายก็ไม่ได้ข้อสรุป"}]},

{id:"n2a12",lv:"N2",cat:"時・場面",p:"〜末(に)",conn:"Vた／N の ＋ すえ(に)",
en:"After much X, finally Y — a considered conclusion.",
th:"หลังจาก X มามาก สุดท้ายก็ Y — ข้อสรุปที่ผ่านการไตร่ตรอง",
note_en:"The partner of あげく. 末に is neutral or positive; あげく is negative. Both need a lengthy process in front.",
note_th:"เป็นคู่ของ あげく โดย 末に เป็นกลางหรือบวก ส่วน あげく เป็นลบ ทั้งคู่ต้องมีกระบวนการที่ยาวนานนำหน้า",
ex:[{j:"よく考えた末に、転職を決めました。",k:"よく かんがえた すえに、てんしょくを きめました。",e:"After much thought, I decided to change jobs.",t:"หลังจากคิดมาอย่างดี ก็ตัดสินใจเปลี่ยนงานครับ"},
{j:"長年の努力の末、夢を実現した。",k:"ながねんの どりょくの すえ、ゆめを じつげん した。",e:"After years of effort, he realised his dream.",t:"หลังจากพยายามมาหลายปี ก็ทำให้ความฝันเป็นจริงได้"}]},

{id:"n2a13",lv:"N2",cat:"原因・理由",p:"〜あまり(に)",conn:"V辞書形／Vた／N の ＋ あまり",
en:"So much X that Y happened (excessive degree causing a result).",
th:"เพราะ X มากเกินไปจน Y — ระดับที่มากเกินจนเกิดผล",
note_en:"The front clause must be an intense emotion or state: 心配, 驚き, 嬉しさ. The result is usually unexpected or extreme.",
note_th:"ประโยคหน้าต้องเป็นอารมณ์หรือสภาพที่รุนแรง เช่น 心配 驚き 嬉しさ ส่วนผลลัพธ์มักไม่คาดคิดหรือรุนแรง",
ex:[{j:"心配のあまり、眠れなかった。",k:"しんぱいの あまり、ねむれなかった。",e:"I was so worried I couldn't sleep.",t:"เพราะเป็นห่วงมากเกินไป เลยนอนไม่หลับ"},
{j:"驚きのあまり、声が出なかった。",k:"おどろきの あまり、こえが でなかった。",e:"I was so shocked I couldn't speak.",t:"ตกใจมากจนพูดไม่ออก"}]},

{id:"n2a14",lv:"N2",cat:"原因・理由",p:"〜ばかりに",conn:"V普通形／イA／ナA な／N である ＋ ばかりに",
en:"Just because of X, an unfortunate result followed.",
th:"เพียงเพราะ X เท่านั้น ก็เกิดผลร้ายตามมา",
note_en:"Always regretful. The speaker feels the cause was small but the damage was large. Compare with せいで, which just assigns blame.",
note_th:"มีความเสียใจเสมอ ผู้พูดรู้สึกว่าสาเหตุเล็กนิดเดียวแต่ความเสียหายใหญ่ ต่างจาก せいで ที่แค่โทษว่าเป็นเพราะสิ่งนั้น",
ex:[{j:"一言言わなかったばかりに、誤解された。",k:"ひとこと いわなかった ばかりに、ごかい された。",e:"Just because I didn't say one word, I was misunderstood.",t:"เพียงเพราะไม่ได้พูดแค่คำเดียว ก็เลยถูกเข้าใจผิด"},
{j:"保証書をなくしたばかりに、修理代を払った。",k:"ほしょうしょを なくした ばかりに、しゅうりだいを はらった。",e:"Just because I lost the warranty, I had to pay for repairs.",t:"เพียงเพราะทำใบรับประกันหาย ก็เลยต้องจ่ายค่าซ่อม"}]},

{id:"n2a15",lv:"N2",cat:"原因・理由",p:"〜だけに",conn:"V普通形／イA／ナA な／N ＋ だけに",
en:"Precisely because X — the result is all the more so.",
th:"ก็เพราะว่า X นั่นแหละ — ผลจึงยิ่งเป็นแบบนั้น",
note_en:"The result matches the cause and is intensified by it. 期待していただけに、がっかりした = the disappointment is bigger because the hope was.",
note_th:"ผลสอดคล้องกับสาเหตุและถูกเน้นให้แรงขึ้น เช่น 期待していただけに、がっかりした = ผิดหวังมากขึ้นเพราะเคยคาดหวังไว้มาก",
ex:[{j:"期待していただけに、結果が残念だ。",k:"きたい して いた だけに、けっかが ざんねんだ。",e:"Precisely because I'd hoped for it, the result is disappointing.",t:"ก็เพราะคาดหวังไว้นั่นแหละ ผลลัพธ์เลยยิ่งน่าเสียดาย"},
{j:"若いだけに、回復が早い。",k:"わかい だけに、かいふくが はやい。",e:"Being young, he recovers quickly.",t:"ก็เพราะยังหนุ่มนั่นแหละ ถึงฟื้นตัวเร็ว"}]},

{id:"n2a16",lv:"N2",cat:"原因・理由",p:"〜ことだから",conn:"N の ＋ ことだから",
en:"Given that it's X (whose character we both know), surely...",
th:"เพราะเป็น X (ที่เรารู้นิสัยกันดี) ก็คงจะ...",
note_en:"Only for people whose personality is shared knowledge between speaker and listener. It's a prediction based on character.",
note_th:"ใช้เฉพาะกับคนที่ทั้งผู้พูดและผู้ฟังรู้นิสัยร่วมกัน เป็นการคาดเดาจากนิสัยของคนนั้น",
ex:[{j:"彼のことだから、また遅刻するだろう。",k:"かれの ことだから、また ちこく するだろう。",e:"Knowing him, he'll be late again.",t:"เป็นเขาแล้ว คงมาสายอีกแน่ ๆ"},
{j:"真面目な田中さんのことだから、きっと来る。",k:"まじめな たなかさんの ことだから、きっと くる。",e:"Tanaka-san is diligent, so he'll definitely come.",t:"คุณทานากะเป็นคนจริงจัง ยังไงก็ต้องมาแน่"}]},

{id:"n2a17",lv:"N2",cat:"原因・理由",p:"〜以上(は)",conn:"V普通形／イA／ナA である／N である ＋ いじょう(は)",
en:"Now that X is the case, naturally Y must follow.",
th:"ในเมื่อ X แล้ว ก็ต้อง Y เป็นธรรมดา",
note_en:"Near-identical to からには. 以上は is slightly more logical and formal; からには is slightly more emotional and resolute.",
note_th:"เกือบเหมือน からには โดย 以上は เป็นเหตุเป็นผลและทางการกว่าเล็กน้อย ส่วน からには มีอารมณ์และความมุ่งมั่นมากกว่า",
ex:[{j:"約束した以上、守らなければならない。",k:"やくそく した いじょう、まもらなければ ならない。",e:"Now that I've promised, I must keep it.",t:"ในเมื่อสัญญาไปแล้ว ก็ต้องรักษาคำพูด"},
{j:"社会人である以上、責任がある。",k:"しゃかいじんである いじょう、せきにんが ある。",e:"As a working adult, you have responsibilities.",t:"ในเมื่อเป็นคนทำงานแล้ว ก็ต้องมีความรับผิดชอบ"}]},

{id:"n2a18",lv:"N2",cat:"原因・理由",p:"〜おそれがある",conn:"V辞書形／N の ＋ おそれがある",
en:"There is a risk that (something bad may occur).",
th:"มีความเสี่ยงว่าจะ (เกิดสิ่งไม่ดี)",
note_en:"Only for undesirable outcomes, and mainly in news, weather warnings and official notices. ×合格するおそれがある.",
note_th:"ใช้เฉพาะผลลัพธ์ที่ไม่พึงประสงค์ และใช้ในข่าว คำเตือนสภาพอากาศ และประกาศทางการเป็นหลัก ×合格するおそれがある",
ex:[{j:"台風が上陸するおそれがあります。",k:"たいふうが じょうりく する おそれが あります。",e:"There's a risk the typhoon will make landfall.",t:"มีความเสี่ยงที่พายุไต้ฝุ่นจะขึ้นฝั่งครับ"},
{j:"このままでは倒産のおそれがある。",k:"この ままでは とうさんの おそれが ある。",e:"At this rate there's a risk of bankruptcy.",t:"ถ้าเป็นแบบนี้ต่อไป มีความเสี่ยงจะล้มละลาย"}]},

{id:"n2a19",lv:"N2",cat:"逆接・対比",p:"〜にもかかわらず",conn:"V普通形／イA／ナA（である）／N（である）＋ にもかかわらず",
en:"Despite X — a strong, formal 'even though'.",
th:"ทั้ง ๆ ที่ X — เป็นคำว่า 'ถึงแม้' ที่หนักแน่นและเป็นทางการ",
note_en:"Stronger than のに and with no whining tone. Standard in written Japanese, speeches and announcements.",
note_th:"หนักแน่นกว่า のに และไม่มีน้ำเสียงบ่น เป็นมาตรฐานในภาษาเขียน สุนทรพจน์ และประกาศ",
ex:[{j:"雨にもかかわらず、多くの人が集まった。",k:"あめにも かかわらず、おおくの ひとが あつまった。",e:"Despite the rain, many people gathered.",t:"ถึงแม้ฝนจะตก ก็ยังมีคนมารวมตัวกันมาก"},
{j:"努力したにもかかわらず、結果が出なかった。",k:"どりょく したにも かかわらず、けっかが でなかった。",e:"Despite my efforts, no results came.",t:"ทั้ง ๆ ที่พยายามแล้ว แต่ก็ไม่มีผลลัพธ์"}]},

{id:"n2a20",lv:"N2",cat:"逆接・対比",p:"〜ものの",conn:"V普通形／イA／ナA な／N である ＋ ものの",
en:"Although X — but reality fell short.",
th:"ถึงแม้ว่า X — แต่ความจริงกลับไม่เป็นอย่างนั้น",
note_en:"Written style. Typical shape: I did/said X, but the expected consequence didn't follow. 買ったものの、一度も使っていない.",
note_th:"เป็นภาษาเขียน รูปแบบทั่วไปคือ ทำหรือพูด X ไปแล้ว แต่ผลที่ควรตามมากลับไม่เกิด เช่น 買ったものの、一度も使っていない",
ex:[{j:"申し込んだものの、まだ返事がない。",k:"もうしこんだ ものの、まだ へんじが ない。",e:"I applied, but there's still no reply.",t:"สมัครไปแล้ว แต่ก็ยังไม่มีคำตอบ"},
{j:"N3に合格したものの、会話は苦手だ。",k:"エヌさんに ごうかく した ものの、かいわは にがてだ。",e:"I passed N3, but I'm still weak at conversation.",t:"ถึงจะสอบ N3 ผ่าน แต่การสนทนาก็ยังไม่เก่ง"}]},

{id:"n2a21",lv:"N2",cat:"逆接・対比",p:"〜一方(で)",conn:"V普通形／イA／ナA な・である／N である ＋ いっぽう(で)",
en:"On the one hand X, on the other Y — balanced contrast.",
th:"ด้านหนึ่ง X แต่อีกด้านหนึ่ง Y — เป็นการเปรียบเทียบอย่างสมดุล",
note_en:"Neutral contrast of two coexisting facts. Very common in essays and the reading section — spot it and you know a contrast is coming.",
note_th:"เป็นการเปรียบเทียบสองข้อเท็จจริงที่มีอยู่พร้อมกันอย่างเป็นกลาง เจอบ่อยมากในเรียงความและพาร์ตการอ่าน ถ้าเห็นก็รู้ว่ากำลังจะเปรียบเทียบ",
ex:[{j:"都会は便利な一方で、生活費が高い。",k:"とかいは べんりな いっぽうで、せいかつひが たかい。",e:"Cities are convenient, but living costs are high.",t:"เมืองใหญ่สะดวกก็จริง แต่ค่าครองชีพก็สูง"},
{j:"彼は厳しい一方、優しいところもある。",k:"かれは きびしい いっぽう、やさしい ところも ある。",e:"He's strict, but he also has a kind side.",t:"เขาเข้มงวดก็จริง แต่ก็มีด้านที่ใจดีเหมือนกัน"}]},

{id:"n2a22",lv:"N2",cat:"逆接・対比",p:"〜反面 / 〜半面",conn:"V普通形／イA／ナA な・である／N である ＋ はんめん",
en:"While on the other hand — two opposing qualities in ONE thing.",
th:"ในทางกลับกัน — สองคุณสมบัติที่ตรงข้ามกันในสิ่งเดียว",
note_en:"Key difference from 一方で: 反面 requires the two sides to belong to the SAME subject. 一方で can compare two different subjects.",
note_th:"จุดต่างสำคัญจาก 一方で คือ 反面 ต้องเป็นสองด้านของสิ่งเดียวกัน ส่วน 一方で เปรียบเทียบสองสิ่งที่ต่างกันได้",
ex:[{j:"この仕事は大変な反面、やりがいがある。",k:"この しごとは たいへんな はんめん、やりがいが ある。",e:"This job is tough, but on the other hand it's rewarding.",t:"งานนี้หนักก็จริง แต่ในทางกลับกันก็มีคุณค่าน่าทำ"},
{j:"便利になった反面、人と話す機会が減った。",k:"べんりに なった はんめん、ひとと はなす きかいが へった。",e:"Things got convenient, but chances to talk to people shrank.",t:"สะดวกขึ้นก็จริง แต่ในทางกลับกันโอกาสได้คุยกับคนก็น้อยลง"}]},

{id:"n2a23",lv:"N2",cat:"逆接・対比",p:"〜に反して / 〜に反する",conn:"N＋にはんして・にはんする",
en:"Contrary to X (expectation, rule, prediction).",
th:"ตรงข้ามกับ X (ความคาดหวัง กฎ การคาดการณ์)",
note_en:"The noun must be an expectation, forecast, rule or intention: 予想, 期待, 規則, 意思. Not any random noun.",
note_th:"คำนามข้างหน้าต้องเป็นความคาดหวัง การพยากรณ์ กฎ หรือเจตนา เช่น 予想 期待 規則 意思 ไม่ใช่คำนามทั่วไป",
ex:[{j:"予想に反して、試験は簡単だった。",k:"よそうに はんして、しけんは かんたん だった。",e:"Contrary to expectations, the exam was easy.",t:"ตรงข้ามกับที่คาดไว้ ข้อสอบง่ายมาก"},
{j:"規則に反する行為は認められません。",k:"きそくに はんする こういは みとめられません。",e:"Acts against the rules are not permitted.",t:"การกระทำที่ขัดต่อกฎไม่ได้รับอนุญาตครับ"}]},

{id:"n2a24",lv:"N2",cat:"逆接・対比",p:"〜どころか",conn:"V普通形／イA／ナA な／N ＋ どころか",
en:"Far from X — in fact the opposite, or even more extreme.",
th:"ไม่ใช่แค่ X — ที่จริงกลับตรงข้าม หรือหนักกว่านั้นอีก",
note_en:"Two directions: reversal (楽どころか大変だった) and escalation (漢字どころかひらがなも読めない). The second is more common on the exam.",
note_th:"มีสองทิศทาง: กลับด้าน (楽どころか大変だった) และยกระดับ (漢字どころかひらがなも読めない) แบบที่สองเจอบ่อยกว่าในข้อสอบ",
ex:[{j:"楽どころか、思ったより大変だった。",k:"らく どころか、おもったより たいへん だった。",e:"Far from easy, it was harder than I thought.",t:"ไม่ใช่แค่ไม่สบาย แต่ยากกว่าที่คิดอีก"},
{j:"漢字どころか、ひらがなも読めなかった。",k:"かんじ どころか、ひらがなも よめなかった。",e:"Forget kanji — I couldn't even read hiragana.",t:"อย่าว่าแต่คันจิเลย ฮิรางานะยังอ่านไม่ออกเลย"}]},

{id:"n2a25",lv:"N2",cat:"逆接・対比",p:"〜からといって",conn:"普通形＋からといって",
en:"Just because X doesn't mean Y.",
th:"เพียงเพราะ X ก็ไม่ได้หมายความว่า Y",
note_en:"The second clause is always negative — わけではない, とは限らない, ない. It rejects a lazy conclusion.",
note_th:"ประโยคหลังเป็นรูปปฏิเสธเสมอ เช่น わけではない, とは限らない, ない เป็นการปฏิเสธข้อสรุปที่ด่วนเกินไป",
ex:[{j:"日本に住んでいるからといって、日本語が上手とは限らない。",k:"にほんに すんで いるからと いって、にほんごが じょうずとは かぎらない。",e:"Living in Japan doesn't necessarily mean your Japanese is good.",t:"เพียงเพราะอยู่ญี่ปุ่นก็ไม่ได้แปลว่าภาษาญี่ปุ่นจะเก่ง"},
{j:"安いからといって、質が悪いわけではない。",k:"やすいからと いって、しつが わるい わけでは ない。",e:"Cheap doesn't mean poor quality.",t:"ถูกก็ไม่ได้แปลว่าคุณภาพแย่"}]},

{id:"n2a26",lv:"N2",cat:"逆接・対比",p:"〜にしても / 〜にしろ / 〜にせよ",conn:"V普通形／イA／ナA／N ＋ にしても・にしろ・にせよ",
en:"Even if; whether X or Y — concession covering all cases.",
th:"ถึงแม้ว่า; ไม่ว่าจะ X หรือ Y — การยอมรับที่ครอบคลุมทุกกรณี",
note_en:"にしろ and にせよ are stiffer and more written. Often doubled: 行くにしても行かないにしても, 連絡してください.",
note_th:"にしろ กับ にせよ แข็งและเป็นภาษาเขียนมากกว่า มักใช้คู่กัน เช่น 行くにしても行かないにしても, 連絡してください",
ex:[{j:"行くにしても、まず連絡してください。",k:"いくに しても、まず れんらく して ください。",e:"Even if you go, contact me first.",t:"ถึงจะไป ก็ช่วยติดต่อมาก่อนนะครับ"},
{j:"賛成にせよ反対にせよ、意見を言ってほしい。",k:"さんせいに せよ はんたいに せよ、いけんを いって ほしい。",e:"Whether you agree or disagree, I want your opinion.",t:"ไม่ว่าจะเห็นด้วยหรือไม่เห็นด้วย ก็อยากให้บอกความเห็น"}]},

{id:"n2a27",lv:"N2",cat:"逆接・対比",p:"〜としても",conn:"普通形＋としても",
en:"Even supposing X were true, still Y.",
th:"ต่อให้สมมติว่า X เป็นจริง ก็ยัง Y",
note_en:"Purely hypothetical, unlike のに which describes real facts. 雨が降ったとしても行く (it may or may not rain).",
note_th:"เป็นการสมมติล้วน ๆ ต่างจาก のに ที่พูดถึงข้อเท็จจริงจริง เช่น 雨が降ったとしても行く (ฝนอาจตกหรือไม่ตกก็ได้)",
ex:[{j:"たとえ失敗したとしても、後悔しない。",k:"たとえ しっぱい したと しても、こうかい しない。",e:"Even if I fail, I won't regret it.",t:"ต่อให้ล้มเหลวก็จะไม่เสียใจ"},
{j:"本当だとしても、信じられない。",k:"ほんとうだと しても、しんじられない。",e:"Even if it's true, I can't believe it.",t:"ต่อให้เป็นเรื่องจริงก็ยังไม่อยากเชื่อ"}]},

{id:"n2a28",lv:"N2",cat:"逆接・対比",p:"〜とはいえ",conn:"普通形＋とはいえ",
en:"That said; even so — concede then push back.",
th:"ถึงอย่างนั้นก็เถอะ — ยอมรับแล้วโต้กลับ",
note_en:"You accept the first statement is true, then immediately limit it. Formal and quite literary.",
note_th:"เป็นการยอมรับว่าข้อความแรกจริง แล้วจำกัดขอบเขตทันที เป็นทางการและค่อนข้างเป็นภาษาวรรณกรรม",
ex:[{j:"春とはいえ、まだ寒い日が続く。",k:"はるとは いえ、まだ さむい ひが つづく。",e:"It may be spring, but cold days continue.",t:"ถึงจะบอกว่าเป็นฤดูใบไม้ผลิ แต่วันที่หนาวก็ยังมีอยู่"},
{j:"合格したとはいえ、油断はできない。",k:"ごうかく したとは いえ、ゆだんは できない。",e:"I passed, but I can't let my guard down.",t:"ถึงจะสอบผ่าน แต่ก็ประมาทไม่ได้"}]},
{id:"n2b01",lv:"N2",cat:"条件",p:"〜さえ〜ば",conn:"N＋さえ＋V仮定形／Vます形＋さえすれば",
en:"If only X, then that's all you need.",
th:"ขอแค่ X อย่างเดียวก็พอ",
note_en:"Marks the single sufficient condition. The pattern splits around the noun: 薬さえ飲めば, 練習しさえすれば. Learners often forget the ば half.",
note_th:"ใช้ระบุเงื่อนไขเดียวที่เพียงพอ รูปประโยคจะแยกคร่อมคำนาม เช่น 薬さえ飲めば, 練習しさえすれば ผู้เรียนมักลืมส่วน ば",
ex:[{j:"時間さえあれば、もっと勉強できるのに。",k:"じかん さえ あれば、もっと べんきょう できるのに。",e:"If only I had time, I could study more.",t:"ขอแค่มีเวลา ก็จะเรียนได้มากกว่านี้แท้ ๆ"},
{j:"毎日話しさえすれば、必ず上達する。",k:"まいにち はなし さえ すれば、かならず じょうたつ する。",e:"So long as you speak every day, you'll definitely improve.",t:"ขอแค่พูดทุกวัน ยังไงก็ต้องเก่งขึ้นแน่นอน"}]},

{id:"n2b02",lv:"N2",cat:"条件",p:"〜ないことには",conn:"Vない／イA くない／N でない ＋ ことには",
en:"Unless you do X, nothing can proceed.",
th:"ถ้าไม่ทำ X ก่อน ก็ไม่มีอะไรดำเนินต่อได้",
note_en:"Second clause must be negative. Stronger than なければ — it says the whole thing is blocked without X.",
note_th:"ประโยคหลังต้องเป็นรูปปฏิเสธ หนักแน่นกว่า なければ เพราะบอกว่าถ้าไม่มี X ทุกอย่างก็ติดขัดหมด",
ex:[{j:"実際に使ってみないことには、良さが分からない。",k:"じっさいに つかって みない ことには、よさが わからない。",e:"Unless you actually try it, you won't see how good it is.",t:"ถ้าไม่ได้ลองใช้จริง ก็ไม่รู้หรอกว่าดียังไง"},
{j:"話してみないことには、相手のことは分からない。",k:"はなして みない ことには、あいての ことは わからない。",e:"You can't know someone without talking to them.",t:"ถ้าไม่ได้ลองคุย ก็ไม่มีทางรู้จักอีกฝ่าย"}]},

{id:"n2b03",lv:"N2",cat:"条件",p:"〜ものなら",conn:"V可能形＋ものなら",
en:"If it were possible to X (but it probably isn't).",
th:"ถ้าทำ X ได้ก็ดีสิ (แต่คงทำไม่ได้)",
note_en:"Requires the potential form and carries a wistful, almost impossible tone. 戻れるものなら戻りたい.",
note_th:"ต้องใช้รูปสามารถ และมีน้ำเสียงเพ้อฝันเกือบเป็นไปไม่ได้ เช่น 戻れるものなら戻りたい",
ex:[{j:"やり直せるものなら、やり直したい。",k:"やりなおせる ものなら、やりなおしたい。",e:"If I could start over, I would.",t:"ถ้าเริ่มใหม่ได้ก็อยากเริ่มใหม่"},
{j:"帰れるものなら、今すぐ帰りたい。",k:"かえれる ものなら、いますぐ かえりたい。",e:"If I could go home, I'd go right now.",t:"ถ้ากลับได้ก็อยากกลับเดี๋ยวนี้เลย"}]},

{id:"n2b04",lv:"N2",cat:"条件",p:"〜となると / 〜となれば",conn:"V普通形／N ＋ となると・となれば",
en:"When it comes to the point of X, then...",
th:"พอถึงขั้นที่จะ X จริง ๆ แล้วก็...",
note_en:"Signals a shift from the theoretical to the real. Often used when reality suddenly feels heavier: 実際に住むとなると、家賃が問題だ.",
note_th:"เป็นสัญญาณว่ากำลังเปลี่ยนจากทฤษฎีมาสู่ความจริง มักใช้ตอนที่ความจริงหนักขึ้นทันที เช่น 実際に住むとなると、家賃が問題だ",
ex:[{j:"実際に引っ越すとなると、費用がかかる。",k:"じっさいに ひっこす となると、ひようが かかる。",e:"When it actually comes to moving, it costs money.",t:"พอถึงขั้นย้ายบ้านจริง ๆ ก็ต้องใช้เงิน"},
{j:"面接となると、緊張してしまう。",k:"めんせつと なると、きんちょう して しまう。",e:"When it comes to interviews, I get nervous.",t:"พอถึงเวลาสัมภาษณ์จริง ๆ ก็ตื่นเต้นทุกที"}]},

{id:"n2b05",lv:"N2",cat:"条件",p:"〜からすると / 〜からすれば",conn:"N＋からすると・からすれば",
en:"Judging from X; from X's point of view.",
th:"ตัดสินจาก X; จากมุมมองของ X",
note_en:"Two flavours: evidence (この様子からすると) and standpoint (親からすれば). から見ると is a close synonym.",
note_th:"มีสองแบบ: จากหลักฐาน (この様子からすると) และจากจุดยืน (親からすれば) から見ると เป็นคำพ้องความหมายที่ใกล้เคียง",
ex:[{j:"この点数からすると、合格は難しい。",k:"この てんすうから すると、ごうかくは むずかしい。",e:"Judging by this score, passing will be hard.",t:"ดูจากคะแนนนี้แล้ว จะสอบผ่านคงยาก"},
{j:"外国人からすれば、日本の敬語は複雑だ。",k:"がいこくじんから すれば、にほんの けいごは ふくざつだ。",e:"From a foreigner's view, Japanese keigo is complicated.",t:"จากมุมมองของชาวต่างชาติ ภาษายกย่องของญี่ปุ่นซับซ้อนมาก"}]},

{id:"n2b06",lv:"N2",cat:"目的・手段",p:"〜を通じて / 〜を通して",conn:"N＋をつうじて・をとおして",
en:"Through; by way of; throughout a period.",
th:"ผ่านทาง; โดยอาศัย; ตลอดช่วงเวลา",
note_en:"を通じて leans toward a medium or channel; を通して leans toward active use of something. With time spans both mean 'throughout': 一年を通じて.",
note_th:"を通じて เน้นสื่อกลางหรือช่องทาง ส่วน を通して เน้นการใช้สิ่งนั้นอย่างตั้งใจ ถ้าใช้กับช่วงเวลาทั้งคู่แปลว่า 'ตลอด' เช่น 一年を通じて",
ex:[{j:"友人を通じて彼を知りました。",k:"ゆうじんを つうじて かれを しりました。",e:"I got to know him through a friend.",t:"รู้จักเขาผ่านทางเพื่อนครับ"},
{j:"アルバイトを通して、接客を学んだ。",k:"アルバイトを とおして、せっきゃくを まなんだ。",e:"Through my part-time job I learned customer service.",t:"ได้เรียนรู้การบริการลูกค้าผ่านงานพาร์ตไทม์"}]},

{id:"n2b07",lv:"N2",cat:"目的・手段",p:"〜をもとに(して)",conn:"N＋をもとに(して)",
en:"Based on X (as raw material or source).",
th:"อ้างอิงจาก X (ในฐานะวัตถุดิบหรือแหล่งที่มา)",
note_en:"X is the source material you built something from. Compare 〜に基づいて, where X is a rule or principle you must follow.",
note_th:"X คือวัตถุดิบที่ใช้สร้างสิ่งใหม่ ต่างจาก 〜に基づいて ที่ X คือกฎหรือหลักการที่ต้องปฏิบัติตาม",
ex:[{j:"実話をもとに作られた映画です。",k:"じつわを もとに つくられた えいが です。",e:"It's a film made from a true story.",t:"เป็นหนังที่สร้างจากเรื่องจริงครับ"},
{j:"アンケートをもとに、商品を改良した。",k:"アンケートを もとに、しょうひんを かいりょう した。",e:"We improved the product based on the survey.",t:"ปรับปรุงสินค้าโดยอ้างอิงจากแบบสอบถาม"}]},

{id:"n2b08",lv:"N2",cat:"目的・手段",p:"〜に基づいて",conn:"N＋にもとづいて",
en:"On the basis of; in accordance with (a rule, law, data).",
th:"บนพื้นฐานของ; เป็นไปตาม (กฎ กฎหมาย ข้อมูล)",
note_en:"Formal and binding. The noun is usually 法律, 規則, データ, 事実 — something authoritative.",
note_th:"เป็นทางการและมีผลผูกพัน คำนามข้างหน้ามักเป็น 法律 規則 データ 事実 คือสิ่งที่มีอำนาจอ้างอิง",
ex:[{j:"法律に基づいて処理します。",k:"ほうりつに もとづいて しょり します。",e:"We will handle it in accordance with the law.",t:"จะดำเนินการตามกฎหมายครับ"},
{j:"データに基づいた判断が必要だ。",k:"データに もとづいた はんだんが ひつようだ。",e:"A data-based judgement is needed.",t:"จำเป็นต้องตัดสินใจบนพื้นฐานของข้อมูล"}]},

{id:"n2b09",lv:"N2",cat:"目的・手段",p:"〜に沿って",conn:"N＋にそって",
en:"Along; in line with (a policy, guideline, physical line).",
th:"ไปตาม; สอดคล้องกับ (นโยบาย แนวทาง หรือแนวเส้นจริง)",
note_en:"Works for both physical lines (川に沿って) and abstract guidelines (方針に沿って). Softer than に基づいて.",
note_th:"ใช้ได้ทั้งแนวเส้นจริง (川に沿って) และแนวทางนามธรรม (方針に沿って) นุ่มกว่า に基づいて",
ex:[{j:"会社の方針に沿って進めます。",k:"かいしゃの ほうしんに そって すすめます。",e:"We'll proceed in line with company policy.",t:"จะดำเนินการตามนโยบายบริษัทครับ"},
{j:"川に沿って歩いた。",k:"かわに そって あるいた。",e:"I walked along the river.",t:"เดินไปตามแม่น้ำ"}]},

{id:"n2b10",lv:"N2",cat:"目的・手段",p:"〜をめぐって",conn:"N＋をめぐって",
en:"Concerning; surrounding (a disputed issue).",
th:"เกี่ยวกับ; รายรอบ (ประเด็นที่มีข้อถกเถียง)",
note_en:"Only for controversial topics with multiple parties. Followed by verbs of conflict: 議論する, 対立する, 争う.",
note_th:"ใช้เฉพาะประเด็นที่มีข้อขัดแย้งและมีหลายฝ่าย ตามด้วยกริยาที่แสดงความขัดแย้ง เช่น 議論する 対立する 争う",
ex:[{j:"この問題をめぐって、議論が続いている。",k:"この もんだいを めぐって、ぎろんが つづいて いる。",e:"Debate continues over this issue.",t:"การถกเถียงเกี่ยวกับปัญหานี้ยังดำเนินต่อไป"},
{j:"遺産をめぐって家族が対立した。",k:"いさんを めぐって かぞくが たいりつ した。",e:"The family fell out over the inheritance.",t:"ครอบครัวขัดแย้งกันเรื่องมรดก"}]},

{id:"n2b11",lv:"N2",cat:"添加・並列",p:"〜上に",conn:"V普通形／イA／ナA な・である／N の・である ＋ うえに",
en:"On top of X, additionally Y.",
th:"นอกจาก X แล้วยัง Y อีกด้วย",
note_en:"Both halves must point the same way — both good or both bad. ×安い上にまずい is wrong; use のに there.",
note_th:"ทั้งสองส่วนต้องไปทางเดียวกัน คือดีทั้งคู่หรือแย่ทั้งคู่ ×安い上にまずい ผิด กรณีนั้นต้องใช้ のに",
ex:[{j:"この店は安い上に、おいしい。",k:"この みせは やすい うえに、おいしい。",e:"This place is cheap and tasty on top of that.",t:"ร้านนี้ถูกแถมยังอร่อยอีกด้วย"},
{j:"道に迷った上に、雨まで降ってきた。",k:"みちに まよった うえに、あめまで ふって きた。",e:"I got lost, and on top of that it started raining.",t:"หลงทางแล้วยังฝนตกลงมาอีก"}]},

{id:"n2b12",lv:"N2",cat:"添加・並列",p:"〜に加えて",conn:"N＋にくわえて",
en:"In addition to X.",
th:"นอกเหนือจาก X แล้ว",
note_en:"Neutral and formal, unlike 上に which carries evaluation. Common in reports and business writing.",
note_th:"เป็นกลางและทางการ ต่างจาก 上に ที่มีการประเมินค่า เจอบ่อยในรายงานและงานเขียนธุรกิจ",
ex:[{j:"英語に加えて、日本語も話せます。",k:"えいごに くわえて、にほんごも はなせます。",e:"In addition to English, I can speak Japanese.",t:"นอกจากภาษาอังกฤษแล้ว ยังพูดภาษาญี่ปุ่นได้ด้วยครับ"},
{j:"人手不足に加えて、コストも上がっている。",k:"ひとでぶそくに くわえて、コストも あがって いる。",e:"On top of the labour shortage, costs are rising too.",t:"นอกจากขาดแคลนแรงงานแล้ว ต้นทุนก็ยังสูงขึ้นอีก"}]},

{id:"n2b13",lv:"N2",cat:"添加・並列",p:"〜ばかりか / 〜ばかりでなく",conn:"V普通形／イA／ナA な／N ＋ ばかりか・ばかりでなく",
en:"Not only X but even Y — Y is more surprising.",
th:"ไม่เพียงแค่ X แต่ยัง Y — โดย Y น่าประหลาดใจกว่า",
note_en:"The second item must outrank the first in degree. ばかりか can't be followed by a command; ばかりでなく can.",
note_th:"สิ่งที่สองต้องมีระดับสูงกว่าสิ่งแรก ばかりか ตามด้วยคำสั่งไม่ได้ ส่วน ばかりでなく ได้",
ex:[{j:"彼は日本語ばかりか、韓国語も話せる。",k:"かれは にほんご ばかりか、かんこくごも はなせる。",e:"He speaks not only Japanese but Korean too.",t:"เขาไม่ได้พูดได้แค่ภาษาญี่ปุ่น แต่พูดภาษาเกาหลีได้ด้วย"},
{j:"読むばかりでなく、書く練習もしてください。",k:"よむ ばかりでなく、かく れんしゅうも して ください。",e:"Don't just read — practise writing too.",t:"ไม่ใช่แค่อ่าน ให้ฝึกเขียนด้วยนะครับ"}]},

{id:"n2b14",lv:"N2",cat:"添加・並列",p:"〜のみならず",conn:"V普通形／イA／ナA である／N（である）＋ のみならず",
en:"Not only X (but also Y) — the written, formal version.",
th:"ไม่เพียงแต่ X (แต่ยัง Y) — รูปแบบทางการในภาษาเขียน",
note_en:"Same meaning as ばかりでなく but noticeably stiffer. Reserve it for essays and formal speech.",
note_th:"ความหมายเดียวกับ ばかりでなく แต่แข็งกว่าอย่างเห็นได้ชัด เก็บไว้ใช้ในเรียงความและการพูดทางการ",
ex:[{j:"本人のみならず、家族も参加できます。",k:"ほんにんの みならず、かぞくも さんか できます。",e:"Not only the person but family may also attend.",t:"ไม่เพียงแต่เจ้าตัว ครอบครัวก็เข้าร่วมได้ครับ"},
{j:"国内のみならず、海外でも人気がある。",k:"こくないの みならず、かいがいでも にんきが ある。",e:"It's popular not just domestically but abroad.",t:"ไม่ได้ดังแค่ในประเทศ แต่ต่างประเทศก็นิยมด้วย"}]},

{id:"n2b15",lv:"N2",cat:"添加・並列",p:"〜はもちろん / 〜はもとより",conn:"N＋はもちろん・はもとより",
en:"X goes without saying, and Y as well.",
th:"X ไม่ต้องพูดถึงอยู่แล้ว และ Y ก็ด้วย",
note_en:"X must be the obvious, easy case; Y the surprising addition. もとより is the formal one.",
note_th:"X ต้องเป็นกรณีที่ชัดเจนและง่าย ส่วน Y คือส่วนเพิ่มที่น่าประหลาดใจ ส่วน もとより เป็นรูปทางการ",
ex:[{j:"漢字はもちろん、敬語も難しい。",k:"かんじは もちろん、けいごも むずかしい。",e:"Kanji goes without saying, and keigo is hard too.",t:"คันจิไม่ต้องพูดถึง ภาษายกย่องก็ยากด้วย"},
{j:"平日はもとより、週末も営業しております。",k:"へいじつは もとより、しゅうまつも えいぎょう して おります。",e:"We're open weekdays and weekends alike.",t:"เปิดทำการทั้งวันธรรมดาและวันหยุดสุดสัปดาห์ครับ"}]},

{id:"n2b16",lv:"N2",cat:"添加・並列",p:"〜やら〜やら",conn:"N／V辞書形 ＋ やら＋N／V辞書形＋やら",
en:"What with X and Y — a jumble of things, usually overwhelming.",
th:"ทั้ง X ทั้ง Y — สารพัดเรื่องปนกัน มักให้ความรู้สึกท่วมท้น",
note_en:"Implies more items exist beyond the two listed, and a tone of being swamped. Contrast with 〜とか〜とか which is neutral.",
note_th:"สื่อว่ายังมีสิ่งอื่นนอกเหนือจากสองอย่างที่ยกมา และมีน้ำเสียงว่ารับมือไม่ไหว ต่างจาก 〜とか〜とか ที่เป็นกลาง",
ex:[{j:"引っ越しやら手続きやらで忙しい。",k:"ひっこし やら てつづき やらで いそがしい。",e:"What with moving and paperwork, I'm swamped.",t:"ทั้งย้ายบ้านทั้งทำเรื่องเอกสาร ยุ่งไปหมด"},
{j:"うれしいやら悲しいやら、複雑な気持ちだ。",k:"うれしい やら かなしい やら、ふくざつな きもちだ。",e:"Happy, sad — my feelings are all mixed up.",t:"ทั้งดีใจทั้งเศร้า ความรู้สึกซับซ้อนไปหมด"}]},

{id:"n2b17",lv:"N2",cat:"限定・強調",p:"〜に限って",conn:"N＋にかぎって",
en:"Only when it's X, of all times — bad luck; or: X alone would never.",
th:"พอเป็น X ทีไรก็ต้อง — โชคร้าย; หรือ เฉพาะ X เท่านั้นที่จะไม่มีทาง",
note_en:"Two senses. Ironic bad-luck (急いでいる時に限って電車が遅れる) and trust (うちの子に限ってそんなことはしない).",
note_th:"มีสองความหมาย คือความโชคร้ายเชิงประชด (急いでいる時に限って電車が遅れる) และความไว้ใจ (うちの子に限ってそんなことはしない)",
ex:[{j:"急いでいる時に限って、電車が遅れる。",k:"いそいで いる ときに かぎって、でんしゃが おくれる。",e:"The train is late precisely when I'm in a hurry.",t:"พอรีบทีไร รถไฟก็ต้องช้าทุกที"},
{j:"彼に限って、嘘をつくはずがない。",k:"かれに かぎって、うそを つく はずが ない。",e:"He of all people wouldn't lie.",t:"เป็นเขาแล้วไม่มีทางโกหกแน่นอน"}]},

{id:"n2b18",lv:"N2",cat:"限定・強調",p:"〜に限らず",conn:"N＋にかぎらず",
en:"Not limited to X — Y as well.",
th:"ไม่จำกัดแค่ X — Y ก็ด้วย",
note_en:"The negative of に限って. Expands scope rather than narrowing it.",
note_th:"เป็นรูปปฏิเสธของ に限って คือขยายขอบเขตแทนที่จะจำกัด",
ex:[{j:"若者に限らず、高齢者にも人気がある。",k:"わかものに かぎらず、こうれいしゃにも にんきが ある。",e:"It's popular not just with young people but the elderly too.",t:"ไม่ได้นิยมแค่ในหมู่คนหนุ่มสาว ผู้สูงอายุก็ชอบด้วย"},
{j:"週末に限らず、平日も混んでいる。",k:"しゅうまつに かぎらず、へいじつも こんで いる。",e:"It's crowded on weekdays as well as weekends.",t:"ไม่ใช่แค่วันหยุด วันธรรมดาก็คนเยอะ"}]},

{id:"n2b19",lv:"N2",cat:"限定・強調",p:"〜からこそ",conn:"普通形＋からこそ",
en:"Precisely because X — emphatic reason.",
th:"ก็เพราะ X นั่นแหละ — เน้นเหตุผล",
note_en:"こそ spotlights the reason as the ONLY real one. Often ends with のだ / んです for extra emphasis.",
note_th:"こそ เน้นว่าเหตุผลนี้คือเหตุผลเดียวที่แท้จริง มักลงท้ายด้วย のだ / んです เพื่อเน้นเพิ่ม",
ex:[{j:"難しいからこそ、挑戦する価値がある。",k:"むずかしいからこそ、ちょうせん する かちが ある。",e:"It's worth attempting precisely because it's hard.",t:"ก็เพราะมันยากนั่นแหละ ถึงคุ้มค่าที่จะลอง"},
{j:"あなたのことを思うからこそ、厳しく言うんです。",k:"あなたの ことを おもうからこそ、きびしく いうんです。",e:"I'm being strict precisely because I care about you.",t:"ก็เพราะเป็นห่วงคุณนั่นแหละ ถึงได้พูดแรง"}]},

{id:"n2b20",lv:"N2",cat:"限定・強調",p:"〜てこそ",conn:"Vて＋こそ",
en:"Only by doing X does Y become true.",
th:"ต้องทำ X เท่านั้น Y ถึงจะเป็นจริง",
note_en:"X is the indispensable condition for a valuable outcome. Always positive in tone.",
note_th:"X คือเงื่อนไขที่ขาดไม่ได้สำหรับผลลัพธ์ที่มีค่า น้ำเสียงเป็นบวกเสมอ",
ex:[{j:"失敗してこそ、成長できる。",k:"しっぱい してこそ、せいちょう できる。",e:"It's only by failing that you can grow.",t:"ต้องเคยล้มเหลวเท่านั้นถึงจะเติบโตได้"},
{j:"努力してこそ、結果がついてくる。",k:"どりょく してこそ、けっかが ついて くる。",e:"Results follow only when you put in the work.",t:"ต้องพยายามเท่านั้น ผลลัพธ์ถึงจะตามมา"}]},

{id:"n2b21",lv:"N2",cat:"限定・強調",p:"〜さえ / 〜でさえ",conn:"N（＋助詞）＋さえ・でさえ",
en:"Even X — citing an extreme example.",
th:"แม้แต่ X — ยกตัวอย่างที่สุดขั้ว",
note_en:"Picks the most unlikely case to prove the point. 子供でさえ知っている implies adults certainly do.",
note_th:"เลือกกรณีที่เป็นไปได้น้อยที่สุดมาพิสูจน์ประเด็น เช่น 子供でさえ知っている สื่อว่าผู้ใหญ่ยิ่งต้องรู้",
ex:[{j:"子供でさえ知っていることだ。",k:"こどもでさえ しって いる ことだ。",e:"Even a child knows that.",t:"เรื่องแค่นี้แม้แต่เด็กยังรู้เลย"},
{j:"忙しくて、食事する時間さえない。",k:"いそがしくて、しょくじ する じかん さえ ない。",e:"I'm so busy I don't even have time to eat.",t:"ยุ่งจนไม่มีแม้แต่เวลากินข้าว"}]},

{id:"n2b22",lv:"N2",cat:"限定・強調",p:"〜ないではいられない / 〜ずにはいられない",conn:"Vない（ない削除）＋ではいられない／Vない（ない削除）＋ずにはいられない",
en:"Can't help doing; cannot stop myself.",
th:"อดไม่ได้ที่จะ; ห้ามตัวเองไม่ได้",
note_en:"An irresistible urge, not a choice. する becomes せずに, not しずに — memorise that exception.",
note_th:"เป็นแรงกระตุ้นที่ห้ามไม่ได้ ไม่ใช่การเลือก โดย する จะกลายเป็น せずに ไม่ใช่ しずに ต้องจำข้อยกเว้นนี้",
ex:[{j:"あの映画は泣かずにはいられない。",k:"あの えいがは なかずには いられない。",e:"You can't watch that film without crying.",t:"หนังเรื่องนั้นดูแล้วอดร้องไห้ไม่ได้"},
{j:"心配せずにはいられません。",k:"しんぱい せずには いられません。",e:"I can't help worrying.",t:"อดเป็นห่วงไม่ได้จริง ๆ ครับ"}]},

{id:"n2b23",lv:"N2",cat:"程度・比例",p:"〜につれて",conn:"V辞書形／N ＋ につれて",
en:"As X progresses, Y changes along with it.",
th:"เมื่อ X ดำเนินไป Y ก็เปลี่ยนตามไปด้วย",
note_en:"Both sides must be gradual, natural change. You can't use it with a one-off event or a deliberate action.",
note_th:"ทั้งสองฝั่งต้องเป็นการเปลี่ยนแปลงแบบค่อยเป็นค่อยไปตามธรรมชาติ ใช้กับเหตุการณ์ครั้งเดียวหรือการกระทำที่ตั้งใจไม่ได้",
ex:[{j:"時間が経つにつれて、痛みが和らいだ。",k:"じかんが たつに つれて、いたみが やわらいだ。",e:"As time passed, the pain eased.",t:"เมื่อเวลาผ่านไป ความเจ็บก็ค่อย ๆ บรรเทาลง"},
{j:"練習するにつれて、自信がついてきた。",k:"れんしゅう するに つれて、じしんが ついて きた。",e:"As I practised, I gained confidence.",t:"ยิ่งฝึกไป ความมั่นใจก็ค่อย ๆ มา"}]},

{id:"n2b24",lv:"N2",cat:"程度・比例",p:"〜にしたがって",conn:"V辞書形／N ＋ にしたがって",
en:"As X changes, Y follows; also: in accordance with.",
th:"เมื่อ X เปลี่ยน Y ก็ตาม; และแปลว่า ปฏิบัติตาม ได้ด้วย",
note_en:"Nearly identical to につれて for change, but it also means 'obey': 指示に従って. That second meaning につれて doesn't have.",
note_th:"เกือบเหมือน につれて ในความหมายการเปลี่ยนแปลง แต่ยังแปลว่า 'ทำตาม' ได้ เช่น 指示に従って ซึ่ง につれて ไม่มีความหมายนี้",
ex:[{j:"北へ行くにしたがって、寒くなる。",k:"きたへ いくに したがって、さむく なる。",e:"The further north you go, the colder it gets.",t:"ยิ่งไปทางเหนือก็ยิ่งหนาว"},
{j:"係員の指示にしたがってください。",k:"かかりいんの しじに したがって ください。",e:"Please follow the staff's instructions.",t:"กรุณาปฏิบัติตามคำแนะนำของเจ้าหน้าที่ครับ"}]},

{id:"n2b25",lv:"N2",cat:"程度・比例",p:"〜に伴って",conn:"V辞書形／N ＋ にともなって",
en:"Accompanying X; as a consequence of X.",
th:"พร้อมกับ X; อันเป็นผลจาก X",
note_en:"More formal than につれて and works for one-off changes too. Common in news: 高齢化に伴って.",
note_th:"เป็นทางการกว่า につれて และใช้กับการเปลี่ยนแปลงครั้งเดียวได้ด้วย เจอบ่อยในข่าว เช่น 高齢化に伴って",
ex:[{j:"人口の増加に伴って、住宅が不足している。",k:"じんこうの ぞうかに ともなって、じゅうたくが ふそく して いる。",e:"With the population increase, housing is short.",t:"พร้อมกับจำนวนประชากรที่เพิ่มขึ้น ที่อยู่อาศัยก็ขาดแคลน"},
{j:"転勤に伴って、引っ越すことになった。",k:"てんきんに ともなって、ひっこす ことに なった。",e:"With my transfer, I'll be moving house.",t:"เนื่องจากย้ายที่ทำงาน ก็เลยต้องย้ายบ้าน"}]},

{id:"n2b26",lv:"N2",cat:"程度・比例",p:"〜てたまらない",conn:"Vて／イA くて／ナA で ＋ たまらない",
en:"Unbearably; I can't stand how X I am.",
th:"...จนทนไม่ไหว",
note_en:"For your own strong physical or emotional sensation. Third person needs らしい or ようだ on top.",
note_th:"ใช้กับความรู้สึกทางกายหรือทางใจที่รุนแรงของตัวเอง ถ้าเป็นบุคคลที่สามต้องเติม らしい หรือ ようだ ด้วย",
ex:[{j:"国の家族に会いたくてたまらない。",k:"くにの かぞくに あいたくて たまらない。",e:"I miss my family back home unbearably.",t:"คิดถึงครอบครัวที่บ้านเกิดจนทนไม่ไหว"},
{j:"暑くてたまらない。",k:"あつくて たまらない。",e:"It's unbearably hot.",t:"ร้อนจนทนไม่ไหวแล้ว"}]},

{id:"n2b27",lv:"N2",cat:"程度・比例",p:"〜てしかたがない / 〜てしょうがない",conn:"Vて／イA くて／ナA で ＋ しかたがない・しょうがない",
en:"Extremely; can't be helped how much X.",
th:"...เหลือเกิน; ...จนช่วยไม่ได้",
note_en:"Very close to てたまらない. しょうがない is the casual spoken form; しかたがない the neutral one.",
note_th:"ใกล้เคียงกับ てたまらない มาก โดย しょうがない เป็นรูปพูดกันเอง ส่วน しかたがない เป็นกลาง",
ex:[{j:"結果が気になってしかたがない。",k:"けっかが きに なって しかたが ない。",e:"I can't stop worrying about the result.",t:"กังวลเรื่องผลลัพธ์เหลือเกิน"},
{j:"眠くてしょうがない。",k:"ねむくて しょうが ない。",e:"I'm desperately sleepy.",t:"ง่วงเหลือเกิน"}]},

{id:"n2b28",lv:"N2",cat:"程度・比例",p:"〜ようがない / 〜ようもない",conn:"Vます形＋ようがない",
en:"There's no way to do it — no method exists.",
th:"ไม่มีทางทำได้ — เพราะไม่มีวิธีเลย",
note_en:"Different from できない. できない = I can't. ようがない = no method exists for anyone. 連絡しようがない (I have no contact details at all).",
note_th:"ต่างจาก できない ตรงที่ できない = ฉันทำไม่ได้ ส่วน ようがない = ไม่มีวิธีใดเลยสำหรับใครก็ตาม เช่น 連絡しようがない (ไม่มีช่องทางติดต่อเลย)",
ex:[{j:"住所も電話番号も知らないので、連絡しようがない。",k:"じゅうしょも でんわばんごうも しらないので、れんらく しようが ない。",e:"I know neither address nor number, so there's no way to contact them.",t:"ไม่รู้ทั้งที่อยู่ทั้งเบอร์โทร เลยไม่มีทางติดต่อได้"},
{j:"壊れすぎて、直しようがない。",k:"こわれすぎて、なおしようが ない。",e:"It's too broken to be fixed.",t:"พังเกินกว่าจะซ่อมได้แล้ว"}]},
{id:"n2c01",lv:"N2",cat:"立場・観点",p:"〜にかけては",conn:"N＋にかけては",
en:"When it comes to X, (nobody beats them) — praising a strength.",
th:"ถ้าพูดถึงเรื่อง X แล้ว (ไม่มีใครสู้ได้) — ใช้ชมจุดแข็ง",
note_en:"Only ever positive. The second half is always praise: 一番だ, 誰にも負けない, 自信がある. Perfect for interviews.",
note_th:"เป็นบวกเสมอ ประโยคหลังต้องเป็นคำชม เช่น 一番だ 誰にも負けない 自信がある เหมาะมากสำหรับการสัมภาษณ์งาน",
ex:[{j:"接客にかけては、誰にも負けません。",k:"せっきゃくに かけては、だれにも まけません。",e:"When it comes to customer service, I yield to no one.",t:"ถ้าพูดถึงเรื่องบริการลูกค้าแล้ว ผมไม่แพ้ใครครับ"},
{j:"記憶力にかけては自信がある。",k:"きおくりょくに かけては じしんが ある。",e:"I'm confident when it comes to memory.",t:"ถ้าเป็นเรื่องความจำ ผมมั่นใจครับ"}]},

{id:"n2c02",lv:"N2",cat:"立場・観点",p:"〜から見ると / 〜から言うと",conn:"N＋からみると・からいうと",
en:"Seen from X's perspective; speaking in terms of X.",
th:"เมื่อมองจากมุมของ X; ถ้าพูดในแง่ของ X",
note_en:"から見ると takes a person or viewpoint; から言うと takes a criterion (値段から言うと). Small difference, tested often.",
note_th:"から見ると ใช้กับคนหรือมุมมอง ส่วน から言うと ใช้กับเกณฑ์ (値段から言うと) ต่างกันนิดเดียวแต่ออกสอบบ่อย",
ex:[{j:"外国人から見ると、日本の習慣は不思議だ。",k:"がいこくじんから みると、にほんの しゅうかんは ふしぎだ。",e:"From a foreigner's view, Japanese customs are curious.",t:"เมื่อมองจากมุมของชาวต่างชาติ ธรรมเนียมญี่ปุ่นน่าแปลกใจ"},
{j:"経験から言うと、この方法が一番いい。",k:"けいけんから いうと、この ほうほうが いちばん いい。",e:"Speaking from experience, this method is best.",t:"ถ้าพูดจากประสบการณ์ วิธีนี้ดีที่สุด"}]},

{id:"n2c03",lv:"N2",cat:"立場・観点",p:"〜のもとで / 〜のもとに",conn:"N＋のもとで・のもとに",
en:"Under (guidance, conditions, a system).",
th:"ภายใต้ (การชี้แนะ เงื่อนไข หรือระบบ)",
note_en:"のもとで for a person's supervision (先生のもとで学ぶ); のもとに for abstract conditions (法律のもとに).",
note_th:"のもとで ใช้กับการดูแลของคน (先生のもとで学ぶ) ส่วน のもとに ใช้กับเงื่อนไขนามธรรม (法律のもとに)",
ex:[{j:"先輩のもとで、接客を学びました。",k:"せんぱいの もとで、せっきゃくを まなびました。",e:"I learned customer service under a senior colleague.",t:"ได้เรียนรู้การบริการลูกค้าภายใต้การดูแลของรุ่นพี่ครับ"},
{j:"法律のもとに、全員が平等だ。",k:"ほうりつの もとに、ぜんいんが びょうどうだ。",e:"Under the law, everyone is equal.",t:"ภายใต้กฎหมาย ทุกคนเท่าเทียมกัน"}]},

{id:"n2c04",lv:"N2",cat:"立場・観点",p:"〜を問わず",conn:"N＋をとわず",
en:"Regardless of X.",
th:"ไม่ว่าจะ X ก็ตาม; โดยไม่คำนึงถึง X",
note_en:"The noun is usually a category with variation: 年齢, 経験, 国籍, 男女. Extremely common in job adverts — worth memorising for that alone.",
note_th:"คำนามข้างหน้ามักเป็นหมวดที่มีความหลากหลาย เช่น 年齢 経験 国籍 男女 เจอบ่อยมากในประกาศรับสมัครงาน ควรจำไว้",
ex:[{j:"経験を問わず、応募できます。",k:"けいけんを とわず、おうぼ できます。",e:"You can apply regardless of experience.",t:"สมัครได้โดยไม่คำนึงถึงประสบการณ์ครับ"},
{j:"国籍を問わず、誰でも参加できる。",k:"こくせきを とわず、だれでも さんか できる。",e:"Anyone may join regardless of nationality.",t:"ไม่ว่าสัญชาติใด ใครก็เข้าร่วมได้"}]},

{id:"n2c05",lv:"N2",cat:"立場・観点",p:"〜はともかく(として)",conn:"N＋はともかく(として)",
en:"Setting X aside for now, the real issue is Y.",
th:"เรื่อง X ยกไว้ก่อน ประเด็นจริง ๆ คือ Y",
note_en:"You're deliberately postponing a less urgent matter to focus on the important one.",
note_th:"เป็นการตั้งใจพักเรื่องที่ด่วนน้อยกว่าไว้ก่อน เพื่อโฟกัสเรื่องที่สำคัญกว่า",
ex:[{j:"味はともかく、値段は安い。",k:"あじは ともかく、ねだんは やすい。",e:"Taste aside, it's cheap.",t:"รสชาติยกไว้ก่อน ราคาถูกนะ"},
{j:"結果はともかく、全力を尽くした。",k:"けっかは ともかく、ぜんりょくを つくした。",e:"Whatever the result, I gave it everything.",t:"ผลจะเป็นยังไงก็ช่าง ได้ทุ่มสุดตัวแล้ว"}]},

{id:"n2c06",lv:"N2",cat:"傾向・様子",p:"〜気味",conn:"Vます形／N ＋ ぎみ",
en:"A slight touch of; a bit on the X side.",
th:"ออกอาการ...นิดหน่อย; ค่อนไปทาง X เล็กน้อย",
note_en:"Mild and usually negative: 風邪気味, 疲れ気味, 遅れ気味. It's the 'slightly' of physical and situational states.",
note_th:"เบา ๆ และมักเป็นลบ เช่น 風邪気味 疲れ気味 遅れ気味 เป็นคำว่า 'นิดหน่อย' สำหรับสภาพร่างกายและสถานการณ์",
ex:[{j:"最近、疲れ気味です。",k:"さいきん、つかれぎみ です。",e:"I've been a bit tired lately.",t:"ช่วงนี้รู้สึกเหนื่อย ๆ นิดหน่อยครับ"},
{j:"電車が少し遅れ気味だ。",k:"でんしゃが すこし おくれぎみだ。",e:"The trains are running slightly behind.",t:"รถไฟค่อนข้างช้ากว่าเวลานิดหน่อย"}]},

{id:"n2c07",lv:"N2",cat:"傾向・様子",p:"〜つつある",conn:"Vます形＋つつある",
en:"Is in the process of changing; is steadily becoming.",
th:"กำลังอยู่ในระหว่างการเปลี่ยนแปลง; กำลังค่อย ๆ กลายเป็น",
note_en:"Only for gradual, directional change — never for a momentary action. ×食べつつある is wrong. Formal, common in news.",
note_th:"ใช้กับการเปลี่ยนแปลงที่ค่อยเป็นค่อยไปและมีทิศทางเท่านั้น ห้ามใช้กับการกระทำชั่วขณะ ×食べつつある ผิด เป็นทางการ เจอบ่อยในข่าว",
ex:[{j:"景気は回復しつつある。",k:"けいきは かいふく しつつ ある。",e:"The economy is steadily recovering.",t:"เศรษฐกิจกำลังค่อย ๆ ฟื้นตัว"},
{j:"日本語力が着実に伸びつつある。",k:"にほんごりょくが ちゃくじつに のびつつ ある。",e:"My Japanese ability is steadily growing.",t:"ความสามารถภาษาญี่ปุ่นกำลังค่อย ๆ พัฒนาขึ้นอย่างมั่นคง"}]},

{id:"n2c08",lv:"N2",cat:"傾向・様子",p:"〜一方だ",conn:"V辞書形＋いっぽうだ",
en:"Keeps getting more and more X — a one-way trend.",
th:"มีแต่จะ...มากขึ้นเรื่อย ๆ — แนวโน้มทางเดียว",
note_en:"Requires a change verb (増える, 減る, 悪くなる). Often but not always negative. Only one direction, never back.",
note_th:"ต้องใช้กับกริยาที่แสดงการเปลี่ยนแปลง (増える 減る 悪くなる) มักเป็นลบแต่ไม่เสมอไป ไปทางเดียวไม่ย้อนกลับ",
ex:[{j:"物価は上がる一方だ。",k:"ぶっかは あがる いっぽうだ。",e:"Prices just keep going up.",t:"ราคาสินค้ามีแต่จะขึ้นเรื่อย ๆ"},
{j:"彼の日本語は上達する一方だ。",k:"かれの にほんごは じょうたつ する いっぽうだ。",e:"His Japanese keeps improving.",t:"ภาษาญี่ปุ่นของเขามีแต่จะเก่งขึ้นเรื่อย ๆ"}]},

{id:"n2c09",lv:"N2",cat:"傾向・様子",p:"〜ばかりだ（変化）",conn:"V辞書形＋ばかりだ",
en:"Only gets worse and worse.",
th:"มีแต่จะแย่ลงเรื่อย ๆ",
note_en:"Almost always negative, unlike 一方だ which can go either way. 悪くなるばかりだ.",
note_th:"เกือบจะเป็นลบเสมอ ต่างจาก 一方だ ที่ไปได้ทั้งสองทาง เช่น 悪くなるばかりだ",
ex:[{j:"状況は悪くなるばかりだ。",k:"じょうきょうは わるく なる ばかりだ。",e:"The situation only gets worse.",t:"สถานการณ์มีแต่จะแย่ลงเรื่อย ๆ"},
{j:"不安は増すばかりだった。",k:"ふあんは ます ばかり だった。",e:"My anxiety only mounted.",t:"ความกังวลมีแต่จะเพิ่มขึ้นเรื่อย ๆ"}]},

{id:"n2c10",lv:"N2",cat:"傾向・様子",p:"〜げ",conn:"イA（い削除）／ナA ＋ げ",
en:"Looking as if; with an air of.",
th:"ดูท่าทาง...; มีท่าทีว่า",
note_en:"Only for emotions visible on someone's face: 寂しげ, 嬉しげ, 不安げ. Written and slightly literary.",
note_th:"ใช้เฉพาะอารมณ์ที่เห็นได้จากสีหน้า เช่น 寂しげ 嬉しげ 不安げ เป็นภาษาเขียนและออกแนววรรณกรรมเล็กน้อย",
ex:[{j:"彼女は寂しげな顔をしていた。",k:"かのじょは さびしげな かおを して いた。",e:"She had a lonely look on her face.",t:"เธอทำหน้าเหงา ๆ"},
{j:"子供が自慢げに話している。",k:"こどもが じまんげに はなして いる。",e:"The child is talking proudly.",t:"เด็กกำลังพูดด้วยท่าทางภูมิใจ"}]},

{id:"n2c11",lv:"N2",cat:"傾向・様子",p:"〜っぱなし",conn:"Vます形＋っぱなし",
en:"Left in a state; doing continuously without stopping.",
th:"ปล่อยทิ้งไว้แบบนั้น; ทำต่อเนื่องไม่หยุด",
note_en:"Two senses, both slightly critical: leaving something on (つけっぱなし) and non-stop action (立ちっぱなし).",
note_th:"มีสองความหมาย ทั้งคู่ออกแนวติเล็กน้อย คือปล่อยทิ้งไว้ (つけっぱなし) และทำต่อเนื่องไม่หยุด (立ちっぱなし)",
ex:[{j:"テレビをつけっぱなしで寝てしまった。",k:"テレビを つけっぱなしで ねて しまった。",e:"I fell asleep with the TV left on.",t:"เผลอหลับไปโดยเปิดทีวีทิ้งไว้"},
{j:"満員電車で1時間立ちっぱなしだった。",k:"まんいん でんしゃで いちじかん たちっぱなし だった。",e:"I stood the whole hour on the packed train.",t:"ยืนบนรถไฟที่คนแน่นตลอดหนึ่งชั่วโมง"}]},

{id:"n2c12",lv:"N2",cat:"傾向・様子",p:"〜向け / 〜向き",conn:"N＋むけ・むき",
en:"向け = made for (intended target). 向き = suited to (turns out to fit).",
th:"向け = ทำมาเพื่อ (กลุ่มเป้าหมายที่ตั้งใจ) ส่วน 向き = เหมาะกับ (บังเอิญเหมาะพอดี)",
note_en:"初心者向けの本 was written for beginners. 初心者向きの本 happens to suit them. Intention vs suitability.",
note_th:"初心者向けの本 คือเขียนมาเพื่อผู้เริ่มต้น ส่วน 初心者向きの本 คือบังเอิญเหมาะกับผู้เริ่มต้น ต่างกันที่ความตั้งใจกับความเหมาะสม",
ex:[{j:"これは外国人向けの日本語教材です。",k:"これは がいこくじん むけの にほんご きょうざい です。",e:"This is Japanese material made for foreigners.",t:"นี่คือสื่อการเรียนภาษาญี่ปุ่นที่ทำมาเพื่อชาวต่างชาติครับ"},
{j:"この仕事は几帳面な人向きだ。",k:"この しごとは きちょうめんな ひと むきだ。",e:"This job suits meticulous people.",t:"งานนี้เหมาะกับคนละเอียดรอบคอบ"}]},

{id:"n2c13",lv:"N2",cat:"評価・判断",p:"〜ざるを得ない",conn:"Vない（ない削除）＋ざるを得ない（する→せざるを得ない）",
en:"Have no choice but to; am forced to.",
th:"จำเป็นต้อง...อย่างเลี่ยงไม่ได้",
note_en:"Formal and reluctant. Memorise the irregular: する → せざるを得ない, never しざる.",
note_th:"เป็นทางการและแฝงความไม่เต็มใจ ต้องจำรูปพิเศษ: する → せざるを得ない ไม่ใช่ しざる",
ex:[{j:"体調が悪いので、休まざるを得ない。",k:"たいちょうが わるいので、やすまざるを えない。",e:"I'm unwell, so I have no choice but to rest.",t:"ร่างกายไม่ไหว เลยจำเป็นต้องหยุดพัก"},
{j:"証拠がある以上、認めざるを得ない。",k:"しょうこが ある いじょう、みとめざるを えない。",e:"Given the evidence, I have to admit it.",t:"ในเมื่อมีหลักฐานแล้ว ก็ต้องยอมรับ"}]},

{id:"n2c14",lv:"N2",cat:"評価・判断",p:"〜ないわけにはいかない",conn:"Vない＋わけにはいかない",
en:"I really must — social obligation makes refusing impossible.",
th:"ยังไงก็ต้องทำ — เพราะภาระทางสังคมทำให้ปฏิเสธไม่ได้",
note_en:"Double negative meaning 'must'. Contrast with わけにはいかない (must NOT). The extra ない flips it completely.",
note_th:"ปฏิเสธซ้อนปฏิเสธ แปลว่า 'ต้อง' ต่างจาก わけにはいかない (ห้ามทำ) แค่เติม ない ความหมายก็กลับด้านหมด",
ex:[{j:"招待されたので、行かないわけにはいかない。",k:"しょうたい されたので、いかない わけには いかない。",e:"I've been invited, so I really have to go.",t:"ได้รับเชิญมาแล้ว ยังไงก็ต้องไป"},
{j:"約束したから、やらないわけにはいかない。",k:"やくそく したから、やらない わけには いかない。",e:"I promised, so I must do it.",t:"สัญญาไว้แล้ว ยังไงก็ต้องทำ"}]},

{id:"n2c15",lv:"N2",cat:"評価・判断",p:"〜に決まっている",conn:"V普通形／イA／ナA／N ＋ にきまっている",
en:"It's absolutely certain; obviously.",
th:"แน่นอนอยู่แล้ว; ก็ต้องเป็นแบบนั้นสิ",
note_en:"Casual and very confident — stronger than にちがいない. Too blunt for formal situations, but common in conversation.",
note_th:"เป็นกันเองและมั่นใจมาก แรงกว่า にちがいない ตรงเกินไปสำหรับสถานการณ์ทางการ แต่ใช้บ่อยในบทสนทนา",
ex:[{j:"そんな話、嘘に決まっている。",k:"そんな はなし、うそに きまって いる。",e:"That story is obviously a lie.",t:"เรื่องแบบนั้นโกหกแน่นอนอยู่แล้ว"},
{j:"毎日練習すれば、上手になるに決まっている。",k:"まいにち れんしゅう すれば、じょうずに なるに きまって いる。",e:"Practise daily and of course you'll improve.",t:"ถ้าฝึกทุกวันก็ต้องเก่งขึ้นแน่นอนอยู่แล้ว"}]},

{id:"n2c16",lv:"N2",cat:"評価・判断",p:"〜かねない",conn:"Vます形＋かねない",
en:"Might well (something bad); there's a danger of.",
th:"อาจจะ (เรื่องไม่ดี); มีความเสี่ยงว่าจะ",
note_en:"Only for bad possibilities. ×合格しかねない is wrong. Think of it as 'could end up doing something you'd regret'.",
note_th:"ใช้เฉพาะความเป็นไปได้ในทางลบ ×合格しかねない ผิด ให้นึกว่าเป็น 'อาจจะลงเอยด้วยเรื่องที่น่าเสียใจ'",
ex:[{j:"無理をすると、体を壊しかねない。",k:"むりを すると、からだを こわし かねない。",e:"Push too hard and you might well damage your health.",t:"ถ้าฝืนมากไป อาจทำร้ายร่างกายตัวเองได้"},
{j:"この発言は誤解を招きかねない。",k:"この はつげんは ごかいを まねき かねない。",e:"This remark could well invite misunderstanding.",t:"คำพูดนี้อาจนำไปสู่ความเข้าใจผิดได้"}]},

{id:"n2c17",lv:"N2",cat:"評価・判断",p:"〜かねる",conn:"Vます形＋かねる",
en:"Cannot bring myself to; am unable to (polite refusal).",
th:"ไม่อาจจะ...ได้ (การปฏิเสธอย่างสุภาพ)",
note_en:"The politest way to say no in business. わかりかねます sounds far softer than わかりません. Learn this for front desk work.",
note_th:"เป็นวิธีปฏิเสธที่สุภาพที่สุดในการทำงาน わかりかねます ฟังนุ่มกว่า わかりません มาก ควรจำไว้ใช้ในงานต้อนรับ",
ex:[{j:"その件については、お答えいたしかねます。",k:"その けんに ついては、おこたえ いたし かねます。",e:"I'm afraid I'm unable to answer on that matter.",t:"เรื่องนั้นผมไม่อาจตอบได้ครับ"},
{j:"詳細は分かりかねますので、確認いたします。",k:"しょうさいは わかり かねますので、かくにん いたします。",e:"I can't say for certain, so I'll check.",t:"รายละเอียดผมไม่อาจทราบได้ ขอตรวจสอบก่อนนะครับ"}]},

{id:"n2c18",lv:"N2",cat:"評価・判断",p:"〜得る / 〜得ない",conn:"Vます形＋える・うる／えない",
en:"It is possible / impossible for that to happen.",
th:"เป็นไปได้ / เป็นไปไม่ได้ที่จะเกิดขึ้น",
note_en:"About theoretical possibility, not personal ability. The affirmative reads both うる and える; the negative is always えない.",
note_th:"พูดถึงความเป็นไปได้ในเชิงทฤษฎี ไม่ใช่ความสามารถส่วนตัว รูปบอกเล่าอ่านได้ทั้ง うる และ える ส่วนรูปปฏิเสธอ่าน えない เสมอ",
ex:[{j:"そんなことはあり得ない。",k:"そんな ことは あり えない。",e:"That simply cannot happen.",t:"เรื่องแบบนั้นเป็นไปไม่ได้"},
{j:"誰にでも起こり得る問題です。",k:"だれにでも おこり うる もんだい です。",e:"It's a problem that can happen to anyone.",t:"เป็นปัญหาที่เกิดขึ้นกับใครก็ได้ครับ"}]},

{id:"n2c19",lv:"N2",cat:"評価・判断",p:"〜っこない",conn:"Vます形＋っこない",
en:"There's no way; definitely not (casual).",
th:"ไม่มีทางหรอก; ไม่มีทางเป็นไปได้ (ภาษากันเอง)",
note_en:"Very casual and emphatic — friends only. Formal equivalent is はずがない or 得ない.",
note_th:"เป็นกันเองมากและเน้นหนัก ใช้กับเพื่อนเท่านั้น รูปทางการคือ はずがない หรือ 得ない",
ex:[{j:"一日で覚えられっこない。",k:"いちにちで おぼえられっこない。",e:"There's no way I can memorise it in a day.",t:"ไม่มีทางจำได้ในวันเดียวหรอก"},
{j:"そんな話、信じられっこないよ。",k:"そんな はなし、しんじられっこないよ。",e:"No way anyone believes that.",t:"เรื่องแบบนั้นไม่มีทางเชื่อได้หรอก"}]},

{id:"n2c20",lv:"N2",cat:"評価・判断",p:"〜まい / 〜まいか",conn:"V辞書形（Iグループ）／Vない語幹＋まい（IIグループ）",
en:"Will surely not; I resolve not to.",
th:"คงจะไม่...แน่ ๆ; ตั้งใจว่าจะไม่",
note_en:"An old-fashioned negative volitional. Two uses: strong negative guess (雨は降るまい) and firm resolve (二度と行くまい).",
note_th:"เป็นรูปเจตนาปฏิเสธแบบเก่า มีสองความหมาย คือเดาแบบปฏิเสธหนักแน่น (雨は降るまい) และความตั้งใจแน่วแน่ (二度と行くまい)",
ex:[{j:"二度と同じ失敗はするまい。",k:"にどと おなじ しっぱいは するまい。",e:"I will never make the same mistake again.",t:"จะไม่ทำผิดพลาดแบบเดิมอีกเป็นครั้งที่สอง"},
{j:"彼はもう来まいと思う。",k:"かれは もう くるまいと おもう。",e:"I doubt he'll come now.",t:"คิดว่าเขาคงไม่มาแล้วล่ะ"}]},

{id:"n2c21",lv:"N2",cat:"評価・判断",p:"〜ことだ",conn:"V辞書形／Vない ＋ ことだ",
en:"You should; the important thing is to (advice).",
th:"ควรจะ; สิ่งสำคัญคือต้อง (คำแนะนำ)",
note_en:"Direct advice from a position of some authority. Use with care toward superiors — it can sound preachy.",
note_th:"เป็นคำแนะนำตรง ๆ จากผู้ที่มีความรู้มากกว่า ระวังเวลาใช้กับผู้ใหญ่ เพราะอาจฟังดูเหมือนสั่งสอน",
ex:[{j:"上達したければ、毎日話すことだ。",k:"じょうたつ したければ、まいにち はなす ことだ。",e:"If you want to improve, the thing is to speak daily.",t:"ถ้าอยากเก่งขึ้น สิ่งสำคัญคือต้องพูดทุกวัน"},
{j:"無理をしないことだ。",k:"むりを しない ことだ。",e:"The thing is not to overdo it.",t:"สิ่งสำคัญคืออย่าฝืนตัวเอง"}]},

{id:"n2c22",lv:"N2",cat:"評価・判断",p:"〜ことはない",conn:"V辞書形＋ことはない",
en:"There's no need to; don't bother.",
th:"ไม่จำเป็นต้อง; ไม่ต้องถึงขนาดนั้นหรอก",
note_en:"Used to reassure someone who is worrying too much. Softer and warmer than 必要ない.",
note_th:"ใช้ปลอบใจคนที่กังวลมากเกินไป นุ่มและอบอุ่นกว่า 必要ない",
ex:[{j:"心配することはありませんよ。",k:"しんぱい する ことは ありませんよ。",e:"There's no need to worry.",t:"ไม่ต้องเป็นห่วงหรอกครับ"},
{j:"そんなに急ぐことはない。",k:"そんなに いそぐ ことは ない。",e:"There's no need to rush like that.",t:"ไม่ต้องรีบขนาดนั้นก็ได้"}]},

{id:"n2c23",lv:"N2",cat:"評価・判断",p:"〜までもない",conn:"V辞書形＋までもない",
en:"There's no need to go so far as to; it goes without saying.",
th:"ไม่จำเป็นต้องถึงขั้น; ไม่ต้องพูดก็รู้",
note_en:"Stronger than ことはない — the action would be excessive. 言うまでもない = needless to say.",
note_th:"หนักแน่นกว่า ことはない เพราะสื่อว่าการกระทำนั้นเกินความจำเป็น เช่น 言うまでもない = ไม่ต้องพูดก็รู้",
ex:[{j:"言うまでもなく、健康が第一だ。",k:"いうまでも なく、けんこうが だいいちだ。",e:"Needless to say, health comes first.",t:"ไม่ต้องพูดก็รู้ว่าสุขภาพต้องมาก่อน"},
{j:"わざわざ行くまでもない。",k:"わざわざ いくまでも ない。",e:"There's no need to go all that way.",t:"ไม่จำเป็นต้องอุตส่าห์ไปถึงขนาดนั้น"}]},

{id:"n2c24",lv:"N2",cat:"評価・判断",p:"〜にすぎない",conn:"V普通形／N ＋ にすぎない",
en:"Is nothing more than; merely.",
th:"เป็นเพียงแค่; ไม่มากไปกว่า",
note_en:"Downplays something deliberately. Often used modestly about yourself: 私は学生にすぎません.",
note_th:"เป็นการลดความสำคัญโดยตั้งใจ มักใช้พูดถึงตัวเองอย่างถ่อมตน เช่น 私は学生にすぎません",
ex:[{j:"それは言い訳にすぎない。",k:"それは いいわけに すぎない。",e:"That's nothing but an excuse.",t:"นั่นเป็นแค่ข้อแก้ตัวเท่านั้น"},
{j:"これは全体の一部にすぎません。",k:"これは ぜんたいの いちぶに すぎません。",e:"This is merely a part of the whole.",t:"นี่เป็นเพียงส่วนหนึ่งของทั้งหมดครับ"}]},

{id:"n2c25",lv:"N2",cat:"評価・判断",p:"〜にほかならない",conn:"N＋にほかならない",
en:"It is nothing other than X — emphatic identification.",
th:"ไม่ใช่อะไรอื่นนอกจาก X — เน้นการระบุอย่างหนักแน่น",
note_en:"A strong rhetorical assertion, common in essays. It says 'the one true cause is this'.",
note_th:"เป็นการยืนยันเชิงวาทศิลป์ที่หนักแน่น เจอบ่อยในเรียงความ สื่อว่า 'สาเหตุที่แท้จริงมีเพียงข้อนี้'",
ex:[{j:"成功は努力の結果にほかならない。",k:"せいこうは どりょくの けっかに ほかならない。",e:"Success is nothing other than the result of effort.",t:"ความสำเร็จไม่ใช่อะไรอื่นนอกจากผลของความพยายาม"},
{j:"これは彼の努力の証にほかならない。",k:"これは かれの どりょくの あかしに ほかならない。",e:"This is nothing but proof of his effort.",t:"นี่ไม่ใช่อะไรอื่นนอกจากหลักฐานความพยายามของเขา"}]},

{id:"n2c26",lv:"N2",cat:"評価・判断",p:"〜というものだ",conn:"V普通形／イA／ナA／N ＋ というものだ",
en:"That's what X really is — asserting a general truth.",
th:"นั่นแหละคือ X ที่แท้จริง — ยืนยันความจริงทั่วไป",
note_en:"Delivers a life lesson or social truth with conviction. 助け合うのが友達というものだ.",
note_th:"ใช้กล่าวบทเรียนชีวิตหรือความจริงทางสังคมอย่างมั่นใจ เช่น 助け合うのが友達というものだ",
ex:[{j:"困った時に助けるのが友達というものだ。",k:"こまった ときに たすけるのが ともだち という ものだ。",e:"Helping in hard times — that's what a friend is.",t:"ช่วยกันตอนลำบาก นั่นแหละคือเพื่อนแท้"},
{j:"努力すれば報われる、というものでもない。",k:"どりょく すれば むくわれる、という ものでも ない。",e:"It's not as if effort is always rewarded.",t:"ไม่ใช่ว่าพยายามแล้วจะได้ผลตอบแทนเสมอไป"}]},

{id:"n2c27",lv:"N2",cat:"評価・判断",p:"〜どころではない",conn:"V辞書形／N ＋ どころではない",
en:"This is no time for X; X is out of the question.",
th:"ไม่ใช่เวลาที่จะ X; X ไม่ต้องพูดถึงเลย",
note_en:"Circumstances make X impossible right now. Different from どころか, which reverses or escalates a statement.",
note_th:"สถานการณ์ทำให้ X เป็นไปไม่ได้ในตอนนี้ ต่างจาก どころか ที่กลับด้านหรือยกระดับข้อความ",
ex:[{j:"忙しくて、旅行どころではない。",k:"いそがしくて、りょこう どころでは ない。",e:"I'm too busy — travel is out of the question.",t:"ยุ่งมากจนไม่ต้องพูดถึงเรื่องไปเที่ยวเลย"},
{j:"試験前だから、遊んでいるどころではない。",k:"しけんまえだから、あそんで いる どころでは ない。",e:"It's just before the exam — no time for playing.",t:"ใกล้สอบแล้ว ไม่ใช่เวลามาเล่นสนุก"}]},

{id:"n2c28",lv:"N2",cat:"評価・判断",p:"〜とは限らない",conn:"普通形＋とはかぎらない",
en:"It isn't necessarily the case that X.",
th:"ไม่จำเป็นว่าจะต้องเป็น X เสมอไป",
note_en:"Rejects an over-generalisation. Frequently paired with からといって at the front of the sentence.",
note_th:"เป็นการปฏิเสธการเหมารวมเกินไป มักใช้คู่กับ からといって ที่ต้นประโยค",
ex:[{j:"高いものがいいとは限らない。",k:"たかい ものが いいとは かぎらない。",e:"Expensive doesn't always mean good.",t:"ของแพงไม่จำเป็นว่าจะดีเสมอไป"},
{j:"努力が必ず報われるとは限らない。",k:"どりょくが かならず むくわれるとは かぎらない。",e:"Effort isn't always rewarded.",t:"ความพยายามไม่จำเป็นว่าจะได้ผลตอบแทนเสมอไป"}]},
{id:"n2d01",lv:"N2",cat:"慣用・書き言葉",p:"〜をこめて",conn:"N＋をこめて",
en:"With (feeling) put into it.",
th:"ด้วยความ...ที่ใส่ลงไป",
note_en:"The noun must be an emotion: 心, 愛, 感謝, 祈り. Common on gifts and cards — 感謝を込めて.",
note_th:"คำนามข้างหน้าต้องเป็นอารมณ์ เช่น 心 愛 感謝 祈り เจอบ่อยบนของขวัญและการ์ด เช่น 感謝を込めて",
ex:[{j:"感謝を込めて、この手紙を書きます。",k:"かんしゃを こめて、この てがみを かきます。",e:"I write this letter with gratitude.",t:"เขียนจดหมายฉบับนี้ด้วยความรู้สึกขอบคุณ"},
{j:"心を込めて作りました。",k:"こころを こめて つくりました。",e:"I made it with all my heart.",t:"ทำด้วยความตั้งใจจากใจจริงครับ"}]},

{id:"n2d02",lv:"N2",cat:"慣用・書き言葉",p:"〜ぬきで / 〜を抜きにして",conn:"N＋ぬきで・をぬきにして",
en:"Without X; leaving X out.",
th:"โดยไม่มี X; ตัด X ออกไป",
note_en:"Very handy at a restaurant: わさび抜きで. Also abstract: 冗談は抜きにして (joking aside).",
note_th:"ใช้สะดวกมากในร้านอาหาร เช่น わさび抜きで และใช้เชิงนามธรรมได้ เช่น 冗談は抜きにして (พูดจริง ๆ นะ)",
ex:[{j:"わさび抜きでお願いします。",k:"わさび ぬきで おねがい します。",e:"Without wasabi, please.",t:"ขอแบบไม่ใส่วาซาบิครับ"},
{j:"冗談は抜きにして、真面目に話そう。",k:"じょうだんは ぬきに して、まじめに はなそう。",e:"Joking aside, let's talk seriously.",t:"พูดเล่นไว้ก่อน มาคุยกันจริงจังเถอะ"}]},

{id:"n2d03",lv:"N2",cat:"慣用・書き言葉",p:"〜がたい",conn:"Vます形＋がたい",
en:"Hard to do — emotionally or morally difficult.",
th:"ยากที่จะ — ยากในเชิงอารมณ์หรือศีลธรรม",
note_en:"Not physical difficulty (that's にくい). がたい is about what you find hard to accept: 信じがたい, 忘れがたい, 理解しがたい.",
note_th:"ไม่ใช่ความยากทางกายภาพ (นั่นคือ にくい) แต่ がたい คือสิ่งที่ยอมรับได้ยาก เช่น 信じがたい 忘れがたい 理解しがたい",
ex:[{j:"信じがたい話だ。",k:"しんじがたい はなしだ。",e:"It's a hard story to believe.",t:"เป็นเรื่องที่ยากจะเชื่อ"},
{j:"忘れがたい経験になりました。",k:"わすれがたい けいけんに なりました。",e:"It became an unforgettable experience.",t:"กลายเป็นประสบการณ์ที่ยากจะลืมครับ"}]},

{id:"n2d04",lv:"N2",cat:"慣用・書き言葉",p:"〜ぬく",conn:"Vます形＋ぬく",
en:"To do all the way through, despite hardship.",
th:"ทำจนสำเร็จถึงที่สุด แม้จะยากลำบาก",
note_en:"きる is about finishing the quantity; ぬく is about enduring to the end. 走りぬく = ran through despite pain.",
note_th:"きる เน้นทำจนหมดปริมาณ ส่วน ぬく เน้นอดทนจนถึงที่สุด เช่น 走りぬく = วิ่งจนจบทั้ง ๆ ที่เจ็บ",
ex:[{j:"最後までやりぬくつもりです。",k:"さいごまで やりぬく つもり です。",e:"I intend to see it through to the very end.",t:"ตั้งใจว่าจะทำให้สำเร็จจนถึงที่สุดครับ"},
{j:"苦しかったが、走りぬいた。",k:"くるしかったが、はしりぬいた。",e:"It was painful, but I ran it through.",t:"ถึงจะทรมาน แต่ก็วิ่งจนจบ"}]},

{id:"n2d05",lv:"N2",cat:"慣用・書き言葉",p:"〜かのようだ",conn:"V普通形／N である ＋ かのようだ",
en:"As if it were X (but it isn't).",
th:"ราวกับว่าเป็น X (แต่จริง ๆ ไม่ใช่)",
note_en:"Stronger and more literary than ようだ. The か signals the comparison is definitely counterfactual.",
note_th:"หนักแน่นและเป็นวรรณกรรมกว่า ようだ โดย か เป็นสัญญาณว่าการเปรียบเทียบนี้ไม่ใช่ความจริงแน่นอน",
ex:[{j:"まるで夢を見ているかのようだ。",k:"まるで ゆめを みて いるかの ようだ。",e:"It's just as if I were dreaming.",t:"ราวกับว่ากำลังฝันอยู่เลย"},
{j:"彼は何も知らないかのように振る舞った。",k:"かれは なにも しらないかの ように ふるまった。",e:"He acted as if he knew nothing.",t:"เขาทำท่าราวกับว่าไม่รู้อะไรเลย"}]},

{id:"n2d06",lv:"N2",cat:"慣用・書き言葉",p:"〜てならない",conn:"Vて／イA くて／ナA で ＋ ならない",
en:"Uncontrollably; I can't help feeling.",
th:"...จนห้ามใจไม่ได้; อดรู้สึกไม่ได้",
note_en:"Reserved for spontaneous feelings and thoughts (気になる, 思える, 悲しい), not physical sensations — for those use てたまらない.",
note_th:"ใช้กับความรู้สึกและความคิดที่เกิดขึ้นเอง (気になる 思える 悲しい) ไม่ใช้กับความรู้สึกทางกาย กรณีนั้นใช้ てたまらない",
ex:[{j:"結果が気になってならない。",k:"けっかが きに なって ならない。",e:"I can't stop thinking about the result.",t:"อดคิดถึงผลลัพธ์ไม่ได้เลย"},
{j:"故郷が懐かしくてならない。",k:"こきょうが なつかしくて ならない。",e:"I feel unbearably homesick.",t:"คิดถึงบ้านเกิดจนห้ามใจไม่ได้"}]},

{id:"n2d07",lv:"N2",cat:"慣用・書き言葉",p:"〜まみれ",conn:"N＋まみれ",
en:"Smeared all over with (liquid or powder).",
th:"เปรอะเปื้อนไปทั่ว (ของเหลวหรือผง)",
note_en:"Only for substances that stick: 泥, 汗, 血, ほこり. だらけ is broader and can take abstract nouns like 間違い; まみれ cannot.",
note_th:"ใช้เฉพาะสิ่งที่เกาะติดได้ เช่น 泥 汗 血 ほこり ส่วน だらけ กว้างกว่าและใช้กับคำนามนามธรรมอย่าง 間違い ได้ แต่ まみれ ใช้ไม่ได้",
ex:[{j:"汗まみれになって働いた。",k:"あせ まみれに なって はたらいた。",e:"I worked until I was drenched in sweat.",t:"ทำงานจนตัวโชกไปด้วยเหงื่อ"},
{j:"本がほこりまみれだ。",k:"ほんが ほこり まみれだ。",e:"The books are covered in dust.",t:"หนังสือเต็มไปด้วยฝุ่น"}]},

{id:"n2d08",lv:"N2",cat:"慣用・書き言葉",p:"〜わけだ（結論）",conn:"V普通形／イA／ナA な／N という ＋ わけだ",
en:"Which means; that's why — drawing the logical conclusion.",
th:"ก็หมายความว่า; มิน่าล่ะ — เป็นการสรุปตามเหตุผล",
note_en:"At N2 it appears at the end of a reasoning chain, meaning 'therefore, naturally'. Often with つまり or どうりで.",
note_th:"ในระดับ N2 จะปรากฏท้ายลำดับเหตุผล แปลว่า 'ดังนั้นจึงเป็นธรรมดา' มักใช้กับ つまり หรือ どうりで",
ex:[{j:"つまり、彼は反対だというわけですね。",k:"つまり、かれは はんたいだと いう わけですね。",e:"So in other words, he's against it.",t:"ก็คือหมายความว่าเขาไม่เห็นด้วยสินะครับ"},
{j:"3時間もかかった。遅れるわけだ。",k:"さんじかんも かかった。おくれる わけだ。",e:"It took three hours — no wonder we're late.",t:"ใช้เวลาตั้ง 3 ชั่วโมง มิน่าล่ะถึงสาย"}]},

{id:"n2d09",lv:"N2",cat:"慣用・書き言葉",p:"〜に相違ない",conn:"V普通形／イA／ナA／N ＋ にそういない",
en:"There can be no doubt that.",
th:"ไม่มีข้อสงสัยเลยว่า",
note_en:"The formal written twin of にちがいない. Appears in reports and legal writing, rarely in speech.",
note_th:"เป็นฝาแฝดในภาษาเขียนทางการของ にちがいない เจอในรายงานและงานเขียนกฎหมาย ไม่ค่อยใช้พูด",
ex:[{j:"本人が書いたものに相違ない。",k:"ほんにんが かいた ものに そういない。",e:"There's no doubt this was written by the person themselves.",t:"ไม่มีข้อสงสัยว่านี่คือสิ่งที่เจ้าตัวเขียนเอง"},
{j:"彼が犯人に相違ない。",k:"かれが はんにんに そういない。",e:"He must without doubt be the culprit.",t:"เขาต้องเป็นคนร้ายแน่นอนไม่มีข้อสงสัย"}]},

{id:"n2d10",lv:"N2",cat:"慣用・書き言葉",p:"〜のではないだろうか",conn:"普通形＋のではないだろうか",
en:"Isn't it perhaps the case that... — a hedged opinion.",
th:"หรือว่าจะเป็นอย่างนั้นก็ได้นะ — การเสนอความเห็นแบบระวังตัว",
note_en:"The polite way to state an opinion in essays without sounding arrogant. Very useful for the N1 writing register.",
note_th:"เป็นวิธีสุภาพในการเสนอความเห็นในเรียงความโดยไม่ฟังดูอวดดี มีประโยชน์มากสำหรับระดับภาษาเขียนของ N1",
ex:[{j:"もっと話す機会が必要なのではないだろうか。",k:"もっと はなす きかいが ひつような のでは ないだろうか。",e:"Isn't it that we need more chances to speak?",t:"หรือว่าเราต้องการโอกาสได้พูดมากกว่านี้ก็ได้นะ"},
{j:"これが本当の原因ではないだろうか。",k:"これが ほんとうの げんいんでは ないだろうか。",e:"Might this not be the real cause?",t:"หรือว่านี่จะเป็นสาเหตุที่แท้จริงก็ได้นะ"}]},

{id:"n2d11",lv:"N2",cat:"慣用・書き言葉",p:"〜ものがある",conn:"V辞書形／イA／ナA な ＋ ものがある",
en:"There's something (moving/impressive) about it.",
th:"มีบางอย่างที่ (น่าประทับใจ/สะเทือนใจ) อยู่",
note_en:"Expresses a felt impression you can't fully pin down. 感動的なものがある, 目を見張るものがある.",
note_th:"ใช้แสดงความรู้สึกที่สัมผัสได้แต่อธิบายไม่หมด เช่น 感動的なものがある, 目を見張るものがある",
ex:[{j:"彼の努力には目を見張るものがある。",k:"かれの どりょくには めを みはる ものが ある。",e:"There's something remarkable about his effort.",t:"ความพยายามของเขามีบางอย่างที่น่าทึ่ง"},
{j:"この曲には心に響くものがある。",k:"この きょくには こころに ひびく ものが ある。",e:"There's something in this song that resonates.",t:"เพลงนี้มีบางอย่างที่กินใจ"}]},

{id:"n2d12",lv:"N2",cat:"慣用・書き言葉",p:"〜ものか",conn:"V辞書形／イA／ナA な／N な ＋ ものか",
en:"As if! Absolutely not — emphatic refusal.",
th:"จะไปมีทางเหรอ! ไม่มีทางเด็ดขาด — การปฏิเสธอย่างหนักแน่น",
note_en:"A rhetorical question that means a flat no. Casual and forceful; 〜もんか in speech.",
note_th:"เป็นคำถามเชิงวาทศิลป์ที่หมายถึงการปฏิเสธเด็ดขาด เป็นกันเองและแรง เวลาพูดจะเป็น 〜もんか",
ex:[{j:"二度と行くものか。",k:"にどと いく ものか。",e:"As if I'd ever go again!",t:"จะไปอีกได้ยังไง ไม่มีทาง"},
{j:"そんな話、信じるものか。",k:"そんな はなし、しんじる ものか。",e:"As if I'd believe that!",t:"เรื่องแบบนั้นจะไปเชื่อได้ยังไง"}]},

{id:"n2d13",lv:"N2",cat:"慣用・書き言葉",p:"〜だけあって / 〜だけのことはある",conn:"V普通形／イA／ナA な／N ＋ だけあって",
en:"As one would expect from X — living up to a reputation.",
th:"สมกับที่เป็น X — สมกับชื่อเสียงที่มี",
note_en:"Always admiring, and X must be something praiseworthy. ×失敗しただけあって is wrong.",
note_th:"เป็นการชื่นชมเสมอ และ X ต้องเป็นสิ่งที่น่ายกย่อง ×失敗しただけあって ผิด",
ex:[{j:"10年住んでいるだけあって、日本語が完璧だ。",k:"じゅうねん すんで いる だけ あって、にほんごが かんぺきだ。",e:"As you'd expect after ten years here, his Japanese is perfect.",t:"สมกับที่อยู่มา 10 ปี ภาษาญี่ปุ่นสมบูรณ์แบบมาก"},
{j:"人気店だけのことはある。",k:"にんきてん だけの ことは ある。",e:"It lives up to its reputation as a popular place.",t:"สมกับที่เป็นร้านดังจริง ๆ"}]},

{id:"n2d14",lv:"N2",cat:"慣用・書き言葉",p:"〜ぐらい / 〜くらい（軽視）",conn:"N／V普通形 ＋ ぐらい・くらい",
en:"Just; merely — downplaying how small something is.",
th:"แค่; เพียง — ลดความสำคัญว่าเรื่องเล็กนิดเดียว",
note_en:"The dismissive use. 挨拶ぐらいしなさい = at least do something as small as greeting. Slight reproach attached.",
note_th:"เป็นการใช้แบบมองข้าม เช่น 挨拶ぐらいしなさい = อย่างน้อยแค่ทักทายก็ยังทำได้ มีน้ำเสียงตำหนิเล็กน้อย",
ex:[{j:"挨拶ぐらいしなさい。",k:"あいさつ ぐらい しなさい。",e:"At least say hello.",t:"อย่างน้อยแค่ทักทายก็ยังทำได้นะ"},
{j:"それくらい自分でやりなさい。",k:"それ くらい じぶんで やりなさい。",e:"Do that much yourself.",t:"แค่นั้นทำเองสิ"}]},

{id:"n2d15",lv:"N2",cat:"慣用・書き言葉",p:"〜からして",conn:"N＋からして",
en:"Starting with X (and everything else follows the same way).",
th:"ดูแค่ X ก็ (และอย่างอื่นก็เป็นแบบเดียวกัน)",
note_en:"Picks the most obvious example to imply the whole. 名前からして怪しい = even the name alone is suspicious.",
note_th:"เลือกตัวอย่างที่ชัดที่สุดมาสื่อถึงทั้งหมด เช่น 名前からして怪しい = แค่ชื่อก็น่าสงสัยแล้ว",
ex:[{j:"名前からして怪しい店だ。",k:"なまえから して あやしい みせだ。",e:"Even the name of the place is suspicious.",t:"แค่ชื่อร้านก็น่าสงสัยแล้ว"},
{j:"服装からして、彼は真面目な人だ。",k:"ふくそうから して、かれは まじめな ひとだ。",e:"Judging even from his clothes, he's a serious person.",t:"ดูแค่การแต่งตัวก็รู้ว่าเขาเป็นคนจริงจัง"}]},

{id:"n2d16",lv:"N2",cat:"慣用・書き言葉",p:"〜たものだ / 〜たいものだ",conn:"Vた＋ものだ／Vたい＋ものだ",
en:"I used to (nostalgia); I really would like to (strong wish).",
th:"เมื่อก่อนเคย (ความคิดถึง); อยากจะ...จริง ๆ (ความปรารถนาแรงกล้า)",
note_en:"たものだ looks back fondly at a repeated past habit. たいものだ makes a wish sound heartfelt and formal.",
note_th:"たものだ คือมองย้อนกลับไปที่นิสัยเดิม ๆ ในอดีตด้วยความคิดถึง ส่วน たいものだ ทำให้ความปรารถนาฟังดูจริงใจและเป็นทางการ",
ex:[{j:"学生のころ、よく徹夜したものだ。",k:"がくせいの ころ、よく てつや した ものだ。",e:"Back in my student days I often stayed up all night.",t:"ตอนเป็นนักเรียนเคยอดนอนทั้งคืนบ่อย ๆ"},
{j:"いつか流暢に話せるようになりたいものだ。",k:"いつか りゅうちょうに はなせる ように なりたい ものだ。",e:"I really do want to speak fluently one day.",t:"สักวันหนึ่งอยากพูดได้คล่องจริง ๆ นะ"}]},

{id:"n2d17",lv:"N2",cat:"慣用・書き言葉",p:"〜わけがない",conn:"V普通形／イA／ナA な／N の ＋ わけがない",
en:"There's no way that — logically impossible.",
th:"ไม่มีทางที่จะ — เป็นไปไม่ได้ตามหลักเหตุผล",
note_en:"Complete the trio: わけだ (so that's why) / わけではない (not entirely) / わけがない (no chance). Test writers love mixing these.",
note_th:"ครบชุดสามพี่น้อง: わけだ (มิน่าล่ะ) / わけではない (ไม่ได้หมายความว่า) / わけがない (ไม่มีทาง) คนออกข้อสอบชอบสลับสามตัวนี้",
ex:[{j:"彼がそんなことを言うわけがない。",k:"かれが そんな ことを いう わけが ない。",e:"There's no way he'd say something like that.",t:"เขาไม่มีทางพูดอะไรแบบนั้นแน่นอน"},
{j:"一週間で覚えられるわけがない。",k:"いっしゅうかんで おぼえられる わけが ない。",e:"There's no way to memorise it in a week.",t:"ไม่มีทางจำได้ในหนึ่งสัปดาห์หรอก"}]},

{id:"n2d18",lv:"N2",cat:"慣用・書き言葉",p:"〜てはじめて / 〜てこそ（対比）",conn:"Vて＋はじめて",
en:"Only upon doing X does the truth of Y appear.",
